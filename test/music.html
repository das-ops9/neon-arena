    <style>
      /* NEON ARENA v4 디자인 토큰과 기본 규칙. 근거: docs/history/UI_RESEARCH.md
   글자는 rem(사용자 글자 크기 설정을 따름), 간격·터치 영역은 px로 고정한다. */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #070b13;
  --bg-raise: #0b1420;
  --surface: #0f1b29;
  --surface-2: #142538;
  --surface-3: #1a3048;
  --line: #20364a;
  --line-strong: #2e4c66;

  /* 글자 (배경 #070b13 기준 대비: ink 17:1, ink-2 11:1, muted 7:1) */
  --ink: #ebf3f6;
  --ink-2: #b9c9d4;
  --muted: #8aa0ae;

  /* 강조 */
  --cyan: #50f3d6;
  --cyan-deep: #0f3a37;
  --gold: #f4ce72;
  --gold-deep: #3a2d12;
  --blue: #68b9ff;
  --blue-deep: #12304d;
  --violet: #c4a3ff;
  --violet-deep: #2b1f48;
  --pink: #ff4e8e;
  --danger: #ff5f6d;
  --orange: #ff9a4d;

  /* 재화 */
  --c-gold: var(--gold);
  --c-blue: var(--blue);
  --c-sc: var(--violet);

  /* 글꼴 */
  --font: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;

  /* 간격·모서리 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

  /* 터치 영역 */
  --tap: 44px;
  --tap-lg: 48px;
  --action-h: 56px;
  --action-w: 72px;

  /* 층 */
  --z-hud: 10;
  --z-overlay: 20;
  --z-menu: 30;
  --z-sheet: 40;
  --z-dialog: 50;

  /* 움직임 */
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* 안전 영역 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  /* 화면 위 · 아래 끝 여백(R-047): 위는 로고 글씨 높이의 70%(편집장 +20%, 앞 카메라 구멍), 아래는 50%.
     모든 화면(메뉴 · 준비 · 전투 HUD · 창 · 시트)이 쓴다. 가로 화면은 0(ui.css) */
  --edge-top: calc(var(--fs-lg) * 0.7);
  --edge-bottom: calc(var(--fs-lg) * 0.5);

  /* 화면 높이: 주소창이 펼쳐진 작은 높이 기준 */
  --vh-full: 100vh;
}
@supports (height: 100svh) {
  :root {
    --vh-full: 100svh;
  }
}
/* 세로 전체 화면(설정 '전체 화면'): 상태 표시줄이 사라져 앞 카메라 구멍이 화면 위에 걸린다.
   브라우저가 알려 주는 위 안전 영역이 그보다 작으면 최소 28px을 둔다(R-047) */
@media (orientation: portrait) {
  :root:fullscreen {
    --safe-t: max(env(safe-area-inset-top, 0px), 28px);
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button,
input,
select,
output {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
}
button:focus-visible,
canvas:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
h1,
h2,
h3,
p,
ol,
ul {
  margin: 0;
  padding: 0;
}
ol,
ul {
  list-style: none;
}
[hidden] {
  display: none !important;
}
.num {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.muted {
  color: var(--muted);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 모드 배지 (src/badges.js). 상자 크기에 장식까지 포함해 이웃 요소와 겹치지 않는다. */
.nb {
  display: inline-block;
  flex: none;
  line-height: 0;
  vertical-align: middle;
}
.nb--full {
  width: var(--nb-w, 112px);
  aspect-ratio: 140 / 56;
}
.nb--compact {
  width: var(--nb-cw, 70px);
  aspect-ratio: 78 / 22;
}
.nb svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.nb text {
  font-family: var(--font);
}
.nb-shine {
  transform-box: fill-box;
  animation: nb-shine 3.6s var(--ease) infinite;
}
.nb--insane .nb-aura {
  animation: nb-pulse 2.4s ease-in-out infinite;
}
.nb-spark {
  transform-box: fill-box;
  transform-origin: center;
  animation: nb-twinkle 2.8s ease-in-out infinite;
}
.nb-spark:nth-of-type(2n) {
  animation-delay: 1.3s;
}
/* Insane(R-032): Ultra보다 별빛이 많고 반짝임은 opacity만(별마다 지연이 다르다) */
.nb--insane .nb-spark {
  animation: nb-glint 2.4s ease-in-out infinite;
}
@keyframes nb-shine {
  0%,
  55% {
    transform: skewX(-18deg) translateX(0);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  90%,
  100% {
    transform: skewX(-18deg) translateX(560%);
    opacity: 0;
  }
}
@keyframes nb-pulse {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-glint {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-twinkle {
  0%,
  100% {
    opacity: 0.25;
    transform: scale(0.7);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}
.nb-static .nb-shine,
.nb-static .nb-aura,
.nb-static .nb-spark {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .nb-shine,
  .nb-aura,
  .nb-spark {
    animation: none !important;
  }
}

    </style>
    <style>
      /* 음악 후보 듣기(R-051 피드백, /test/ 전용): 폰 세로 기준. 게임 토큰을 쓰고, 페이지가 세로로 스크롤한다. */
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: visible;
      }
      body {
        font-size: var(--fs-md);
        line-height: 1.5;
        word-break: keep-all;
        padding: calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(32px + var(--safe-b))
          calc(16px + var(--safe-l));
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      .top-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: var(--fs-xl);
      }
      .game {
        flex: none;
        display: inline-flex;
        align-items: center;
        min-height: var(--tap);
        padding: 0 4px;
        color: var(--cyan);
        text-decoration: none;
        font-size: var(--fs-sm);
      }
      .note {
        margin: 4px 0 8px;
        color: var(--muted);
        font-size: var(--fs-sm);
      }
      h2 {
        margin: 20px 0 8px;
        color: var(--cyan);
        font-size: var(--fs-sm);
        letter-spacing: 0.08em;
      }
      .row {
        display: grid;
        grid-template-columns: var(--tap-lg) minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        padding: 10px 10px 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background: var(--surface);
      }
      .row.is-on {
        border-color: var(--cyan);
      }
      .play {
        width: var(--tap-lg);
        height: var(--tap-lg);
        border: 1px solid var(--cyan);
        border-radius: 50%;
        color: var(--cyan);
        font-size: var(--fs-lg);
      }
      .play[aria-pressed='true'] {
        background: var(--cyan);
        color: var(--bg);
      }
      .info {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .info b {
        font-size: var(--fs-md);
      }
      .info small,
      .meta {
        color: var(--muted);
        font-size: var(--fs-xs);
      }
      .info small {
        color: var(--ink-2);
      }
      .st {
        color: var(--gold);
        font-style: normal;
      }
      .use {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: var(--tap);
        min-height: var(--tap);
        color: var(--muted);
        font-size: var(--fs-2xs);
        text-align: center;
        cursor: pointer;
      }
      .use input {
        width: 22px;
        height: 22px;
        margin: 0 0 2px;
        accent-color: var(--cyan);
      }
      .use input:checked + span {
        color: var(--cyan);
      }
      .foot {
        margin-top: 20px;
      }
      .copy {
        width: 100%;
        min-height: var(--tap);
        border: 1px solid var(--cyan);
        border-radius: var(--r-md);
        color: var(--cyan);
      }
      .status {
        min-height: 1.5em;
        margin: 8px 0 0;
        color: var(--gold);
        font-size: var(--fs-sm);
      }
      textarea {
        width: 100%;
        min-height: 4em;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: var(--fs-sm);
      }
    </style>
  </head>
  <body>

    <script>
      (function (root) {
  'use strict';
  // 판 결과에 영향을 주는 수치의 단일 원본(R-013). 이름·표기·화면 문구는 terms.js에 있다.
  // 값을 바꾸면: npm run docs(정본 문서 표 다시 만들기) → node tests/replay.test.cjs --update(기준 재생 다시 만들기,
  // 바뀐 항목을 커밋 메시지에 적는다). 화면 효과(흔들림·입자)와 기록 분석용 정의는 각 모듈에 둔다.
  const deepFreeze = o => {
    for (const v of Object.values(o)) if (v && typeof v === 'object') deepFreeze(v);
    return Object.freeze(o);
  };
  const BALANCE = deepFreeze({
    name: 'v5-3',
    // 모드: 키 순서 = 화면 순서 = 해금 순서. 배율은 적에게 곱한다.
    // defenseCap: 장갑 강화·재생 실드를 '준비+획득'으로 고를 수 있는 횟수(Infinity = 없음)
    // auto: 자동 강화 사용 · goldBonus: 분당 G 추가 · bossGold: 보스 1마리 처치 G(R-002 · R-036) · blue: 실제 LV10마다 B
    // fan·burst: 사수 부채꼴·연속 사격 · bossSide: 보스 조준 탄 양옆 2발
    // blueCoin: 레벨업 코인 칸이 B 코인(economy.coinChoiceBlue B)이 될 확률(R-043, 엔진 난수와 따로)
    // score: 처치 Point 배율(적 Point × STAGE 배율에 곱한다. 콤보 보너스는 그대로)
    modes: {
      easy: {
        spawn: 1,
        hp: 1,
        damage: 1,
        fire: 1,
        bulletSpeed: 1,
        xp: 1,
        score: 1,
        defenseCap: 30,
        choices: 4,
        auto: false,
        goldBonus: 0,
        bossGold: 1,
        blue: 1,
        blueCoin: 0,
        fan: false,
        burst: false,
        bossSide: false,
      },
      hard: {
        spawn: 1.5,
        hp: 1.32,
        damage: 1.25,
        fire: 1.25,
        bulletSpeed: 1.15,
        xp: 0.95,
        score: 2.5,

        auto: false,
        goldBonus: 0,
        bossGold: 2,
        blue: 1,
        blueCoin: 0.01,
        fan: false,
        burst: false,
        bossSide: false,
      },
      extream: {
        spawn: 2.25,
        hp: 1.74,
        damage: 1.55,
        fire: 1.55,
        bulletSpeed: 1.32,
        xp: 0.85,
        score: 5,
        defenseCap: 15,
        choices: 3,
        auto: true,
        goldBonus: 1,
        bossGold: 3,
        blue: 1,
        blueCoin: 0.02,
        fan: true,
        burst: false,
        bossSide: false,
      },
      super: {

        damage: 1.93,

        xp: 0.7,
        score: 9,

        choices: 3,
        auto: true,

        bossGold: 4,

    // 해금: from 모드의 한 판이 조건을 모두 채우면 열린다(time 초 · score Point · level LV). Easy·Hard는 처음부터.

    dash: { time: 0.19, invuln: 0.28, speed: 1000, min: 1 },

        speed: '이동 속도 +' + S.speed.step,

        orbit: '칼날 +1 · 피해 강화',

      }[id] || ''
    );

  // 레벨업 카드 설명: 지금 능력치(g.p)에 따라 상한에 닿으면 넘친 스택 효과를 보여 준다.
  function skillChoice(g, id) {
    const b = B(),
      S = b.skills,
      p = g.p,
      xpBonus = Number((S.magnet.xp * (g.profile?.xp || 1)).toFixed(2));
    return (
      {
        power: '기본 탄환 피해 +' + pct(S.power.damage),
        rapid:
          p.fire > S.rapid.minFire + 0.001
            ? '발사 간격 단축 · 연사 강화'
            : '탄환 피해 +' + pct(S.rapid.overflow) + ' · 최대 연사 유지',
        multi:
          p.multi < S.multi.max
            ? '동시 탄환 +1'
            : '탄환 피해 +' + pct(S.multi.overflow) + ' · ' + S.multi.max + '발 유지',
        pierce:
          p.pierce < S.pierce.max
            ? '추가 관통 +1'
            : '탄환 피해 +' + pct(S.pierce.overflow) + ' · 관통 ' + S.pierce.max + ' 유지',
        speed:
          p.speed < S.speed.max
            ? '이동 속도 +' + Math.min(S.speed.step, S.speed.max - p.speed) + ' · 대시 재충전 개선'
            : '탄환 피해 +' +
              pct(S.speed.overflow) +
              (p.dashMax > b.dash.min + 0.0001 ? ' · 대시 재충전 개선' : ''),
        magnet:
          p.magnet < S.magnet.max
            ? '수집 범위 +' + Math.min(S.magnet.step, S.magnet.max - p.magnet) + ' · XP +' + xpBonus
            : '탄환 피해 +' + pct(S.magnet.overflow) + ' · XP +' + xpBonus,
        orbit:
          p.orbits < b.orbit.max
            ? skillName('orbit') + ' +1 · 칼날 피해 강화'
            : '칼날 피해 +' + S.orbit.step + ' · ' + b.orbit.max + '개 유지',
        vital: '최대 체력 +' + S.vital.hp + ' · 최대 ' + S.vital.heal + ' 회복',
        nova:
          '충격파 피해 +' +
          S.nova.damage +
          (p.novaRadius < S.nova.radiusMax
            ? ' · 범위 +' + Math.min(S.nova.radius, S.nova.radiusMax - p.novaRadius)
            : '') +
          (p.novaMax > S.nova.cooldownMin ? ' · 재충전 −' + S.nova.cooldown + '초' : ''),
        crit:
          p.crit < S.crit.max
            ? '치명타 확률 +' + Math.round((Math.min(S.crit.max, p.crit + S.crit.step) - p.crit) * 100) + '%'
            : '치명타 피해 배율 +' + S.crit.overflow,

  // 기체 카드의 시작 스택 한 줄(예: '부스터·속사 +3', '다연발 +3 (4발)')
  function craftStart(id) {
    const start = B().crafts[id]?.start || {},
      ids = Object.keys(start);
    if (!ids.length) return '';
    const n = start[ids[0]];
    return ids.map(skillName).join('·') + ' +' + n + (start.multi ? ' (' + (1 + start.multi) + '발)' : '');
  }
  // 스택 출처
  const sources = { craft: '기체', cat: '고양이', perma: '영구', prep: '준비', earned: '획득' };
  // 적. name: 화면 · short: 짧은 이름
  const enemies = {

  const enemyName = kind => (enemies[kind] || enemies.unknown).name;
  // 고양이 비행사(1단계 R-026에서 화면에 나온다. 이름은 임시, 3단계에서 확정)
  // 고양이 비행사(R-026). 이름 · 그림은 임시(3단계에서 확정). effect: 효과 한 줄, value: 짧은 값(레벨 미리보기)
  const pctOf = v => Math.round(v * 100);
  const cats = {

  const ranking = { name: '순위', normal: '일반', super: launches.super };

  // 해금 조건 한 줄(예: 'Super 10분 + 500,000 Point')
  function unlockGate(id) {
    const u = B().unlock[id];

    const parts = [];
    if (u.time) parts.push(u.time / 60 + '분' + (u.score || u.level ? '' : ' 생존'));
    if (u.score) parts.push(num(u.score) + ' ' + point.name);

    return modeName(u.from) + ' ' + parts.join(' + ');

  // 자동 강화를 켤 수 있는 가장 낮은 모드
  const firstMode = key => Object.keys(B().modes).find(id => B().modes[id][key]);
  const autoFrom = () => modeName(firstMode('auto'));
  // Easy와 key 값이 다른 모드를 이웃끼리 같은 값으로 묶는다. 마지막 모드까지 이어지면 'Ultra 이상'
  // 예: modeGroups('blue', ' ', '개') → ['Ultra 이상 2개'], modeGroups('goldBonus', ' +') → ['Extreme · Super +1', 'Ultra 이상 +2']
  const modeGroups = (key, sep, unit = '') => {
    const m = B().modes,
      ids = Object.keys(m),
      groups = [];
    for (const id of ids) {
      if (m[id][key] === m.easy[key]) continue;
      const last = groups[groups.length - 1];
      if (last && last.value === m[id][key] && ids.indexOf(id) === ids.indexOf(last.ids.at(-1)) + 1)
        last.ids.push(id);
      else groups.push({ value: m[id][key], ids: [id] });
    }
    return groups.map(g => {
      const name =
        g.ids.length > 1 && g.ids.at(-1) === ids.at(-1)
          ? modeName(g.ids[0]) + ' 이상'
          : g.ids.map(modeName).join(' · ');
      return name + sep + g.value + unit;
    });
  };
  const blueExtra = unit => modeGroups('blue', ' ', unit);
  // B 코인 칸 확률(R-043): 확률이 있는 모드만 'Hard 1% · … · Insane 5%'
  const blueCoinModes = () =>

  // 분당 G 보너스(goldBonus)가 있는 모드: 'Extreme · Super +1, Ultra 이상 +2'
  const goldExtra = () => modeGroups('goldBonus', ' +').join(', ');
  // 보스 1마리 G(R-036): 모드마다 다르면 첫 모드 ~ 마지막 모드('Easy 1 ~ Insane 6'), 모두 같으면 그 값
  const bossGoldText = () => {
    const m = B().modes,
      ids = Object.keys(m),
      a = m[ids[0]].bossGold,
      z = m[ids.at(-1)].bossGold;
    return ids.every(id => m[id].bossGold === a)

  // ── 전투 알림(R-030). 알림 대기열 하나로 보인다(app.js notify) ──

    siege: { major: true, tone: 'danger', sec: 3, text: wave => '⚠ 포위 ' + wave + '회차' },
    // 손으로 올린 STAGE(배율 숫자는 뺀다): boss = 'now'(이 Stage가 보스) · 'next'(다음이 보스) · ''
    stage: {
      sec: 4,
      text: (s, boss) =>
        stageLabel(s) + (boss === 'now' ? ' · 보스 등장' : boss === 'next' ? ' · 다음 보스' : ''),
    },
    // AUTO 결과: n = 고른 스킬 수, gold = 자동 G 습득으로 받은 G(R-025), blue = 그중 B 코인 칸으로 받은 B(R-043)

        return (enemies[p[2]]?.name || p[2]) + ' ' + (mixKeys[p[3]] || p[3]);

      return names[group]?.[rest] || rest || group;

        },
        reese: {
          kind: 'bass',
          inst: 'reese',
          v: 0.11,
          gate: 0.98,
          cut: 600,
          lines: [['9-24', 'R.......R.......']],
        },
        pad: { kind: 'pad', inst: 'pad2', v: 0.12, cut: 2400, atk: 0.5, rel: 1.4, rev: 0.6 },
        keys: {
          kind: 'chord',
          inst: 'epiano',
          v: 0.16,
          gate: 0.95,
          strum: 0.01,
          rev: 0.35,
          dly: 0.2,
          wobble: { rate: 3, depth: 0.3 },
          lines: [['1-24', 'X.......x.......']],
        },
        bells: {
          kind: 'arp',
          inst: 'glass',
          v: 0.04,
          decay: 1.2,
          base: 'A4',
          rev: 0.6,
          dly: 0.3,
          pan: 0.2,
          lines: [['17-24', '0.1.2.3.2.1.3.2.']],
        },
        lead: {
          kind: 'melody',
          inst: 'soft',
          v: 0.11,
          gate: 0.92,
          glide: 0.04,
          rev: 0.4,
          dly: 0.3,
          bars: {
            9: 'A5 - - -',
            10: 'G5 - E5 -',
            11: 'G5 - - -',
            12: 'A5 - G5 -',
            13: 'F5 - - -',
            14: 'E5 - D5 -',
            15: 'E5 - - -',
            16: 'G#5 - - -',
            17: 'A5 - - -',
            18: 'C5 - E5 G5',
            19: 'B4 - D5 -',
            20: 'E5 - - -',
            21: 'F#5 - - -',
            22: 'G5 - B5 -',
            23: 'A5 - - -',
            24: 'B4 - - -',
          },
        },
      },
    },
  };

  // 장면마다 고를 수 있는 곡(음악 후보, R-051 피드백). 첫째가 기본(지금 곡), 이름 · 설명은 terms.js musicLab
  const CANDIDATES = {
    intro: ['intro', 'intro-a', 'intro-b', 'intro-c'],
    lobby: ['lobby', 'lobby-a', 'lobby-b', 'lobby-c'],
    battle: ['battle', 'battle-a', 'battle-b', 'battle-c'],
  };

  // ── 곡 표 → 음 이벤트(순수) ──
  // 새 꼴 파트(음악 후보, R-051 피드백): 파트에 kind가 있으면 아래 규칙으로 읽는다(없으면 위 지금 곡의 옛 꼴).
  //   inst = 소리(PLAY 이름, 없으면 파트 이름) · pan(−1~1) · wobble { rate, depth }(좌우 흔들림) · human(세기 흔들림, 고정 씨앗)
  //   pad: 마디 화음을 길게 · chord: 16칸 X/x 자리에서 화음(top 위 n음 · oct 옥타브 · strum 초 · gate)
  //   bass: 16칸 R/r 근음 · O/o 옥타브 위 · 5 5도(근음은 roots, '|'로 마디를 나눈다) · arp: 16칸 숫자 = 화음 음 번호
  //   melody: bars { '마디': '칸…' }, 마디마다 4 · 8 · 16칸 등. 음 이름 · '-' 늘임(마디를 넘어 이어짐) · '.' 쉼, glide(초)
  //   drum: 16칸 X/x(O/o 열린 소리), 소리는 곡마다 한 번 만든 북 샘플(KIT) · riser · noise(곡 전체 한 줄)
  //   16칸에서 ','는 끊음. swing(곡): 16분 뒷박(홀수 칸)을 16분 × swing만큼 늦춘다
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  // 음 이름(과학 표기, A4 = 440Hz) → MIDI 번호. 'Bb3' · 'G#5'
  function midi(name) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    if (!m) throw new Error('음 이름 ' + name);
    return 12 * (Number(m[3]) + 1) + PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // n의 음 이름을 base 이상에서 가장 낮은 자리로
  const above = (n, base) => base + ((((n - base) % 12) + 12) % 12);
  // 마디 표기 → 마디 번호 목록(1부터)
  function barsOf(spec, total) {
    const out = [];
    for (const part of String(spec).split(',')) {
      const m = /^(\d+)(?:-(\d+))?(?:\/(\d+))?$/.exec(part.trim());
      if (!m) throw new Error('마디 표기 ' + spec);
      const from = Number(m[1]),
        to = Math.min(m[2] ? Number(m[2]) : from, total),
        by = m[3] ? Number(m[3]) : 1;
      for (let b = from; b <= to; b += by) out.push(b);
    }
    return out;
  }
  // 칸 글자 세기: 대문자 = 강, 소문자 = 약
  const level = ch => (ch === ch.toUpperCase() ? 1 : 0.55);
  // 아르페지오 음: 'chord' = 그 칸 화음 음을 base 위로 모아 낮은 순, '1-5-8-10' = 근음 · 5도 · 옥타브 · 10도(장 · 단은 화음에서)
  function arpTones(kind, seg, root, base) {
    if (kind === '1-5-8-10') {
      const r = above(root, base),
        third = seg.notes.some(n => (((n - r) % 12) + 12) % 12 === 3) ? 3 : 4;
      return [r, r + 7, r + 12, r + 12 + third];
    }
    return [...new Set(seg.notes.map(n => above(n, base)))].sort((a, b) => a - b);
  }
  // 북 소리 길이(초). 열린 하이햇은 0.25
  const DRUM = { kick: 0.35, snare: 0.18, clap: 0.22, hat: 0.04, crash: 1.5 };
  // 새 꼴 북 샘플 길이(초). 소리 만드는 법은 아래 합성 KIT
  const KIT_SEC = {
    kick2: 0.55,
    kick3: 0.45,
    snare2: 0.4,
    snare3: 0.45,
    clap2: 0.45,
    hat2: 0.09,
    'hat2-open': 0.45,
    shaker: 0.16,
    crash2: 2.2,
  };
  // 글자 → 고정 씨앗(세기 흔들림이 곡 · 파트마다 늘 같게)
  const hash = s =>
    [...String(s)].reduce((h, ch) => Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0, 2166136261);

  // 곡 → { len(초), events: [{ i 파트, t 시작, d 길이(초), v 음량, f 음높이(Hz, 음이 있는 파트), o 열린 하이햇 }] }
  function score(id) {
    const tr = TRACKS[id];
    if (!tr) throw new Error('곡 없음 ' + id);
    const beat = 60 / tr.bpm,
      bar = beat * 4,
      step = beat / 4,
      len = tr.bars * bar,
      P = tr.parts,
      // 근음: 마디마다 하나, 새 꼴은 '|'로 마디를 똑같이 나눌 수 있다(옛 꼴은 마디 첫 근음)
      rootSegs = [],
      roots = tr.roots.split(/\s+/).map((tok, b) => {
        const ps = tok.split('|');
        ps.forEach((p, k) =>
          rootSegs.push({ t: b * bar + (k * bar) / ps.length, d: bar / ps.length, n: midi(p) }),
        );
        return midi(ps[0]);
      }),
      events = [];
    const rootAt = t => (rootSegs.find(s => t < s.t + s.d - 1e-9) || rootSegs[rootSegs.length - 1]).n;
    const add = (i, t, d, v, f, more) =>
      events.push(Object.assign({ i, t, d, v }, f === undefined ? null : { f }, more));
    // 화음 칸: '|'로 나눈 마디는 칸마다
    const segs = [];
    tr.chords.forEach((text, b) => {
      const parts = text.split('|');
      parts.forEach((p, k) =>
        segs.push({
          t: b * bar + (k * bar) / parts.length,
          d: bar / parts.length,
          notes: p.trim().split(/\s+/).map(midi),
        }),
      );
    });
    const segAt = t => segs.find(s => t < s.t + s.d - 1e-9) || segs[segs.length - 1];
    // 16칸 패턴: fn(글자, 시작, 다음 글자까지 길이, 마디)
    const grid = (part, fn) => {
      for (const [spec, cells] of part.lines) {
        if (cells.length !== 16) throw new Error(id + ' 칸 수 ' + cells);
        for (const b of barsOf(spec, tr.bars))
          for (let k = 0; k < 16; k++) {
            if (cells[k] === '.') continue;
            let n = k + 1;
            while (n < 16 && cells[n] === '.') n++;
            fn(cells[k], (b - 1) * bar + k * step, (n - k) * step, b);
          }
      }
    };
    // 옛 꼴(kind 없음): 지금 곡 세 개
    const old = k => P[k] && !P[k].kind;
    if (old('pad'))
      for (const s of segs) for (const n of s.notes) add('pad', s.t, s.d, P.pad.v / s.notes.length, hz(n));
    for (const i of Object.keys(DRUM))
      if (old(i))
        grid(P[i], (ch, t) => {
          const open = i === 'hat' && (ch === 'O' || ch === 'o');
          add(i, t, open ? 0.25 : DRUM[i], P[i].v * level(ch), undefined, open ? { o: 1 } : null);
        });
    if (old('riser')) grid(P.riser, (ch, t) => add('riser', t, P.riser.len * step, P.riser.v * level(ch)));
    if (old('bass'))
      grid(P.bass, (ch, t, span, b) => {
        const up = ch === 'O' || ch === 'o' ? 12 : 0;
        add('bass', t, span * P.bass.gate, P.bass.v * level(ch), hz(roots[b - 1] + up));
      });
    if (old('arp')) {
      const base = midi(P.arp.base);
      grid(P.arp, (ch, t, span, b) => {
        const tones = arpTones(P.arp.tones, segAt(t), roots[b - 1], base),
          k = Number(ch);
        add('arp', t, P.arp.decay, P.arp.v, hz(tones[k % tones.length] + 12 * Math.floor(k / tones.length)));
      });
    }
    if (old('lead'))
      for (const [b, text] of Object.entries(P.lead.bars)) {
        const cells = text.trim().split(/\s+/),
          eighth = beat / 2;
        if (cells.length !== 8) throw new Error(id + ' 멜로디 ' + b + '마디 칸 수 ' + cells.length);
        for (let k = 0; k < 8; k++) {
          if (cells[k] === '-' || cells[k] === '.') continue;
          let n = k + 1;
          while (n < 8 && cells[n] === '-') n++;
          add(
            'lead',
            (b - 1) * bar + k * eighth,
            (n - k) * eighth * P.lead.gate,
            P.lead.v,
            hz(midi(cells[k])),
          );
        }
      }
    if (old('bell'))
      for (const b of barsOf(P.bell.bars, tr.bars)) {
        const s = segAt((b - 1) * bar);
        add('bell', (b - 1) * bar, 0.8, P.bell.v, hz(Math.max(...s.notes) + P.bell.up));
      }

    // 새 꼴(kind 있음): 음악 후보
    const sw = (tr.swing || 0) * step,
      at16 = (b, k) => (b - 1) * bar + k * step + (k % 2 ? sw : 0);
    // 16칸: '.' 늘임 · ',' 끊음(소리 없음). fn(글자, 시작, 다음 칸까지 길이)
    const grid16 = (part, fn) => {
      for (const [spec, cells] of part.lines) {
        if (cells.length !== 16) throw new Error(id + ' 칸 수 ' + cells);
        for (const b of barsOf(spec, tr.bars))
          for (let k = 0; k < 16; k++) {
            if (cells[k] === '.' || cells[k] === ',') continue;
            let n = k + 1;
            while (n < 16 && cells[n] === '.') n++;
            const t = at16(b, k);
            fn(cells[k], t, (n < 16 ? at16(b, n) : b * bar) - t);
          }
      }
    };
    const voicing = (notes, p) => {
      const ns = notes.map(n => n + 12 * (p.oct || 0));
      return p.top ? ns.slice(-p.top) : ns;
    };
    // 멜로디: 칸을 시간 순으로 펼치고, '-'가 바로 이어지면(마디를 넘어도) 앞 음을 늘인다
    const melody = (name, p) => {
      const cells = [];
      for (const [spec, text] of Object.entries(p.bars)) {
        const cs = text.trim().split(/\s+/),
          per = 16 / cs.length,
          swung = cs.length === 16;
        if (![1, 2, 4, 8, 16].includes(cs.length))
          throw new Error(id + ' ' + name + ' ' + spec + '마디 칸 수');
        for (const b of barsOf(spec, tr.bars))
          cs.forEach((c, k) => {
            const t0 = swung ? at16(b, k) : (b - 1) * bar + k * per * step,
              t1 =
                k + 1 === cs.length ? b * bar : swung ? at16(b, k + 1) : (b - 1) * bar + (k + 1) * per * step;
            cells.push({ t0, t1, c });
          });
      }
      cells.sort((a, b) => a.t0 - b.t0);
      let prev = null;
      cells.forEach(({ t0, t1, c }, k) => {
        if (c === '-' || c === '.') return;
        let end = t1;
        for (let j = k + 1; j < cells.length && cells[j].c === '-' && Math.abs(cells[j].t0 - end) < 1e-6; j++)
          end = cells[j].t1;
        const f = hz(midi(c)),
          legato = prev && Math.abs(prev.end - t0) < 1e-6;
        add(name, t0, (end - t0) * (p.gate || 0.92), p.v, f, p.glide && legato ? { g: prev.f } : null);
        prev = { f, end };
      });
    };
    for (const [name, p] of Object.entries(P)) {
      if (!p.kind) continue;
      const r = seeded(hash(id + '/' + name)),
        lv = ch => level(ch) * (1 - (p.human || 0) * r());
      if (p.kind === 'pad')
        for (const s of segs) {
          const ns = voicing(s.notes, p);
          for (const n of ns) add(name, s.t, s.d, p.v / ns.length, hz(n));
        }
      else if (p.kind === 'chord')
        grid16(p, (ch, t, span) => {
          const ns = voicing(segAt(t).notes, p),
            st = p.strum || 0;
          ns.forEach((n, k) =>
            add(
              name,
              t + k * st,
              Math.max(0.05, span * (p.gate || 0.9) - k * st),
              (p.v * lv(ch)) / Math.sqrt(ns.length),
              hz(n),
            ),
          );
        });
      else if (p.kind === 'bass')
        grid16(p, (ch, t, span) =>
          add(
            name,
            t,
            span * (p.gate || 0.85),
            p.v * lv(ch),
            hz(rootAt(t) + 12 * (p.oct || 0) + ({ O: 12, o: 12, 5: 7 }[ch] || 0)),
          ),
        );
      else if (p.kind === 'arp') {
        const base = midi(p.base);
        grid16(p, (ch, t) => {
          const tones = arpTones(p.tones || 'chord', segAt(t), rootAt(t), base),
            k = Number(ch);
          add(
            name,
            t,
            p.decay || 0.3,
            p.v * lv('X'),
            hz(tones[k % tones.length] + 12 * Math.floor(k / tones.length)),
          );
        });
      } else if (p.kind === 'drum')
        grid16(p, (ch, t) => {
          const open = ch === 'O' || ch === 'o';
          add(
            name,
            t,
            KIT_SEC[(p.inst || name) + (open ? '-open' : '')],
            p.v * lv(ch),
            undefined,
            open ? { o: 1 } : null,
          );
        });
      else if (p.kind === 'riser') grid16(p, (ch, t) => add(name, t, (p.len || 16) * step, p.v * level(ch)));
      else if (p.kind === 'noise') add(name, 0, len, p.v);
      else if (p.kind === 'melody') melody(name, p);
      else throw new Error(id + ' 모르는 kind ' + p.kind);
    }
    events.sort((a, b) => a.t - b.t);
    return { id, bpm: tr.bpm, bars: tr.bars, len, events };
  }

  // ── 합성(렌더 안에서만) ──
  // 노드를 차례로 잇는다(마지막은 노드나 AudioParam)
  function link(...nodes) {
    for (let i = 1; i < nodes.length; i++) nodes[i - 1].connect(nodes[i]);
    return nodes[nodes.length - 1];
  }
  function gainOf(c, v) {
    const g = c.createGain();
    g.gain.value = v;
    return g;
  }
  function filter(c, type, f, q) {
    const b = c.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    if (q) b.Q.value = q;
    return b;
  }
  // 바로 올라 지수로 사라지는 음량(북 · 종 · 아르페지오)
  function hit(c, t, v, dec, attack = 0.003) {
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + attack);
    g.gain.exponentialRampToValueAtTime(1e-4, t + dec);
    return g;
  }
  // 잡음 소리(고정 잡음 버퍼를 돌려 쓴다)
  function noiseFrom(c, nz, t, d) {
    const s = c.createBufferSource();
    s.buffer = nz;
    s.loop = true;
    s.start(t);
    s.stop(t + d + 0.02);
    return s;
  }
  // 고정 씨앗 난수(mulberry32)
  function seeded(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noiseBuffer(c) {
    const b = c.createBuffer(1, 2 * MIX.rate, MIX.rate),
      d = b.getChannelData(0),
      r = seeded(17);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
    return b;
  }
  // 새 꼴 잔향 IR(fx.room): 미리 지연 · 이른 반사 + 갈수록 어두워지는(damp) 잡음 꼬리, sec초에 −60dB
  function roomBuffer2(c, room) {
    const R = c.sampleRate,
      sec = room.sec || 2.5,
      pre = Math.round((room.pre ?? 0.02) * R),
      n = pre + Math.round(sec * R),
      b = c.createBuffer(2, n, R),
      damp = room.damp ?? 0.5;
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch),
        r = seeded(53 + ch);
      let y = 0;
      for (let i = pre; i < n; i++) {
        const t = (i - pre) / R,
          fc = 300 + 8500 * Math.exp(-t * (1 + damp * 4));
        y += (1 - Math.exp((-2 * Math.PI * fc) / R)) * (r() * 2 - 1 - y);
        d[i] = y * Math.exp((-6.9 * t) / sec);
      }
      [0.011, 0.019, 0.027, 0.041].forEach((s, k) => {
        d[pre + Math.round(s * R)] += ((k + ch) % 2 ? 0.5 : -0.4) * (1 - k * 0.2);
      });
    }
    return b;
  }
  // 잔향 IR: 2초 잡음 × e^(−3t), 좌우 다른 잡음
  function roomBuffer(c) {
    const n = 2 * MIX.rate,
      b = c.createBuffer(2, n, MIX.rate),
      r = seeded(29);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (r() * 2 - 1) * Math.exp((-3 * i) / MIX.rate);
    }
    return b;
  }

  // ── 새 꼴 악기 도우미 ──
  // 부드러운 포화(tanh). 사인에 홀수 배음을 더해 폰 스피커에서도 낮은 음이 들린다
  const curves = {};
  function shaper(c, k) {
    if (!curves[k]) {
      const a = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) a[i] = Math.tanh(k * ((i / 1023) * 2 - 1)) / Math.tanh(k);
      curves[k] = a;
    }
    const w = c.createWaveShaper();
    w.curve = curves[k];
    return w;
  }
  // 올라(atk) 머물다 끝에서 rel초에 사라지는 음량(멈춤은 end + rel × 2)
  function sustain(c, t, end, v, atk, rel) {
    const g = c.createGain(),
      top = Math.max(end, t + atk);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + atk);
    g.gain.setValueAtTime(v, top);
    g.gain.setTargetAtTime(0, top, rel / 3);
    return g;
  }
  // 음높이: glide가 있고 앞 음과 이어지면(e.g) 앞 음에서 미끄러져 온다. mul = 배수(옥타브 위 · 아래)
  function pitch(o, e, glide, mul = 1) {

    // 둥근 베이스: 사인 → 포화(배음) → 저역 통과

    TRACKS,
    CANDIDATES,
    PICK_KEY,
    score,

            '</h2>' +
            M.CANDIDATES[scene].map(id => row(scene, id, p[scene] === id)).join('') +
            '</section>',
        ).join('');
      }
      // 줄마다 ▶/■ · 상태 글자(만드는 중 n% · 차례 · 재생 중 · 실패)
      function paint() {
        for (const el of document.querySelectorAll('.row')) {
          const id = el.dataset.id,
            on = !!cur && cur.id === id,
            b = el.querySelector('.play'),
            name = L.tracks[id][0];
          el.classList.toggle('is-on', on || want === id);
          b.setAttribute('aria-pressed', String(on));
          b.setAttribute('aria-label', on ? L.stop(name) : L.play(name));
          b.firstChild.textContent = on ? '■' : '▶';
          el.querySelector('.st').textContent = on
            ? L.playing
            : making === id
              ? L.making(pct[id] || 0)
              : queue.includes(id)
                ? L.waiting
                : failed[id]
                  ? L.failed
                  : '';
        }
      }
      function ensure() {
        if (!AC) return false;
        if (!ac) {
          ac = new AC();
          out = ac.createGain();
          out.gain.value = M.MIX.music;
          out.connect(ac.destination);
        }
        if (ac.state === 'suspended') ac.resume();
        return true;
      }
      function play(id) {
        const t = ac.currentTime,
          src = ac.createBufferSource(),
          g = ac.createGain(),
          r = cache.get(id);
        cache.delete(id);
        cache.set(id, r);
        src.buffer = r.buffer;
        src.loop = true;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(1, t + 0.15);
        src.connect(g);
        g.connect(out);
        src.start(t);
        cur = { id, src, g };
      }
      function stop() {
        if (!cur) return;
        const { src, g } = cur,
          t = ac.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0, t + 0.15);
        src.stop(t + 0.2);
        cur = null;
      }
      async function next() {
        if (making || !queue.length) return;
        const id = (making = queue.shift());
        pct[id] = 0;
        paint();
        try {
          const r = await M.render(id, p => {
            const n = Math.round(p * 100);
            if (n !== pct[id]) {
              pct[id] = n;
              paint();
            }
          });
          cache.set(id, r);
          while (cache.size > 4) cache.delete([...cache.keys()].find(k => !cur || k !== cur.id));
          if (want === id && !cur) play(id);
        } catch {
          failed[id] = true;
        }
        making = null;
        paint();
        next();
      }
      function toggle(id) {
        if (!ensure()) return status(L.noAudio);
        const again = cur && cur.id === id;
        stop();
        want = again ? null : id;
        if (want) {
          if (cache.has(id)) play(id);
          else if (making !== id) queue = [id];
        }
        paint();
        next();
      }

      list();
      paint();
      document.addEventListener('click', e => {
        const b = e.target.closest('[data-play]');
        if (b) toggle(b.dataset.play);
      });
      document.addEventListener('change', e => {
        const name = e.target.name || '';
        if (!name.startsWith('use-')) return;
        const scene = name.slice(4);
        try {
          const p = M.picks();
          p[scene] = e.target.value;
          localStorage.setItem(M.PICK_KEY, JSON.stringify(p));
          status(L.saved(scene));
        } catch {
          status(L.failed);
        }
      });
      $('copy').addEventListener('click', async () => {
        const text = L.text(picked()),
          box = $('copy-text');
        try {
          await navigator.clipboard.writeText(text);
          status(L.copied);
        } catch {
          box.hidden = false;
          box.value = text;
          box.select();
          status(L.copyFail);
        }
      });
      // 뒤로 가면 멈추고 돌아오면 이어서
      document.addEventListener('visibilitychange', () => {
        if (!ac) return;
        if (document.hidden) ac.suspend();
        else ac.resume();
      });
    </script>
  </body>
</html>
