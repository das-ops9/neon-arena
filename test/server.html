<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>NEON ARENA · 시험 서버 값</title>
    <style>
      /* NEON ARENA v4 디자인 토큰과 기본 규칙. 근거: docs/history/UI_RESEARCH.md
   글자는 rem(사용자 글자 크기 설정을 따름), 간격·터치 영역은 px로 고정한다. */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #070b13;
  --bg-raise: #0b1420;
  --surface: #0f1b29;
  --surface-2: #142538;
  --surface-3: #1a3048;
  --line: #20364a;
  --line-strong: #2e4c66;

  /* 글자 (배경 #070b13 기준 대비: ink 17:1, ink-2 11:1, muted 7:1) */
  --ink: #ebf3f6;
  --ink-2: #b9c9d4;
  --muted: #8aa0ae;

  /* 강조 */
  --cyan: #50f3d6;
  --cyan-deep: #0f3a37;
  --gold: #f4ce72;
  --gold-deep: #3a2d12;
  --blue: #68b9ff;
  --blue-deep: #12304d;
  --violet: #c4a3ff;
  --violet-deep: #2b1f48;
  --pink: #ff4e8e;
  --danger: #ff5f6d;
  --orange: #ff9a4d;

  /* 한 줄 남기기 글자색(R-161). 기존 팔레트를 가리키고, 색은 글자에만 적용 */
  --note-base: var(--ink-2);
  --note-cyan: var(--cyan);
  --note-mint: var(--cos-mint);
  --note-gold: var(--gold);
  --note-pink: var(--pink);
  --note-violet: var(--violet);

  /* 재화 */
  --c-gold: var(--gold);
  --c-blue: var(--blue);
  --c-sc: var(--violet);

  /* 색은 모두 이 파일 한 곳(팔레트, R-054). 다른 파일은 이름(var(--…))으로만 쓴다.
     같은 값이 이미 있으면 그 토큰을 가리킨다. 캔버스 · 그래프는 처음 한 번 읽어 풀린 값을 쓴다 */

  /* 낱색: 한두 곳에서만 쓰는 색(이름은 쓰임새) */
  --white: #ffffff;
  --black: #000000;
  --lilac: #b895ff;
  --on-cyan: #04201c;
  --on-danger: #1a0508;
  --on-white: var(--bg); /* 흰 바탕 위 글자(결과 NEW BEST) */
  --blue-ink: #cfe7ff;
  --violet-ink: #e9ddff;
  --danger-ink: #ffd0d5;
  --danger-deep: #3a1219;
  --logo-ink: #e9fffb;
  --title-top: #18153f;
  --title-mid: #100d2a;
  --title-bottom: #0a0918;
  --title-glow: #7a5cff;
  --grid-line: #16313d;
  --area-line: #24394b;
  --area-bg: #08101a;
  --area-label: #8fb3c4;
  --gold-tint: #2a2412;
  --cyan-tint: #10302d;
  --danger-tint: #2a1218;
  --soon-line: #2a3d50;
  --soon-bg: #0b121c;
  --scrim: #03060b;
  --overlay-bg: #04070c;
  --stage-bg: #1d170a;
  --bar-bg: #1b2a38;
  --action-bg: #0a1520;
  --vignette: #050810;
  --shine: #ffd36a;
  --shine-core: #fff6d8;
  --debug-mark: #ffe45c;
  --warn: var(--danger);

  /* 스킬(terms.js skills의 color → 카드 · HUD 스킬 줄 --c) */
  --sk-power: var(--cyan);
  --sk-rapid: var(--cyan);
  --sk-multi: var(--gold);
  --sk-pierce: #af9bff;
  --sk-speed: var(--cyan);
  --sk-magnet: var(--gold);
  --sk-orbit: var(--sk-pierce);
  --sk-vital: #8ce8a2;
  --sk-nova: var(--sk-pierce);
  --sk-crit: var(--gold);
  --sk-shield: #50b6ff;
  /* 연쇄 번개(R-120, 월드 전용): 연두 전기 — 적 탄(빨강 · 주황) · 칼날(흰빛) · 시안과 다른 색 */
  --sk-chain: #d8ff5c;
  /* 월드(R-122 · R-123): 흑백(은빛) 화면 색 · 연쇄 번개 */
  --world: #dfe4ee;
  --world-2: #aab1bf;
  --world-line: #4c525e;
  --world-deep: #15181f;
  --chain: var(--sk-chain);

  /* 회복(R-061 회복 구역 · R-062 HP 회복 버프 · 버프 표시): 장갑 강화와 같은 초록 계열(전장에 없는 색) */
  --heal: var(--sk-vital);
  /* GM 실험 칸 표시(R-065, 시험 경로에만) */
  --gm: var(--pink);
  /* 튜토리얼 · 팁(R-073): TIP 줄 · 할 일 칩 · 가리킴. 플레이어 쪽 색(시안) */
  --tip: var(--cyan);
  /* 탭 새 소식 점(R-074): 모바일 새 소식 관례의 빨강 */
  --dot: var(--danger);
  /* 고양이 비행사 소품 · 배지 색(R-075): 정비사 미오 렌치 · 보급관 토토 상자 · 조종사 루나 고글 · 종이비행기 */
  --cat-engineer: var(--orange);
  --cat-supply: #e3b277;
  --cat-pilot: #7fd4ff;

  /* 모드 배지(badges.js, 모양은 그 파일): 색 · 판 위(tone) · 판 아래(tone2) · 글자 */
  --mode-easy: #52ead1;
  --mode-easy-tone: #123033;
  --mode-easy-tone2: #0a1d20;
  --mode-easy-text: #d2fff6;
  --mode-hard: #f2c768;
  --mode-hard-tone: #3d3019;
  --mode-hard-tone2: #231b0e;
  --mode-hard-text: #fff0c8;
  --mode-extream: var(--blue);
  --mode-extream-tone: #173351;
  --mode-extream-tone2: #0d1f33;
  --mode-extream-text: #dbeeff;
  --mode-super: #b996ff;
  --mode-super-tone: #30224c;
  --mode-super-tone2: #1b1330;
  --mode-super-text: #efe6ff;
  --mode-ultra: #ffd98a;
  --mode-ultra-tone: #4c3a19;
  --mode-ultra-tone2: #2b200d;
  --mode-ultra-text: #fff5dc;
  --mode-insane: #ff5a7a;
  --mode-insane-tone: #4d1728;
  --mode-insane-tone2: #2a0b16;
  --mode-insane-text: #ffe3ea;
  /* BOSS MODE(R-156): HELIOS 금주황 */
  --mode-boss: #ffa94d;
  --mode-boss-tone: #4d2a10;
  --mode-boss-tone2: #2a1606;
  --mode-boss-text: #fff0de;
  /* SHADOW MODE(R-157): 잔상 은보라 */
  --mode-shadow: #cfc6ff;
  --mode-shadow-tone: #2a2548;
  --mode-shadow-tone2: #15122b;
  --mode-shadow-text: #f3f0ff;

  /* 전장(renderer.js가 처음 한 번 읽는다. 캔버스용이라 #rrggbb나 그 값을 가리키는 var()만, 빠지면 자홍) */
  --cv-base-bg: #070c16;
  --cv-base-grid: var(--grid-line);
  --cv-base-border: #386b76;
  --cv-super-bg: #0c0a18;
  --cv-super-grid: #252039;
  --cv-super-border: #514369;
  --cv-ultra-bg: #120f0a;
  --cv-ultra-grid: #302a1b;
  --cv-ultra-border: #625538;
  --cv-insane-bg: #150b12;
  --cv-insane-grid: #33202d;
  --cv-insane-border: #6c3e52;
  --cv-craft-fill: #123b40;
  --cv-craft-line: #97ffe9;
  --cv-craft-core: #f1fffb;
  --cv-craft-2d: var(--cyan);
  --cv-glow: var(--cyan);
  --cv-chaser: var(--pink);
  --cv-runner: #ffad66;
  --cv-shooter: var(--lilac);
  --cv-splitter: var(--pink);
  --cv-boss: #ffca74;
  --cv-boss-2: var(--orange);
  --cv-boss-3: var(--danger);
  --cv-boss-inner: #ffd68b;
  /* HELIOS 다섯 단계(R-299): 황금 → 주황 → 진홍 → 백금 → 청백. 색만이 아니라 코로나 모양 · 보스 줄 'n단계'로도 구분 */
  --cv-helios-1: #ffd166;
  --cv-helios-2: #ff9a3c;
  --cv-helios-3: #ff4d6d;
  --cv-helios-4: #eef1ff;
  --cv-helios-5: #8fd3ff;
  --cv-boss-tell: var(--gold);
  --cv-enemy-fill: #301a2b;
  --cv-shooter-fill: #251c38;
  --cv-boss-fill: #362a23;
  --cv-gem: #ffde85;
  --cv-gem-2d: var(--gold);
  --cv-shot: #a1ffec;
  --cv-shot-tint: #8affea;
  --cv-crit-tint: #ffdb8a;
  --cv-shot-2d: #9fffe7;
  --cv-hostile-red: #ff4d5e;
  --cv-hostile-orange: #ff7a45;
  --cv-hostile-edge: #2a0b0b;
  --cv-hostile-core: #ffe0c8;
  --cv-blade: var(--cyan);
  --cv-blade-core: #f4fffd;
  --cv-spark: var(--white);
  --cv-hurt: var(--pink);
  --cv-dash: var(--cyan);
  --cv-nova: var(--lilac);
  /* 붕괴 구역(R-072) = 빨강(바닥의 큰 원 · 차오름으로 작은 적 탄과 구분) → 마지막에 노랗게 → 흰 섬광. 회복 구역 초록과 짝 */
  --cv-hazard: #ff4060;
  --cv-hazard-hot: var(--shine);
  --cv-hazard-flash: var(--white);
  --cv-shield: #65baff;
  --cv-shield-max: #9fdcff;
  --cv-number: var(--gold);
  --cv-scoin: var(--violet);
  --cv-scoin-fill: var(--violet-deep);
  --cv-scoin-ink: #eee2ff;
  --cv-bcoin: var(--blue);
  --cv-bcoin-fill: var(--blue-deep);
  --cv-bcoin-ink: var(--blue-ink);
  --cv-heal: var(--heal);
  --cv-revive: var(--gold);
  /* 월드 판(R-122): 모드와 상관없이 흑백 전장 · 필드 스킬 패(짙은 채움 · 잠김 회색) · 연쇄 번개(연두 빛 + 흰 심) */
  --cv-world-bg: #0a0b0e;
  --cv-world-grid: #22252c;
  --cv-world-border: #5d626c;
  --cv-item-fill: #0b1220;
  --cv-item-lock: #7d8494;
  --cv-chain: var(--chain);
  --cv-chain-core: #f6ffd6;
  /* 도색(R-108): 몸체 선 · 빛(밝은 색) + 몸체 채움(짙은 색). 기체 가운데 흰 점은 그대로.
     구분: 칼(시안 + 흰 심) · 적 탄(빨강 · 주황)과 겹치지 않게 빨강 · 주황 계열 없음.
     노랑 = 레몬(54°) ↔ 경험치 젬 옅은 금색 · 보스 금색: 채도 · 밝기로 가름.
     파랑 = 코발트(229°) ↔ 보호막 · B 코인 하늘색(208°): 색상을 20° 넘게 띄움.
     보라 = 짙은 보라(270°, 채도 높음) ↔ S 코인 · 충격파 · 사수 연보라(채도 낮음): 채도로 가름 */
  --paint-yellow: #ffe23a;
  --paint-yellow-fill: #3a3108;
  --paint-blue: #4f6bff;
  --paint-blue-fill: #111c55;
  --paint-violet: #a855ff;
  --paint-violet-fill: #2a1250;
  --cv-paint-yellow: var(--paint-yellow);
  --cv-paint-yellow-fill: var(--paint-yellow-fill);
  --cv-paint-blue: var(--paint-blue);
  --cv-paint-blue-fill: var(--paint-blue-fill);
  --cv-paint-violet: var(--paint-violet);
  --cv-paint-violet-fill: var(--paint-violet-fill);
  /* 꾸미기(R-116 · R-118): 무늬 색 · 엔진 불꽃 · 꼬리 자국(자국 색 = 불꽃 색). 빨강 · 주황 · 분홍 계열은 없다
     (적 탄 · 붕괴 구역 · 추적 적 색과 구분). 오로라 = 시안 → 하늘 → 보라 → 민트 → 금빛 띠(렌더러가 이 다섯을 섞음) */
  --cos-white: #f4fffd;
  --cos-cyan: var(--cyan);
  --cos-sky: #7fd4ff;
  --cos-mint: #7cf2b4;
  --cos-violet: var(--violet);
  --cos-silver: #cfd8e6;
  --cos-gold: var(--shine);
  --cv-cos-white: var(--cos-white);
  --cv-cos-cyan: var(--cos-cyan);
  --cv-cos-sky: var(--cos-sky);
  --cv-cos-mint: var(--cos-mint);
  --cv-cos-violet: var(--cos-violet);
  --cv-cos-silver: var(--cos-silver);
  --cv-cos-gold: var(--cos-gold);
  /* 꾸미기 확장(R-160): 기본 · 고급 · 특별의 색. INSANE RED 색(진홍 · 적철 · 흑진홍 · 진홍 은맥 · 루비 유리)은
     선체 안의 무광 면 · 짧은 점에만 쓴다. 불꽃 · 꼬리 자국의 빨강은 없다(백청 · 은백 · 흰빛). 등급 줄 색은 --tier-*. */
  --cos-aqua: #2fc7e8;
  --cos-ice: #c9f0ff;
  --cos-cobalt: #4f6dff;
  --cos-jade: #3fd9a0;
  --cos-ion: #3d9bff;
  --cos-pearlblue: #b4d2ff;
  --cos-spectrum: #c9a8ff;
  --cos-pearlchrome: #eef2fa;
  --cos-prismshift: #f2c9ff;
  --cos-deepblue: #2452d6;
  --cos-whiteblue: #d6f7ff;
  --cos-crimson: #8f1c31;
  --cos-ironred: #b84a5e;
  --cos-darkred: #5a1224;
  --cos-redvein: #c8334f;
  --cos-rubyglass: #e2506b;
  --cv-cos-aqua: var(--cos-aqua);
  --cv-cos-ice: var(--cos-ice);
  --cv-cos-cobalt: var(--cos-cobalt);
  --cv-cos-jade: var(--cos-jade);
  --cv-cos-ion: var(--cos-ion);
  --cv-cos-pearlblue: var(--cos-pearlblue);
  --cv-cos-spectrum: var(--cos-spectrum);
  --cv-cos-pearlchrome: var(--cos-pearlchrome);
  --cv-cos-prismshift: var(--cos-prismshift);
  --cv-cos-deepblue: var(--cos-deepblue);
  --cv-cos-whiteblue: var(--cos-whiteblue);
  --cv-cos-crimson: var(--cos-crimson);
  --cv-cos-ironred: var(--cos-ironred);
  --cv-cos-darkred: var(--cos-darkred);
  --cv-cos-redvein: var(--cos-redvein);
  --cv-cos-rubyglass: var(--cos-rubyglass);
  /* 등급 줄(R-160 · 꾸미기 화면 안): INSANE RED 테두리 · 글자 = 은백, 면 = 무광 진홍 어두운 바탕 */
  --tier-insane: var(--cos-silver);
  --tier-insane-bg: #2a0f17;

  /* 분석 페이지(analysis.html, 그래프 색은 페이지를 열 때 읽는다) */
  --an-bg: #090f18;
  --an-ink: #dcebf1;
  --an-text: #8fa9b9;
  --an-on-cyan: #0c2520;
  --an-line: #2b414d;
  --an-card: #10202b;
  --an-label: #83a0b1;
  --an-chart-line: #253c48;
  --an-chart-bg: #0e1a25;
  --an-status-bg: #11252a;
  --an-status-ink: #b4cdd4;
  --an-empty-ink: #91a8b7;
  --an-notes-line: #2c414d;
  --an-notes-ink: #9fb8c6;
  --an-version: #667e8b;
  --an-plot-title: #bfd8e1;
  --an-plot-ink: #87a5b5;
  --an-plot-note: #86a2b0;
  --an-plot-grid: #233a46;
  --an-shield: #7dafff;
  --an-damage: #ff6e9d;
  --an-fps: #79b9ff;

  /* 글꼴 */
  --font: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  /* 굵기 4단(R-098): 1 보조 · 2 기본 · 3 라벨 · 제목 · 4 큰 숫자 · 로고 */
  --fw-1: 500;
  --fw-2: 700;
  --fw-3: 800;
  --fw-4: 900;
  /* HUD 글자 단계(R-090 · R-098): 9 작은 표지 · 11 값 · 18 · 20 STAGE · 24 큰 수. px라 HUD zoom만 따른다 */
  --hfs-1: 9px;
  --hfs-2: 11px;
  --hfs-3: 18px;
  --hfs-4: 20px;
  --hfs-5: 24px;

  /* 간격·모서리 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

  /* 터치 영역 */
  --tap: 44px;
  /* 켜기/끄기 스위치 한 가지 크기(R-309): 설정 · 가져오기 · 상점 · 출격 준비 */
  --sw-w: 40px;
  --sw-h: 24px;
  --sw-knob: 18px;
  /* HUD 크기(R-091 · R-232): body[data-hud] m(기본 1.1) | s(작게 1.0). 위 덩어리 · 아래 행동 줄에만 zoom으로 걸린다(ui.css) */
  --hud-z: 1.1;
  --tap-lg: 48px;
  --action-h: 56px;
  --action-w: 72px;

  /* 층 */
  --z-hud: 10;
  --z-overlay: 20;
  --z-menu: 30;
  --z-sheet: 40;
  --z-dialog: 50;

  /* 움직임 */
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* 안전 영역 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  /* 화면 위 · 아래 끝 여백(R-047): 위는 로고 글씨 높이의 70%(편집장 +20%, 앞 카메라 구멍), 아래는 50%.
     모든 화면(메뉴 · 준비 · 전투 HUD · 창 · 시트)이 쓴다. 가로 화면은 0(ui.css) */
  --edge-top: calc(var(--fs-lg) * 0.7);
  --edge-bottom: calc(var(--fs-lg) * 0.5);

  /* 화면 높이: 주소창이 펼쳐진 작은 높이 기준 */
  --vh-full: 100vh;
}
@supports (height: 100svh) {
  :root {
    --vh-full: 100svh;
  }
}
/* 세로 전체 화면(설정 '전체 화면'): 삼성 인터넷은 앞 카메라 자리를 화면 밖 흰 띠로 비워 두지만, 바로 아래는

      .sort(([x], [y]) => (x < y ? -1 : 1))
      .slice(-SENT_DAYS);
    const out = {
      v: 1,
      id: str(a.id, 32),
      nick: str(a.nick, 20),
      token: /^[0-9a-f]{64}$/.test(a.token) ? a.token : '',
      created: int(a.created),
      nickAt: int(a.nickAt),
      gen: int(a.gen),
      at: int(a.at),
      linked: !!a.linked,
      paused: !!a.paused,
      put: /^[0-9a-f]{64}$/.test(a.put) ? a.put : '',
      hash: Object.fromEntries(hash),
      sent: Object.fromEntries(sent),
      ops: Object.fromEntries(ops),
      queue: (Array.isArray(a.queue) ? a.queue : [])
        .filter(x => typeof x === 'string' && x.length <= 64)
        .slice(-QUEUE_MAX),
      seen: (Array.isArray(a.seen) ? a.seen : []).filter(Number.isInteger).slice(-SEEN_MAX),
    };
    if (!out.token)
      Object.assign(out, {
        id: '',
        nick: '',
        created: 0,
        nickAt: 0,
        gen: 0,
        at: 0,
        linked: false,
        paused: false,
        put: '',
      });
    return out;
  }
  function load(store = root.localStorage) {
    try {
      return clean(JSON.parse((store && store.getItem(key())) || 'null'));
    } catch {
      return clean(null);
    }
  }
  function save(acct, store = root.localStorage) {
    const a = clean(acct);
    try {
      if (store) store.setItem(key(), JSON.stringify(a));
    } catch {
      /* 저장 공간이 꽉 차도 판은 계속 */
    }
    return a;
  }
  // 로그인 결과를 붙인다(같은 계정이면 맞춘 hash · 올린 날은 남김)
  function signedIn(acct, res) {
    const a = clean(acct),
      x = obj(res && res.account);
    const same = a.id && a.id === x.id;
    return clean({
      ...a,
      id: x.id,
      nick: x.nick,
      created: x.created,
      nickAt: x.nickAt,
      token: res.token,
      gen: same ? a.gen : 0,
      at: same ? a.at : 0,
      linked: false,
      paused: false,
      put: '',
      sent: same ? a.sent : {},
      queue: same ? a.queue : [],
      seen: same ? a.seen : [],
    });
  }
  // 로그아웃 · 401: 토큰만 지우고 맞춘 hash는 계정 id별로 남김(다시 로그인하면 조용히 연결)
  const signedOut = acct => clean({ hash: clean(acct).hash });

  // ---- 요청 ----
  async function request(method, path, body, opts = {}) {
    const url = base();
    if (!url) return { ok: false, status: 0, error: 'off' };
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), opts.timeout || TIMEOUT) : 0;
    try {
      const res = await (opts.fetch || root.fetch)(url + path, {
        method,
        headers: {
          ...(body === undefined ? {} : { 'Content-Type': 'application/json' }),
          ...(opts.token ? { Authorization: 'Bearer ' + opts.token } : {}),
          ...(opts.headers || {}),
        },
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: ctl ? ctl.signal : undefined,
        cache: 'no-store',
      });
      let data = {};
      try {
        data = await res.json();
      } catch {
        data = {};
      }
      if (res.ok) return { ok: true, status: res.status, body: data };
      return { ok: false, status: res.status, body: data, error: str(data.error, 32) || 'busy' };
    } catch {
      return { ok: false, status: 0, error: 'offline' };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  // ---- 비밀번호 ----
  const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  function newSalt() {
    return hex(root.crypto.getRandomValues(new Uint8Array(16)));
  }
  function pwCheck(pw) {
    const n = [...String(pw == null ? '' : pw)].length;
    return n < PW_MIN || n > PW_MAX ? 'pw-length' : '';
  }
  // PBKDF2-SHA256 → 64자 16진. 비밀번호는 NFC로 맞춘다(기기마다 같은 글자 = 같은 값)
  async function derive(pw, salt, iter = ITER) {
    const enc = new TextEncoder();
    const k = await root.crypto.subtle.importKey(
      'raw',
      enc.encode(String(pw).normalize('NFC')),
      'PBKDF2',
      false,
      ['deriveBits'],
    );
    return hex(
      await root.crypto.subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: iter },
        k,
        256,
      ),
    );
  }

  // ---- 화면 상태 하나(칩 · 줄 · 버튼은 여기서만 판정) ----
  // state: 'off'(서버 없음) · 'out'(로그아웃) · 'in'(로그인) · 'paused'(고르기 전 자동 백업 멈춤) · 'fail'(마지막 백업 실패)
  function status(acct, extra = {}) {
    if (!enabled()) return { state: 'off', dot: false };
    const a = clean(acct);
    if (!a.token) return { state: 'out', dot: false };
    if (a.paused) return { state: 'paused', dot: true };
    if (extra.failed) return { state: 'fail', dot: true };
    return { state: 'in', dot: false };
  }

  // ---- 계정 흐름(성공이면 새 계정 키를 저장해 돌려줌) ----
  async function signup(acct, { nick, pw, age, agree }, opts) {
    const salt = newSalt();
    const r = await request(
      'POST',
      '/v1/signup',
      { nick, salt, key: await derive(pw, salt), age: !!age, agree: !!agree },
      opts,
    );
    if (!r.ok) return r;
    return { ok: true, code: r.body.code, acct: save(signedIn(acct, r.body), opts && opts.store) };
  }
  async function login(acct, { nick, pw }, opts) {
    const s = await request('POST', '/v1/salt', { nick }, opts);
    if (!s.ok) return s;
    const r = await request('POST', '/v1/login', { nick, key: await derive(pw, s.body.salt) }, opts);
    if (!r.ok) return r;
    return { ok: true, acct: save(signedIn(acct, r.body), opts && opts.store) };
  }
  async function recover(acct, { nick, code, pw }, opts) {
    const salt = newSalt();
    const r = await request('POST', '/v1/recover', { nick, code, salt, key: await derive(pw, salt) }, opts);
    if (!r.ok) return r;
    return { ok: true, code: r.body.code, acct: save(signedIn(acct, r.body), opts && opts.store) };
  }
  // 로그인한 요청: 401이면 토큰을 지운 계정 키를 함께 돌려준다
  async function authed(acct, method, path, body, opts = {}) {
    const a = clean(acct);
    const r = await request(method, path, body, { ...opts, token: a.token });
    if (!r.ok && r.status === 401 && r.error === 'login')
      return { ...r, acct: save(signedOut(a), opts.store) };
    return r;
  }
  async function logout(acct, opts) {
    await authed(acct, 'POST', '/v1/logout', {}, opts); // 실패해도 이 기기는 로그아웃
    return { ok: true, acct: save(signedOut(acct), opts && opts.store) };
  }
  async function changeNick(acct, nick, opts) {
    const r = await authed(acct, 'POST', '/v1/nick', { nick }, opts);
    if (!r.ok) return r;
    return {
      ok: true,
      acct: save(
        { ...clean(acct), nick: r.body.account.nick, nickAt: r.body.account.nickAt },
        opts && opts.store,
      ),
    };
  }
  async function changePassword(acct, { pw, next }, opts) {
    const a = clean(acct);
    const s = await request('POST', '/v1/salt', { nick: a.nick }, opts);
    if (!s.ok) return s;
    const salt = newSalt();
    return authed(
      a,
      'POST',
      '/v1/password',
      { key: await derive(pw, s.body.salt), salt, next: await derive(next, salt) },
      opts,
    );
  }
  async function remove(acct, pw, opts) {
    const a = clean(acct);
    const s = await request('POST', '/v1/salt', { nick: a.nick }, opts);
    if (!s.ok) return s;
    const r = await authed(a, 'DELETE', '/v1/me', { key: await derive(pw, s.body.salt) }, opts);
    if (!r.ok) return r;
    const out = signedOut(a);
    delete out.hash[a.id];
    return { ok: true, acct: save(out, opts && opts.store) };
  }
  // 복구 코드 새로 만들기(비밀번호 확인 → 새 코드, 옛 코드 무효)
  async function newCode(acct, pw, opts) {
    const a = clean(acct);
    const s = await request('POST', '/v1/salt', { nick: a.nick }, opts);
    if (!s.ok) return s;
    const r = await authed(a, 'POST', '/v1/code', { key: await derive(pw, s.body.salt) }, opts);
    return r.ok ? { ok: true, code: r.body.code } : r;
  }
  const me = (acct, opts) => authed(acct, 'GET', '/v1/me', undefined, opts);
  // 서버 알림(16b R-153): 아직 안 본 것만 · 읽음 알리기(실패해도 seen이 막아 한 줄만)
  const unseen = (acct, list) =>
    (Array.isArray(list) ? list : []).filter(
      x => x && Number.isInteger(x.id) && !clean(acct).seen.includes(x.id),
    );
  const markSeen = (acct, ids) => ({ ...clean(acct), seen: [...clean(acct).seen, ...ids].slice(-SEEN_MAX) });
  const readNotices = (acct, ids, opts) => authed(acct, 'POST', '/v1/notices/read', { ids }, opts);
  // 받을 보상 받기(16c C2): 서버 grants 줄 id → { got, taken, missing }(한 batch · 같은 로그인 다시 보내도 같은 값)
  const claim = (acct, ids, opts) => authed(acct, 'POST', '/v1/claim', { ids }, opts);

  // ---- 클라우드 백업(16b R-151) ----
  // 사본 = NeonBackup.makeBackup(schema 3) 그대로. 기기에서 gzip(CompressionStream, 없으면 JSON 글자) → base64, 상한 1.5MB.
  // 내용 hash = 정렬 키 JSON(기록 id 순, 내보낸 시각 · 앱 버전 · gm 뺌)의 SHA-256 — 기기 · 탭이 달라도 같은 내용이면 같은 값.
  const CLOUD_MAX = 1500000;
  const DROP = new Set(['exportedAt', 'app', 'gm']);
  function canon(v, top = true) {
    if (Array.isArray(v)) return v.map(x => canon(x, false));
    if (!v || typeof v !== 'object') return v;
    const out = {};
    for (const k of Object.keys(v).sort())
      if (!(top && DROP.has(k)) && v[k] !== undefined) out[k] = canon(v[k], false);
    return out;
  }
  async function contentHash(backup) {
    const c = canon(backup);
    if (Array.isArray(c.records))
      c.records = [...c.records].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const buf = await root.crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(c)));
    return hex(buf);
  }
  const toB64 = bytes => {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return root.btoa(s);
  };
  const fromB64 = s => Uint8Array.from(root.atob(s), ch => ch.charCodeAt(0));
  async function streamBytes(bytes, Stream) {
    const out = new Response(new Blob([bytes]).stream().pipeThrough(new Stream('gzip')));
    return new Uint8Array(await out.arrayBuffer());
  }
  async function pack(backup) {
    const text = JSON.stringify(backup);
    let out;
    if (typeof root.CompressionStream === 'function')
      out = {
        enc: 'gzip',
        data: toB64(await streamBytes(new TextEncoder().encode(text), root.CompressionStream)),
      };
    else out = { enc: 'json', data: text };
    return out.data.length > CLOUD_MAX ? { error: 'too-large' } : out;
  }
  async function unpack(row) {
    if (!row || typeof row.data !== 'string') throw new Error('backup');
    if (row.enc === 'json') return JSON.parse(row.data);
    if (row.enc !== 'gzip' || typeof root.DecompressionStream !== 'function') throw new Error('enc');
    return JSON.parse(
      new TextDecoder().decode(await streamBytes(fromB64(row.data), root.DecompressionStream)),
    );
  }
  const cloudGet = (acct, opts) => authed(acct, 'GET', '/v1/backup', undefined, opts);
  const cloudPut = (acct, { enc, data, hash, app }, ifMatch, opts = {}) =>
    authed(
      acct,
      'PUT',
      '/v1/backup',
      { enc, data, hash, app },
      { ...opts, headers: { 'If-Match': String(ifMatch) } },
    );

  // 로그인 · 가입 직후 연결 판정(순수). cloud = 서버 머리(gen · hash) 또는 null, local = 이 기기 내용 hash,
  // remembered = 이 계정으로 마지막에 맞춘 hash(초기화 · 되돌리기 · 파일 교체 · 다른 계정 사본 뒤에는 비어 있음),
  // fresh = 이 기기가 처음 상태(기록 0)
  // → 'upload'(클라우드 없음 · 바로 올림) | 'link'(같은 내용 · 조용히 연결) | 'resume'(클라우드가 그대로 · 이 기기가 앞섬 → 연결 뒤 올림)
  //   | 'offer'(이 기기가 처음 · 가져올까요) | 'choose'(고르기 창)
  function decide({ cloud, local, remembered, fresh }) {
    if (!cloud) return 'upload';
    if (cloud.hash === local) return 'link';
    if (remembered && cloud.hash === remembered) return 'resume';
    return fresh ? 'offer' : 'choose';
  }
  // 409 때 서버 사본이 '내 것'인지: 마지막으로 보낸 hash나 지금 hash와 같으면 gen만 받아 조용히 이어 간다(응답이 끊긴 PUT · 같은 기기 다른 탭)
  const mine409 = (server, { sent, local }) =>
    !!server && !!server.hash && (server.hash === sent || server.hash === local);
  // 연결됨으로: gen · 맞춘 hash(이 계정 것만 남김 — 다른 계정 사본과 섞이지 않게) · 멈춤 풂
  const linkedTo = (acct, { gen, hash, at }) => {
    const a = clean(acct);
    return clean({
      ...a,
      gen,
      at: at || a.at,
      linked: true,
      paused: false,
      hash: a.id ? { [a.id]: hash } : {},
    });
  };
  // 멈춤: 이 기기가 거꾸로 간 변경(초기화 · 되돌리기 · 파일 교체) 뒤 · 고르기 전. 맞춘 hash를 모두 비워 다음 연결은 고르기 창으로만
  const pausedAcct = acct => clean({ ...clean(acct), linked: false, paused: true, hash: {} });
  // 계정 키 읽고 쓰기 · 올리기를 탭 사이에서 하나씩(없으면 그냥)
  function withLock(fn) {
    const locks = root.navigator && root.navigator.locks;
    return locks && locks.request ? locks.request('neon-cloud' + (root.NEON_NS || ''), fn) : fn();
  }

  // ---- 월드 전체 순위(16b R-152) ----
  // 올리는 판: 매일 도전(kind 'daily') · 날 = 오늘(또는 날이 바뀐 지 2시간 안의 어제) · 이 기기에서 그날 올린 점수보다 높을 때만.
  // 실패(연결 · 서버)는 대기열(기록 id, 최대 10) → 앱 열 때 다시, 기한 지나면 버림(기기 기록 그대로).
  const GRACE = 2 * 3600000;
  const Week = () => root.NeonWeek || (typeof require === 'function' ? require('./week.js') : null);
  function dayOpen(day, now) {
    const W = Week(),
      i = W.dayIndexOf(day),
      today = W.dayIndex(now);
    if (i === null) return false;
    return i === today || (i === today - 1 && now - W.dayStart(today) < GRACE);
  }
  const isDaily = r => !!(r && r.world && r.world.kind === 'daily' && typeof r.world.week === 'string');
  // 작전 몫(16c): 1 = 출석으로 세는 판 · 2 = 그날 미션을 채운 판
  // mission = 서버가 준 그날 미션(없으면 이 기기 balance로)
  function opsBits(r, mission) {
    const O = root.NeonOps;
    if (!O || !isDaily(r)) return 0;
    const W = Week(),
      m = mission || O.mission(W.dayIndexOf(r.world.week));
    return (O.attRun(r) ? 1 : 0) | (m && O.met(r, m) ? 2 : 0);
  }
  function shouldSend(acct, r, now, mission) {
    const a = clean(acct);
    if (!a.token || !isDaily(r) || r.world.input !== 'in' || !dayOpen(r.world.week, now)) return false;
    const sent = a.sent[r.world.week];
    if (!(Number.isFinite(sent) && sent >= Math.floor(r.score))) return true;
    // 점수는 그날 최고보다 낮아도 아직 안 올린 작전 몫(출석 · 미션)이 있으면 올림
    return (opsBits(r, mission) & ~(a.ops[r.world.week] || 0)) !== 0;
  }
  // 올렸음(또는 서버가 이미 가짐 · 받지 않음): 그날 최고 점수 · 대기열에서 뺌
  const markSent = (acct, r, ok = true, mission = null) => {
    const a = clean(acct),
      day = r.world.week,
      s = Math.floor(r.score);
    return clean({
      ...a,
      sent: ok ? { ...a.sent, [day]: Math.max(s, a.sent[day] || 0) } : a.sent,
      ops: ok && opsBits(r, mission) ? { ...a.ops, [day]: (a.ops[day] || 0) | opsBits(r, mission) } : a.ops,
      queue: a.queue.filter(id => id !== r.id),
    });
  };
  const enqueue = (acct, id) => {
    const a = clean(acct);
    return clean({ ...a, queue: [...a.queue.filter(x => x !== id), id] });
  };
  const dequeue = (acct, id) => {
    const a = clean(acct);
    return clean({ ...a, queue: a.queue.filter(x => x !== id) });
  };
  const postRun = (acct, record, input, build, opts) =>
    authed(acct, 'POST', '/v1/runs', { record, input, build: build || '' }, opts);
  const board = (day, opts) => request('GET', '/v1/board' + (day ? '?day=' + day : ''), undefined, opts);
  // 전광판(16c R-314): 그날 미션 · 참가 · 달성 · 단 · 소식(로그인 없이) · 보급 투하(로그인, 서버 장부 M)
  const ops = (day, opts) => request('GET', '/v1/ops' + (day ? '?day=' + day : ''), undefined, opts);
  const drop = (acct, opts) => authed(acct, 'POST', '/v1/ops/drop', {}, opts);
  // M 쓰임(16c C3): 닉네임 색 · 엠블럼(slot, id '' = 벗기) · 정비 패스 — 서버 장부로 막음
  const looks = (acct, slot, id, opts) => authed(acct, 'POST', '/v1/looks', { slot, id }, opts);
  // key = 기기 요청 키(R-327): 응답을 잃고 다시 누르면 같은 키 → 서버가 같은 값(두 장 없음)
  const buyPass = (acct, key, opts) => authed(acct, 'POST', '/v1/ops/pass', { key }, opts);
  const myRank = (acct, day, opts) =>
    authed(acct, 'GET', '/v1/rank' + (day ? '?day=' + day : ''), undefined, opts);
  const runCard = (acct, id, opts) =>
    request('GET', '/v1/run/' + encodeURIComponent(id), undefined, { ...opts, token: clean(acct).token });
  // 결과 한 줄 상태(순수): 서버 응답 → 'up'(올림 · 순위) | 'long'(2시간 넘음) | 'bad'(확인 실패) | 'fail'(나중에 다시)
  function sendResult(r) {
    if (r.ok && (r.body.status === 'new' || r.body.status === 'dup'))
      return { state: 'up', rank: r.body.rank || 0 };
    if (r.ok && r.body.status === 'bad') return { state: r.body.reason === 'long' ? 'long' : 'bad' };
    return { state: 'fail' };
  }

  const api = {
    ITER,
    PW_MIN,
    PW_MAX,
    KEY_BASE,
    key,
    base,
    enabled,
    clean,
    load,
    save,
    signedIn,
    signedOut,
    request,
    newSalt,
    pwCheck,
    derive,
    status,
    signup,
    login,
    recover,
    authed,
    logout,
    changeNick,
    changePassword,
    remove,
    newCode,
    me,
    unseen,
    markSeen,
    readNotices,
    claim,
    CLOUD_MAX,
    canon,
    contentHash,
    pack,
    unpack,
    cloudGet,
    cloudPut,
    decide,
    mine409,
    linkedTo,
    pausedAcct,
    withLock,
    dayOpen,
    shouldSend,
    markSent,
    enqueue,
    dequeue,
    postRun,
    board,
    ops,
    drop,
    looks,
    buyPass,
    opsBits,
    myRank,
    runCard,
    sendResult,
  };
  root.NeonOnline = api;
  if (typeof module !== 'undefined') module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

    </script>
    <script>
      (function (root) {
  'use strict';
  // 시험 서버 값(R-329, /test/server.html): 로그인한 자기 계정의 시험 서버 값을 표로 보고 그대로 정한다.
  // 기기 값(G · B · S · 해금 …)은 GM 실험 칸, 서버 값(M 장부 · 패스 · 출석 · 받을 보상 · 투하 · 꾸미기)은 여기.
  // 계정 키는 /test/와 같은 저장소 접미사(-test)라 /test/에서 로그인했으면 그대로 이어진다. 서버는 시험(ENV = test)에서만 받는다.
  // 개발 도구라 문구는 이 파일 안(본게임 문구 목록 밖 — CATALOG '제외'). 실제 주소 조립에는 넣지 않는다(tools/deploy.cjs).
  const O = root.NeonOnline;
  const $ = id => document.getElementById(id);
  const esc = v =>
    String(v).replace(
      /[&<>"']/g,
      ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch],
    );
  const LAST = { none: '없음', yday: '어제', today: '오늘', old: '이틀 넘게 전' };
  const KIND = { op: '작전 M', att: '출석 S', wk: '주간 휘장', medal: '월간 휘장' };
  const TIER = ['', 'METEOR', 'PULSAR', 'SUPERNOVA', 'QUASAR'];
  let acct = O.load(),
    state = null,
    busy = false,
    msg = { text: '', err: false };

  const payText = x =>
    x.kind === 'op'
      ? 'M ' + (x.pay.m || 0)
      : x.kind === 'att'
        ? 'S ' + (x.pay.s || 0)
        : x.kind === 'medal'
          ? TIER[x.pay.t] || ''
          : '';
  const say = (text, err = false) => {
    msg = { text, err };
    const el = document.querySelector('.msg');
    if (el) {
      el.textContent = text;
      el.classList.toggle('err', err);
    }
  };
  const errText = r =>
    r.status === 0
      ? '연결이 안 됩니다. 잠시 뒤 다시.'
      : r.status === 401
        ? '로그인이 끝났습니다. 다시 로그인하세요.'
        : r.status === 404
          ? '시험 서버가 아니거나 서버가 아직 이 기능을 모릅니다.'
          : '실패(' + r.status + ' ' + (r.error || '') + ')';

  function renderWho() {
    const note = $('sv-note');
    if (!O.enabled()) {
      note.textContent = '이 빌드는 서버 주소가 없습니다. /test/ 배포본(또는 --api=test 빌드)에서 여세요.';
      $('sv-who').innerHTML = '';
      $('sv-body').hidden = true;
      return;
    }
    note.textContent =
      '시험 서버 전용 — 로그인한 내 계정의 서버 값을 그대로 정합니다. 실제 서버 · 실제 주소 기록에는 닿지 않고, 몇 번이고 바꾸고 되돌릴 수 있습니다. 바꾼 뒤 /test/에서 M 상점 · 알림함을 열면 보입니다.';
    if (!acct.token) {
      $('sv-who').innerHTML =
        '<h2>시험 계정 로그인</h2><form class="login" id="sv-login">' +
        '<input id="sv-nick" autocomplete="username" placeholder="닉네임" />' +
        '<input id="sv-pw" type="password" autocomplete="current-password" placeholder="비밀번호" />' +
        '<button class="primary" type="submit">로그인</button></form>' +
        '<p class="note">/test/와 같은 로그인입니다(여기서 로그인하면 /test/도 이 계정).</p>' +
        '<p class="msg' +
        (msg.err ? ' err' : '') +
        '">' +
        esc(msg.text) +
        '</p>';
      $('sv-body').hidden = true;
      return;
    }
    $('sv-who').innerHTML =
      '<div class="who"><span>계정 <b>' +
      esc(acct.nick) +
      '</b>' +
      (state ? ' · 서버 날 ' + esc(state.day) : '') +
      '</span><button type="button" id="sv-out">다른 계정</button></div>' +
      // 값을 못 읽었을 때(연결 · 옛 서버 · 실제 서버) 이유를 여기에 — 표가 없어 아래 메시지 줄이 없음
      (state ? '' : '<p class="msg' + (msg.err ? ' err' : '') + '">' + esc(msg.text) + '</p>');
  }

  const row = (label, now, input, changed = false) =>
    '<span>' +
    label +
    '</span><span class="now' +
    (changed ? ' changed' : '') +
    '">' +
    now +
    '</span>' +
    input;
  const num = (id, v, max) =>
    '<input id="' + id + '" type="number" inputmode="numeric" min="0" max="' + max + '" value="' + v + '" />';
  const pick = (id, list, v) =>
    '<select id="' +
    id +
    '">' +
    list
      .map(([k, t]) => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + t + '</option>')
      .join('') +
    '</select>';
  const check = id => '<input id="' + id + '" type="checkbox" />';

  function renderBody() {
    const s = state,
      body = $('sv-body');
    if (!s) {
      body.hidden = true;
      return;
    }
    body.hidden = false;
    const own = s.looks.own || [];
    body.innerHTML =
      '<h2>서버 값</h2><div class="rows">' +
      '<span class="h">항목</span><span class="h now">지금</span><span class="h">새 값</span>' +
      row('M 잔액', s.m, num('sv-m', s.m, 100000)) +
      row(
        '정비 패스',
        s.pass + ' / ' + s.passMax,
        pick(
          'sv-pass',
          Array.from({ length: s.passMax + 1 }, (_, i) => [String(i), i + '장']),
          String(s.pass),
        ),
      ) +
      row('출석 연속', s.run + '일', num('sv-run', s.run, 365)) +
      row('출석 누적', s.total + '일', num('sv-total', s.total, 9999)) +
      row(
        '마지막 출석',
        LAST[s.last] || s.last,
        pick(
          'sv-last',
          [
            ['none', '없음'],
            ['yday', '어제'],
            ['today', '오늘'],
            ...(s.last === 'old' ? [['old', '그대로']] : []),
          ],
          s.last,
        ),
      ) +
      row('주간 휘장', s.wk + '개', '<span></span>') +
      row('오늘 보급 투하', s.drop ? '함' : '안 함', s.drop ? check('sv-drop') : '<span></span>') +
      row(
        '산 꾸미기',
        own.length ? own.length + '개' : '없음',
        own.length ? check('sv-looks') : '<span></span>',
      ) +
      '</div>' +
      (s.drop || own.length ? '<p class="note">체크 = 지우기(오늘 투하 · 산 색 · 엠블럼)</p>' : '') +
      '<h2 style="margin-top:14px">받을 보상 줄 ' +
      s.open.length +
      '</h2>' +
      (s.open.length
        ? '<ul class="open">' +
          s.open
            .map(
              x => '<li>' + esc(KIND[x.kind] || x.kind) + ' · ' + esc(x.id) + ' ' + esc(payText(x)) + '</li>',
            )
            .join('') +
          '</ul>'
        : '<p class="note">없음</p>') +
      '<div class="rows" style="margin-top:8px">' +
      row('작전 보상 M 넣기', '', num('sv-op', 0, 10000)) +
      row('출석 보상 S 넣기', '', num('sv-att', 0, 10000)) +
      row('주간 휘장 줄 넣기', '', num('sv-wk', 0, 5)) +
      row(
        '월간 휘장 넣기',
        '',
        pick(
          'sv-medal',
          TIER.map((t, i) => [String(i), i ? t : '안 넣음']),
          '0',
        ),
      ) +
      row('받을 줄 모두 지우기', '', check('sv-clear')) +
      '</div>' +
      '<div class="bar"><div class="actions"><button class="primary" type="button" id="sv-apply">반영</button>' +
      '<button type="button" id="sv-reload">다시 읽기</button>' +
      '<button class="danger" type="button" id="sv-reset">처음 상태로</button></div>' +
      '<p class="msg' +
      (msg.err ? ' err' : '') +
      '">' +
      esc(msg.text) +
      '</p></div>';
    for (const b of body.querySelectorAll('button')) b.disabled = busy;
  }
  function render() {
    renderWho();
    renderBody();
  }

  const val = id => $(id) && $(id).value;
  const n = id => Math.max(0, Math.floor(Number(val(id)) || 0));
  // 바뀐 칸만 보낸다(지금 값과 같으면 빼서 다른 칸을 덮지 않음)
  function changes() {
    const s = state,
      b = {},
      add = [];
    if (n('sv-m') !== s.m) b.m = n('sv-m');
    if (Number(val('sv-pass')) !== s.pass) b.pass = Number(val('sv-pass'));
    if (n('sv-run') !== s.run) b.run = n('sv-run');
    if (n('sv-total') !== s.total) b.total = n('sv-total');
    if (val('sv-last') !== s.last && val('sv-last') !== 'old') b.last = val('sv-last');
    if ($('sv-drop') && $('sv-drop').checked) b.drop = 0;
    if ($('sv-looks') && $('sv-looks').checked) b.looks = 'reset';
    if ($('sv-clear').checked) b.clear = true;
    if (n('sv-op')) add.push({ kind: 'op', n: n('sv-op') });
    if (n('sv-att')) add.push({ kind: 'att', n: n('sv-att') });
    for (let i = 0; i < Math.min(5, n('sv-wk')); i++) add.push({ kind: 'wk', n: 1 });
    if (Number(val('sv-medal'))) add.push({ kind: 'medal', n: Number(val('sv-medal')) });
    if (add.length) b.add = add;
    return b;
  }

  async function call(method, body) {
    busy = true;
    renderBody();
    const r = await O.authed(acct, method, '/v1/test/state', body);
    busy = false;
    if (r.acct) acct = r.acct;
    if (r.ok) state = r.body;
    return r;
  }
  async function reload(text = '') {
    const r = await call('GET');
    if (!r.ok) say(errText(r), true);
    else msg = { text, err: false };
    render();
  }
  async function apply(body, done) {
    if (!Object.keys(body).length) return say('바꾼 칸이 없습니다.');
    const r = await call('POST', body);
    if (r.ok) msg = { text: done, err: false };
    else msg = { text: errText(r), err: true };
    render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled || busy) return;
    if (b.id === 'sv-apply') apply(changes(), '반영했습니다 — /test/에서 M 상점 · 알림함을 열면 보입니다.');
    else if (b.id === 'sv-reload') reload('다시 읽었습니다.');
    else if (b.id === 'sv-reset') {
      if (
        root.confirm(
          'M · 패스 · 출석 · 받을 보상 줄 · 오늘 투하 · 산 꾸미기를 처음으로 돌립니다(받은 줄 기록은 남음).',
        )
      )
        apply({ reset: true }, '처음 상태로 돌렸습니다.');
    } else if (b.id === 'sv-out') {
      acct = O.save(O.signedOut(acct));
      state = null;
      msg = { text: '', err: false };
      render();
    }
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'sv-login') return;
    e.preventDefault();
    if (busy) return;
    busy = true;
    say('로그인 중…');
    const r = await O.login(acct, { nick: val('sv-nick').trim(), pw: val('sv-pw') });
    busy = false;
    if (!r.ok) {
      msg = {
        text: r.error === 'login' || r.status === 401 ? '닉네임 · 비밀번호가 맞지 않습니다.' : errText(r),
        err: true,
      };
      return render();
    }
    acct = r.acct;
    msg = { text: '', err: false };
    reload();
  });

  render();
  if (O.enabled() && acct.token) reload();
})(typeof globalThis !== 'undefined' ? globalThis : this);

    </script>
  </body>
</html>
