  // ── 목표 목록 · 목표까지 판 수 · 플레이 시간 ──
  // 목표 16줄: 상점 · 고양이 · 영구 스택 8줄 + 버프 2줄 + 도색 3줄 + 꾸미기 2줄 + 월드 스킬 모두 MAX 1줄(R-124).
  // 비용 { gold, blue, super }. balance.paint가 없는 옛 balance(시나리오 파일 · 옛 기준값)면 도색 줄은 없다(10줄).
  function goalList(balance) {
    const E = balance.economy,
      C = balance.cats,
      F = balance.buffs,
      // 성장 스킬 전부 MAX(R-042 · R-161): door까지 기존 가격, 넘는 칸은 B 배율과 S 비용.
      perma = Object.values(E.perma).reduce(
        (sum, c) => {
          const door = c.door ?? c.max,
            over = E.permaOver || { x: 1, s: 0 };
          for (let k = 0; k < c.max; k++) {
            const base = c.price + c.step * k;
            sum.blue += k >= door ? base * over.x : base;
            if (k >= door) sum.super += over.s;
          }
          return sum;
        },
        { blue: 0, super: 0 },
      );
    const list = [
      ['income', { gold: E.incomePrice * E.incomeMax }],
      ['auto', { gold: E.autoPrice }],
      ['autoGold', { gold: E.autoGoldPrice }],
      ['note', { gold: E.noteMax * E.notePerChar }],
      ['sc', { gold: E.scGold, blue: E.scBlue }],
      ['catUnlock', { super: Object.values(C.unlock).reduce((s, v) => s + v, 0) }],
      [
        'catMax',
        { super: C.levelCost.reduce((s, c) => s + c.s, 0), blue: C.levelCost.reduce((s, c) => s + c.b, 0) },
      ],
      ['permaMax', perma],
      ['buffRegen', { blue: F.regen.b }],
      ['buffRevive', { super: F.revive.s }],
    ];
    // 도색: 색 하나 값(price의 g · b · s 칸 그대로) × 기체 수. 줄 이름 = 'paint' + 색(첫 글자 대문자)
    const P = balance.paint,
      crafts = Object.keys(balance.crafts || {}).length;
    if (P && P.price)
      for (const color of P.colors || Object.keys(P.price)) {
        const pr = P.price[color] || {};
        list.push([
          'paint' + color[0].toUpperCase() + color.slice(1),
          { gold: num(pr.g) * crafts, blue: num(pr.b) * crafts, super: num(pr.s) * crafts },
        ]);
      }
    // 꾸미기(R-116): G 조각 전부 · 특별(S) 조각 전부. balance.cos가 없는 옛 balance면 없음
    const items = balance.cos?.items;
    if (Array.isArray(items)) {
      list.push(['cosG', { gold: items.reduce((s, x) => s + num(x.g), 0) }]);
      list.push(['cosS', { super: items.reduce((s, x) => s + num(x.s), 0) }]);
    }
    // 월드 스킬(R-124): 다섯 종을 모두 최대 단계까지 살 때 드는 S.
    if (balance.world?.sk?.price && balance.world?.sk?.ids)
      list.push([
        'wsk',
        { super: balance.world.sk.ids.length * balance.world.sk.price.reduce((s, v) => s + num(v), 0) },
      ]);
    return list.map(([id, c]) => ({
      id,
      cost: { gold: c.gold || 0, blue: c.blue || 0, super: c.super || 0 },
    }));
  }
  // perRun: 판당 순수입 { gold, blue, super }. 통화마다 ceil(비용 ÷ 판당)의 최댓값, 벌 수 없으면 Infinity.
  function goals(balance, perRun) {
    const p = perRun || {};
    return goalList(balance).map(({ id, cost }) => {
      let runs = 0;
      for (const k of ['gold', 'blue', 'super']) {
        if (!(cost[k] > 0)) continue;
        const per = num(p[k]);
        runs = Math.max(runs, per > 0 ? Math.ceil(cost[k] / per) : Infinity);
      }
      return { id, cost, runs };
    });
  }
  // perMinute: 분당 순수입 { gold, blue, super }. 통화마다 비용 ÷ 분당의 최댓값(분), 벌 수 없으면 Infinity.
  function goalMinutes(balance, perMinute) {
    const p = perMinute || {};
    return goalList(balance).map(({ id, cost }) => {
      let minutes = 0;
      for (const k of ['gold', 'blue', 'super']) {
        if (!(cost[k] > 0)) continue;
        const per = num(p[k]);
        minutes = Math.max(minutes, per > 0 ? cost[k] / per : Infinity);
      }
      return { id, cost, minutes };
    });
  }

  // ── 적 배율 ──
  // engine.js stageRules · 출현 간격 · 사수 재사격 식 그대로. 모르는 모드는 첫 모드.
  function difficulty(balance, mode, stage) {
    const n = Math.max(1, Math.floor(Number(stage) || 1)) - 1,
      M = balance.modes[modeOf(balance, mode)],
      G = balance.stage,
      R = M.stage,
      SP = balance.spawn,
      SH = balance.shooter;
    return {
      hp: M.hp * (1 + R.hp * n),
      damage: M.damage * (1 + R.damage * n),
      xp: M.xp * (1 + G.xp * n),
      point: M.score * (1 + G.score * n),
      spawnPerSec: (M.spawn * SP.rate) / Math.max(SP.min, SP.interval / (1 + R.density * n)),
      shotsPerSec: M.fire / Math.max(SH.reloadMin, SH.reload / (1 + SH.reloadStage * n)),
      bulletSpeed: M.bulletSpeed,
      speed: Math.min(G.speedMax, 1 + R.speed * n),
    };
  }

  // ── 기준 빌드 · 내 화력 · 처치 시간 · 초당 위험(R-069) ──
  // 기준 빌드: STAGE에 맞는 LV(자동 승격 식을 거꾸로)까지 공격 스킬 4개를 차례로 1씩 고른 빌드.
  const OFFENSE = Object.freeze(['power', 'rapid', 'multi', 'crit']);
  function refBuild(balance, craft, stage) {
    const level = Math.max(1, balance.stage.autoLevel * (Math.max(1, Math.floor(Number(stage) || 1)) - 1)),
      stacks = { ...(balance.crafts[craft].start || {}) };
    for (let i = 0; i < level - 1; i++) {
      const id = OFFENSE[i % OFFENSE.length];
      stacks[id] = (stacks[id] || 0) + 1;
    }
    return { level, stacks };
  }
  // 물리 상한에 닿는 스택 수(engine.js CAPS 식 그대로)
  function skillCaps(balance, craft) {
    const S = balance.skills,
      c = balance.crafts[craft],
      P = balance.player;
    return {
      multi: S.multi.max - 1,
      pierce: S.pierce.max,
      orbit: balance.orbit.max,
      magnet: Math.ceil((S.magnet.max - P.magnet) / S.magnet.step),
      crit: Math.ceil((S.crit.max - P.crit) / S.crit.step),
      rapid: Math.ceil((c.fire / S.rapid.minFire - 1) / S.rapid.rate),
      speed: Math.ceil((S.speed.max - c.speed) / S.speed.step),
    };
  }
  // engine.js recalculate의 공격 부분 그대로(넘친 스택은 피해 +). dps = 한 발 기대 피해 × 발 수 ÷ 발사 간격.
  function firepower(balance, craft, stacks) {
    const S = balance.skills,
      c = balance.crafts[craft],
      P = balance.player,
      cap = skillCaps(balance, craft),
      st = stacks || {},
      u = id => st[id] || 0,
      extra = (n, max) => Math.max(0, n - max);
    const damage =
        c.damage *
        (1 +
          S.power.damage * u('power') +
          S.multi.overflow * extra(u('multi'), cap.multi) +
          S.pierce.overflow * extra(u('pierce'), cap.pierce) +
          S.rapid.overflow * extra(u('rapid'), cap.rapid) +
          S.speed.overflow * extra(u('speed'), cap.speed) +
          S.magnet.overflow * extra(u('magnet'), cap.magnet)),
      fire = Math.max(S.rapid.minFire, c.fire / (1 + S.rapid.rate * u('rapid'))),
      multi = Math.min(S.multi.max, 1 + u('multi')),
      crit = Math.min(S.crit.max, P.crit + S.crit.step * u('crit')),
      critScale = P.critScale + S.crit.overflow * extra(u('crit'), cap.crit);
    return {
      damage,
      fire,
      multi,
      crit,
      critScale,
      dps: (damage * multi * (1 + crit * (critScale - 1))) / fire,
    };
  }
  // 나온 적 하나의 평균(섞임 비율 × 모드 배율 × STAGE 배율). bullet = 사수 탄 하나 피해, volley = 사격 한 번의 평균 탄 수.
  function enemyAvg(balance, mode, stage) {
    const M = balance.modes[mode],
      E = balance.enemies,
      n = Math.max(1, Math.floor(stage)) - 1,
      R = M.stage,
      mix = mixAt(balance, stage);
    let hp = 0,
      dmg = 0;
    for (const k of Object.keys(mix)) {
      hp += mix[k] * E[k].hp;
      dmg += mix[k] * E[k].damage;
    }
    return {
      hp: hp * M.hp * (1 + R.hp * n),
      damage: dmg * M.damage * (1 + R.damage * n),
      shooterShare: mix.shooter,
      shooterHp: E.shooter.hp * M.hp * (1 + R.hp * n),
      bullet: E.shooter.damage * M.damage * (1 + R.damage * n) * balance.hostile.damage,
      volley: 1 + (M.fan ? 2 / balance.shooter.fanEvery : 0) + (M.burst ? 1 / balance.shooter.burstEvery : 0),
    };
  }
  // 평균 적 하나를 기준 빌드로 잡는 데 걸리는 초
  function killTime(balance, mode, craft, stage) {
    const b = refBuild(balance, craft, stage);
    return enemyAvg(balance, mode, stage).hp / firepower(balance, craft, b.stacks).dps;
  }

  // 진단은 등장 시각의 HP로 계산한다. 시간 압박은 engine.stageRules와 같은 식.
  function combatBudget(balance, mode, craft, stage, minutes, stacks) {
    const M = balance.modes[mode],
      F = balance.final,
      n = Math.max(1, Math.floor(stage)) - 1,
      over = Math.max(0, minutes - M.late.from),
      hpX = M.hp * (1 + M.stage.hp * n) * (1 + M.late.hp * over),
      damageX = M.damage * (1 + M.stage.damage * n) * (1 + M.late.damage * over),
      power = firepower(balance, craft, stacks),
      ttk = hp => (power.dps > 0 ? hp / power.dps : Infinity),
      enemies = Object.entries(balance.enemies).map(([id, e]) => ({
        id,
        hp: e.hp * hpX,
        damage: e.damage * damageX,
        seconds: ttk(e.hp * hpX),
      })),
      finalHp = F.hp * M.hp * (1 + M.stage.hp * (F.stage - 1)) * (1 + M.late.hp * over),
      bounds = [1, ...F.phases, 0],
      phases = F.phaseX.map((x, i) => ({
        hp: finalHp * Math.max(0, bounds[i] - bounds[i + 1]),
        damage: F.damage[mode] * x * (1 + M.late.damage * over),
        seconds: ttk(finalHp * Math.max(0, bounds[i] - bounds[i + 1])),
      }));
    return {
      power,
      enemies,
      phases,
      finalHp,
      finalSeconds: ttk(finalHp),
      spawn:
        (M.spawn * balance.spawn.rate) /
        Math.max(
          balance.spawn.min,
          balance.spawn.interval / ((1 + M.stage.density * n) * (1 + M.late.density * over)),
        ),
    };
  }
  // 초당 위험: 초당 나오는 적 × (몸 피해 + 사수 몫 × 사수가 살아 있는 동안 쏘는 탄 피해)
  function threat(balance, mode, craft, stage) {
    const d = difficulty(balance, mode, stage),
      a = enemyAvg(balance, mode, stage),
      dps = firepower(balance, craft, refBuild(balance, craft, stage).stacks).dps,
      life = a.shooterHp / dps;
    return d.spawnPerSec * (a.damage + a.shooterShare * d.shotsPerSec * a.volley * a.bullet * life);
  }
  // 난이도 그래프 가로축 STAGE 줄. 모르는 metric은 NaN 줄.
  const SERIES = Object.freeze({
    killTime: (b, mode, craft, s) => killTime(b, mode, craft, s),
    threat: (b, mode, craft, s) => threat(b, mode, craft, s),
    point: (b, mode, craft, s) => pointPerKill(b, mode, s),
    hp: (b, mode, craft, s) => difficulty(b, mode, s).hp,
    damage: (b, mode, craft, s) => difficulty(b, mode, s).damage,
    spawn: (b, mode, craft, s) => difficulty(b, mode, s).spawnPerSec,
  });
  function stageSeries(balance, mode, metric, stages, craft) {
    const list = Array.isArray(stages) ? stages : [],
      f = own(SERIES, metric) ? SERIES[metric] : null;
    return list.map(s => (f ? f(balance, mode, craft, s) : NaN));
  }

  // ── 시나리오 파일 ──
  const cleanName = v => {
    const s = typeof v === 'string' ? v.trim().slice(0, NAME_MAX).trim() : '';
    return s || NAME_EMPTY;
  };
  // 결과의 자동 판 판 줄(runs 객체 배열)을 열 배열(packed)로 바꾼다. results는 이미 사본이어야 한다.
  function packResults(results) {
    const sim = isObj(results) ? results.sim : null;
    if (!isObj(sim) || !Array.isArray(sim.runs)) return false;
    sim.packed = packRuns(sim.runs);
    delete sim.runs;
    return true;
  }
  function makeScenario(input, base, meta) {
    const i = input || {},
      m = meta || {},
      changes = {},
      from = {},
      results = isObj(i.results) ? jsonCopy(i.results) : null;
    for (const a of diff(base, i.changes, { world: true })) {
      changes[a.path] = a.to;
      from[a.path] = a.from;
    }
    packResults(results);
    return {
      format: FORMAT,
      schema: SCHEMA,
      name: cleanName(i.name),
      savedAt: m.now,
      version: m.version,
      balance: base.name,
      changes,
      base: from,
      rows: Array.isArray(i.rows) ? jsonCopy(i.rows.slice(0, ROWS_MAX)) : null,
      sim: isObj(i.sim) ? jsonCopy(i.sim) : null,
      results,
    };
  }
  // JSON에는 Infinity가 없어서 문자열 'Infinity'로 적는다.
  // 압축된 판 줄(packed.rows)은 한 줄에 한 판, 줄 안은 공백 없이 쓴다(들여쓰기를 붙이면 크기가 다시 커진다).
  function toJSON(scenario) {
    // 자리표시 글이 시나리오 안의 글(이름 등)과 겹치지 않게 접두를 늘린다
    const plain = JSON.stringify(scenario, infReplacer) || '';
    let tag = '@@neon-lab-rows-';
    while (plain.includes(tag)) tag += '~';
    const blocks = [],
      mark = i => tag + i + '@@';
    const out = JSON.stringify(
      scenario,
      function (k, v) {
        if (v === Infinity) return 'Infinity';
        if (k === 'rows' && Array.isArray(v) && Array.isArray(this.cols)) {
          blocks.push(v.length ? '[\n' + v.map(r => JSON.stringify(r, infReplacer)).join(',\n') + ']' : '[]');
          return mark(blocks.length - 1);
        }
        return v;
      },
      2,
    );
    return blocks.reduce((s, b, i) => s.split(JSON.stringify(mark(i))).join(b), out);
  }
  // 경로 → 값 맵에서 문자열 'Infinity'만 되돌린다.
  const revive = map => {
    const out = {};
    if (isObj(map)) for (const k of Object.keys(map)) out[k] = map[k] === 'Infinity' ? Infinity : map[k];
    return out;
  };
  function parseScenario(input, base) {
    let raw;
    try {
      // 객체도 파일과 같은 길(문자열 왕복)로 읽어 입력을 건드리지 않는다.
      raw = JSON.parse(typeof input === 'string' ? input : toJSON(input));
    } catch {
      return { ok: false, reason: 'json' };
    }
    if (!isObj(raw) || raw.format !== FORMAT) return { ok: false, reason: 'format' };
    if (raw.schema !== SCHEMA) return { ok: false, reason: 'schema' };
    const map = entryMap(base, { world: true }),
      changes = {},
      missing = [],
      rejected = [];
    for (const [path, value] of Object.entries(revive(raw.changes))) {
      const r = checkWith(map, base, path, value);
      if (r.ok) changes[path] = r.value;
      else if (r.reason === 'missing') missing.push(path);
      else rejected.push({ path, value, reason: r.reason });
    }
    // 저장 때의 기본값: 숫자 · boolean만 남긴다. 지금 값과 다르면 drift.
    const saved = {},
      drift = [];
    for (const [path, value] of Object.entries(revive(raw.base))) {
      if (typeof value !== 'number' && typeof value !== 'boolean') continue;
      saved[path] = value;
      let now;
      if (map.has(path)) now = map.get(path).value;
      else if (isStartPath(base, path)) now = 0;
      else continue;
      if (!Object.is(value, now)) drift.push({ path, saved: value, now });
    }
    const scenario = {
      format: FORMAT,
      schema: SCHEMA,
      name: cleanName(raw.name),
      savedAt: typeof raw.savedAt === 'number' && Number.isFinite(raw.savedAt) ? raw.savedAt : 0,
      version: typeof raw.version === 'string' ? raw.version : '',
      balance: typeof raw.balance === 'string' ? raw.balance : '',
      changes,
      base: saved,
      rows: Array.isArray(raw.rows) ? raw.rows : null,
      sim: isObj(raw.sim) ? raw.sim : null,
      results: isObj(raw.results) ? raw.results : null,
    };
    // 판 줄: 옛 파일(runs 객체 배열)은 그대로, 새 파일(packed 열 배열)은 runs로 풀어 준다.
    const rs = scenario.results && scenario.results.sim;
    if (isObj(rs) && !Array.isArray(rs.runs) && own(rs, 'packed')) {
      rs.runs = unpackRuns(rs.packed);
      delete rs.packed;
    }
    return { ok: true, scenario, drift, missing, rejected };
  }

  // ── 실험실 저장 한도(R-068) ──
  // store = { saved: [시나리오 JSON, 앞이 최신], draft: { scenario: JSON, ui } }. 길이 = JSON.stringify(store).length.
  // 넘으면 ① 옛 형식(runs) 결과를 압축해 다시 쓰고 ② 그래도 넘으면 저장 목록 끝(오래된 것)부터,
  // 마지막에 초안의 자동 판 결과(results)만 뺀다. 바꾼 값 · 이름 · 예시 줄 · 조건은 남긴다. 입력은 바꾸지 않는다.
  const storeLength = s => JSON.stringify(s).length;
  const hasResults = sc =>
    isObj(sc.results) && Object.values(sc.results).some(v => v !== null && v !== undefined);
  function rewrite(json, edit) {
    if (typeof json !== 'string') return null;
    let sc;
    try {
      sc = JSON.parse(json);
    } catch {
      return null;
    }
    if (!isObj(sc) || !edit(sc)) return null;
    return toJSON(sc);
  }
  function storeFit(store, limit) {
    if (!isObj(store) || storeLength(store) <= limit) return { store, dropped: 0 };
    const out = { ...store },
      hasSaved = Array.isArray(store.saved),
      hasDraft = isObj(store.draft) && typeof store.draft.scenario === 'string';
    if (hasSaved) out.saved = [...store.saved];
    if (hasDraft) out.draft = { ...store.draft };
    const pack = sc => packResults(sc.results);
    if (hasSaved)
      out.saved = out.saved.map(j => {
        const r = rewrite(j, pack);
        return r === null ? j : r;
      });
    if (hasDraft) {
      const r = rewrite(out.draft.scenario, pack);
      if (r !== null) out.draft.scenario = r;
    }
    const drop = sc => {
      if (!hasResults(sc)) return false;
      sc.results = null;
      return true;
    };
    let dropped = 0;
    if (hasSaved)
      for (let i = out.saved.length - 1; i >= 0 && storeLength(out) > limit; i--) {
        const r = rewrite(out.saved[i], drop);
        if (r === null) continue;
        out.saved[i] = r;
        dropped++;
      }
    if (hasDraft && storeLength(out) > limit) {
      const r = rewrite(out.draft.scenario, drop);
      if (r !== null) {
        out.draft.scenario = r;
        dropped++;
      }
    }
    return { store: out, dropped };
  }

  // ── 옛 결과 판정(R-068): 결과를 돌린 balance 지문 · 바꾼 값 · 조건을 지금과 비교 ──
  // 저장 설정 키 worldWeek는 그대로 두고, daily는 YYYY-MM-DD · legacy weekly는 YYYY-Www를 담는다.
  const SIM_KEYS = Object.freeze([
    'modes',
    'crafts',
    'launch',
    'minutes',
    'stage',
    'rushTo',
    'perMin',
    'seeds',
    'autoGold',
    'profile',
    'loadout',
    'worldKind',
    'worldWeek',
    'link',
    'laser',
    'encounter',
    'entryMinutes',
    'entryStage',
    'worldSkills',
  ]);
  function simStatus(results, now) {
    const o = now || {},
      base = o.base,
      names = { ran: '', now: base && typeof base.name === 'string' ? base.name : '' };
    if (!isObj(results)) return { fresh: false, base: 'unknown', names, changes: [], settings: [] };
    names.ran = typeof results.baseName === 'string' ? results.baseName : '';
    const world = results.settings?.worldKind && results.settings.worldKind !== 'solo',
      calcOptions = world ? { world: true } : undefined,
      baseState =
        typeof results.base !== 'string'
          ? 'unknown'
          : results.base === fingerprint(base, calcOptions)
            ? 'same'
            : 'changed';
    // 결과 파일의 Infinity는 문자열로 남아 있을 수 있어 되돌려 비교한다
    const ran = new Map(apply(base, revive(results.changes), calcOptions).applied.map(a => [a.path, a.to])),
      cur = new Map(apply(base, o.changes, calcOptions).applied.map(a => [a.path, a.to])),
      order = new Map(entries(base, calcOptions).map((e, i) => [e.path, i])),
      paths = [...new Set([...ran.keys(), ...cur.keys()])],
      dflt = p => {
        const v = get(base, p);
        return v === undefined && isStartPath(base, p) ? 0 : v;
      };
    const changes = [];
    for (const path of paths) {
      const a = ran.has(path) ? ran.get(path) : dflt(path),
        b = cur.has(path) ? cur.get(path) : dflt(path);
      if (!Object.is(a, b)) changes.push({ path, ran: a, now: b });
    }
    const rank = p => (order.has(p) ? order.get(p) : order.size + paths.indexOf(p));
    changes.sort((x, y) => rank(x.path) - rank(y.path));
    const rs = isObj(results.settings) ? results.settings : {},
      ns = isObj(o.settings) ? o.settings : {},
      settings = SIM_KEYS.filter(k => keyOf(rs[k]) !== keyOf(ns[k]));
    return {
      fresh: baseState === 'same' && !changes.length && !settings.length,
      base: baseState,
      names,
      changes,
      settings,
    };
  }

  // 기본 제공 시나리오(이름은 화면이 붙인다). '첫 실험'은 v5-2 밸런스에 반영돼 지웠다(R-038).

    if (opts.world && !box.Week) throw new Error('월드 주 계산을 읽지 못했습니다');
    const launch = ['super', 'ss', 'sss'].includes(opts.launch) ? opts.launch : 'normal';
    const launchSpec = { super: B.superLaunch, ss: B.ssLaunch, sss: B.sssLaunch }[launch];
    const m = Number(opts.minutes),
      s = Number(opts.seed),
      to = Math.trunc(Number(opts.rushTo)),
      per = Math.trunc(Number(opts.perMin)),
      profile = PROFILE_IDS.includes(opts.profile) ? opts.profile : 'basic',
      cats = opts.cats && typeof opts.cats === 'object' ? opts.cats : {},
      mode = has(B.modes, opts.mode) ? opts.mode : 'insane',
      rawWorld = opts.world && typeof opts.world === 'object' ? opts.world : null,
      requestedWeek = typeof rawWorld?.week === 'string' ? rawWorld.week : '',
      worldKind = rawWorld
        ? rawWorld.kind === 'practice'
          ? 'practice'
          : rawWorld.kind === 'daily'
            ? 'daily'
            : 'weekly'
        : null,
      validPeriod =
        box.Week &&
        (worldKind === 'daily'
          ? Number.isInteger(box.Week.dayIndexOf(requestedWeek))
          : Number.isInteger(box.Week.indexOf(requestedWeek))),
      week = validPeriod
        ? requestedWeek
        : worldKind === 'daily'
          ? box.Week?.dayIdOf(box.Week.dayIndex(Date.now())) || '1970-01-01'
          : box.Week?.id(Date.now()) || '1970-W01',
      periodIndex =
        worldKind === 'daily' ? box.Week.dayIndexOf(week) : validPeriod ? box.Week.indexOf(week) : null,
      challengeMode =
        worldKind === 'daily' && Number.isInteger(periodIndex)
          ? box.Week.dayMode(periodIndex)
          : worldKind === 'weekly' && Number.isInteger(periodIndex)
            ? box.Week.mode(periodIndex)
            : null,
      runMode = challengeMode && has(B.modes, challengeMode) ? challengeMode : mode,
      fixedChallenge = worldKind === 'weekly' || worldKind === 'daily',
      world = worldKind
        ? {
            kind: worldKind,
            week,
            mode: runMode,
            sk: rawWorld.sk && typeof rawWorld.sk === 'object' ? { ...rawWorld.sk } : {},
            fx: rawWorld.fx && typeof rawWorld.fx === 'object' ? { ...rawWorld.fx } : null,
          }
        : null;
    return {
      craft: has(B.crafts, opts.craft) ? opts.craft : 'striker',
      mode: runMode,
      world,
      launch: world ? 'world' : launch,
      encounter: !world && ['final', 'stage'].includes(opts.encounter) ? opts.encounter : 'run',
      entryStage: Math.min(B.final.stage - 1, Math.max(1, Math.floor(Number(opts.entryStage) || 30))),
      entryMinutes: Math.min(60, Math.max(0, Number(opts.entryMinutes) || 0)),
      link: world ? 0 : Math.min(20, Math.max(0, Math.floor(Number(opts.link) || 0))),
      laser: world
        ? null
        : {
            lv: Math.min(B.laser.every.length, Math.max(0, Math.floor(Number(opts.laser?.lv) || 0))),
            n: Object.fromEntries(
              ['g', 'b', 's'].map(k => [
                k,
                Math.min(999, Math.max(0, Math.floor(Number(opts.laser?.n?.[k]) || 0))),
              ]),
            ),
          },
      minutes: Number.isFinite(m) ? Math.min(LIMITS.minutes, Math.max(0.5, m)) : 5,
      seed: fixedChallenge ? box.Week.seed(world.week) : Number.isFinite(s) ? Math.trunc(s) : 1,
      // 실력 봇은 Stage를 게임 기본으로만 올린다(수동 계획을 쓰지 않는다)
      profile,
      stage: profile !== 'basic' ? 'none' : STAGE_PLANS.includes(opts.stage) ? opts.stage : 'rush',
      rushTo: Number.isFinite(to) ? Math.min(LIMITS.rushTo, Math.max(1, to)) : RUSH.to,
      perMin: Number.isFinite(per) ? Math.min(LIMITS.perMin, Math.max(0, per)) : 1,
      autoGold: opts.autoGold !== false,
      // 출격 준비 상태(영구 스택 · 고양이 효과 · 출격 버프): 호출하는 쪽이 프로필(또는 백업)에서 정해 넘긴다
      perma: opts.perma && typeof opts.perma === 'object' ? opts.perma : {},
      cats: {
        ...cats,
        engineer: Number(cats.engineer) || 0,
        pilot: Number(cats.pilot) || 0,
        novaX: Number(cats.novaX) || 1,
      },
      buffLv: opts.buffLv && typeof opts.buffLv === 'object' ? { ...opts.buffLv } : null,
      // 출격 버프는 게임 규칙대로 buffs.from 모드(Super) 이상에서만 붙는다(progression.buffOk와 같은 순서)
      buffs:
        Array.isArray(opts.buffs) &&
        Object.keys(B.modes).indexOf(mode) >= Object.keys(B.modes).indexOf(B.buffs.from)
          ? opts.buffs.slice()
          : [],
      // S 배분은 보존한다. SS/SSS는 지정 배분 뒤 남은 준비 스택을 기본 순서로 채운다.
      prep:
        launchSpec && opts.prepMode === 'manual'
          ? (() => {
              const out = {};
              let left = launchSpec.picks;
              for (const id of Object.keys(B.skills)) {
                const n = Math.min(left, Math.max(0, Math.floor(Number(opts.prep?.[id]) || 0)));
                if (n) out[id] = n;
                left -= n;
              }
              return out;
            })()
          : launchSpec
            ? opts.prep && typeof opts.prep === 'object' && Object.keys(opts.prep).length
              ? (() => {
                  if (launch === 'super') return { ...opts.prep };
                  const prep = {},
                    ids = Object.keys(defaultPrep(B));
                  let left = launchSpec.picks;
                  for (const id of ids) {
                    const n = Math.min(left, Math.max(0, Math.floor(Number(opts.prep[id]) || 0)));
                    prep[id] = n;
                    left -= n;
                  }
                  for (let i = 0; i < left; i++) prep[ids[i % ids.length]]++;
                  return prep;
                })()
              : (() => {
                  const prep = defaultPrep(B),
                    ids = Object.keys(prep);
                  for (let i = B.superLaunch.picks; i < launchSpec.picks; i++) {
                    const id = ids[i % ids.length];
                    prep[id]++;
                  }
                  return prep;
                })()
            : null,
    };
  }

  // 판 만들기: 엔진 한 판과 화면 값. 실험실 · 관전이 같은 값으로 시작한다.
  function newGame(box, o) {
    const Neon = box.Neon;
    let launch = {
      perma: o.perma,
      cats: o.cats,
      buffs: o.buffs,
      buffLv: o.buffLv,
      link: o.link,
      laser: o.laser,
    };
    if (o.world) {
      launch = {
        type: 'world',
        world: {
          week: o.world.week,
          seed: o.world.kind === 'weekly' || o.world.kind === 'daily' ? box.Week.seed(o.world.week) : o.seed,
          mode: o.mode,
          kind: o.world.kind,
          sk: o.world.sk,
        },
        fx: o.world.fx || {
          start: 0,
          regen: 0,
          revive: 0,
          shieldX: 1,
          engineer: o.cats.engineer,
          pilot: o.cats.pilot,
          novaX: o.cats.novaX,
        },
      };
    } else if (['super', 'ss', 'sss'].includes(o.launch)) {
      const spec = { super: box.balance.superLaunch, ss: box.balance.ssLaunch, sss: box.balance.sssLaunch }[
        o.launch
      ];
      Object.assign(launch, {
        type: 'super',
        launchId: 'lab',
        prep: o.prep,
        startStage: spec.stage,
        startLevel: spec.level,
      });
    }
    const seed =
        o.world?.kind === 'weekly' || o.world?.kind === 'daily' ? box.Week.seed(o.world.week) : o.seed,
      g = new Neon.Game(1).reset(o.craft, seed, o.mode, launch);
    g.spawnRadius = SCREEN.spawnRadius;
    g.targetRange = SCREEN.targetRange;
    g.balance = box.balance;
    // 명시적인 단독 시험: 출격 빌드를 보존하고 전투 시계만 지정한 관문 준비 상태에서 시작한다.
    if (['final', 'stage'].includes(o.encounter) && !o.world) {
      g.time = o.entryMinutes * 60;
      // 생략한 구간의 분 알림·재화·포위를 첫 스텝에 뒤늦게 발생시키지 않는다.
      g.minute = Math.floor(g.time / 60);
      if (g.siege && box.Siege) {
        g.siege = box.Siege.create(g.time);
        g.siege.waves = Math.floor(g.time / box.Siege.INTERVAL);
      }
      if (Number.isFinite(g.sCoinNext))
        g.sCoinNext = (Math.floor(g.time / box.balance.superCoin.every) + 1) * box.balance.superCoin.every;
      g.bCoinNext = (Math.floor(g.time / box.balance.bCoin.every) + 1) * box.balance.bCoin.every;
      const heal = box.balance.healZone;
      g.zoneNext =
        g.time < heal.first
          ? heal.first
          : heal.first + (Math.floor((g.time - heal.first) / heal.every) + 1) * heal.every;
      g.bossWaves = [];
      g.pendingBoss = 0;
      g.stage = o.encounter === 'final' ? box.balance.final.stage - 1 : o.entryStage - 1;
      g.stageUp();
    }
    return g;
  }

  // 봇 한 사람: 레벨업 고르기 · Stage 계획 · 입력. 실험실 판과 관전 화면이 같이 쓴다.
  // before(g)는 스텝마다 입력 전에 부르고, input(g)는 입력을 돌려준다(g.view가 화면 값이어야 한다).
  const TRACE_COLS = Object.freeze([
    't',
    'score',
    'level',
    'stage',
    'health',
    'dps',
    'finalRatio',
    'laser',
    'combo',
    'damage',
  ]);
  function startSnapshot(g, o) {
    const p = g.p;
    return {
      hp: p.maxHp,
      shield: p.maxShield,
      dps: (p.damage * p.multi * (1 + p.crit * (p.critScale - 1))) / p.fire,
      dash: p.dashMax,
      nova: p.novaDamage,
      regen: g.time >= g.lateAt ? 0 : g.buffs.regen ? g.buffLv.regen : 0,
      revives: g.reviveTotal,
      level: p.level,
      stage: g.stage,
      cats: { ...o.cats },
      buffs: g.buffList.slice(),
      buffLv: { ...g.buffLv },
      stacks: Object.fromEntries(Object.keys(g.balance.skills).map(id => [id, g.stack(id)])),
      prep: { ...g.stacks.prep },
      excludedPaint: true,
    };
  }
  function preview(box, opts) {
    const o = options(box, opts),
      g = newGame(box, o);
    return startSnapshot(g, o);
  }
  function createBot(box, o, g) {
    const Neon = box.Neon,
      B = box.balance,
      K = PROFILES[o.profile] || null,
      auto = !!Neon.difficulty(o.mode).auto,
      st = { rng: botRandom(o.seed), queue: [], last: { x: 0, y: 0, aim: null }, hpLog: [] },
      // picks: 판 중 고른 스킬 카드(레벨 · id 순서). 관전 화면의 빌드 줄이 쓰고, 결과(result)에는 넣지 않는다
      counts = {
        coinsCapped: 0,
        coinsChance: 0,
        manualCoins: 0,
        blueCoins: 0,
        sSpawned: 0,
        sPicked: 0,
        finalAt: g.finalState() === 'on' ? g.time : null,
        comboPrizes: 0,
        comboPoints: 0,
        picks: [],
        trace: [],
        hurt: { contact: 0, projectile: 0, floor: 0, other: 0 },
        lastHit: null,
        pace: [],
        nextMinute: (Math.floor(g.time / 60) + 1) * 60,
      };
    const traceStart = g.time,
      traceEvery = Math.max(5, Math.ceil((o.minutes * 60) / 60));
    let nextTrace = traceStart;
    const sample = game => {
      const p = game.p,
        boss = game.enemies.find(e => e.final && !e.dead),
        row = [
          +(game.time - traceStart).toFixed(3),
          game.score,
          p.level,
          game.stage,
          Math.max(0, p.hp),
          (p.damage * p.multi * (1 + p.crit * (p.critScale - 1))) / p.fire,
          game.finalDone ? 0 : boss ? (boss.hp / boss.maxHp) * 100 : null,
          game.lzFire,
          counts.comboPoints,
          Object.values(counts.hurt).reduce((a, b) => a + b, 0),
        ];
      const old = counts.trace.at(-1);
      if (old && old[0] === row[0]) counts.trace[counts.trace.length - 1] = row;
      else if (counts.trace.length < 244) counts.trace.push(row);
    };
    sample(g);
    nextTrace += traceEvery;
    let rushing = o.stage === 'rush' && g.stage < o.rushTo,
      owed = 0,
      stageNext = o.stage === 'none' ? Infinity : rushing ? RUSH.gap : STEADY;

    // 레벨업 고르기: basic은 추천 카드, 실력 봇은 무작위(random). 여러 장을 고르면 무작위 수를 한 번씩 쓴다.
    const pickId = () => {
      if (K && K.pick === 'random') {
        const list = g.choices;
        return list.length ? list[Math.floor(st.rng() * list.length)].id : null;
      }
      return g.recommendUpgrade();
    };
    // 코인 칸 종류(R-043)는 고르기 전에 읽는다(고른 뒤 다음 레벨업이 오면 바뀐다). B 코인은 blueCoins만 센다.
    const levelUp = () => {
      for (let i = 0; i < 50 && g.mode === 'upgrade'; i++) {
        const blue = g.coinKind === 'blue';
        if (auto && o.autoGold) {
          const capped = g.choices.length > 0 && g.choices.every(u => g.isCapped(u.id));
          if (g.chooseAutoGold(0)) {
            if (blue) counts.blueCoins++;
            else if (capped) counts.coinsCapped++;
            else counts.coinsChance++;
            continue;
          }
        }
        const id = pickId(),
          lv = g.p.level;
        if (!id || !g.choose(id, 0, auto ? 'auto' : 'manual')) {
          g.chooseCoin(0);
          if (blue) counts.blueCoins++;
          else counts.manualCoins++;
        } else counts.picks.push({ lv, id });
      }
    };
    // 실패(레벨업 중 등)하면 다음 스텝에 다시 한다. steady는 STEADY초마다 perMin칸을 빚으로 쌓고 갚는다.
    const planStage = () => {
      if (rushing) {
        if (g.time + 1e-9 < stageNext || !g.stageUp()) return;
        if (g.stage >= o.rushTo) {
          rushing = false;
          stageNext = g.time + STEADY;
        } else stageNext += RUSH.gap;
        return;
      }
      if (g.time + 1e-9 >= stageNext) {
        owed += o.perMin;
        stageNext += STEADY;
      }
      while (owed > 0 && g.stageUp()) owed--;
    };
    // 실력 봇의 입력: 판단은 지금 상태로 하고, K.reaction초 뒤에 들어간다(늦게 누르는 것).
    const reacted = input => {
      st.queue.push({ at: g.time + K.reaction + 1e-9, input });
      let dash = false,
        nova = false;
      while (st.queue.length && st.queue[0].at <= g.time) {
        const d = st.queue.shift().input;
        st.last = { x: d.x, y: d.y, aim: d.aim };
        if (d.dash) dash = true;
        if (d.nova) nova = true;
      }
      return { x: st.last.x, y: st.last.y, aim: st.last.aim, dash, nova };
    };

    return {
      counts,
      sample,
      settle: levelUp,
      before(game) {
        if (game.mode === 'upgrade') levelUp();
        // 최종전은 자동 승격만으로 시작되지 않는다. 실제 관문 준비 뒤 버튼과 같은 입력을 한다.
        if (K && game.mode === 'playing' && game.finalState() === 'ready') game.stageUp();
        if (game.mode !== 'ended' && !K) planStage();
      },
      input(game) {
        const input = !K ? decide(game, B) : reacted(decideSkilled(game, K, st));
        if (!game.world || !game.items.length) return input;
        // 월드 실험실 봇: 위험이 낮을 때만 가까운 열린 필드 스킬로 움직인다. 방어 한도에
        // 닿은 잠긴 스킬은 목표에서 제외해 게임에서 주울 수 없는 칸을 쫓지 않는다.
        let nearest = null,
          best = Infinity,
          threats = 0;
        for (const e of game.enemies) {
          if (e.dead) continue;
          const dx = e.x - game.p.x,
            dy = e.y - game.p.y,
            d2 = dx * dx + dy * dy;
          if (d2 < 250 * 250) threats++;
        }
        for (const b of game.hostiles) {
          const dx = b.x - game.p.x,
            dy = b.y - game.p.y,
            d2 = dx * dx + dy * dy;
          if (d2 < 180 * 180) threats++;
        }
        if (threats >= 2 || game.p.hp < game.p.maxHp * 0.35) return input;
        for (const item of game.items) {
          if (game.defenseFull(item.sk)) continue;
          const d2 = (item.x - game.p.x) ** 2 + (item.y - game.p.y) ** 2;
          if (d2 < best) {
            best = d2;
            nearest = item;
          }
        }
        if (!nearest) return input;
        const dx = nearest.x - game.p.x,
          dy = nearest.y - game.p.y,
          d = Math.hypot(dx, dy) || 1;
        return { ...input, x: dx / d, y: dy / d };
      },
      drain(game) {
        for (const e of game.drain()) {
          if (e.type === 'stage' && e.final && counts.finalAt === null) counts.finalAt = game.time;
          if (e.type === 'link_combo') {
            counts.comboPrizes++;
            counts.comboPoints += e.prize;
          }
          if (e.type === 's_spawn') counts.sSpawned++;
          else if (e.type === 's_pick') counts.sPicked++;
          else if (e.type === 'hurt') {
            // 피해 출처: 접촉(몸통) · 탄(사수 · 보스) · 바닥(붕괴 구역) · 기타. 흡수된 피해는 빼고 본다
            const at = e.source && e.source.attack,
              cat = at === 'contact' || at === 'projectile' || at === 'floor' ? at : 'other',
              amount = Number(e.healthDamage) || 0;
            counts.hurt[cat] += amount;
            counts.lastHit = cat;
          }
        }
        if (
          game.time >= nextTrace ||
          game.mode === 'ended' ||
          game.mode === 'final' ||
          (counts.trace.at(-1)?.[6] === null && game.enemies.some(e => e.final && !e.dead))
        ) {
          sample(game);
          nextTrace = game.time + traceEvery;
        }
        // 페이스: 1분이 지날 때마다 LV · Stage를 남긴다(살아 있는 판만)
        while (game.time >= counts.nextMinute && counts.pace.length < 120) {
          counts.pace.push({ m: counts.nextMinute / 60, lv: game.p.level, stage: game.stage });
          counts.nextMinute += 60;
        }
      },
    };
  }

  // 판 한 개를 한 스텝(1/60초)씩 돌린다. 실험실 자동 판과 관전 화면이 같이 쓴다.
  // g = 엔진 판(관전이 그린다), stepOnce()는 한 스텝, result()는 지금까지의 결과.
  function begin(box, opts) {
    const o = options(box, opts),
      B = box.balance;
    const g = newGame(box, o),
      bot = createBot(box, o, g),
      initial = startSnapshot(g, o);
    const startAt = g.time,
      limit = startAt + o.minutes * 60,
      maxSteps = o.minutes * 3600 + 600;
    let steps = 0,
      done = false,
      reason = null;

    const finish = why => {
      if (g.mode === 'upgrade') bot.settle();
      // 실제 게임의 끝내기와 같은 시간 Point 정산. 격추로 이미 끝난 판에는 중복 지급하지 않는다.
      if (g.mode !== 'ended') g.end('retired');
      bot.sample(g);
      done = true;
      reason = why;
    };
    const stepOnce = () => {
      if (done) return;
      bot.before(g);
      if (g.mode === 'ended') return finish('defeated');
      const V = g.world ? B.world.view : SCREEN;
      g.view = { x: g.p.x, y: g.p.y, hw: V.hw, hh: V.hh };
      g.step(DT, bot.input(g));
      bot.drain(g);
      steps++;
      if (g.mode === 'ended') finish('defeated');
      else if (g.mode === 'final') finish('success');
      else if (g.time >= limit || steps > maxSteps) finish('time');
    };

    return {
      o,
      g,
      stepOnce,
      get picks() {
        return bot.counts.picks.slice();
      },
      get progress() {
        return done ? 1 : Math.min(1, (g.time - startAt) / (limit - startAt));
      },
      get done() {
        return done;
      },
      result() {
        const startLevel = Number.isFinite(g.launch?.startLevel)
          ? g.launch.startLevel
          : o.launch === 'super'
            ? B.superLaunch.level
            : 1;
        const c = bot.counts;
        return {
          craft: o.craft,
          mode: o.mode,
          launch: o.launch,
          kind: o.world?.kind || '',
          week: o.world?.week || '',
          profile: o.profile,
          seed: o.seed,
          minutes: (g.time - startAt) / 60,
          time: g.time - startAt,
          reason,
          startLevel,
          level: g.p.level,
          stage: g.stage,
          kills: g.kills,
          score: g.score,
          bosses: g.bossKills,
          autoPicks: g.autoChoices,
          autoGoldCoins: { capped: c.coinsCapped, chance: c.coinsChance },
          manualCoins: c.manualCoins,
          blueCoins: c.blueCoins,
          sSpawned: c.sSpawned,
          sPicked: c.sPicked,
          hurt: { ...c.hurt },
          hurtContact: c.hurt.contact,

d, [, max]] of Object.entries(excess.cut))\n          if (max > 0) p.perma[id] = max;\n          else delete p.perma[id];\n        p.blue += excess.blue;\n      }\n      p.runs = cleanRuns(raw.runs);\n      p.tx = Array.isArray(raw.tx) ? raw.tx.filter(validId).slice(-TX_KEEP) : [];\n      p.scHold =\n        raw.scHold && validId(raw.scHold.prepId)\n          ? {\n              prepId: raw.scHold.prepId,\n              at: Number(raw.scHold.at) || 0,\n              n: holdN(raw.scHold.n),\n            }\n          : null;\n    }\n    if (v4) {\n      // 범위 밖 레벨과 모르는 고양이는 버린다. 동반 고양이는 해금된(레벨 1 이상) 고양이만.\n      for (const id of CATS) {\n        const lv = raw.cats?.[id];\n        if (Number.isSafeInteger(lv) && lv >= 0 && lv <= B.cats.maxLevel) p.cats[id] = lv;\n      }\n      p.companion = CATS.includes(raw.companion) && p.cats[raw.companion] >= 1 ? raw.companion : null;\n      p.hidden = raw.hidden === true;\n      p.ownedAutoGold = raw.ownedAutoGold === true;\n    }\n    if (sv === SCHEMA) Object.assign(p, cleanV5(raw));\n    return p;\n  }\n  // ── 비행 경력(R-100, DATA.md 4 · 7절). 모두 순수 함수. 지킬 사실: 기록의 careerAt이 0이 아니면 그 판은 경력에 들어 있다.\n  const Data = () => root.NeonData || (typeof require === 'function' ? require('./data.js') : null);\n  // 정상 종료 판(패배 · 직접 종료)만 센다 — Point 정산(R-082)과 같은 규칙. 중단 판은 세지 않는다\n  const careerRun = r => !!r && (r.reason === 'defeated' || r.reason === 'retired');\n  // 기록(정규화된 것 또는 같은 꼴) 한 판을 더한 새 경력. 없는 값은 건너뛴다(로그만 있는 판은 충격파 · 대시 · CHAIN · 고양이 없음)\n  function careerAdd(career, r) {\n    const c = cleanCareer(career),\n      num = v => nonNeg(Number(v)) || 0,\n      room = (o, k) => isId(k) && (k in o || Object.keys(o).length < 200),\n      add = (k, v) => {\n        const n = num(v);\n        if (n > 0 && room(c.sum, k)) c.sum[k] = (c.sum[k] || 0) + n;\n      },\n      top = (k, v) => {\n        const n = num(v);\n        if (n > (c.max[k] || 0) && room(c.max, k)) c.max[k] = n;\n      },\n      time = Math.round(num(r?.time)),\n      u = r?.abilityUsage || {},\n      by = (kind, id) => {\n        if (!isId(id)) return;\n        add(kind + '.' + id + '.runs', 1);\n        add(kind + '.' + id + '.time', time);\n      };\n    add('runs', 1);\n    add('time', time);\n    add('kills', r?.kills);\n    add('bosses', r?.bossKills);\n    add('point', r?.score);\n    add('gold', r?.earned?.gold);\n    add('blue', r?.earned?.blue);\n    add('super', r?.earned?.super);\n    add('nova.kills', u.nova?.kills);\n    add('nova.clears', u.nova?.projectilesCleared);\n    add('dash', u.dash?.activations);\n    add('siege', r?.siegeWaves);\n    add('late', r?.late === true ? 1 : 0);\n    add('revive', r?.revives);\n    add('sc', r?.launch?.type === 'super' ? 1 : 0);\n    if (r?.launch?.type === 'world') {\n      add('world.runs', 1);\n      if (r.world?.kind === 'practice' || r.world?.kind === 'daily')\n        add('world.' + r.world.kind + '.runs', 1);\n      add('world.bosses', r.world?.wb);\n    }\n    by('mode', r?.difficultyId);\n    by('craft', r?.craft);\n    for (const id of Data().partyOf(r)) by('cat', id);\n    top('score', r?.score);\n    top('time', time);\n    top('stage', r?.stage);\n    top('level', r?.level);\n    if (Data().isSolo(r) && B.modes[r.difficultyId]) {\n      top('mode.' + r.difficultyId + '.boss', r?.bossTop);\n      // 최종전(R-297): 모드별 HELIOS 승리 수(레전드) · 모드 한 판 최고 Point(연계 회로 조건)\n      add('mode.' + r.difficultyId + '.final', r?.final ? 1 : 0);\n      top('mode.' + r.difficultyId + '.point', r?.score);\n    }\n    top('chain', r?.maxCombo);\n    top('kills', r?.kills);\n    const date = natural(Math.floor(Number(r?.date) || 0)) || 0;\n    if (date) {\n      c.first = c.first ? Math.min(c.first, date) : date;\n      c.last = Math.max(c.last, date);\n    }\n    return c;\n  }\n  // 플레이 로그 판 줄 → careerAdd가 읽는 꼴(있는 값만)\n  const logRun = e => ({\n    date: e.at,\n    reason: e.reason,\n    time: e.time,\n    kills: e.kills,\n    bossKills: e.bosses,\n    score: e.score,\n    earned: { gold: e.earned?.gold, blue: e.earned?.blue, super: e.earned?.sc },\n    difficultyId: e.mode,\n    craft: e.craft,\n    launch: { type: e.launch },\n    revives: e.revived === true ? 1 : 0,\n    level: e.level,\n    stage: e.stage,\n  });\n  // 경력 처음 값(이관 때 한 번): 정상 종료 기록 + 플레이 로그에만 있는 판. 깨진 줄은 건너뛰고 예외를 던지지 않는다.\n  // 로그는 배열 순서대로 — 판 줄은 목록에 더하고, 'reset'이면 지금 목록을 보관하고 비우며, 'undo'면 보관본으로(없으면 빈 목록).\n  // 남은 판 줄 중 어떤 기록(끝난 이유 · 날짜와 상관없이)과도 at · score가 같지 않은 판만 센다.\n  // → { career(since = 넣은 판 중 가장 늦은 날짜), ids: [처음 값에 넣은 기록 id], records, log }\n  function careerSeed({ records, history: entries } = {}) {\n    let career = blankCareer(),\n      fromLog = 0;\n    const ids = [],\n      seen = new Set();\n    for (const raw of Array.isArray(records) ? records : []) {\n      try {\n        const r = Data().normalizeRecord(raw);\n        if (!r) continue;\n        seen.add(r.date + '|' + count(r.score));\n        if (!careerRun(r)) continue;\n        career = careerAdd(career, r);\n        ids.push(r.id);\n      } catch {\n        /* 깨진 기록은 건너뜀 */\n      }\n    }\n    let list = [],\n      saved = null;\n    for (const e of Array.isArray(entries) ? entries : []) {\n      if (!e || typeof e !== 'object') continue;\n      if (e.kind === 'run') list.push(e);\n      else if (e.kind === 'reset') {\n        saved = list;\n        list = [];\n      } else if (e.kind === 'undo') {\n        list = saved || [];\n        saved = null;\n      }\n    }\n    for (const e of list)\n      try {\n        const at = Number(e.at);\n        if (!Number.isSafeInteger(at) || at <= 0 || e.reason === 'interrupted') continue;\n        if (seen.has(at + '|' + count(e.score))) continue;\n        career = careerAdd(career, logRun(e));\n        fromLog++;\n      } catch {\n        /* 깨진 줄은 건너뜀 */\n      }\n    career.since = career.last;\n    return { career, ids, records: ids.length, log: fromLog };\n  }\n  // 두 경력 합치기(백업 가져오기): 항목마다 큰 값, first는 0 아닌 작은 값, since는 a(지금 값) 그대로.\n  // 두 기기에서 따로 쌓은 몫은 더해지지 않고 큰 쪽만 남는다(DATA.md 9절)\n  function careerMerge(a, b) {\n    const x = cleanCareer(a),\n      y = cleanCareer(b),\n      both = (o, q) => {\n        const out = { ...o };\n        for (const [k, v] of Object.entries(q)) out[k] = Math.max(out[k] || 0, v);\n        return out;\n      };\n    return cleanCareer({\n      v: Math.max(x.v, y.v),\n      since: x.since,\n      first: x.first && y.first ? Math.min(x.first, y.first) : x.first || y.first,\n      last: Math.max(x.last, y.last),\n      sum: both(x.sum, y.sum),\n      max: both(x.max, y.max),\n    });\n  }\n  // 이정표 합치기: 아이디마다 이른 시각(0이 아닌 쪽)\n  function mileMerge(a, b) {\n    const out = cleanIdMap(a, 300, natural);\n    for (const [k, v] of Object.entries(cleanIdMap(b, 300, natural)))\n      out[k] = out[k] && v ? Math.min(out[k], v) : out[k] || v;\n    return cleanIdMap(out, 300, natural);\n  }\n  const mainBackupId = sv => (sv === 4 ? 'main-v4-backup' : sv === 3 ? 'main-v3-backup' : 'main-v2-backup');\n  function remember(p, txId) {\n    p.tx.push(txId);\n    if (p.tx.length > TX_KEEP) p.tx.splice(0, p.tx.length - TX_KEEP);\n  }\n  const fail = reason => ({ ok: false, reason });\n  const dup = extra => ({ ok: true, duplicate: true, ...extra });\n  // 고양이 레벨은 0~maxLevel 정수만 믿는다(이상한 값은 0).\n  const catLevel = v => (Number.isSafeInteger(v) && v >= 0 && v <= B.cats.maxLevel ? v : 0);\n  // 저장된 동반 원 목록: 예비 칸 x.party(balance cats.list 순서) 중 해금(Lv1 이상)한 고양이만.\n  // x.party가 없으면 옛 칸 companion 한 마리로 읽는다(지금 계정 = 지금 동반 그대로)\n  function partyRaw(p) {\n    const on = id => catLevel(p?.cats?.[id]) >= 1,\n      raw = p?.x?.party;\n    if (Array.isArray(raw)) return CATS.filter(id => raw.includes(id) && on(id));\n    return CATS.includes(p?.companion) && on(p.companion) ? [p.companion] : [];\n  }\n  const catTop = (p, id) => catLevel(p?.cats?.[id]) === B.cats.maxLevel;\n  // 동반 고양이 목록(R-237: Lv5 아닌 고양이 1칸 + Lv5 고양이는 칸 밖 모두). 원 목록에서 Lv5 아닌 고양이가 둘 이상이면\n  // companion(그 안에 있으면) 아니면 cats.list 순 첫 하나만 남긴다. 결과는 cats.list 순. 동반을 읽는 곳은 모두 여기로\n  function partyOf(p) {\n    const list = partyRaw(p),\n      low = list.filter(id => !catTop(p, id));\n    if (low.length < 2) return list;\n    const keep = low.includes(p?.companion) ? p.companion : low[0];\n    return list.filter(id => catTop(p, id) || id === keep);\n  }\n  // 동반 목록을 쓴다: x.party(다른 x 칸은 그대로) + companion = 첫 동반(옛 코드 · 옛 탭 호환)\n  function writeParty(p, list) {\n    p.x = { ...(isObj(p.x) ? p.x : {}), party: [...list] };\n    p.companion = list[0] ?? null;\n  }\n  // ── 승진(R-111). 값은 balance cats.promo(없으면 승진 없음)\n  const PROMO = B.cats.promo || null,\n    MAX_LV = B.cats.maxLevel;\n  // R-161: 마지막 승진 단계는 open의 null이 아니라 legend 조건으로 연다.\n  function promoCap() {\n    return PROMO ? PROMO.open.length : 0;\n  }\n  // 저장된 승진 칸 사본(없으면 처음 값)\n  function promoOf(p, cat) {\n    const v = p?.promo?.[cat],\n      rk = intIn(0, 9);\n    return {\n      rank: rk(v?.rank) ?? 0,\n      open: rk(v?.open) ?? 0,\n      best: isObj(v?.best) ? cleanIdMap(v.best, 20, nonNeg) : {},\n    };\n  }\n  // 효과 · 이름에 쓰는 단계: Lv5일 때만, promoCap으로 자름(데이터 · GM · 백업으로 큰 값이 와도)\n  function promoRank(p, cat) {\n    return catLevel(p?.cats?.[cat]) === MAX_LV ? Math.min(promoOf(p, cat).rank, promoCap()) : 0;\n  }\n  // 고양이 효과(R-026 · R-111): Lv 효과 = 동반 고양이(여러 마리) + 동반이 아닌 Lv5(겹치면 한 번). 프로필을 바꾸지 않는다.\n  // engineer: 기체 시작 스킬마다 더할 스택 · supply: 분당 G · pilot: 대시 재충전 감소 비율. 적용되지 않으면 0.\n  // 승진 효과는 동반한 Lv5 고양이만: engineer · pilot은 Lv5 값 대신 승진 값 · supply는 G 그대로 + supplyBlue · supplySuper ·\n  // 충격파 배율 novaX = 1 + 고양이마다 nova 몫(더함). ranks = 동반 · 승진한 고양이의 단계\n  function catEffects(profile) {\n    const levels = {},\n      ranks = {},\n      party = partyOf(profile),\n      out = { levels, ranks, party, novaX: 1, supplyBlue: 0, supplySuper: 0 };\n    let nova = 0;\n    for (const id of CATS) {\n      const lv = catLevel(profile?.cats?.[id]),\n        on = lv >= 1 && (lv === MAX_LV || party.includes(id)),\n        rk = party.includes(id) ? promoRank(profile, id) : 0;\n      levels[id] = on ? lv : 0;\n      out[id] = on ? B.cats.effect[id][lv - 1] : 0;\n      if (!rk) continue;\n      ranks[id] = rk;\n      nova += PROMO.nova[rk - 1] || 0;\n      const fx = PROMO.effect;\n      if (id === 'supply') {\n        out.supplyBlue = count(fx.supplyBlue?.[rk - 1]);\n        out.supplySuper = count(fx.supplySuper?.[rk - 1]);\n      } else if (fx[id]?.[rk - 1] !== undefined) out[id] = fx[id][rk - 1];\n    }\n    out.novaX = Math.round((1 + nova) * 1000) / 1000;\n    return out;\n  }\n  // 승진 판정(R-111): 판 끝 한 번(addCareer · sweepCareer — careerAt 중복 막이). 기록 값만 본다.\n  // 셈하는 고양이 = 정상 종료 판 · 기록 party에 있음 · 출격 순간 Lv5(기록 cats). 고양이마다:\n  // 1 시험 — 판 전에 열려 있던 시험만(이 판에 열린 시험은 다음 판부터): 처치 · 탄(충격파 버튼)을 넘기면 한 단계 · best 비움,\n  //   못 넘으면 best를 각각 큰 값으로. 2 열림 — 기록 bossTop ≥ open[i]인 가장 높은 i까지 + 마스터(R-297) = 이 판이\n  //   솔로 master.mode이고 최종전 승리(기록 final). 레전드 = 마스터 + 경력 sum['mode.<id>.final'] ≥ 1(이 판을 먼저 더한 뒤)\n  // 돌려줌 events: 고양이마다 하나(pass > opened > try), 통과 먼저 · cats.list 순\n  function promoRun(p, record) {\n    const events = [];\n    if (!PROMO || !careerRun(record)) return events;\n    const cap = promoCap(),\n      party = Data().partyOf(record),\n      u = record.abilityUsage || {},\n      num = v => nonNeg(Number(v)) || 0,\n      kills = num(u.nova?.kills),\n      clears = num(u.nova?.projectilesCleared),\n      top = natural(record.bossTop) || 0,\n      legend = PROMO.legend,\n      legendModes = Array.isArray(legend?.modes) ? legend.modes : [],\n      master =\n        !!PROMO.master &&\n        !!record.final &&\n        Data().isSolo(record) &&\n        record.difficultyId === PROMO.master.mode;\n    let reach = 0;\n    PROMO.open.forEach((stage, i) => {\n      if (stage !== null && top >= stage) reach = Math.max(reach, i + 1);\n    });\n    if (master) reach = Math.max(reach, cap - 1);\n    for (const cat of CATS) {\n      if (!party.includes(cat) || catLevel(record.cats?.[cat]) !== MAX_LV) continue;\n      const pr = promoOf(p, cat),\n        was = Math.min(pr.rank, cap),\n        openBefore = pr.open,\n        legendOpen =\n          was >= cap - 1 &&\n          legendModes.length > 0 &&\n          legend.final === true &&\n          legendModes.every(id => (nonNeg(p.career?.sum?.['mode.' + id + '.final']) || 0) >= 1);\n      let ev = null;\n      if (openBefore > was && was < cap) {\n        const t = PROMO.test[was];\n        if (kills >= t.kills && clears >= t.clears) {\n          pr.rank = was + 1;\n          pr.best = {};\n          ev = { cat, kind: 'pass', rank: was + 1, nowRank: was + 1, kills, clears };\n        } else {\n          pr.best = {\n            ...pr.best,\n            kills: Math.max(pr.best.kills || 0, kills),\n            clears: Math.max(pr.best.clears || 0, clears),\n          };\n          ev = { cat, kind: 'try', rank: was + 1, nowRank: was, kills, clears };\n        }\n      }\n      if (reach > pr.open) pr.open = Math.min(9, reach);\n      if (legendOpen) pr.open = Math.max(pr.open, cap);\n      const now = Math.min(pr.rank, cap);\n      // 다음 시험이 이 판에 처음 열렸으면 '열림'(통과 줄이 우선, 이미 열려 있던 시험이면 시험 줄 그대로)\n      if (ev?.kind !== 'pass' && now < cap && pr.open > now && !(openBefore > now))\n        ev = { cat, kind: 'opened', rank: now + 1, nowRank: now, kills, clears };\n      p.promo[cat] = pr;\n      if (ev) events.push(ev);\n    }\n    return [...events.filter(e => e.kind === 'pass'), ...events.filter(e => e.kind !== 'pass')];\n  }\n  // S 출격 준비에 예약된 S(30분 안의 예약 수량)는 쓸 수 없다. 시각을 모르면 예약을 지킨다.\n  function spendableSC(p, now) {\n    const held =\n      p.scHold && (!Number.isFinite(now) || now - p.scHold.at < HOLD_STALE_MS) ? holdN(p.scHold.n) : 0;\n    return p.superCoins - held;\n  }\n  // S가 모자란 이유: 예약 때문이면 sc_reserved, 아니면 insufficient. 충분하면 null.\n  function scShort(p, now, cost) {\n    if (spendableSC(p, now) >= cost) return null;\n    return p.superCoins >= cost ? 'sc_reserved' : 'insufficient';\n  }\n  // ── 격납고 도색(R-106 · R-107). 색 · 기체 목록은 balance. 모음 = 세 기체 모두 그 색을 가짐(own에서 계산, 따로 저장하지 않음)\n  const PAINT = B.paint,\n    COLORS = Object.freeze([...PAINT.colors]),\n    CRAFT_IDS = Object.freeze(Object.keys(B.crafts));\n  // 기체가 가진 색(balance 순서, 모르는 색은 빼고 봄 — 저장된 값은 그대로 둔다)\n  function paintOwn(p, craft) {\n    const own = p?.paint?.own?.[craft];\n    return Array.isArray(own) ? COLORS.filter(c => own.includes(c)) : [];\n  }\n  function paintSets(p) {\n    return COLORS.filter(c => CRAFT_IDS.every(id => paintOwn(p, id).includes(c)));\n  }\n  // 입힌 색: 가진 색일 때만(아니면 기본 = null)\n  function paintWear(p, craft) {\n    const w = p?.paint?.wear?.[craft];\n    return paintOwn(p, craft).includes(w) ? w : null;\n  }\n  // 켜진 모음 중 그 효과를 가진 첫 값(없으면 기본값)\n  const setValue = (sets, key, base) => {\n    for (const c of sets) if (PAINT.sets[c]?.[key] !== undefined) return PAINT.sets[c][key];\n    return base;\n  };\n  const notePer = p => setValue(paintSets(p), 'noteCost', ECONOMY.notePerChar);\n  // 출격 순간 고정할 도색 효과(catEffects 꼴, 프로필을 바꾸지 않는다). craft = 이 판 기체\n  // start: 기체 시작 스킬마다 더할 스택 · regen: 초당 HP · revive: 도색 · 모음 부활 수(reviveMax로 자름) · gx: 분당 G 배율 ·\n  // shieldX: 보호막 재생 배율 · noteCost: 한 줄 남기기 글자당 G · scMake: S 제작 한 번에 만드는 S\n  function paintEffects(p, craft) {\n    const wear = paintWear(p, craft),\n      sets = paintSets(p),\n      on = (map, c) => (c ? count(map?.[c]) : 0);\n    return {\n      wear,\n      sets,\n      start: on(PAINT.start, wear),\n      regen: on(PAINT.regen, wear),\n      revive: Math.min(PAINT.reviveMax, on(PAINT.revive, wear) + count(setValue(sets, 'revive', 0))),\n      gx: setValue(sets, 'goldX', 1),\n      shieldX: setValue(sets, 'shieldX', 1),\n      noteCost: setValue(sets, 'noteCost', ECONOMY.notePerChar),\n      scMake: setValue(sets, 'scMake', 1),\n    };\n  }\n  // ── 연계 회로 · 제어 레이저 저장 칸(R-297). 프로필 예비 칸 x(add-only, 이관 없음 — 옛 저장은 기본값으로 읽음):\n  // x.link = 연계 구매 수(0~LINK_MAX) · x.laser = { lv: 공통 단계 0~5, g · b · s: 재고 }. 꼴이 틀리면 기본값\n  const LINK = B.link || null,\n    LASER = B.laser || null,\n    LINK_MAX = LINK ? LINK.price.heal.length * 4 : 0,\n    LASER_KINDS = Object.freeze(LASER ? Object.keys(LASER.price) : []),\n    LASER_MAX = LASER ? LASER.every.length : 0;\n  function linkCount(p) {\n    const n = p?.x?.link;\n    return Number.isSafeInteger(n) && n >= 0 ? Math.min(LINK_MAX, n) : 0;\n  }\n  // 열린 레이저 종류: 그 색 모음(세 기체 모두 그 색을 가짐)이 있는 종류(balance 순서)\n  function laserOpen(p) {\n    if (!LASER) return [];\n    const sets = paintSets(p);\n    return LASER_KINDS.filter(k => sets.includes(LASER.set[k]));\n  }\n  // 읽은 레이저: lv = 쓰는 단계(열린 종류가 있으면 max(저장 단계, 1), 없으면 0) · stored = 저장 단계 · 종류별 재고 · open\n  function laserOf(p) {\n    const raw = isObj(p?.x?.laser) ? p.x.laser : {},\n      open = laserOpen(p),\n      stored = intIn(0, LASER_MAX)(raw.lv) ?? 0,\n      out = { lv: open.length ? Math.max(1, stored) : 0, stored, open };\n    for (const k of LASER_KINDS) out[k] = natural(raw[k]) ?? 0;\n    return out;\n  }\n  function writeLaser(p, v) {\n    const cur = laserOf(p);\n    p.x = {\n      ...(isObj(p.x) ? p.x : {}),\n      laser: Object.fromEntries([['lv', v.lv ?? cur.stored], ...LASER_KINDS.map(k => [k, v[k] ?? cur[k]])]),\n    };\n  }\n  // 연계 효과 단계(R-300): 효과 k(balance link.price 순서 = 회복 · 득점 · 붕괴 · 포상)는 구매 k+1 · k+5 · k+9 …번째에 오른다\n  // → max(0, ceil((n − k) / 4)). 엔진 linkLevels와 같은 식\n  const LINK_FX = Object.freeze(LINK ? Object.keys(LINK.price) : []);\n  function linkLevels(n) {\n    const c = Math.min(LINK_MAX, count(n));\n    return Object.fromEntries(LINK_FX.map((id, k) => [id, Math.max(0, Math.ceil((c - k) / 4))]));\n  }\n  // 솔로 Insane 한 판 최고 Point(정상 종료 기록, 경력 max) — 연계 회로 순환 조건\n  const linkBest = p => count(p?.career?.max?.['mode.insane.point']);\n  // 성장 목록에 연계 회로 카드가 보이는가: 첫 순환 기록을 넘었거나 이미 하나라도 샀다\n  const linkShown = p => !!LINK && (linkCount(p) > 0 || linkBest(p) >= LINK.need[0]);\n  // 다음 연계 구매: 효과 n % 4 · 순환 n / 4. 조건 = 기록 ≥ need[순환] · perma 스킬 모두 MAX(앞 구매는 순서로 보장).\n  // → null(MAX) | { n, fx, cycle, price: { g, b, s }, need, best, rec(기록 됨), perma(MAX 됨) }\n  function lin .push(m.id);\n      }\n    return ids.length ? { ok: true, ids } : dup({ ids: [] });\n  }\n  // 화면 상태(비행 일지): 넘음 · 시각 + 못 넘은 것의 진행(have/need) · 잠김(lock) · 준비 중(soon)\n  function mileState(p) {\n    const cap = promoCap(),\n      top = topRank(p);\n    return MILE.map(m => {\n      const at = natural(p?.mile?.[m.id]) || 0,\n        x = { id: m.id, col: m.col, title: !!m.title, done: at > 0, at };\n      if (m.play === 'insane') Object.assign(x, { have: insanePlayed(p) ? 1 : 0, need: 1 });\n      else if (m.sum) Object.assign(x, { have: mileSum(p, m.sum), need: m.need });\n      else if (m.rank) Object.assign(x, m.rank > cap ? { lock: true } : { have: top, need: m.rank });\n      else if (m.door === 'world' && !B.world) x.soon = true;\n      return x;\n    });\n  }\n  // 가진 칭호는 mile에서 계산한다. 새 배열을 우선하고, 옛 단일 칭호는 그대로 읽는다.\n  const titlesOf = p => TITLE_IDS.filter(id => natural(p?.mile?.[id]) > 0);\n  function wornTitles(p) {\n    const selected = Array.isArray(p?.cos?.titles) ? p.cos.titles : [p?.cos?.wear?.title];\n    return titlesOf(p).filter(id => selected.includes(id));\n  }\n  function titleOf(p) {\n    return wornTitles(p)[0] || null;\n  }\n\n  // ── 꾸미기 · 보급 캡슐(R-116). 목록 · 값 · 열림은 balance.cos(없는 옛 balance면 빈 목록), 이름 · 글은 terms.cos.\n  // 저장 = cos.own(가진 조각 id) · cos.wear(칸 → id, 13단계 title과 같은 곳) · cnt.capsule · opened 'cos'. 판 진행 영향 0\n  const COS = Object.freeze([...(B.cos?.items || [])]),\n    COS_BY = new Map(COS.map(x => [x.id, x])),\n    COS_SLOTS = Object.freeze([...new Set(COS.map(x => x.slot))]),\n    CAPSULE = B.cos?.capsule || null;\n  const cosItem = id => COS_BY.get(id) || null;\n  const cosOwn = p => (Array.isArray(p?.cos?.own) ? p.cos.own : []);\n  // 소품 칸(prop.<고양이>)의 고양이\n  const slotCat = slot => (typeof slot === 'string' && slot.startsWith('prop.') ? slot.slice(5) : null);\n  // 상점 네 칸(시간 코인 모두 · 자동 강화 · 자동 G)을 모두 샀다 → 꾸미기 문\n  const shopFull = p =>\n    count(p?.incomeTier) >= ECONOMY.incomeMax && p?.ownedAuto === true && p?.ownedAutoGold === true;\n  // 조각 열림(순수): null = 열림 · { kind: 'cat' | 'rank' | 'tier' | 'mile' | 'soon', id }. 모르는 id = { kind: 'invalid' }.\n  // 소품 = 그 고양이를 깨움(Lv ≥ 1) · rank = 그 고양이 승진 단계 · tier = 등급 문(balance.cos.tiers · INSANE RED = insane1, R-160) ·\n  // mile = 그 이정표 넘음('이전 기록' 1 포함) · world = 15단계 전 준비 중. 등급 문을 먼저 보고, 항목 조건은 그 뒤에 따로 본다\n  function cosNeed(p, id) {\n    const it = cosItem(id);\n    if (!it) return { kind: 'invalid', id };\n    const cat = slotCat(it.slot);\n    if (cat && !(catLevel(p?.cats?.[cat]) >= 1)) return { kind: 'cat', id: cat };\n    const door = it.tier && B.cos?.tiers?.[it.tier]?.need?.mile;\n    if (door && !(natural(p?.mile?.[door]) > 0)) return { kind: 'tier', id: door, tier: it.tier };\n    if (it.need?.rank && !(promoRank(p, cat) >= it.need.rank))\n      return { kind: 'rank', id: cat, need: it.need.rank };\n    const m = it.need?.mile;\n    if (m === 'world' && !B.world) return { kind: 'soon', id: m };\n    if (m && !(natural(p?.mile?.[m]) > 0)) return { kind: 'mile', id: m };\n    return null;\n  }\n  // 입은 것(순수): 칸마다 가진 · 아는 · 그 칸 조각만(모르는 id · 안 가진 것은 기본으로 읽고 지우지 않는다 — 뒤 단계 조각 보존).\n  // 옛 탭도 wear의 모르는 슬롯은 보존한다. 표식 없는 기체는 옛 공통 복장, 표식만 있으면 기본 복장.\n  const COS_CRAFT_SLOTS = ['mark', 'mcol', 'flame', 'trail'];\n  const cosCraftKey = craft => 'craft.' + craft;\n  function cosWorn(p, craft) {\n    const wear = isObj(p?.cos?.wear) ? p.cos.wear : {},\n      personal = CRAFT_IDS.includes(craft) && wear[cosCraftKey(craft)] === 'base',\n      own = cosOwn(p),\n      out = {};\n    for (const slot of COS_SLOTS) {\n      const key = personal && COS_CRAFT_SLOTS.includes(slot) ? cosCraftKey(craft) + '.' + slot : slot,\n        id = wear[key];\n      if (cosItem(id)?.slot === slot && own.includes(id)) out[slot] = id;\n    }\n    return out;\n  }\n  // 첫 변경 때 공통 네 칸을 해당 기체 슬롯에 복사한다. 기본으로 벗겨도 표식을 남겨 다른 기체와 분리한다.\n  function cosWearChange(p, set, craft) {\n    const wear = { ...(p.cos?.wear || {}) },\n      personal = CRAFT_IDS.includes(craft),\n      key = personal ? cosCraftKey(craft) : null;\n    if (personal && Object.keys(set).some(slot => COS_CRAFT_SLOTS.includes(slot)) && wear[key] !== 'base') {\n      for (const slot of COS_CRAFT_SLOTS) if (wear[slot]) wear[key + '.' + slot] = wear[slot];\n      wear[key] = 'base';\n    }\n    for (const [slot, id] of Object.entries(set)) {\n      const target = personal && COS_CRAFT_SLOTS.includes(slot) ? key + '.' + slot : slot;\n      if (id === null) delete wear[target];\n      else wear[target] = id;\n    }\n    return Object.keys(wear).length <= 50 ? wear : null;\n  }\n  // 문자열 → 0 이상 1 미만(FNV-1a + 섞기). 보급 캡슐 전용 난수 줄 — 엔진 rng와 따로, 같은 글자 = 같은 값\n  function hash01(str) {\n    const s = String(str);\n    let h = 0x811c9dc5;\n    for (let i = 0; i < s.length; i++) {\n      h ^= s.charCodeAt(i);\n      h = Math.imul(h, 0x01000193);\n    }\n    h ^= h >>> 16;\n    h = Math.imul(h, 0x85ebca6b);\n    h ^= h >>> 13;\n    h = Math.imul(h, 0xc2b2ae35);\n    h ^= h >>> 16;\n    return (h >>> 0) / 4294967296;\n  }\n  // 캡슐에서 나올 수 있는 조각: G 조각 중 열렸고 아직 없는 것(특별 S · INSANE RED · 잠긴 조각은 안 나옴 — 노력형 원칙), 목록 순서\n  const capsulePool = p =>\n    COS.filter(x => x.g > 0 && x.tier !== 'insane' && !cosOwn(p).includes(x.id) && !cosNeed(p, x.id)).map(\n      x => x.id,\n    );\n  // 보급 캡슐(Q211, 순수 — addCareer · sweepCareer 안에서만 불러 careerAt이 중복을 막는다): 정상 종료 · 솔로 · 문 'cos' ·\n  // time초 이상 · 고를 조각 있음 · 기록 id 해시 < 모드 확률이면 조각 하나를 own에 더하고 cnt.capsule += 1 → id(아니면 null).\n  // 입히지 않는다 · 재화 0. force(GM '캡슐 항상') = 확률 1 · 시간 0\n  function capsuleRun(p, record, { force } = {}) {\n    if (!CAPSULE || !careerRun(record) || !Data().isSolo(record) || !p.opened?.includes('cos')) return null;\n    if (!force && !((nonNeg(Number(record.time)) || 0) >= CAPSULE.time)) return null;\n    const pool = capsulePool(p);\n    if (!pool.length) return null;\n    if (!force && !(hash01('cap:' + record.id) < (CAPSULE.chance[modeId(record.difficultyId)] || 0)))\n      return null;\n    const id = pool[Math.floor(hash01('capp:' + record.id) * pool.length)];\n    p.cos = { ...p.cos, own: [...cosOwn(p), id] };\n    p.cnt = { ...(isObj(p.cnt) ? p.cnt : {}), capsule: count(p.cnt?.capsule) + 1 };\n    return id;\n  }\n\n  // 출격 단계 해금 거래(buySS · buySSS 공용)\n  function buyTier(p, kind, { txId, now, needs }) {\n    if (!validId(txId)) return fail('invalid');\n    if (p.tx.includes(txId)) return dup();\n    if (p.opened.includes(kind)) return dup();\n    if (needs && !p.opened.includes(needs)) return fail('needs_' + needs);\n    const price = launchTier(kind).open,\n      short = scShort(p, now, price);\n    if (short) return fail(short);\n    p.superCoins -= price;\n    p.opened.push(kind);\n    remember(p, txId);\n    return { ok: true, price, opened: [] };\n  }\n\n  // 순수 규칙: p(프로필 사본)를 바꾸고 결과를 돌려준다.\n  const rules = {\n    // 출격(R-062 · R-161): launch.buffs(요청 id 배열)를 BUFFS 순서로 본다. 비용 · buffLv는 계정 최고 Point 단계로 정한다.\n    // 비용(B · S)이 모자라면 건너뜀('insufficient', 예약된 S 때문이면 'sc_reserved'), 아니면 이 트랜잭션에서 낸다.\n    // 적용한 버프는 runs[runId].bf. 같은 판 id의 두 번째 출격은 아무것도 내지 않고 그 판의 버프를 돌려준다.\n    // 도색 효과(R-107)는 이 판 기체(craft)로 출격 순간 고정 — 분당 G 배율은 runs[runId].x.gx(1이면 적지 않음)\n    startRun(p, { runId, mode, launch, now, craft }) {\n      if (!validId(runId)) return fail('invalid');\n      const cats = catEffects(p),\n        paint = paintEffects(p, craft),\n        // 월드 판(R-121): 버프 · 고양이 분당 G 없음, 판 고정값 x.w = 1(지급 함수들이 0)\n        world = launch?.type === 'world';\n      if (p.runs[runId])\n        return dup({\n          cats,\n          paint,\n          buffs: [...p.runs[runId].bf],\n          buffLv: { ...p.runs[runId].bl },\n          skipped: [],\n        });\n      const buffLv = {\n          regen: buffSpec(p, 'regen').hp,\n          revive: buffSpec(p, 'revive').n,\n        },\n        startLevel = count(launch?.startLevel) || 1,\n        want = world ? [] : buffList(launch?.buffs),\n        buffs = [],\n        skipped = [];\n      for (const id of want) {\n        if (!buffOk(mode)) {\n          skipped.push({ id, reason: 'mode' });\n          continue;\n        }\n        const spec = buffSpec(p, id),\n          b = spec.b,\n          s = spec.s,\n          short = (s && scShort(p, now, s)) || (p.blue < b ? 'insufficient' : null);\n        if (short) {\n          skipped.push({ id, reason: short });\n          continue;\n        }\n        p.blue -= b;\n        p.superCoins -= s;\n        buffs.push(id);\n      }\n      // 고양이 분당 G(보급관)는 출격 순간 값으로 고정한다.\n      p.runs[runId] = {\n        mode: modeId(mode),\n        m: 0,\n        l: Math.floor(startLevel / ECONOMY.blueEvery) * ECONOMY.blueEvery,\n        c: [],\n        b: [],\n        s: [],\n        bc: [],\n        pb: null,\n        cg: world ? 0 : cats.supply,\n        t: Number(now) || 0,\n        bf: buffs,\n        bl: { ...buffLv },\n      };\n      if (world) {\n        p.runs[runId].x = { w: 1 };\n        return { ok: true, cats, paint, buffs: [], buffLv: { ...buffLv }, skipped: [] };\n      }\n      // 판 고정값 x: 모음 분당 G 배율 gx(1이면 적지 않음) · 승진 보급관(R-111) B/분 cb · S 분 간격 cs(supplyFrom 모드부터, 0이면 적지 않음)\n      const x = {},\n        supplyOk = PROMO && MODES.indexOf(modeId(mode)) >= MODES.indexOf(PROMO.supplyFrom);\n      if (paint.gx !== 1) x.gx = paint.gx;\n      if (supplyOk && cats.supplyBlue > 0) x.cb = cats.supplyBlue;\n      if (supplyOk && cats.supplySuper > 0) x.cs = cats.supplySuper;\n      if (Object.keys(x).length) p.runs[runId].x = x;\n      // 실제 시작을 저장한 같은 거래에서 해금한다. 중단·앱 종료 여부와 상관없이 첫 플레이는 남는다.\n      if (modeId(mode) === 'insane') {\n        if (!isObj(p.cnt)) p.cnt = {};\n        p.cnt['insane.played'] = 1;\n        const doors = rules.openDoors(p);\n        return {\n          ok: true,\n          cats,\n          paint,\n          buffs: [...buffs],\n          buffLv: { ...buffLv },\n          skipped,\n          opened: doors.opened,\n          ...(doors.unlocked ? { unlocked: true } : {}),\n        };\n      }\n      return { ok: true, cats, paint, buffs: [...buffs], buffLv: { ...buffLv }, skipped };\n    },\n    // 분마다 분당 G × 이 판의 모음 배율(x.gx, R-107) + 고양이 분당 G(cg, 배율 없음). cat은 그중 고양이 몫.\n    // 승진 보급관(R-111): 분마다 x.cb B · 전투 분이 x.cs의 배수를 지날 때마다 1 S(blue · super는 모두 고양이 몫)\n    awardMinute(p, { runId, minute }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ gold: 0, cat: 0, blue: 0, super: 0 });\n      if (!Number.isSafeInteger(minute) || minute <= r.m) return dup({ gold: 0, cat: 0, blue: 0, super: 0 });\n      const minutes = minute - r.m,\n        gx = r.x?.gx > 0 ? r.x.gx : 1,\n        cat = minutes * count(r.cg),\n        gold = minuteGold(p.incomeTier, r.mode, minutes, gx, r.cg),\n        cs = count(r.x?.cs),\n        blue = minutes * count(r.x?.cb),\n        sup = cs ? Math.floor(minute / cs) - Math.floor(r.m / cs) : 0;\n      p.gold += gold;\n      p.blue += blue;\n      p.superCoins += sup;\n      r.m = minute;\n      return { ok: true, gold, cat, blue, super: sup };\n    },\n    awardLevel(p, { runId, level }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ blue: 0 });\n      if (!Number.isSafeInteger(level) || level < 1) return fail('invalid');\n      const top = Math.floor(level / ECONOMY.blueEvery) * ECONOMY.blueEvery;\n      if (top <= r.l) return dup({ blue: 0 });\n      const milestones = (top - r.l) / ECONOMY.blueEvery,\n        blue = milestones * ECONOMY.bluePerMilestone[r.mode];\n      p.blue += blue;\n      r.l = top;\n      return { ok: true, blue, milestones };\n    },\n    // 레벨업 코인(R-043): kind 'gold'는 coinChoice G, 'blue'는 coinChoiceBlue B(그 판 모드의 blueCoin이 0보다 클 때만).\n    // 같은 레벨은 종류와 상관없이 한 번만(c 목록).\n    awardCoin(p, { runId, level, kind = 'gold' }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ gold: 0, blue: 0 });\n      if (!Number.isSafeInteger(level) || level < 1) return fail('invalid');\n      if (kind !== 'gold' && kind !== 'blue') return fail('invalid');\n      if (kind === 'blue' && !(B.modes[r.mode].blueCoin > 0)) return fail('invalid');\n      if (r.c.includes(level)) return dup({ gold: 0, blue: 0 });\n      r.c.push(level);\n      if (kind === 'blue') {\n        p.blue += ECONOMY.coinChoiceBlue;\n        return { ok: true, blue: ECONOMY.coinChoiceBlue };\n      }\n      p.gold += ECONOMY.coinChoice;\n      return { ok: true, gold: ECONOMY.coinChoice };\n    },\n    // 보스 처치 G + B(R-002 · R-079): 보스 번호로 한 번만, 모드별 G와 B.bCoin.boss를 함께 지급한다.\n    awardBoss(p, { runId, bossId }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ gold: 0 });\n      if (!Number.isSafeInteger(bossId) || bossId < 1) return fail('invalid');\n      if (r.b.includes(bossId)) return dup({ gold: 0 });\n      r.b.push(bossId);\n      if (r.b.length > 400) r.b.splice(0, r.b.length - 400);\n      const gold = B.modes[r.mode].bossGold;\n      p.gold += gold;\n      p.blue += B.bCoin.boss;\n      return { ok: true, gold };\n    },\n    // Insane S 코인(R-023): superCoin.mode 판에서 판 안 S 코인 번호로 한 번만 1 S.\n    awardBlueCoin(p, { runId, coinId }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ blue: 0 });\n      if (!Number.isSafeInteger(coinId) || coinId < 1) return fail('invalid');\n      if (!(B.modes[r.mode].blueCoin > 0)) return fail('invalid');\n      if (r.bc.includes(coinId)) return dup({ blue: 0 });\n      r.bc.push(coinId);\n      if (r.bc.length > 400) r.bc.splice(0, r.bc.length - 400);\n      p.blue += B.bCoin.value;\n      return { ok: true, blue: B.bCoin.value };\n    },\n    awardPointBonus(p, { runId, score }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ gold: 0, blue: 0, super: 0 });\n      if (!Number.isSafeInteger(score) || score < 0) return fail('invalid');\n      if (r.pb) return dup({ ...r.pb });\n      const reward = pointBonus(score);\n      r.pb = { ...reward };\n      p.gold += reward.gold;\n      p.blue += reward.blue;\n      p.superCoins += reward.super;\n      return { ok: true, ...reward };\n    },\n    awardSuper(p, { runId, coinId }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (isWorldRun(r)) return dup({ super: 0 });\n      if (!Number.isSafeInteger(coinId) || coinId < 1) return fail('invalid');\n      if (r.mode !== B.superCoin.mode) return fail('invalid');\n      if (r.s.includes(coinId)) return dup({ super: 0 });\n      r.s.push(coinId);\n      if (r.s.length > 400) r.s.splice(0, r.s.length - 400);\n      p.superCoins += 1;\n      return { ok: true, super: 1 };\n    },\n    // 최종전 승리 표식(R-297): 격파 순간 runs[runId].x.f = 1(한 번). 화면은 바로 체크포인트를 'retired'로 쓴다\n    finalRun(p, { runId }) {\n      const r = p.runs[runId];\n      if (!r) return fail('run_unknown');\n      if (r.x?.f === 1) return dup();\n      r.x = { ...(r.x || {}), f: 1 };\n      return { ok: true };\n    },\n    finishRun(p, { runId }) {\n      if (!p.runs[runId]) return dup();\n      delete p.runs[runId];\n      return { ok: true };\n    },\n    // 앱을 열 때: 오래된 판 보상 기록과 남은 SC 예약을 정리한다.\n    cleanup(p, { now }) {\n      let changed = false;\n      for (const [id, r] of Object.entries(p.runs))\n        if (now - r.t > RUN_STALE_MS) {\n          delete p.runs[id];\n          changed = true;\n        }\n      if (p.scHold) {\n        p.scHold = null;\n        changed = true;\n      }\n      // 옛 첫 Insane 근거도 같은 해금 규칙으로 정리한다.\n      if (!rules.openDoors(p).duplicate) changed = true;\n      // 동반 정리(R-237): 정리 결과가 원 목록과 다르면 바로 저장(원본을 남기면 빠진 고양이가 Lv5 뒤 저절로 돌아온다)\n      const raw = partyRaw(p),\n        party = partyOf(p),\n        partyCut = raw.filter(id => !party.includes(id));\n      if (partyCut.length) {\n        writeParty(p, party);\n        changed = true;\n      }\n      if (!changed) return dup();\n      return partyCut.length ? { ok: true, partyCut } : { ok: true };\n    },\n    // 한 줄 남기기: 기록 r에 한 번만. 글자 · 색 비용은 이 거래에서 다시 계산한다.\n    note(p, { record: r, value, noteColor }) {\n      const q = noteQuote(value, notePer(p), noteColor);\n      if (!q.valid) return { ok: false, reason: 'invalid_note', cost: 0 };\n      if (!r) return { ok: false, reason: 'record_not_found', cost: 0 };\n      if (r.noteConfirmed || r.note) return { ok: false, reason: 'note_confirmed', record: r, cost: 0 };\n      if (p.gold < q.cost) return { ok: false, reason: 'insufficient', cost: 0 };\n      p.gold -= q.cost;\n      r.note = q.text;\n      r.noteConfirmed = true;\n      r.noteCost = q.cost;\n      if (q.noteColor) r.noteColor = q.noteColor;\n      else delete r.noteColor;\n      return { ok: true, record: r, cost: q.cost };\n    },\n    // 솔로 Insane 첫 플레이: 전투도색·월드 연습(hangar), 꾸미기, 승무원(hidden), 월드를 함께 연다.\n    // 기존에 열린 문과 구매는 조건과 무관하게 보존한다.\n    openDoors(p) {\n      const opened = [];\n      if (!insanePlayed(p)) return dup({ opened });\n      const unlocked = !p.hidden;\n      p.hidden = true;\n      if (!p.opened.includes('hangar')) opened.push('hangar');\n      if (COS.length && !p.opened.includes('cos')) opened.push('cos');\n      if (WB && !p.opened.includes('world')) opened.push('world');\n      if (!opened.length && !unlocked) return dup({ opened });\n      p.opened.push(...opened);\n      return { ok: true, opened, ...(unlocked ? { unlocked: true } : {}) };\n    },\n    // 이정표(R-114): 프로필 쓰기 한 길(ProfileStore.mutate)을 감싼다. 규칙이 ok면 같은 트랜잭션에서 mileCheck →\n    // 새 이정표가 있으면 결과에 mile: [id]를 붙이고 쓰기(규칙이 dup이어도). ok가 아니면 그대로\n    withMile(change, now) {\n      return (p, r, raw) => {\n        const out = change(p, r, raw);\n        if (!out?.ok) return out;\n        const m = mileCheck(p, { now });\n        return m.duplicate ? out : { ...out, mile: m.ids, duplicate: false };\n      };\n    },\n    // 칭호: 배열 = 복수 선택, 단일 id = 한 개 선택, null = 모두 벗기. 저장 순서는 칭호 정본 순서.\n    setTitle(p, { id }) {\n      const want = id === null || id === undefined ? [] : Array.isArray(id) ? id : [id];\n      if (want.some(value => !TITLE_IDS.includes(value))) return fail('invalid');\n      const owned = titlesOf(p);\n      if (want.some(value => !owned.includes(value))) return fail('locked');\n      if (!isObj(p.cos)) p.cos = { wear: {} };\n      if (!isObj(p.cos.wear)) p.cos.wear = {};\n      const next = TITLE_IDS.filter(value => want.includes(value)),\n        before = Array.isArray(p.cos.titles) ? p.cos.titles : p.cos.wear.title ? [p.cos.wear.title] : [];\n      if (JSON.stringify(before) === JSON.stringify(next)) return dup();\n      p.cos.titles = next;\n      if (next.length) p.cos.wear.title = next[0];\n      else delete p.cos.wear.title;\n      return { ok: true };\n    },\n    buyIncome(p, { txId, expectedTier }) {\n      if (!validId(txId)) return fail('invalid');\n      if (p.tx.includes(txId)) return dup();\n      if (p.incomeTier !== expectedTier) return fail('stale');\n      if (p.incomeTier >= ECONOMY.incomeMax) return fail('max');\n      if (p.gold < ECONOMY.incomePrice) return fail('insufficient');\n      p.gold -= ECONOMY.incomePrice;\n      p.incomeTier++;\n      remember(p, txId);\n      return { ok: true, price: ECONOMY.incomePrice, opened: rules.openDoors(p).opened };\n    },\n    // 출격 단계 해금(R-161 · R-240): 값 = launchTier(kind).open S(예약된 S는 쓰지 않음) → opened에 kind\n    buySS(p, { txId, now }) {\n      return buyTier(p, 'ss', { txId, now });\n    },\n    // SSS는 SS를 연 뒤만(needs_ss)\n    buySSS(p, { txId, now }) {\n      return buyTier(p, 'sss', { txId, now, needs: 'ss' });\n    },\n    buyPerma(p, { txId, skill, expectedOwned, now }) {\n      if (!validId(txId) || !SKILLS.includes(skill)) return fail('invalid');\n      if (p.tx.includes(txId)) return dup();\n      const owned = p.perma[skill] || 0;\n      if (owned !== expectedOwned) return fail('stale');\n      const price = permaPrice(skill, owned);\n      if (price === null) return fail('max');\n      const sc      return { ok: true, price: ECONOMY.autoPrice, opened: rules.openDoors(p).opened };\n    },\n    // 자동 G 습득(R-025): 자동 강화를 먼저 사야 하고 한 번만 산다. 켜기/끄기는 브라우저 설정이라 여기 없다.\n    buyAutoGold(p, { txId }) {\n      if (!validId(txId)) return fail('invalid');\n      if (p.tx.includes(txId) || p.ownedAutoGold) return dup();\n      if (!p.ownedAuto) return fail('needs_auto');\n      const price = ECONOMY.autoGoldPrice;\n      if (p.gold < price) return fail('insufficient');\n      p.gold -= price;\n      p.ownedAutoGold = true;\n      remember(p, txId);\n      return { ok: true, price, opened: rules.openDoors(p).opened };\n    },\n    // 고양이 해금(R-026, Lv0 → Lv1): S만 낸다. 예약된 S는 쓰지 않는다.\n    unlockCat(p, { txId, cat, now }) {\n      if (!validId(txId) || !CATS.includes(cat)) return fail('invalid');\n      if (p.tx.includes(txId)) return dup();\n      if (!p.hidden) return fail('hidden_locked');\n      if (p.cats[cat] !== 0) return fail('stale');\n      const s = B.cats.unlock[cat],\n        short = scShort(p, now, s);\n      if (short) return fail(short);\n      // 동반 목록은 Lv1로 올리기 전에 정리한 것(옛 x.party에 남은 이 고양이가 해금되며 저절로 1칸을 바꾸지 않게 늘 다시 쓴다).\n      // 새로 해금한 고양이는 1칸(Lv5 아닌 동반)이 비어 있을 때만 동반 켜짐(R-111 · R-237)\n      const party = partyOf(p);\n      p.superCoins -= s;\n      p.cats[cat] = 1;\n      writeParty(\n        p,\n        party.every(id => catTop(p, id)) ? CATS.filter(id => id === cat || party.includes(id)) : party,\n      );\n      remember(p, txId);\n      return { ok: true, price: { s }, level: 1 };\n    },\n    // 고양이 육성(R-026, Lv n → n+1): S와 B를 함께 낸다. 하나라도 모자라면 아무것도 바꾸지 않는다.\n    levelCat(p, { txId, cat, expectedLevel, now }) {\n      if (!validId(txId) || !CATS.includes(cat)) return fail('invalid');\n      if (p.tx.includes(txId)) return dup();\n      if (!p.hidden) return fail('hidden_locked');\n      if (p.cats[cat] !== expectedLevel) return fail('stale');\n      if (expectedLevel < 1) return fail('locked');\n      if (expectedLevel >= B.cats.maxLevel) return fail('
