// 지금 바꾼 값이 저장한 시나리오 어디에도 없으면 버리기 전에 묻는다
function confirmReplace() {
  if (running) {
    toast(W.progress(state.simResults.runs.length, state.simResults.total));
    return false;
  }
  const n = changeList().length;
  if (!n) return true;
  const k = keyOf(Lab.makeScenario({ changes: state.changes }, base, {}).changes);
  if (store.saved.some(j => parsedSaved(j).ok && keyOf(parsedSaved(j).scenario.changes) === k)) return true;
  return confirm(L.save.replaceConfirm(n));
}
function openParsed(r) {
  state.notices = [];
  applyScenario(r.scenario);
  state.name = r.scenario.name;
  const list = a => a.map(p => L.label(p) + ' (' + p + ')').join(', ');
  if (r.drift.length)
    state.notices.push(
      L.save.drift(r.drift.map(d => L.label(d.path) + ' ' + raw(d.saved) + ' → ' + raw(d.now)).join(', ')),
    );
  if (r.missing.length) state.notices.push(L.save.missing(list(r.missing)));
  if (r.rejected.length) state.notices.push(L.save.rejected(list(r.rejected.map(x => x.path))));
  changed();
  toast(L.save.opened(r.scenario.name));
}
function fileName(name) {
  const d = new Date(),
    p = n => String(n).padStart(2, '0'),
    safe = String(name || 'lab')
      .replace(/[\\/:*?"<>|\s]+/g, '-')
      .slice(0, 40);
  return (
    'neon-lab-' +
    safe +
    '-' +
    d.getFullYear() +
    p(d.getMonth() + 1) +
    p(d.getDate()) +
    '-' +
    p(d.getHours()) +
    p(d.getMinutes()) +
    '.json'
  );
}
function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('tab-save').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act,
    i = Number(b.dataset.i);
  if (act === 'builtin') {
    const bi = Lab.BUILTIN.find(x => x.id === b.dataset.id);
    if (!bi || !confirmReplace()) return;
    state.changes = { ...bi.changes };
    state.sim = cleanSim(bi.sim);
    state.simResults = null;
    state.name = (L.save.builtins[bi.id] || {}).name || bi.id;
    state.notices = [];
    changed();
    toast(L.save.opened(state.name) + ' · ' + L.changed(changeList().length));
  } else if (act === 'store') {
    state.name = ($('s-name').value || '').trim().slice(0, 60);
    const json = Lab.toJSON(scenarioNow(state.name));
    store.saved.unshift(json);
    store.saved = store.saved.slice(0, 50);
    writeStore();
    toast(storeOK ? L.save.saved(parsedSaved(json).scenario.name) : L.save.storageFail);
    renderSave();
  } else if (act === 'export') {
    state.name = ($('s-name').value || '').trim().slice(0, 60);
    download(fileName(state.name), Lab.toJSON(scenarioNow(state.name)));
  } else if (act === 'open') {
    const r = parsedSaved(store.saved[i] || '');
    if (!r.ok) return toast(L.save.badFile);
    if (confirmReplace()) openParsed(r);
  } else if (act === 'file') {
    const r = parsedSaved(store.saved[i] || '');
    if (r.ok) download(fileName(r.scenario.name), store.saved[i]);
  } else if (act === 'remove') {
    const r = parsedSaved(store.saved[i] || '');
    if (!confirm(L.save.removeConfirm(r.ok ? r.scenario.name : '?'))) return;
    store.saved.splice(i, 1);
    writeStore();
    renderSave();
  } else if (act === 'paste') {
    // 에이전트가 대화로 준 시나리오 글(JSON)을 붙여 넣어 연다
    const r = Lab.parseScenario($('s-paste').value || '', base);
    if (!r.ok) return toast(L.save.badFile);
    if (!confirmReplace()) return;
    store.saved.unshift(Lab.toJSON(r.scenario));
    store.saved = store.saved.slice(0, 50);
    writeStore();
    openParsed(r);
  } else if (act === 'copy') copyText();
});

    ok = false;
  }
  toast(ok ? L.save.copied : L.save.copyFail);
}

function costChanges() {
  const list = changeList().filter(c => Lab.impacts(c.path).includes('economy'));
  if (!list.length) return '';
  return (
    '<details class="card"><summary>' +
    esc(W.cost) +
    '</summary><p class="note">' +
    esc(W.costNote) +
    '</p><ul class="change-list">' +
    list
      .map(
        c => '<li>' + esc(L.label(c.path)) + ' <b>' + esc(raw(c.from)) + ' → ' + esc(raw(c.to)) + '</b></li>',
      )
      .join('') +
    '</ul></details>'
  );
}
function exportText() {
  const list = changeList(),
    v = simView(),
    out = [
      L.text.head(state.name || Lab.makeScenario({}, base, {}).name),
      L.text.meta(VERSION, base.name, dateText(Date.now())),
    ];
  out.push(
    W.validation +
      ': ' +
      (running ? W.partial : v ? (v.partial ? W.partial : v.fresh ? W.fresh : W.stale) : W.pending),
  );
  if (!phaseValid()) out.push(W.phaseOrder);
  out.push(list.length ? L.text.changes(list.length) : L.text.none);
  for (const c of list)
    out.push('- ' + c.path + ' (' + L.label(c.path) + '): ' + raw(c.from) + ' → ' + raw(c.to));
  if (v) {
    out.push('', W.results + ': ' + condText(v.s), W.laserN + ': ' + JSON.stringify(v.s.laser?.n || {}));
    out.push(...resultLines(v.r), ...analysisText(v.r));
    if (v.r.errors?.length) out.push(...v.r.errors);
  }
  return out.join('\n');
}
$('sub').textContent = L.sub(VERSION, base.name);
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) setTab(b.dataset.tab);
});
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  const i = TABS.indexOf(state.tab),
    n =
      e.key === 'Home'
        ? 0
        : e.key === 'End'
          ? TABS.length - 1
          : (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
  setTab(TABS[n]);
  document.querySelector('[data-tab="' + TABS[n] + '"]').focus();
});
$('changed').addEventListener('click', () => {
  state.onlyChanged = true;
  state.search = '';
  $('v-search').value = '';
  state.chips.clear();
  renderChips();
  setTab('values');
});
renderChips();
syncChip();
renderSummary();
setTab(state.tab);

      })();
    </script>
  </body>
