<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070b13" />
    <title>밸런스 실험실 · NEON ARENA</title>
    <style>
      /* NEON ARENA v4 디자인 토큰과 기본 규칙. 근거: docs/history/UI_RESEARCH.md
   글자는 rem(사용자 글자 크기 설정을 따름), 간격·터치 영역은 px로 고정한다. */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #070b13;
  --bg-raise: #0b1420;
  --surface: #0f1b29;
  --surface-2: #142538;
  --surface-3: #1a3048;
  --line: #20364a;
  --line-strong: #2e4c66;

  /* 글자 (배경 #070b13 기준 대비: ink 17:1, ink-2 11:1, muted 7:1) */
  --ink: #ebf3f6;
  --ink-2: #b9c9d4;
  --muted: #8aa0ae;

  /* 강조 */
  --cyan: #50f3d6;
  --cyan-deep: #0f3a37;
  --gold: #f4ce72;
  --gold-deep: #3a2d12;
  --blue: #68b9ff;
  --blue-deep: #12304d;
  --violet: #c4a3ff;
  --violet-deep: #2b1f48;
  --pink: #ff4e8e;
  --danger: #ff5f6d;
  --orange: #ff9a4d;

  /* 재화 */
  --c-gold: var(--gold);
  --c-blue: var(--blue);
  --c-sc: var(--violet);

  /* 색은 모두 이 파일 한 곳(팔레트, R-054). 다른 파일은 이름(var(--…))으로만 쓴다.
     같은 값이 이미 있으면 그 토큰을 가리킨다. 캔버스 · 그래프는 처음 한 번 읽어 풀린 값을 쓴다 */

  /* 낱색: 한두 곳에서만 쓰는 색(이름은 쓰임새) */
  --white: #ffffff;
  --black: #000000;
  --lilac: #b895ff;
  --on-cyan: #04201c;
  --on-danger: #1a0508;
  --blue-ink: #cfe7ff;
  --violet-ink: #e9ddff;
  --danger-ink: #ffd0d5;
  --danger-deep: #3a1219;
  --logo-ink: #e9fffb;
  --title-top: #18153f;
  --title-mid: #100d2a;
  --title-bottom: #0a0918;
  --title-glow: #7a5cff;
  --grid-line: #16313d;
  --area-line: #24394b;
  --area-bg: #08101a;
  --area-label: #8fb3c4;
  --s-tab-ink: #b9a3e8;
  --gold-tint: #2a2412;
  --cyan-tint: #10302d;
  --danger-tint: #2a1218;
  --soon-line: #2a3d50;
  --soon-bg: #0b121c;
  --scrim: #03060b;
  --overlay-bg: #04070c;
  --stage-bg: #1d170a;
  --bar-bg: #1b2a38;
  --action-bg: #0a1520;
  --vignette: #050810;
  --shine: #ffd36a;
  --shine-core: #fff6d8;
  --debug-mark: #ffe45c;
  --warn: var(--danger);

  /* 스킬(terms.js skills의 color → 카드 · HUD 스킬 줄 --c) */
  --sk-power: var(--cyan);
  --sk-rapid: var(--cyan);
  --sk-multi: var(--gold);
  --sk-pierce: #af9bff;
  --sk-speed: var(--cyan);
  --sk-magnet: var(--gold);
  --sk-orbit: var(--sk-pierce);
  --sk-vital: #8ce8a2;
  --sk-nova: var(--sk-pierce);
  --sk-crit: var(--gold);
  --sk-shield: #50b6ff;

  /* 회복(R-061 회복 구역 · R-062 HP 회복 버프 · 버프 표시): 장갑 강화와 같은 초록 계열(전장에 없는 색) */
  --heal: var(--sk-vital);
  /* GM 실험 칸 표시(R-065, 시험 경로에만) */
  --gm: var(--pink);

  /* 모드 배지(badges.js, 모양은 그 파일): 색 · 판 위(tone) · 판 아래(tone2) · 글자 */
  --mode-easy: #52ead1;
  --mode-easy-tone: #123033;
  --mode-easy-tone2: #0a1d20;
  --mode-easy-text: #d2fff6;
  --mode-hard: #f2c768;
  --mode-hard-tone: #3d3019;
  --mode-hard-tone2: #231b0e;
  --mode-hard-text: #fff0c8;
  --mode-extream: var(--blue);
  --mode-extream-tone: #173351;
  --mode-extream-tone2: #0d1f33;
  --mode-extream-text: #dbeeff;
  --mode-super: #b996ff;
  --mode-super-tone: #30224c;
  --mode-super-tone2: #1b1330;
  --mode-super-text: #efe6ff;
  --mode-ultra: #ffd98a;
  --mode-ultra-tone: #4c3a19;
  --mode-ultra-tone2: #2b200d;
  --mode-ultra-text: #fff5dc;
  --mode-insane: #ff5a7a;
  --mode-insane-tone: #4d1728;
  --mode-insane-tone2: #2a0b16;
  --mode-insane-text: #ffe3ea;

  /* 전장(renderer.js가 처음 한 번 읽는다. 캔버스용이라 #rrggbb나 그 값을 가리키는 var()만, 빠지면 자홍) */
  --cv-base-bg: #070c16;
  --cv-base-grid: var(--grid-line);
  --cv-base-border: #386b76;
  --cv-super-bg: #0c0a18;
  --cv-super-grid: #252039;
  --cv-super-border: #514369;
  --cv-ultra-bg: #120f0a;
  --cv-ultra-grid: #302a1b;
  --cv-ultra-border: #625538;
  --cv-insane-bg: #150b12;
  --cv-insane-grid: #33202d;
  --cv-insane-border: #6c3e52;
  --cv-craft-fill: #123b40;
  --cv-craft-line: #97ffe9;
  --cv-craft-core: #f1fffb;
  --cv-craft-2d: var(--cyan);
  --cv-glow: var(--cyan);
  --cv-chaser: var(--pink);
  --cv-runner: #ffad66;
  --cv-shooter: var(--lilac);
  --cv-splitter: var(--pink);
  --cv-boss: #ffca74;
  --cv-boss-2: var(--orange);
  --cv-boss-3: var(--danger);
  --cv-boss-inner: #ffd68b;
  --cv-boss-tell: var(--gold);
  --cv-enemy-fill: #301a2b;
  --cv-shooter-fill: #251c38;
  --cv-boss-fill: #362a23;
  --cv-gem: #ffde85;
  --cv-gem-2d: var(--gold);
  --cv-shot: #a1ffec;
  --cv-shot-tint: #8affea;
  --cv-crit-tint: #ffdb8a;
  --cv-shot-2d: #9fffe7;
  --cv-hostile-red: #ff4d5e;
  --cv-hostile-orange: #ff7a45;
  --cv-hostile-edge: #2a0b0b;
  --cv-hostile-core: #ffe0c8;
  --cv-blade: var(--cyan);
  --cv-blade-core: #f4fffd;
  --cv-spark: var(--white);
  --cv-hurt: var(--pink);
  --cv-dash: var(--cyan);
  --cv-nova: var(--lilac);
  --cv-hazard: var(--lilac);
  --cv-hazard-fuse: #d8bdff;
  --cv-shield: #65baff;
  --cv-shield-max: #9fdcff;
  --cv-number: var(--gold);
  --cv-scoin: var(--violet);
  --cv-scoin-fill: var(--violet-deep);
  --cv-scoin-ink: #eee2ff;
  --cv-heal: var(--heal);
  --cv-revive: var(--gold);

  /* 분석 페이지(analysis.html, 그래프 색은 페이지를 열 때 읽는다) */
  --an-bg: #090f18;
  --an-ink: #dcebf1;
  --an-text: #8fa9b9;
  --an-on-cyan: #0c2520;
  --an-line: #2b414d;
  --an-card: #10202b;
  --an-label: #83a0b1;
  --an-chart-line: #253c48;
  --an-chart-bg: #0e1a25;
  --an-status-bg: #11252a;
  --an-status-ink: #b4cdd4;
  --an-empty-ink: #91a8b7;
  --an-notes-line: #2c414d;
  --an-notes-ink: #9fb8c6;
  --an-version: #667e8b;
  --an-plot-title: #bfd8e1;
  --an-plot-ink: #87a5b5;
  --an-plot-note: #86a2b0;
  --an-plot-grid: #233a46;
  --an-shield: #7dafff;
  --an-damage: #ff6e9d;
  --an-fps: #79b9ff;

  /* 글꼴 */
  --font: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;

  /* 간격·모서리 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

  /* 터치 영역 */
  --tap: 44px;
  --tap-lg: 48px;
  --action-h: 56px;
  --action-w: 72px;

  /* 층 */
  --z-hud: 10;
  --z-overlay: 20;
  --z-menu: 30;
  --z-sheet: 40;
  --z-dialog: 50;

  /* 움직임 */
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* 안전 영역 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  /* 화면 위 · 아래 끝 여백(R-047): 위는 로고 글씨 높이의 70%(편집장 +20%, 앞 카메라 구멍), 아래는 50%.
     모든 화면(메뉴 · 준비 · 전투 HUD · 창 · 시트)이 쓴다. 가로 화면은 0(ui.css) */
  --edge-top: calc(var(--fs-lg) * 0.7);
  --edge-bottom: calc(var(--fs-lg) * 0.5);

  /* 화면 높이: 주소창이 펼쳐진 작은 높이 기준 */
  --vh-full: 100vh;
}
@supports (height: 100svh) {
  :root {
    --vh-full: 100svh;
  }
}
/* 세로 전체 화면(설정 '전체 화면'): 삼성 인터넷은 앞 카메라 자리를 화면 밖 흰 띠로 비워 두지만, 바로 아래는
   로고 줄이 카메라에 너무 붙어 보인다. 위 안전 영역을 최소 9px 둔다(R-053, 편집장: 0은 너무 가깝고 28px는 너무 멂 → 30% → 1px 더) */
@media (orientation: portrait) {
  :root:fullscreen {
    --safe-t: max(env(safe-area-inset-top, 0px), 9px);
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button,
input,
select,
output {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
}
button:focus-visible,
canvas:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
h1,
h2,
h3,
p,
ol,
ul {
  margin: 0;
  padding: 0;
}
ol,
ul {
  list-style: none;
}
[hidden] {
  display: none !important;
}
.num {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.muted {
  color: var(--muted);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 모드 배지 (src/badges.js). 상자 크기에 장식까지 포함해 이웃 요소와 겹치지 않는다. */
.nb {
  display: inline-block;
  flex: none;
  line-height: 0;
  vertical-align: middle;
}
.nb--full {
  width: var(--nb-w, 112px);
  aspect-ratio: 140 / 56;
}
.nb--compact {
  width: var(--nb-cw, 70px);
  aspect-ratio: 78 / 22;
}
.nb svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.nb text {
  font-family: var(--font);
}
.nb-shine {
  transform-box: fill-box;
  animation: nb-shine 3.6s var(--ease) infinite;
}
.nb--insane .nb-aura {
  animation: nb-pulse 2.4s ease-in-out infinite;
}
.nb-spark {
  transform-box: fill-box;
  transform-origin: center;
  animation: nb-twinkle 2.8s ease-in-out infinite;
}
.nb-spark:nth-of-type(2n) {
  animation-delay: 1.3s;
}
/* Insane(R-032): Ultra보다 별빛이 많고 반짝임은 opacity만(별마다 지연이 다르다) */
.nb--insane .nb-spark {
  animation: nb-glint 2.4s ease-in-out infinite;
}
@keyframes nb-shine {
  0%,
  55% {
    transform: skewX(-18deg) translateX(0);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  90%,
  100% {
    transform: skewX(-18deg) translateX(560%);
    opacity: 0;
  }
}
@keyframes nb-pulse {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-glint {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-twinkle {
  0%,
  100% {
    opacity: 0.25;
    transform: scale(0.7);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}
.nb-static .nb-shine,
.nb-static .nb-aura,
.nb-static .nb-spark {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .nb-shine,
  .nb-aura,
  .nb-spark {
    animation: none !important;
  }
}
/* 게임 설정 '흔들림 · 번쩍임 줄이기'도 같다(R-056, app.js가 body[data-fx]를 정한다) */
body[data-fx='low'] .nb-shine,
body[data-fx='low'] .nb-aura,
body[data-fx='low'] .nb-spark {
  animation: none !important;
}

    </style>
    <style>
      /* 밸런스 실험실(R-037): 폰 세로 기준. 게임 토큰을 쓰고, 게임과 달리 페이지가 세로로 스크롤한다. */
      :root {
        --now: var(--cyan);
        --exp: var(--violet);
        --good: var(--sk-vital); /* 플레이어에게 유리(쉬워짐 · 보상 늘어남) */
        --bad: var(--danger); /* 불리(어려워짐 · 보상 줄어듦) */
        --real: var(--ink-2); /* 이 기기 기록(점선) */
        --gutter: 16px;
      }
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: visible;
      }
      body {
        font-size: var(--fs-md);
        line-height: 1.5;
        padding-bottom: calc(48px + var(--safe-b));
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(7, 11, 19, 0.97);
        border-bottom: 1px solid var(--line);
        padding: calc(10px + var(--safe-t)) calc(var(--gutter) + var(--safe-r)) 0
          calc(var(--gutter) + var(--safe-l));
      }
      .top-in,
      .tabs {
        max-width: 760px;
        margin: 0 auto;
      }
      .top-in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .top h1 {
        font-size: var(--fs-lg);
        line-height: 1.25;
      }
      .top .sub {
        display: block;
        font-size: var(--fs-2xs);
        color: var(--muted);
      }
      #changed {
        flex: none;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: var(--ink-2);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      #changed.on {
        border-color: var(--exp);
        color: var(--exp);
        background: var(--violet-deep);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        margin-top: 6px;
      }
      .tab {
        min-height: 44px;
        font-size: var(--fs-sm);
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab[aria-selected='true'] {
        color: var(--cyan);
        border-bottom-color: var(--cyan);
        font-weight: 700;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 14px calc(var(--gutter) + var(--safe-r)) 0 calc(var(--gutter) + var(--safe-l));
      }
      main > section > * + * {
        margin-top: 12px;
      }
      h2 {
        font-size: var(--fs-md);
      }
      h3 {
        font-size: var(--fs-sm);
      }
      .note {
        font-size: var(--fs-xs);
        color: var(--muted);
      }
      .warn {
        font-size: var(--fs-xs);
        color: var(--gold);
        background: var(--gold-deep);
        border-radius: var(--r-sm);
        padding: 8px 10px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 12px;
      }
      .card > * + * {
        margin-top: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--surface-2);
        color: var(--ink);
        font-size: var(--fs-sm);
        cursor: pointer;
      }
      .btn.primary {
        border-color: var(--cyan);
        background: var(--cyan-deep);
        color: var(--cyan);
        font-weight: 700;
      }
      .btn.small {
        min-height: 34px;
        padding: 0 10px;
        font-size: var(--fs-xs);
      }
      .btn:disabled {
        opacity: 0.45;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .field-label {
        display: block;
        font-size: var(--fs-xs);
        color: var(--ink-2);
        margin-bottom: 4px;
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .seg button {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--bg-raise);
        color: var(--ink-2);
        font-size: var(--fs-sm);
      }
      .seg button[aria-pressed='true'] {
        border-color: var(--cyan);
        background: var(--cyan-deep);
        color: var(--cyan);
        font-weight: 600;
      }
      .seg button:disabled {
        opacity: 0.5;
      }
      input.num,
      input.text {
        width: 100%;
        min-width: 0;
        height: 40px;
        padding: 0 8px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--bg-raise);
        color: var(--ink);
        font-size: var(--fs-sm);
      }
      input.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .num-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2) var(--sp-4);
        margin-top: var(--sp-2);
      }
      .num-field {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-2);
        font-size: var(--fs-sm);
        color: var(--ink-2);
      }
      .num-field input {
        width: 76px;
      }
      input:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      input.num.bad {
        border-color: var(--danger);
      }
      .tog {
        width: 100%;
        height: 40px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--bg-raise);
        color: var(--ink-2);
        font-size: var(--fs-sm);
      }
      .changed input.num,
      .changed .tog {
        border-color: var(--exp);
        background: var(--violet-deep);
        color: #fff;
      }
      .was {
        display: none;
        width: 100%;
        min-height: 24px;
        padding: 2px 0;
        font-size: var(--fs-2xs);
        color: var(--exp);
        text-align: right;
      }
      .changed .was {
        display: block;
      }
      .hide {
        display: none !important;
      }
      /* 값 탭 */
      .v-tools {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      /* 찾기 칩(R-069): 영향 칩 4개(여럿 고르면 그중 하나라도) + '바꾼 값만'(그리고) */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--bg-raise);
        color: var(--ink-2);
        font-size: var(--fs-sm);
      }
      .chip[aria-pressed='true'] {
        font-weight: 700;
      }
      .chip.t-difficulty[aria-pressed='true'] {
        border-color: var(--blue);
        color: var(--blue);
        background: var(--blue-deep);
      }
      .chip.t-economy[aria-pressed='true'] {
        border-color: var(--gold);
        color: var(--gold);
        background: var(--gold-deep);
      }
      .chip.t-point[aria-pressed='true'] {
        border-color: var(--cyan);
        color: var(--cyan);
        background: var(--cyan-deep);
      }
      .chip.t-unlock[aria-pressed='true'],
      .chip.only[aria-pressed='true'] {
        border-color: var(--violet);
        color: var(--exp);
        background: var(--violet-deep);
      }
      .group {
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        background: var(--surface);
      }
      .group + .group {
        margin-top: 8px;
      }
      .group > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 12px;
        font-size: var(--fs-sm);
        font-weight: 700;
        cursor: pointer;
        list-style: none;
      }
      .group > summary::-webkit-details-marker {
        display: none;
      }
      .group > summary::after {
        content: '▾';
        color: var(--muted);
      }
      .group[open] > summary::after {
        content: '▴';
      }
      .g-count {
        margin-left: auto;
        color: var(--exp);
        font-size: var(--fs-xs);
        font-weight: 600;
      }
      .g-body {
        padding: 0 12px 12px;
      }
      .v-row {
        display: grid;
        grid-template-columns: 1fr 104px;
        gap: 8px;
        align-items: start;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .v-name b {
        display: block;
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      .v-name small {
        display: block;
        font-size: var(--fs-2xs);
        color: var(--muted);
        word-break: break-all;
      }
      .tag {
        display: inline-block;
        margin-left: 4px;
        padding: 0 5px;
        border-radius: 4px;
        font-size: var(--fs-2xs);
        font-weight: 600;
        vertical-align: 1px;
      }
      /* 영향 태그 4가지(R-068): 값 탭 줄 · 요약 칸이 같은 색 */
      .tag.t-difficulty {
        color: var(--blue);
        background: var(--blue-deep);
      }
      .tag.t-economy {
        color: var(--gold);
        background: var(--gold-deep);
      }
      .tag.t-point {
        color: var(--cyan);
        background: var(--cyan-deep);
      }
      .tag.t-unlock {
        color: var(--violet);
        background: var(--violet-deep);
      }
      /* 뜻 줄(R-069): 이름을 누르면 '뜻 · 단위 · 방향'. 표는 그 줄 아래 한 줄 */
      [data-desc] {
        cursor: pointer;
      }
      .v-name[data-desc] b::after,
      th[data-desc]::after {
        content: ' ▾';
        color: var(--muted);
        font-weight: 400;
      }
      .v-name[aria-expanded='true'] b::after,
      th[data-desc][aria-expanded='true']::after {
        content: ' ▴';
      }
      .v-desc {
        grid-column: 1 / -1;
        padding: 6px 8px;
        border-radius: var(--r-sm);
        background: var(--bg-raise);
        font-size: var(--fs-xs);
        color: var(--ink-2);
        line-height: 1.45;
        word-break: keep-all;
      }
      .dir {
        font-weight: 700;
      }
      .dir.hard {
        color: var(--bad);
      }
      .dir.easy,
      .dir.more {
        color: var(--good);
      }
      .dir.cost,
      .dir.less {
        color: var(--gold);
      }
      table.matrix tr.desc td {
        padding: 0 0 8px;
      }
      /* 그래프 칩에서 건너온 줄: 1초 보라 테두리 */
      .v-row.flash {
        box-shadow: 0 0 0 2px var(--exp);
        border-radius: var(--r-sm);
      }
      tr.flash > th,
      tr.flash > td {
        background: var(--violet-deep);
      }
      .matrix-wrap {
        overflow-x: auto;
      }
      table.matrix {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      table.matrix th,
      table.matrix td {
        padding: 3px 2px;
        vertical-align: top;
      }
      table.matrix thead th {
        font-size: var(--fs-2xs);
        color: var(--ink-2);
        font-weight: 600;
        text-align: center;
        overflow-wrap: normal;
      }
      table.matrix tbody th {
        text-align: left;
        font-size: var(--fs-xs);
        font-weight: 600;
        padding-top: 10px;
      }
      table.matrix tbody th .tag {
        margin: 2px 0 0;
      }
      table.matrix input.num {
        height: 38px;
        padding: 0 3px;
        text-align: center;
        font-size: var(--fs-xs);
      }
      table.matrix .was {
        text-align: center;
      }
      table.matrix td.none {
        padding-top: 12px;
        text-align: center;
        color: var(--muted);
        font-size: var(--fs-xs);
      }
      /* 그래프 · 숫자 */
      .legend {
        display: flex;
        gap: 14px;
        font-size: var(--fs-xs);
        color: var(--ink-2);
      }
      .legend i {
        display: inline-block;
        width: 18px;
        height: 0;
        margin-right: 5px;
        border-top: 2.5px solid var(--now);
        vertical-align: middle;
      }
      .legend i.exp {
        border-top-style: dashed;
        border-top-color: var(--exp);
      }
      svg.chart {
        display: block;
        width: 100%;
        height: auto;
      }
      svg.chart .grid {
        stroke: var(--line);
        stroke-width: 1;
      }
      svg.chart text {
        fill: var(--muted);
        font-size: 10px;
        font-family: var(--font);
      }
      svg.chart path.now {
        fill: none;
        stroke: var(--now);
        stroke-width: 2.4;
      }
      svg.chart path.exp {
        fill: none;
        stroke: var(--exp);
        stroke-width: 2.4;
        stroke-dasharray: 6 4;
      }
      svg.chart circle.now {
        fill: var(--now);
      }
      svg.chart circle.exp {
        fill: var(--exp);
      }
      table.nums {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: var(--fs-2xs);
        font-variant-numeric: tabular-nums;
      }
      table.nums th,
      table.nums td {
        padding: 3px 1px;
        text-align: right;
        overflow-wrap: anywhere;
      }
      table.nums th:first-child {
        width: 30px;
        text-align: left;
        color: var(--muted);
        font-weight: 600;
      }
      table.nums thead th {
        color: var(--muted);
        font-weight: 600;
      }
      table.nums tr.exp-row td {
        color: var(--exp);
      }
      table.nums tr.exp-row td.same {
        color: var(--muted);
      }
      /* 난이도 탭(R-069): 도구 줄 · 모드 토글 · 식 줄 · 들어간 값 칩 */
      /* 폰 폭(약 352px)에서 축 두 개 + 기체가 한 줄, 모드 6개가 한 줄 */
      .dtools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .dtools .seg {
        gap: 4px;
      }
      .dtools .seg button {
        padding: 0 10px;
        font-size: var(--fs-xs);
      }
      .craftsel {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--fs-xs);
        color: var(--ink-2);
      }
      .craftsel select {
        min-height: 36px;
        padding: 0 4px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--bg-raise);
        color: var(--ink);
        font-size: var(--fs-xs);
      }
      .mdots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      /* 모드 토글: 글자 = 그 모드 선 색(범례 겸용), 숨긴 모드는 흐리게 */
      .mdots button {
        min-height: 32px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: var(--bg-raise);
        font-size: var(--fs-2xs);
        font-weight: 700;
      }
      .mdots button[aria-pressed='false'] {
        opacity: 0.4;
        border-color: var(--line-strong);
        font-weight: 400;
      }
      .formula {
        font-size: var(--fs-xs);
        color: var(--ink-2);
        line-height: 1.45;
        word-break: keep-all;
      }
      .vchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .vchips button {
        min-height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        border: 1px solid var(--line-strong);
        background: var(--surface-2);
        color: var(--cyan);
        font-size: var(--fs-2xs);
      }
      svg.chart path.mline {
        fill: none;
        stroke-width: 1.8;
      }
      svg.chart path.mline.dash {
        stroke-dasharray: 5 3;
      }
      /* 경제 */
      .eco-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 2px 10px;
      }
      .eco-head .sub {
        font-size: var(--fs-2xs);
        color: var(--muted);
      }
      .v-now {
        color: var(--now);
      }
      .v-exp {
        color: var(--exp);
      }
      /* 분당 3칸(R-068): 분당이 주인공, 판당은 아래 한 줄 */
      .pm {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        font-variant-numeric: tabular-nums;
      }
      .pm > div {
        min-width: 0;
        padding: 6px 8px;
        border-radius: var(--r-sm);
        background: var(--bg-raise);
      }
      .pm .k {
        display: block;
        font-size: var(--fs-2xs);
        color: var(--ink-2);
      }
      .pm .big {
        display: block;
        font-size: var(--fs-lg);
        font-weight: 700;
        line-height: 1.2;
      }
      .pm .to {
        display: block;
        font-size: var(--fs-xs);
        color: var(--exp);
        white-space: nowrap;
      }
      .pm .to i {
        font-style: normal;
        font-size: var(--fs-2xs);
      }
      .len {
        font-size: var(--fs-xs);
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        word-break: keep-all;
      }
      .tagsrc {
        display: inline-block;
        margin-left: 4px;
        padding: 0 5px;
        border-radius: 4px;
        font-size: var(--fs-2xs);
        color: var(--muted);
        background: var(--surface-2);
      }
      .eco-sub {
        font-size: var(--fs-xs);
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }
      table.grid2 {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
      }
      table.grid2 th,
      table.grid2 td {
        padding: 5px 4px;
        border-top: 1px solid var(--line);
        text-align: right;
      }
      table.grid2 th:first-child,
      table.grid2 td:first-child {
        text-align: left;
        color: var(--ink-2);
        font-weight: 400;
      }
      table.grid2 thead th {
        border-top: 0;
        color: var(--muted);
        font-weight: 600;
      }
      table.grid2 tr.total td {
        font-weight: 700;
      }
      .cond {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      details.method summary {
        display: flex;
        align-items: center;
        min-height: 40px;
        font-size: var(--fs-xs);
        color: var(--ink-2);
        cursor: pointer;
      }
      details.method ul {
        padding-left: 18px;
        font-size: var(--fs-2xs);
        color: var(--muted);
      }
      details.method li + li {
        margin-top: 4px;
      }
      /* 자동 판 */
      .progress {
        height: 8px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--surface-3);
      }
      .progress > div {
        height: 100%;
        width: 0;
        background: var(--cyan);
        transition: width 0.2s linear;
      }
      table.res {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
      }
      table.res th,
      table.res td {
        padding: 5px 2px;
        text-align: right;
        border-top: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      table.res th:first-child,
      table.res td:first-child {
        width: 66px;
        text-align: left;
      }
      table.res thead th {
        border-top: 0;
        font-size: var(--fs-2xs);
        color: var(--muted);
        font-weight: 600;
      }
      table.res td span {
        display: block;
      }
      table.res td .n {
        color: var(--ink-2);
      }
      table.res td .e {
        color: var(--exp);
      }
      table.res tr.avg td {
        font-weight: 700;
      }
      /* 요약 칸(R-068): 모든 탭 맨 위 · 접힘 */
      .sum {
        margin-bottom: 12px;
        padding: 0;
      }
      .sum > * + * {
        margin-top: 0;
      }
      .sum-head {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        text-align: left;
      }
      .sum-head .t {
        font-size: var(--fs-sm);
        font-weight: 700;
        color: var(--ink);
      }
      .sum-head .tg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        min-width: 0;
      }
      .sum-head .tag {
        margin: 0;
      }
      .sum-head .w {
        margin-left: auto;
        flex: none;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: var(--fs-2xs);
        font-weight: 700;
        color: var(--gold);
        background: var(--gold-deep);
      }
      .sum-head .caret {
        flex: none;
        margin-left: auto;
        color: var(--muted);
      }
      .sum-head .w + .caret {
        margin-left: 0;
      }
      .sum-body {
        padding: 0 12px 12px;
      }
      .sum-body > * + * {
        margin-top: 8px;
      }
      /* 경고 줄: 옛 결과(빨강) → 해금 · 순위(금) → 힌트(회색) */
      .warns {
        display: grid;
        gap: 6px;
      }
      .warns li {
        list-style: none;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px;
        align-items: start;
        padding: 7px 10px;
        border-radius: var(--r-sm);
        font-size: var(--fs-xs);
        line-height: 1.4;
        color: var(--ink);
        background: var(--gold-deep);
        border-left: 3px solid var(--gold);
        word-break: keep-all;
        cursor: pointer;
      }
      .warns li b {
        color: var(--gold);
      }
      .warns li.danger {
        background: var(--danger-deep);
        border-left-color: var(--danger);
      }
      .warns li.danger b {
        color: var(--danger);
      }
      .warns li.hint {
        background: var(--surface-2);
        border-left-color: var(--line-strong);
        color: var(--ink-2);
      }
      .warns li.hint b {
        color: var(--ink-2);
      }
      /* 영향 표(4줄 × 모드): 변화만 */
      table.imp {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: var(--fs-2xs);
        font-variant-numeric: tabular-nums;
      }
      table.imp col.k {
        width: 44px;
      }
      table.imp th,
      table.imp td {
        padding: 3px 1px;
        text-align: right;
        white-space: nowrap;
      }
      table.imp thead th {
        font-weight: 600;
        overflow: hidden;
        text-overflow: clip;
      }
      table.imp tbody th {
        text-align: left;
        color: var(--ink-2);
        font-weight: 600;
      }
      table.imp tbody tr + tr th,
      table.imp tbody tr + tr td {
        border-top: 1px solid var(--line);
      }
      .good {
        color: var(--good);
        font-weight: 700;
      }
      .bad {
        color: var(--bad);
        font-weight: 700;
      }
      .flat {
        color: var(--muted);
      }
      .est {
        opacity: 0.75;
        font-style: italic;
      }
      .src {
        font-size: var(--fs-2xs);
        color: var(--muted);
        line-height: 1.45;
        word-break: keep-all;
      }
      /* 자동 판: 돌리기 줄 · 옛 결과 칸 · 모드 비교 한 표 · 생존 곡선 */
      .runbar {
        display: grid;
        gap: 8px;
      }
      .runbar > * + * {
        margin-top: 0;
      }
      .runbar .cond-line {
        font-size: var(--fs-xs);
        color: var(--ink-2);
        line-height: 1.45;
        word-break: keep-all;
      }
      .runbar .btns {
        display: grid;
        grid-template-columns: auto 1fr;
      }
      .stale {
        padding: 10px 12px;
        border-radius: var(--r-md);
        border: 1.5px solid var(--danger);
        background: var(--danger-deep);
        color: var(--ink);
        word-break: keep-all;
      }
      .stale > * + * {
        margin-top: 6px;
      }
      .stale strong {
        display: block;
        font-size: var(--fs-sm);
        color: var(--danger-ink);
      }
      .stale ul {
        padding-left: 16px;
        font-size: var(--fs-xs);
        color: var(--ink-2);
      }
      table.cmp {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.cmp col.m {
        width: 50px;
      }
      table.cmp th,
      table.cmp td {
        padding: 5px 1px;
        text-align: right;
        vertical-align: top;
        white-space: nowrap;
      }
      table.cmp thead th {
        font-size: var(--fs-2xs);
        color: var(--muted);
        font-weight: 600;
        vertical-align: bottom;
      }
      table.cmp tbody th {
        text-align: left;
        font-size: var(--fs-2xs);
        font-weight: 700;
        padding-top: 7px;
      }
      table.cmp tbody th small {
        display: block;
        font-weight: 400;
      }
      table.cmp tbody tr {
        border-top: 1px solid var(--line);
      }
      table.cmp td s,
      table.cmp td b,
      table.cmp td i {
        display: block;
        text-decoration: none;
        font-style: normal;
      }
      table.cmp td s {
        font-size: var(--fs-2xs);
        color: var(--muted);
      }
      table.cmp td b {
        font-size: var(--fs-xs);
        color: var(--exp);
      }
      table.cmp td b.n {
        color: var(--ink);
      }
      table.cmp td i {
        font-size: 0.625rem;
      }
      .surv-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 8px;
      }
      .surv-grid.one {
        grid-template-columns: 1fr;
      }
      .surv h4 {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 0 4px;
        font-size: var(--fs-xs);
      }
      .surv h4 small {
        font-size: 0.625rem;
        color: var(--muted);
        font-weight: 400;
      }
      svg.chart path.real {
        fill: none;
        stroke: var(--real);
        stroke-width: 1.8;
        stroke-dasharray: 1.5 3;

  // 출격 버프(R-062, I-36): 플레이 탭 모드 칸 왼쪽 스위치(위 → 아래 = balance buffs 키 순서). 켜 두면 출격할 때마다 비용

  // 예: modeGroups('blue', ' ', '개') → ['Ultra 이상 2개'], modeGroups('goldBonus', ' +') → ['Extreme · Super +1', 'Ultra 이상 +2']
  const modeGroups = (key, sep, unit = '') => {
    const m = B().modes,
      ids = Object.keys(m),
      groups = [];

        set: text(v('set')),
        craft: text(v('craft')),
        mode: text(v('mode')),
        launch: text(v('launch')),
        seed: num(v('seed')),
        time: t,
        minutes: t / 60,
        reason: text(v('reason')),
        level: num(v('level')),
        stage: num(v('stage')),
        kills: num(v('kills')),
        score: num(v('score')),
        bosses: num(v('bosses')),
        autoPicks: num(v('autoPicks')),
        autoGoldCoins: { capped: num(v('gc')), chance: num(v('gh')) },
        manualCoins: num(v('manualCoins')),
        blueCoins: num(v('blueCoins')),
        sSpawned: num(v('sSpawned')),
      });
    }
    return out;
  }

  // ── 한 판 경제 ──
  // 분 보상은 전투 시계 1분마다(progression.js awardMinute), B는 실제 LV blueEvery마다(startRun + awardLevel).
  // B 코인(R-043): 레벨업 코인 칸이 모드 확률(modes.*.blueCoin)로 B가 된다. 행에 실제 개수(blueCoins)가 있으면
  // 코인 수(manualCoins · autoGoldCoins)는 G만이고, 없으면 손 · 자동 코인의 그 확률만큼을 B로 옮겨 추정한다.
  function economy(balance, row) {
    const r = row || {},
      E = balance.economy,
      mode = modeOf(balance, r.mode),
      M = balance.modes[mode],
      minutes = num(r.minutes),
      w = Math.max(0, Math.floor(minutes)),
      tier = num(r.tier),
      supplyLv = Math.floor(num(r.supplyLv)),
      autoPicks = num(r.autoPicks),
      capShare = num(r.capShare),
      realBlue = typeof r.blueCoins === 'number' && Number.isFinite(r.blueCoins),
      share = realBlue ? 0 : clamp(num(M.blueCoin), 0, 1),
      keep = 1 - share,
      manualCoins = num(r.manualCoins);
    const gold = {
      minute: w * (Math.min(E.goldMax, E.goldBase + Math.min(E.incomeMax, tier)) + M.goldBonus),
      cat: w * (supplyLv >= 1 ? (balance.cats.effect.supply[supplyLv - 1] ?? 0) : 0),
      boss: num(r.bosses) * M.bossGold,
      coin: manualCoins * keep * E.coinChoice,
    };
    // 자동 G 코인 수: 실제 개수가 있으면 그것, 없으면 제시 카드가 모두 상한인 비율(capShare)로 추정
    let capped = 0,
      chance = 0;
    if (r.autoGold === true) {
      if (isObj(r.autoGoldCoins)) {
        capped = num(r.autoGoldCoins.capped);
        chance = num(r.autoGoldCoins.chance);
      } else {
        capped = autoPicks * capShare * E.autoGoldCapped;
        chance = autoPicks * (1 - capShare) * E.autoGoldChance;
      }
    }
    gold.autoGoldCapped = capped * keep * E.coinChoice;
    gold.autoGoldChance = chance * keep * E.coinChoice;
    gold.autoGold = gold.autoGoldCapped + gold.autoGoldChance;
    gold.total = gold.minute + gold.cat + gold.boss + gold.coin + gold.autoGold;
    const launch = r.launch === 'super' ? 'super' : 'normal',
      startLevel = launch === 'super' ? balance.superLaunch.level : 1,
      blueLevel =
        Math.max(0, Math.floor(num(r.level) / E.blueEvery) - Math.floor(startLevel / E.blueEvery)) * M.blue,
      blueCoins = realBlue ? r.blueCoins : (manualCoins + capped + chance) * share,
      blueCoin = blueCoins * num(E.coinChoiceBlue),
      blue = blueLevel + blueCoin,
      // S 코인은 줍는다고 가정한다(실제 개수가 있으면 그것)
      sc =
        typeof r.superCoins === 'number' && Number.isFinite(r.superCoins)
          ? r.superCoins
          : mode === balance.superCoin.mode
            ? Math.max(0, Math.floor((minutes * 60) / balance.superCoin.every))
            : 0,
      per = v => (minutes > 0 ? v / minutes : 0);
    return {
      minutes,
      wholeMinutes: w,
      gold,
      blueLevel,
      blueCoin,
      blue,
      super: sc,
      superCost: launch === 'super' ? 1 : 0,
      perMinute: { gold: per(gold.total), blue: per(blue), super: per(sc) },
    };
  }

  // 저장된 기록(NeonData.normalizeRecord 결과)을 economy 입력으로. 10초 미만 판은 뺀다.
  // 이 balance 규칙대로 만든 기록이면 economy(balance, recordRow(r)).gold.total ≈ earned.gold.
  function recordRow(record, balance) {
    if (!record || typeof record !== 'object') return null;
    const time = num(record.time);
    if (time < 10) return null;
    const E = balance.economy,
      mode = modeOf(balance, record.difficultyId),
      M = balance.modes[mode],
      earned = record.earned || {},
      minutes = time / 60,
      w = Math.floor(minutes),
      autoPicks = num(record.autoChoices),
      manualCoins = num(record.coinChoices),
      blueCoins = num(E.coinChoiceBlue) > 0 ? num(earned.blueCoin) / E.coinChoiceBlue : 0,
      n = E.coinChoice > 0 ? num(earned.autoGold) / E.coinChoice : 0;
    const capShare =
      autoPicks > 0 && n > 0 && E.autoGoldCapped > E.autoGoldChance
        ? clamp((n / autoPicks - E.autoGoldChance) / (E.autoGoldCapped - E.autoGoldChance), 0, 1)
        : 0;
    const minuteGold =
      num(earned.gold) -
      num(earned.boss) -
      num(earned.cat) -
      num(earned.autoGold) -
      manualCoins * E.coinChoice;
    const tier = w >= 1 ? clamp(Math.round(minuteGold / w - E.goldBase - M.goldBonus), 0, E.incomeMax) : 0;
    return {
      mode,
      launch: record.launch?.type === 'super' ? 'super' : 'normal',
      minutes,
      level: num(record.level),
      bosses: num(record.bossKills),
      manualCoins,
      blueCoins,
      autoPicks,
      capShare,
      autoGold: n > 0,
      tier,
      supplyLv: record.cats?.supply || 0,
      actual: { gold: num(earned.gold), blue: num(earned.blue), super: num(earned.super) },
      record: { id: record.id, date: record.date, craft: record.craft },
      score: num(record.score),
      balance: typeof record.balance === 'string' ? record.balance : '',
    };
  }

  // ── 자동 판 판 줄 → 경제 입력(lab.html simAggregate와 같은 변환) ──
  function runRow(balance, run, settings, tier) {
    if (!isObj(run) || !own(balance.modes, run.mode)) return null;
    return {
      mode: run.mode,
      launch: run.launch,
      minutes: num(run.time) / 60,
      level: run.level,
      bosses: run.bosses,
      manualCoins: run.manualCoins,
      autoPicks: run.autoPicks,
      autoGold: !!(settings && settings.autoGold) && !!balance.modes[run.mode].auto,
      autoGoldCoins: run.autoGoldCoins,
      blueCoins: run.blueCoins,
      tier,
      supplyLv: 0,
      superCoins: run.sSpawned,
    };
  }
  // 판 하나 + 끝까지 살았는지 · 분당 Point · G · B
  function runRates(balance, run, settings, tier) {
    const row = runRow(balance, run, settings, tier);
    if (!row) return null;
    const e = economy(balance, row),
      min = num(run.time) / 60,
      per = v => (min > 0 ? v / min : 0);
    return {
      ...run,
      full: run.reason === 'time',
      ppm: per(num(run.score)),
      gpm: per(e.gold.total),
      bpm: per(e.blue),
    };
  }
  // 한 모드 · 한 묶음(지금/실험)의 판들 → 평균 · 분당(합 ÷ 합 분). 모르는 모드 판은 건너뛴다.
  function modeMetrics(balance, runs, settings, tier) {
    let n = 0,
      t = 0,
      lv = 0,
      full = 0,
      score = 0,
      gold = 0,
      blue = 0,
      sc = 0,
      st = 0,
      boss = 0;
    for (const r of Array.isArray(runs) ? runs : []) {
      const row = runRow(balance, r, settings, tier);
      if (!row) continue;
      const e = economy(balance, row);
      n++;
      t += num(r.time);
      lv += num(r.level);
      st += num(r.stage);
      boss += num(r.bosses);
      score += r.score || 0;
      gold += e.gold.total;
      blue += e.blue;
      sc += e.super;
      if (r.reason === 'time') full++;
    }
    if (!n) return null;
    const min = t / 60,
      per = v => (min > 0 ? v / min : 0);
    return {
      n,
      time: t / n,
      full: full / n,
      allFull: full === n,
      level: lv / n,
      stage: st / n,
      bosses: boss / n,
      score: score / n,
      ppm: per(score),
      gpm: per(gold),
      bpm: per(blue),
      spm: per(sc),
    };
  }

  // ── 흔들림 판정: 같은 기체 · 시드끼리 짝지은 차이(실험 − 지금)의 평균이 표준오차 2배를 넘어야 '변화' ──
  // value(run) → 숫자. 짝이 3개 미만이면 판정하지 않는다(sure = false).
  function paired(nowRuns, expRuns, value) {
    const key = r => r.craft + '|' + r.seed,
      map = new Map((nowRuns || []).map(r => [key(r), r])),
      d = [];
    for (const r of expRuns || []) if (map.has(key(r))) d.push(value(r) - value(map.get(key(r))));
    const n = d.length;
    if (!n) return { n: 0, mean: 0, se: 0, same: true, sure: false };
    const mean = d.reduce((s, x) => s + x, 0) / n,
      sd = n > 1 ? Math.sqrt(d.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1)) : 0,
      se = sd / Math.sqrt(n),
      same = d.every(x => Math.abs(x) < 1e-9);
    return { n, mean, se, same, sure: !same && n >= 3 && Math.abs(mean) > 2 * se };
  }

  // ── 생존 곡선: t분(0..minutes)에 살아 있는 비율. 항목 { time, full } ──
  function survival(list, minutes) {
    const out = [];
    for (let t = 0; t <= minutes; t++)
      out.push(list.length ? list.filter(x => x.full || x.time >= t * 60 - 1e-6).length / list.length : NaN);
    return out;
  }

  // ── 해금: 판 끝 값이 그 해금 조건을 모두 채우면 도달(조건이 모두 커지기만 하므로 끝 값으로 충분) ──
  function unlockReach(balance, id, run) {
    if (!own(balance.unlock, id) || !isObj(run)) return false;
    const u = balance.unlock[id];
    return num(run.time) >= num(u.time) && num(run.score) >= num(u.score) && num(run.level) >= num(u.level);
  }

  // 모드 · 출격 종류로 묶기. 모드 키 순서, 같은 모드는 일반 다음 S 출격.
  function groupRows(rows, balance) {
    const groups = new Map();
    for (const id of Object.keys(balance.modes))
      for (const launch of ['normal', 'super']) groups.set(id + '|' + launch, { mode: id, launch, rows: [] });
    for (const row of rows || []) {
      if (!row) continue;
      const launch = row.launch === 'super' ? 'super' : 'normal',
        key = row.mode + '|' + launch;
      if (!groups.has(key)) groups.set(key, { mode: row.mode, launch, rows: [] });
      groups.get(key).rows.push(row);
    }
    return [...groups].filter(([, g]) => g.rows.length).map(([key, g]) => ({ key, ...g }));
  }

  const GOLD_KEYS = [
    'minute',
    'cat',
    'boss',
    'coin',
    'autoGoldCapped',
    'autoGoldChance',
    'autoGold',
    'total',
  ];
  function summarize(balance, rows) {
    const list = (rows || []).filter(Boolean),
      n = list.length,
      sum = { gold: Object.fromEntries(GOLD_KEYS.map(k => [k, 0])) },
      extra = ['blue', 'blueLevel', 'blueCoin', 'super', 'superCost', 'minutes', 'level', 'bosses'];
    for (const k of extra) sum[k] = 0;
    for (const row of list) {
      const e = economy(balance, row);
      for (const k of GOLD_KEYS) sum.gold[k] += e.gold[k];
      sum.blue += e.blue;
      sum.blueLevel += e.blueLevel;
      sum.blueCoin += e.blueCoin;
      sum.super += e.super;
      sum.superCost += e.superCost;
      sum.minutes += e.minutes;
      sum.level += num(row.level);
      sum.bosses += num(row.bosses);
    }
    const avg = v => (n > 0 ? v / n : 0),
      perMin = v => (sum.minutes > 0 ? v / sum.minutes : 0);
    const perRun = { gold: Object.fromEntries(GOLD_KEYS.map(k => [k, avg(sum.gold[k])])) };
    for (const k of extra) perRun[k] = avg(sum[k]);
    // 실제 수입: 모든 판에 실제 값이 있을 때만(판이 없으면 null)
    const actual =
      n > 0 && list.every(r => isObj(r.actual))
        ? {
            gold: avg(list.reduce((s, r) => s + num(r.actual.gold), 0)),
            blue: avg(list.reduce((s, r) => s + num(r.actual.blue), 0)),
            super: avg(list.reduce((s, r) => s + num(r.actual.super), 0)),
          }
        : null;
    return {
      n,
      minutes: sum.minutes,
      perRun,
      perMinute: { gold: perMin(sum.gold.total), blue: perMin(sum.blue), super: perMin(sum.super) },
      actual,
    };
  }

  // 기록이 없을 때 쓰는 예시 판 유형(이름은 화면이 붙인다)
  const PRESETS = deepFreeze([
    {
      id: 'easy',
      mode: 'easy',
      launch: 'normal',
      minutes: 15,
      level: 300,
      bosses: 180,
      manualCoins: 0,

    },
    {
      id: 'extream',
      mode: 'extream',
      launch: 'normal',
      minutes: 3,

      bosses: 25,
      manualCoins: 0,
      autoPicks: 140,
      capShare: 0,

    },
    {
      id: 'super',
      mode: 'super',
      launch: 'normal',
      minutes: 5,

      autoPicks: 115,
      capShare: 0,
      autoGold: true,
      tier: 4,
      supplyLv: 0,
    },
    {
      id: 'ultra',
      mode: 'ultra',
      launch: 'normal',
      minutes: 4,
      level: 100,
      bosses: 8,

      autoPicks: 95,
      capShare: 0,
      autoGold: true,
      tier: 4,

    },
    {
      id: 'insane',
      mode: 'insane',
      launch: 'normal',
      minutes: 6,
      level: 66,
      bosses: 5,
      manualCoins: 0,
      autoPicks: 60,
      capShare: 0,
      autoGold: true,
      tier: 4,
      supplyLv: 0,
    },
    {
      id: 'super-s',
      mode: 'super',
      launch: 'super',
      minutes: 3,
      level: 140,
      bosses: 8,
      manualCoins: 0,
      autoPicks: 110,
      capShare: 0.4,
      autoGold: true,
      tier: 4,
      supplyLv: 2,
    },
    {
      id: 'insane-s',
      mode: 'insane',
      launch: 'super',
      minutes: 5,
      level: 160,
      bosses: 0,
      manualCoins: 0,
      autoPicks: 130,
      capShare: 0.5,
      autoGold: true,
      tier: 4,
      supplyLv: 1,
    },
  ]);

  // ── 목표 목록 · 목표까지 판 수 · 플레이 시간 ──
  // 목표 10줄: 상점 · 고양이 · 영구 스택 8줄 + 버프 2줄(HP 회복 1번 B · 1회 부활 1번 S). 비용 { gold, blue, super }.
  function goalList(balance) {
    const E = balance.economy,
      C = balance.cats,
      F = balance.buffs,
      // 영구 스택 전부 MAX(R-042): 스킬마다 k번째(0부터) 값 = price + step × k, MAX개
      perma = Object.values(E.perma).reduce((s, c) => {
        for (let k = 0; k < c.max; k++) s += c.price + c.step * k;
        return s;
      }, 0);
    const list = [
      ['income', { gold: E.incomePrice * E.incomeMax }],
      ['auto', { gold: E.autoPrice }],
      ['autoGold', { gold: E.autoGoldPrice }],
      ['note', { gold: E.noteMax * E.notePerChar }],
      ['sc', { gold: E.scGold, blue: E.scBlue }],
      ['catUnlock', { super: Object.values(C.unlock).reduce((s, v) => s + v, 0) }],
      [
        'catMax',
        { super: C.levelCost.reduce((s, c) => s + c.s, 0), blue: C.levelCost.reduce((s, c) => s + c.b, 0) },
      ],
      ['permaMax', { blue: perma }],
      ['buffRegen', { blue: F.regen.b }],
      ['buffRevive', { super: F.revive.s }],
    ];
    return list.map(([id, c]) => ({
      id,
      cost: { gold: c.gold || 0, blue: c.blue || 0, super: c.super || 0 },
    }));
  }
  // perRun: 판당 순수입 { gold, blue, super }. 통화마다 ceil(비용 ÷ 판당)의 최댓값, 벌 수 없으면 Infinity.
  function goals(balance, perRun) {
    const p = perRun || {};
    return goalList(balance).map(({ id, cost }) => {
      let runs = 0;
      for (const k of ['gold', 'blue', 'super']) {
        if (!(cost[k] > 0)) continue;
        const per = num(p[k]);
        runs = Math.max(runs, per > 0 ? Math.ceil(cost[k] / per) : Infinity);
      }
      return { id, cost, runs };
    });
  }
  // perMinute: 분당 순수입 { gold, blue, super }. 통화마다 비용 ÷ 분당의 최댓값(분), 벌 수 없으면 Infinity.
  function goalMinutes(balance, perMinute) {
    const p = perMinute || {};
    return goalList(balance).map(({ id, cost }) => {
      let minutes = 0;
      for (const k of ['gold', 'blue', 'super']) {
        if (!(cost[k] > 0)) continue;
        const per = num(p[k]);
        minutes = Math.max(minutes, per > 0 ? cost[k] / per : Infinity);
      }
      return { id, cost, minutes };
    });
  }

  // ── 적 배율 ──
  // engine.js stageRules · 출현 간격 · 사수 재사격 식 그대로. 모르는 모드는 첫 모드.
  function difficulty(balance, mode, stage) {
    const n = Math.max(1, Math.floor(Number(stage) || 1)) - 1,
      M = balance.modes[modeOf(balance, mode)],
      R = balance.stage,
      SP = balance.spawn,
      SH = balance.shooter;
    return {
      hp: M.hp * (1 + R.hp * n),
      damage: M.damage * (1 + R.damage * n),
      xp: M.xp * (1 + R.xp * n),
      point: M.score * (1 + R.score * n),
      spawnPerSec: (M.spawn * SP.rate) / Math.max(SP.min, SP.interval / (1 + R.density * n)),
      shotsPerSec: M.fire / Math.max(SH.reloadMin, SH.reload / (1 + SH.reloadStage * n)),
      bulletSpeed: M.bulletSpeed,
      speed: Math.min(R.speedMax, 1 + R.speed * n),
    };
  }

  // ── 기준 빌드 · 내 화력 · 처치 시간 · 초당 위험(R-069) ──
  // 기준 빌드: STAGE에 맞는 LV(자동 승격 식을 거꾸로)까지 공격 스킬 4개를 차례로 1씩 고른 빌드.
  const OFFENSE = Object.freeze(['power', 'rapid', 'multi', 'crit']);
  function refBuild(balance, craft, stage) {
    const level = Math.max(1, balance.stage.autoLevel * (Math.max(1, Math.floor(Number(stage) || 1)) - 1)),
      stacks = { ...(balance.crafts[craft].start || {}) };
    for (let i = 0; i < level - 1; i++) {
      const id = OFFENSE[i % OFFENSE.length];
      stacks[id] = (stacks[id] || 0) + 1;
    }
    return { level, stacks };
  }
  // 물리 상한에 닿는 스택 수(engine.js CAPS 식 그대로)
  function skillCaps(balance, craft) {
    const S = balance.skills,
      c = balance.crafts[craft],
      P = balance.player;
    return {
      multi: S.multi.max - 1,
      pierce: S.pierce.max,
      orbit: balance.orbit.max,
      magnet: Math.ceil((S.magnet.max - P.magnet) / S.magnet.step),
      crit: Math.ceil((S.crit.max - P.crit) / S.crit.step),
      rapid: Math.ceil((c.fire / S.rapid.minFire - 1) / S.rapid.rate),
      speed: Math.ceil((S.speed.max - c.speed) / S.speed.step),
    };
  }
  // engine.js recalculate의 공격 부분 그대로(넘친 스택은 피해 +). dps = 한 발 기대 피해 × 발 수 ÷ 발사 간격.
  function firepower(balance, craft, stacks) {
    const S = balance.skills,
      c = balance.crafts[craft],
      P = balance.player,
      cap = skillCaps(balance, craft),
      st = stacks || {},
      u = id => st[id] || 0,

tyUsage.dash[k] += v;\n        }\n      this.emit('ability_effect', {\n        ability: 'dash',\n        source: f.source,\n        context: f.context,\n        postContext: post,\n        effect,\n      });\n      this.dashEffect = null;\n    }\n    dash(input = {}, source = 'keyboard') {\n      const p = this.p,\n        context = this.abilityAttempt('dash', source);\n      if (!context) return false;\n      this.finishDashEffect();\n      let x = Number(input.x) || 0,\n        y = Number(input.y) || 0;\n      if (!x && !y) {\n        x = p.dx;\n        y = p.dy;\n      }\n      const n = Math.hypot(x, y) || 1;\n      p.dx = x / n;\n      p.dy = y / n;\n      const previousInvuln = p.invuln;\n      p.dashTime = B.dash.time;\n      p.dashCD = p.dashMax;\n      p.invuln = Math.max(p.invuln, B.dash.invuln);\n      this.dashEffect = {\n        source,\n        context,\n        distance: 0,\n        healthDamage: 0,\n        absorbed: 0,\n        protectedThreat: false,\n        previousInvulnRemaining: previousInvuln,\n        dashInvulnRemaining: B.dash.invuln,\n      };\n      this.emit('dash', { x: p.x, y: p.y, source, context });\n      return true;\n    }\n    nova(source = 'keyboard') {\n      const p = this.p,\n        context = this.abilityAttempt('nova', source);\n      if (!context) return false;\n      p.novaCD = p.novaMax;\n      this.novaFlash = 0.65;\n      this.shake = 0.2;\n      this.emit('nova', { x: p.x, y: p.y, r: p.novaRadius, source, context });\n      const effect = this.blast();\n      for (const [k, v] of Object.entries(effect)) {\n        this.abilityUsage.nova.effects[k] += v;\n        this.abilityUsage.nova[k] += v;\n      }\n      this.emit('ability_effect', { ability: 'nova', source, context, effect });\n      return true;\n    }\n    // 충격파 한 번의 효과: 반경 안 적 피해 · 밀어내기 · 적 탄 지우기(보스 웨이브 끝은 다 맞힌 뒤에 본다).\n    // 충격파 버튼(nova)과 1회 부활(R-062)이 함께 쓴다. 재충전 · 사용 기록은 nova만 한다.\n    blast() {\n      const p = this.p,\n        effect = { effectiveDamage: 0, kills: 0, targetsHit: 0, projectilesCleared: 0 },\n        wave = this.bossWaves[0];\n      this.deferWaveCompletion = true;\n      for (const e of [...this.enemies])\n        if (!e.dead && e.born <= 0 && dist(e, p) < p.novaRadius + e.r) {\n          effect.effectiveDamage += Math.min(Math.max(0, e.hp), p.novaDamage);\n          effect.targetsHit++;\n          this.hit(e, p.novaDamage, true);\n          if (e.dead) effect.kills++;\n          const a = Math.atan2(e.y - p.y, e.x - p.x);\n          e.x += Math.cos(a) * B.nova.push;\n          e.y += Math.sin(a) * B.nova.push;\n        }\n      this.hostiles = this.hostiles.filter(b => {\n        if (dist(b, p) <= p.novaRadius) {\n          effect.projectilesCleared++;\n          return false;\n        }\n        return true;\n      });\n      this.deferWaveCompletion = false;\n      this.finishBossWave(wave);\n      return effect;\n    }\n    bossInfo() {\n      const wave = this.bossWaves[0],\n        bosses = this.enemies.filter(e => !e.dead && e.kind === 'boss');\n      return {\n        alive: bosses.length,\n        total: wave?.total || bosses.length,\n        remaining: wave?.remaining || 0,\n        originStage: wave?.originStage || bosses[0]?.stage || 0,\n        hp: bosses.reduce((n, e) => n + Math.max(0, e.hp), 0),\n        maxHp: bosses.reduce((n, e) => n + e.maxHp, 0),\n        pending: this.bossWaves.slice(1).reduce((n, w) => n + w.remaining, 0),\n      };\n    }\n    finishBossWave(wave = this.bossWaves[0]) {\n      if (!wave || wave !== this.bossWaves[0] || wave.remaining || wave.alive || this.deferWaveCompletion)\n        return;\n      const cleared = this.hostiles.length;\n      this.hostiles = [];\n      this.gems.forEach(b => {\n        b.x = this.p.x;\n        b.y = this.p.y;\n      });\n      this.bossWaves.shift();\n      this.pendingBoss = this.bossWaves.length;\n      this.emit('boss_wave_complete', {\n        waveId: wave.waveId,\n        originStage: wave.originStage,\n        total: wave.total,\n        cleared,\n      });\n      // 보스 S(R-061): Insane에서 웨이브를 다 잡을 때마다 맵 아무 곳에 1개(판당 bossMax)\n      if (this.difficultyId === S_COIN.mode && this.bossS < S_COIN.bossMax) {\n        this.bossS++;\n        this.dropSCoin('boss');\n      }\n    }\n    spawnBossWave() {\n      const wave = this.bossWaves[0];\n      if (!wave) return;\n      // 동시에 나와 있는 보스는 boss.alive마리까지(spawn이 전체 보스 수로 한 번 더 막는다)\n      while (wave.remaining > 0 && wave.alive < B.boss.alive) {\n        const e = this.spawn('boss', undefined, undefined, wave.originStage);\n        if (!e) break;\n        e.waveId = wave.waveId;\n        wave.remaining--;\n        wave.alive++;\n      }\n      this.finishBossWave(wave);\n    }\n    hurt(amount, source = { kind: 'unknown', attack: 'unknown' }) {\n      const p = this.p;\n      if (this.mode !== 'playing' || p.invuln > 0) return false;\n      const absorbed = Math.min(p.shield, amount);\n      p.shield -= absorbed;\n      const loss = Math.max(0, amount - absorbed);\n      p.hp = Math.max(0, p.hp - loss);\n      p.invuln = B.player.hurtInvuln;\n      p.noHit = 0;\n      this.damageTaken += loss;\n      if (this.dashEffect) {\n        this.dashEffect.healthDamage += loss;\n        this.dashEffect.absorbed += absorbed;\n      }\n      this.shake = 0.18;\n      this.emit('hurt', {\n        x: p.x,\n        y: p.y,\n        value: Math.ceil(amount),\n        healthDamage: loss,\n        absorbed,\n        hp: p.hp,\n        source,\n      });\n      if (p.hp <= 0) {\n        // 1회 부활(R-062): 쓰러지는 순간 한 번, 최대 HP × hp로 일어나 invuln초 무적 + 충격파 한 번(재충전 그대로)\n        if (this.reviveLeft > 0) {\n          this.reviveLeft = 0;\n          this.revived = true;\n          p.hp = p.maxHp * BF.revive.hp;\n          p.invuln = BF.revive.invuln;\n          this.emit('revive', { x: p.x, y: p.y, r: p.novaRadius });\n          this.blast();\n        } else this.end('defeated');\n      }\n      return true;\n    }\n    hit(e, amount, critical = false) {\n      if (e.dead) return;\n      e.hp -= amount;\n      this.emit('hit', { x: e.x, y: e.y, value: Math.round(amount), critical, kind: e.kind, phase: e.phase });\n      if (e.hp <= 0) this.kill(e);\n    }\n    kill(e) {\n      if (e.dead) return;\n      e.dead = true;\n      this.kills++;\n      this.combo++;\n      this.comboTTL = B.score.comboWindow;\n      this.maxCombo = Math.max(this.maxCombo, this.combo);\n      const reward = Math.round(e.reward) + Math.min(B.score.comboMax, this.combo * B.score.comboStep);\n      this.score += reward;\n      this.emit('kill', {\n        x: e.x,\n        y: e.y,\n        big: e.kind === 'boss' || e.kind === 'splitter',\n        kind: e.kind,\n        phase: e.phase,\n        enemyStage: e.stage,\n        reward,\n        xp: e.xp,\n      });\n      if (this.gems.length < B.caps.gems)\n        this.gems.push({ x: e.x, y: e.y, value: e.xp, r: e.kind === 'boss' ? 11 : 5 });\n      else this.gems[0].value += e.xp;\n      if (e.kind === 'splitter')\n        for (let i = 0; i < STATS.splitter.split; i++)\n          this.spawn('runner', clamp(e.x + (i - 1) * 23, 30, W - 30), clamp(e.y + 14, 30, H - 30), e.stage);\n      if (e.kind === 'boss') {\n        this.bossKills++;\n        this.emit('bossdown', { enemyStage: e.stage, waveId: e.waveId, id: e.id });\n        const wave = this.bossWaves.find(w => w.waveId === e.waveId);\n        if (wave) {\n          wave.alive = Math.max(0, wave.alive - 1);\n          this.finishBossWave(wave);\n        } else if (!this.enemies.some(b => b.kind === 'boss' && !b.dead)) {\n          this.hostiles = [];\n          this.gems.forEach(b => {\n            b.x = this.p.x;\n            b.y = this.p.y;\n          });\n        }\n      }\n    }\n    recalculate() {\n      const p = this.p,\n        c = CRAFTS[this.craft],\n        cap = skillCaps(this.craft),\n        u = id => this.stack(id),\n        extra = (n, max) => Math.max(0, n - max);\n      p.damage =\n        c.damage *\n        (1 +\n          S.power.damage * u('power') +\n          S.multi.overflow * extra(u('multi'), cap.multi) +\n          S.pierce.overflow * extra(u('pierce'), cap.pierce) +\n          S.rapid.overflow * extra(u('rapid'), cap.rapid) +\n          S.speed.overflow * extra(u('speed'), cap.speed) +\n          S.magnet.overflow * extra(u('magnet'), cap.magnet));\n      p.fire = Math.max(S.rapid.minFire, c.fire / (1 + S.rapid.rate * u('rapid')));\n      p.multi = Math.min(S.multi.max, 1 + u('multi'));\n      p.pierce = Math.min(S.pierce.max, u('pierce'));\n      p.speed = Math.min(S.speed.max, c.speed + S.speed.step * u('speed'));\n      p.dashMax = Math.max(B.dash.min, (c.dash / (1 + S.speed.dash * u('speed'))) * (1 - this.cats.pilot));\n      p.magnet = Math.min(S.magnet.max, B.player.magnet + S.magnet.step * u('magnet'));\n      p.orbits = Math.min(B.orbit.max, u('orbit'));\n      p.orbitDamage = B.orbit.damage + p.level + S.orbit.step * u('orbit');\n      p.maxHp = c.hp + S.vital.hp * u('vital');\n      p.novaDamage = B.nova.damage + S.nova.damage * u('nova');\n      p.novaRadius = Math.min(S.nova.radiusMax, B.nova.radius + S.nova.radius * u('nova'));\n      p.novaMax = Math.max(S.nova.cooldownMin, B.nova.cooldown - S.nova.cooldown * u('nova'));\n      p.crit = Math.min(S.crit.max, B.player.crit + S.crit.step * u('crit'));\n      p.critScale = B.player.critScale + S.crit.overflow * extra(u('crit'), cap.crit);\n      p.maxShield = c.shield + S.shield.amount * u('shield');\n    }\n    choose(id, wait = 0, source = 'manual') {\n      if (this.mode !== 'upgrade' || !this.choices.some(u => u.id === id)) return false;\n      this.upgrades[id] = (this.upgrades[id] || 0) + 1;\n      this.recalculate();\n      if (id === 'vital') this.p.hp = Math.min(this.p.maxHp, this.p.hp + S.vital.heal);\n      if (id === 'shield') this.p.shield = this.p.maxShield;\n      if (id === 'magnet') this.p.xp += S.magnet.xp * this.profile.xp;\n      this.p.hp = Math.min(this.p.maxHp, this.p.hp + B.player.choiceHeal);\n      if (source === 'auto') {\n        this.autoChoices++;\n        this.autoUsed = true;\n      }\n      this.emit('upgrade', {\n        source,\n        id,\n        count: this.upgrades[id],\n        level: this.p.level,\n        offered: this.choices.map(x => x.id),\n        wait,\n      });\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    checkLevel() {\n      const p = this.p;\n      if (this.mode !== 'playing' || p.xp + 1e-6 < p.nextXP) return;\n      p.xp -= p.nextXP;\n      p.level++;\n      p.nextXP = B.level.base + (p.level - 1) * B.level.step;\n      // 레벨업 S(R-061): Insane에서 (시드, LV) 해시가 levelChance 미만이면 맵 아무 곳에 1개\n      if (this.difficultyId === S_COIN.mode && levelDrop(this.initialSeed, p.level) < S_COIN.levelChance)\n        this.dropSCoin('level');\n      const pool = UPGRADES.filter(\n        u => !B.defense.includes(u.id) || this.defenseUsed(u.id) < this.profile.defenseCap,\n      );\n      this.choices = [];\n      while (this.choices.length < this.profile.choices && pool.length)\n        this.choices.push(pool.splice(Math.floor(this.rng() * pool.length), 1)[0]);\n      const blue = this.profile.blueCoin || 0;\n      this.coinKind = blue > 0 && blueRoll(this.initialSeed, p.level) < blue ? 'blue' : 'gold';\n      this.mode = 'upgrade';\n      this.emit('level', { level: p.level, offered: this.choices.map(x => x.id) });\n    }\n    chooseCoin(wait = 0) {\n      if (this.mode !== 'upgrade') return false;\n      this.emit('coin_choice', this.takeCoin({ level: this.p.level, wait }));\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    // 코인 칸(coinKind)을 센다: G 코인은 coinChoices(손)·coinsEarned(G 전체), B 코인은 blueCoins(손 + AUTO). 이벤트 내용을 돌려준다.\n    takeCoin(e, auto = false) {\n      const blue = this.coinKind === 'blue';\n      if (blue) this.blueCoins++;\n      else {\n        this.coinsEarned++;\n        if (!auto) this.coinChoices++;\n      }\n      e.amount = blue ? B.economy.coinChoiceBlue : B.economy.coinChoice;\n      e.offered = this.choices.map(u => u.id);\n      if (auto) e.auto = true;\n      if (blue) e.blue = true;\n      return e;\n    }\n    // 자동 G 습득(R-025): AUTO가 고를 때만 부른다. 엔진 난수가 확률 미만이면 스킬 대신 레벨업 코인을 받고\n    // choose처럼 전투로 돌아간다(같은 시드면 같은 결과). 아니면 false. 확률은 autoGoldChance, 제시된 카드가 모두 상한이면\n    // autoGoldCapped이고, 1이면 난수를 쓰지 않는다(항상).\n    chooseAutoGold(wait = 0) {\n      if (this.mode !== 'upgrade' || !this.choices.length) return false;\n      const chance = this.choices.every(u => this.isCapped(u.id))\n        ? B.economy.autoGoldCapped\n        : B.economy.autoGoldChance;\n      if (chance < 1 && this.rng() >= chance) return false;\n      this.autoChoices++;\n      this.autoUsed = true;\n      this.emit('coin_choice', this.takeCoin({ level: this.p.level, wait }, true));\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    recommendUpgrade() {\n      if (this.mode !== 'upgrade' || !this.choices.length) return null;\n      const p = this.p,\n        score = id => {\n          if (id === 'vital' && p.hp / p.maxHp < 0.6) return 120 + (1 - p.hp / p.maxHp) * 20;\n          if (id === 'shield' && p.shield < Math.max(16, p.maxShield * 0.6)) return 115;\n          return (\n            {\n              multi: p.multi < S.multi.max ? 95 : 68,\n              orbit: p.orbits < B.orbit.max ? 90 : 65,\n              rapid: p.fire > S.rapid.minFire + 0.001 ? 85 : 70,\n              power: 80,\n              crit: 75,\n              nova: 72,\n              vital: 40,\n              shield: 45,\n              speed: p.speed < 300 ? 66 : 35,\n              magnet: p.magnet < 300 ? 64 : 30,\n              pierce: p.pierce < 3 ? 63 : 38,\n            }[id] || 0\n          );\n        };\n      return [...this.choices].sort(\n        (a, b) => score(b.id) - score(a.id) || SKILL_IDS.indexOf(a.id) - SKILL_IDS.indexOf(b.id),\n      )[0].id;\n    }\n    end(reason = 'retired') {\n      if (!['playing', 'paused'].includes(this.mode)) return false;\n      this.finishDashEffect();\n      this.reason = reason;\n      this.mode = 'ended';\n      this.score += Math.floor(this.time);\n      this.emit('end', { reason });\n      return true;\n    }\n    fire() {\n      const p = this.p;\n      let target = null,\n        near = this.targetRange;\n      for (const e of this.enemies) {\n        if (e.dead || e.born > 0) continue;\n        if (\n          this.view &&\n          (Math.abs(e.x - this.view.x) > this.view.hw + e.r ||\n            Math.abs(e.y - this.view.y) > this.view.hh + e.r)\n        )\n          continue;\n        const d = dist(e, p);\n        if (d < near) {\n          near = d;\n          target = e;\n        }\n      }\n      if (!target && !this.manualAim) return;\n      p.aim = this.manualAim\n        ? Math.atan2(this.manualAim.y - p.y, this.manualAim.x - p.x)\n        : Math.atan2(target.y - p.y, target.x - p.x);\n      for (let i = 0; i < p.multi && this.bullets.length < B.caps.bullets; i++) {\n        const a = p.aim + (i - (p.multi - 1) / 2) * B.shot.spread,\n          critical = this.rng() < p.crit;\n        this.bullets.push({\n          x: p.x + Math.cos(a) * B.shot.muzzle,\n          y: p.y + Math.sin(a) * B.shot.muzzle,\n          vx: Math.cos(a) * B.shot.speed,\n          vy: Math.sin(a) * B.shot.speed,\n          ttl: B.shot.ttl,\n          damage: p.damage * (critical ? p.critScale : 1),\n          critical,\n          left: 1 + p.pierce,\n          hits: new Set(),\n        });\n      }\n      p.shotCD = p.fire;\n      this.emit('shoot');\n    }\n    step(dt, input = {}) {\n      if (this.mode !== 'playing' || !Number.isFinite(dt) || dt <= 0) return;\n      dt = Math.min(dt, 0.05);\n      this.time += dt;\n      // Stage 자동 승격(R-022): 실제 LV autoLevel마다 Stage 최소값 +1. 낮으면 한 스텝에 한 칸씩 올린다.\n      if (this.stage < 1 + Math.floor(this.p.level / B.stage.autoLevel)) this.raiseSta
