    <style>
      /* NEON ARENA v4 디자인 토큰과 기본 규칙. 근거: docs/history/UI_RESEARCH.md
   글자는 rem(사용자 글자 크기 설정을 따름), 간격·터치 영역은 px로 고정한다. */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #070b13;
  --bg-raise: #0b1420;
  --surface: #0f1b29;
  --surface-2: #142538;
  --surface-3: #1a3048;
  --line: #20364a;
  --line-strong: #2e4c66;

  /* 글자 (배경 #070b13 기준 대비: ink 17:1, ink-2 11:1, muted 7:1) */
  --ink: #ebf3f6;
  --ink-2: #b9c9d4;
  --muted: #8aa0ae;

  /* 강조 */
  --cyan: #50f3d6;
  --cyan-deep: #0f3a37;
  --gold: #f4ce72;
  --gold-deep: #3a2d12;
  --blue: #68b9ff;
  --blue-deep: #12304d;
  --violet: #c4a3ff;
  --violet-deep: #2b1f48;
  --pink: #ff4e8e;
  --danger: #ff5f6d;
  --orange: #ff9a4d;

  /* 재화 */
  --c-gold: var(--gold);
  --c-blue: var(--blue);
  --c-sc: var(--violet);

  /* 글꼴 */
  --font: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;

  /* 간격·모서리 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

  /* 터치 영역 */
  --tap: 44px;
  --tap-lg: 48px;
  --action-h: 56px;
  --action-w: 72px;

  /* 층 */
  --z-hud: 10;
  --z-overlay: 20;
  --z-menu: 30;
  --z-sheet: 40;
  --z-dialog: 50;

  /* 움직임 */
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* 안전 영역 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);

  /* 화면 높이: 주소창이 펼쳐진 작은 높이 기준 */
  --vh-full: 100vh;
}
@supports (height: 100svh) {
  :root {
    --vh-full: 100svh;
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button,
input,
select,
output {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
}
button:focus-visible,
canvas:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
h1,
h2,
h3,
p,
ol,
ul {
  margin: 0;
  padding: 0;
}
ol,
ul {
  list-style: none;
}
[hidden] {
  display: none !important;
}
.num {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.muted {
  color: var(--muted);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 모드 배지 (src/badges.js). 상자 크기에 장식까지 포함해 이웃 요소와 겹치지 않는다. */
.nb {
  display: inline-block;
  flex: none;
  line-height: 0;
  vertical-align: middle;
}
.nb--full {
  width: var(--nb-w, 112px);
  aspect-ratio: 140 / 56;
}
.nb--compact {
  width: var(--nb-cw, 70px);
  aspect-ratio: 78 / 22;
}
.nb svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.nb text {
  font-family: var(--font);
}
.nb-shine {
  transform-box: fill-box;
  animation: nb-shine 3.6s var(--ease) infinite;
}
.nb--insane .nb-aura {
  animation: nb-pulse 2.4s ease-in-out infinite;
}
.nb-spark {
  transform-box: fill-box;
  transform-origin: center;
  animation: nb-twinkle 2.8s ease-in-out infinite;
}
.nb-spark:nth-of-type(2n) {
  animation-delay: 1.3s;
}
/* Insane(R-032): Ultra보다 별빛이 많고 반짝임은 opacity만(별마다 지연이 다르다) */
.nb--insane .nb-spark {
  animation: nb-glint 2.4s ease-in-out infinite;
}
@keyframes nb-shine {
  0%,
  55% {
    transform: skewX(-18deg) translateX(0);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  90%,
  100% {
    transform: skewX(-18deg) translateX(560%);
    opacity: 0;
  }
}
@keyframes nb-pulse {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-glint {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}
@keyframes nb-twinkle {
  0%,
  100% {
    opacity: 0.25;
    transform: scale(0.7);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}
.nb-static .nb-shine,
.nb-static .nb-aura,
.nb-static .nb-spark {
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .nb-shine,
  .nb-aura,
  .nb-spark {
    animation: none !important;
  }
}

    <style>

        left: 50%;

        z-index: 9;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        border-radius: var(--r-md);

enseUsed(u.id) < this.profile.defenseCap,\n      );\n      this.choices = [];\n      while (this.choices.length < this.profile.choices && pool.length)\n        this.choices.push(pool.splice(Math.floor(this.rng() * pool.length), 1)[0]);\n      this.mode = 'upgrade';\n      this.emit('level', { level: p.level, offered: this.choices.map(x => x.id) });\n    }\n    chooseCoin(wait = 0) {\n      if (this.mode !== 'upgrade') return false;\n      this.coinChoices++;\n      this.coinsEarned++;\n      this.emit('coin_choice', {\n        level: this.p.level,\n        wait,\n        amount: B.economy.coinChoice,\n        offered: this.choices.map(u => u.id),\n      });\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    // 자동 G 습득(R-025): AUTO가 고를 때만 부른다. 엔진 난수가 확률 미만이면 스킬 대신 레벨업 코인을 받고\n    // choose처럼 전투로 돌아간다(같은 시드면 같은 결과). 아니면 false. 확률은 autoGoldChance, 제시된 카드가 모두 상한이면\n    // autoGoldCapped이고, 1이면 난수를 쓰지 않는다(항상).\n    chooseAutoGold(wait = 0) {\n      if (this.mode !== 'upgrade' || !this.choices.length) return false;\n      const chance = this.choices.every(u => this.isCapped(u.id))\n        ? B.economy.autoGoldCapped\n        : B.economy.autoGoldChance;\n      if (chance < 1 && this.rng() >= chance) return false;\n      this.autoChoices++;\n      this.autoUsed = true;\n      this.coinsEarned++;\n      this.emit('coin_choice', {\n        level: this.p.level,\n        wait,\n        amount: B.economy.coinChoice,\n        offered: this.choices.map(u => u.id),\n        auto: true,\n      });\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    recommendUpgrade() {\n      if (this.mode !== 'upgrade' || !this.choices.length) return null;\n      const p = this.p,\n        score = id => {\n          if (id === 'vital' && p.hp / p.maxHp < 0.6) return 120 + (1 - p.hp / p.maxHp) * 20;\n          if (id === 'shield' && p.shield < Math.max(16, p.maxShield * 0.6))         // 실험 값 묶음(바꾼 값이 같으면 다시 만들지 않는다)
        let expMemo = { key: '{}', balance: base };
        function exp() {
          const k = keyOf(state.changes);
          if (k !== expMemo.key) expMemo = { key: k, balance: Lab.apply(base, state.changes).balance };
          return expMemo.balance;
        }
        const changeList = () => Lab.diff(base, state.changes);
        const baseValue = path => {
          const e = ENTRY.get(path);
          return e ? e.value : Lab.isStartPath(base, path) ? 0 : undefined;
        };
        const currentValue = path => (has(state.changes, path) ? state.changes[path] : baseValue(path));
        const isChanged = path =>
          has(state.changes, path) && !Object.is(state.changes[path], baseValue(path));

        const ROW_FIELDS = [
          'minutes',
          'level',
          'bosses',
          'manualCoins',
          'autoPicks',
          'capShare',
          'tier',
          'supplyLv',
        ];
        function cleanRows(list) {
          if (!Array.isArray(list)) return presetRows();
          const out = [];
          for (const r of list) {
            if (!r || !MODES.includes(r.mode)) continue;
            const row = {
              id: typeof r.id === 'string' ? r.id.slice(0, 40) : 'row' + out.length,
              mode: r.mode,
              launch: r.launch === 'super' ? 'super' : 'normal',
              autoGold: r.autoGold === true,
            };
            for (const k of ROW_FIELDS) row[k] = Math.max(0, Number(r[k]) || 0);
            row.capShare = Math.min(1, row.capShare);
            out.push(row);
          }
          return out.length ? out : presetRows();
        }
        // 정수만, 범위 밖은 끝값, 숫자가 아니면 기본값
        function whole(v, lo, hi, fallback) {
          const n = Math.floor(Number(v));
          return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
        }
        function cleanSim(s) {
          const o = { ...DEFAULT_SIM, ...(s && typeof s === 'object' ? s : {}) },
            pick = (list, all, fallback) => {
              const v = Array.isArray(list) ? all.filter(x => list.includes(x)) : [];
              return v.length ? v : fallback.slice();
            },
            tier = Number(o.tier);
          return {
            modes: pick(o.modes, MODES, DEFAULT_SIM.modes),
            crafts: pick(o.crafts, CRAFTS, DEFAULT_SIM.crafts),
            launch: o.launch === 'super' ? 'super' : 'normal',
            minutes: whole(o.minutes, 1, Sim.LIMITS.minutes, DEFAULT_SIM.minutes),
            stage: SIM_STAGES.includes(o.stage) ? o.stage : DEFAULT_SIM.stage,
            rushTo: whole(o.rushTo, 1, Sim.LIMITS.rushTo, DEFAULT_SIM.rushTo),
            perMin: whole(o.perMin, 0, Sim.LIMITS.perMin, DEFAULT_SIM.perMin),
            seeds: SIM_SEEDS.includes(o.seeds) ? o.seeds : DEFAULT_SIM.seeds,
            autoGold: o.autoGold !== false,
            tier: Number.isFinite(tier)
              ? Math.min(base.economy.incomeMax, Math.max(0, Math.floor(tier)))
              : DEFAULT_SIM.tier,
          };
        }
        const validResults = r => !!(r && Array.isArray(r.runs) && r.settings && Array.isArray(r.sets));

        // ── 이 기기 저장(실험실 전용 키) ──
        function readStore() {
          try {
            const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
            return s && typeof s === 'object' ? s : {};
          } catch {
            return {};
          }
        }
        const store = readStore();
        if (!Array.isArray(store.saved)) store.saved = [];
        let storeOK = true;
        function writeStore() {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(store));
            storeOK = true;
          } catch {
            storeOK = false;
          }
          return storeOK;
        }
        function scenarioNow(name) {
          return Lab.makeScenario(
            {
              name,
              changes: state.changes,
              rows: state.rows,
              sim: state.sim,
              results: { sim: state.simResults },
            },
            base,
            { now: Date.now(), version: VERSION },
          );
        }
        let draftTimer = 0;
        function saveDraft() {
          clearTimeout(draftTimer);
          draftTimer = setTimeout(() => {
            store.draft = {
              scenario: Lab.toJSON(scenarioNow(state.name)),
              ui: {
                tab: state.tab,
                stage: state.stage,
                source: state.source,
                metric: state.simMetric,
                name: state.name,
              },
            };
            writeStore();
          }, 300);
        }
        function applyScenario(sc) {
          state.changes = { ...sc.changes };
          state.rows = cleanRows(sc.rows);
          state.sim = cleanSim(sc.sim);
          const r = sc.results && sc.results.sim;
          state.simResults = validResults(r) ? r : null;
        }
        (function restore() {
          const d = store.draft;
          if (d && typeof d.scenario === 'string') {
            const r = Lab.parseScenario(d.scenario, base);
            if (r.ok) applyScenario(r.scenario);
          }
          const ui = (d && d.ui) || {};
          if (TABS.includes(ui.tab)) state.tab = ui.tab;
          if (Number.isFinite(ui.stage) && ui.stage >= 1) state.stage = Math.floor(ui.stage);
          if (['preset', 'test', 'real'].includes(ui.source)) state.source = ui.source;
          if (['time', 'level', 'stage', 'gold'].includes(ui.metric)) state.simMetric = ui.metric;
          if (typeof ui.name === 'string') state.name = ui.name.slice(0, 60);
        })();

        // ── 공통 조각 ──
        let toastTimer = 0;
        function toast(msg) {
          const el = $('toast');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }
        const segBtn = (v, label, on, extra = '') =>
          '<button type="button" data-v="' +
          esc(v) +
          '" aria-pressed="' +
          (on ? 'true' : 'false') +
          '"' +
          extra +
          '>' +
          esc(label) +
          '</button>';
        const legend = () =>
          '<div class="legend"><span><i></i>' +
          esc(L.now) +
          '</span><span><i class="exp"></i>' +
          esc(L.exp) +
          '</span></div>';
        const method = (title, list) =>
          '<details class="method"><summary>' +
          esc(title) +
          '</summary><ul>' +
          list.map(x => '<li>' + esc(x) + '</li>').join('') +
          '</ul></details>';
        function niceMax(v) {
          if (!(v > 0)) return 1;
          const p = Math.pow(10, Math.floor(Math.log10(v)));
          for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (v <= m * p + 1e-12) return m * p;
          return 10 * p;
        }
        // 꺾은선 그래프: x = 이름(모드), series[0] = 지금(실선), series[1] = 실험(점선)
        function lineChart(labels, series) {
          const W = 340,
            H = 136,
            l = 36,
            r = 10,
            t = 10,
            b = 20,
            n = labels.length,
            vals = series.flat().filter(Number.isFinite),
            top = niceMax(Math.max(0, ...vals)),
            X = i => l + (n > 1 ? (i * (W - l - r)) / (n - 1) : (W - l - r) / 2),
            Y = v => t + (1 - (Number.isFinite(v) ? v : 0) / top) * (H - t - b);
          let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
          for (const f of [0, 0.5, 1]) {
            const y = Y(top * f).toFixed(1);
            s +=
              '<line class="grid" x1="' +
              l +
              '" x2="' +
              (W - r) +
              '" y1="' +
              y +
              '" y2="' +
              y +
              '" />' +
              '<text x="' +
              (l - 5) +
              '" y="' +
              (Number(y) + 3) +
              '" text-anchor="end">' +
              esc(fmt(top * f)) +
              '</text>';
          }
          labels.forEach((lb, i) => {
            s +=
              '<text x="' +
              X(i).toFixed(1) +
              '" y="' +
              (H - 5) +
              '" text-anchor="middle">' +
              esc(lb) +
              '</text>';
          });
          series.forEach((vs, si) => {
            const cls = si ? 'exp' : 'now';
            s +=
              '<path class="' +
              cls +
              '" d="' +
              vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') +
              '" />';
            vs.forEach((v, i) => {
              s +=
                '<circle class="' +
                cls +
                '" cx="' +
                X(i).toFixed(1) +
                '" cy="' +
                Y(v).toFixed(1) +
                '" r="3" />';
            });
          });
          return s + '</svg>';
        }
        function numsTable(labels, a, b) {
          let h =
            '<table class="nums"><thead><tr><th></th>' +
            labels.map(x => '<th>' + esc(x) + '</th>').join('') +
            '</tr></thead><tbody><tr><th>' +
            esc(L.now) +
            '</th>' +
            a.map(v => '<td>' + esc(fmt(v)) + '</td>').join('') +
            '</tr>';
          if (b)
            h +=
              '<tr class="exp-row"><th>' +
              esc(L.exp) +
              '</th>' +
              b
                .map((v, i) => '<td' + (same(v, a[i]) ? ' class="same"' : '') + '>' + esc(fmt(v)) + '</td>')
                .join('') +
              '</tr>';
          return h + '</tbody></table>';
        }

        // ── 머리 · 탭 ──
        function syncChip() {
          const n = changeList().length,
            c = $('changed');
          c.textContent = L.changed(n);
          c.classList.toggle('on', n > 0);
        }
        function renderActive() {
          const t = state.tab;
          if (t === 'values') {
            if (!valuesBuilt) buildValues();
            else syncValues();
            return;
          }
          if (!dirty.has(t)) return;
          dirty.delete(t);
          ({ difficulty: renderDifficulty, economy: renderEconomy, sim: renderSim, save: renderSave })[t]();
        }
        function setTab(t) {
          state.tab = t;
          for (const b of document.querySelectorAll('.tab'))
            b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false');
          for (const id of TABS) $('tab-' + id).hidden = id !== t;
          dirty.add(t);
          renderActive();
          window.scrollTo(0, 0);
          saveDraft();
        }
        // 바꾼 값이 달라졌을 때: 머리 · 값 탭을 맞추고 다른 탭은 열 때 다시 그린다
        function changed() {
          syncChip();
          for (const t of TABS) if (t !== 'values') dirty.add(t);
          if (valuesBuilt) syncValues();
          renderActive();
          saveDraft();
        }

        // ── 값 탭 ──
        const tags = path =>
          (Lab.inCalc(path) ? '<span class="tag calc">' + esc(L.values.tagCalc) + '</span>' : '') +
          (Lab.inDifficulty(path) ? '<span class="tag diff">' + esc(L.values.tagDifficulty) + '</span>' : '');
        function inputHTML(path, kind, aria) {
          if (kind === 'bool')
            return (
              '<button type="button" class="tog" data-path="' +
              esc(path) +
              '" aria-label="' +
              esc(aria) +
              '"></button>'
            );
          return (
            '<input class="num" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-path="' +
            esc(path) +
            '" aria-label="' +
            esc(aria) +
            '" />'
          );
        }
        const wasHTML = path => '<button type="button" class="was" data-reset="' + esc(path) + '"></button>';
        // 표 묶음: 열 = 모드 · 기체 · 적, 줄 = 키(기체 시작 스킬은 스킬 순서로 뒤에)
        function matrixLayout(g) {
          const cols = Object.keys(base[g]),
            keys = [];
          for (const c of cols) {
            const pre = g + '.' + c + '.';
            for (const e of ENTRIES)
              if (e.path.startsWith(pre)) {
                const k = e.path.slice(pre.length);
                if (!keys.includes(k)) keys.push(k);
              }
          }
          if (g !== 'crafts') return { cols, keys };
          const starts = Object.keys(base.skills)
            .map(s => 'start.' + s)
            .filter(k => keys.includes(k));
          return { cols, keys: [...keys.filter(k => !k.startsWith('start.')), ...starts] };
        }
        function matrixHTML(g) {
          const { cols, keys } = matrixLayout(g),
            names = cols.map(c => L.column(g, c));
          let h =
            '<div class="matrix-wrap"><table class="matrix"><colgroup><col style="width:64px" />' +
            cols.map(() => '<col />').join('') +
            '</colgroup><thead><tr><th></th>' +
            names.map(x => '<th>' + esc(x) + '</th>').join('') +
            '</tr></thead><tbody>';
          for (const k of keys) {
            const rowName = L.rowName(g, k),
              search = [rowName, g + '.' + k, ...names, ...cols.map(c => g + '.' + c + '.' + k)].join(' ');
            h +=
              '<tr data-search="' +
              esc(search.toLowerCase()) +
              '"><th>' +
              esc(rowName) +
              '<br />' +
              tags(g + '.' + cols[0] + '.' + k) +
              '</th>';
            cols.forEach((c, i) => {
              const path = g + '.' + c + '.' + k,
                e = ENTRY.get(path);
              if (!e && !Lab.isStartPath(base, path)) {
                h += '<td class="none">—</td>';
                return;
              }
              h +=
                '<td data-cell="' +
                esc(path) +
                '">' +
                inputHTML(path, e ? e.kind : 'number', names[i] + ' · ' + rowName) +
                wasHTML(path) +
                '</td>';
            });
            h += '</tr>';
          }
          return h + '</tbody></table></div>';
        }
        function listHTML(g) {
          let h = '';
          for (const e of ENTRIES) {
            if (e.group !== g) continue;
            const label = L.label(e.path);
            h +=
              '<div class="v-row" data-cell="' +
              esc(e.path) +
              '" data-search="' +
              esc((label + ' ' + e.path).toLowerCase()) +
              '"><div class="v-name"><b>' +
              esc(label) +
              tags(e.path) +
              '</b><small>' +
              esc(e.path) +
              '</small></div><div>' +
              inputHTML(e.path, e.kind, label) +
              wasHTML(e.path) +
              '</div></div>';
          }
          return h;
        }
        function buildValues() {
          $('v-groups').innerHTML =
            GROUPS.map(
              g =>
                '<details class="group" data-group="' +
                g +
                '"' +
                (FIRST.includes(g) ? ' open' : '') +
                '><summary><span>' +
                esc(L.groups[g] || g) +
                '</span><span class="g-count"></span></summary><div class="g-body">' +
                (MATRIX.includes(g) ? matrixHTML(g) : listHTML(g)) +
                '</div></details>',
            ).join('') +
            '<p class="note hide" id="v-empty">' +
            esc(L.values.empty) +
            '</p>';
          valuesBuilt = true;
          syncValues();
        }
        function syncValues() {
          const host = $('v-groups'),
            q = state.search.trim().toLowerCase(),
            counts = {};
          for (const cell of host.querySelectorAll('[data-cell]')) {
            const path = cell.dataset.cell,
              on = isChanged(path),
              v = currentValue(path);
            cell.classList.toggle('changed', on);
            if (on) counts[path.split('.')[0]] = (counts[path.split('.')[0]] || 0) + 1;
            const input = cell.querySelector('input.num');
            if (input && document.activeElement !== input) {
              input.value = raw(v);
              input.classList.remove('bad');
            }
            const tog = cell.querySelector('.tog');
            if (tog) {
              tog.textContent = raw(!!v);
              tog.setAttribute('aria-pressed', v ? 'true' : 'false');
            }
            const was = cell.querySelector('.was');
            if (was) {
              const b = raw(baseValue(path));
              was.textContent = cell.tagName === 'TD' ? b : L.values.was(b);
              was.setAttribute('aria-label', L.values.reset);
            }
          }
          let shown = 0;
          for (const row of host.querySelectorAll('[data-search]')) {
            const cells = row.hasAttribute('data-cell') ? [row] : [...row.querySelectorAll('[data-cell]')],
              ok =
                (!q || row.dataset.search.includes(q)) &&
                (!state.onlyChanged || cells.some(c => c.classList.contains('changed')));
            row.classList.toggle('hide', !ok);
            if (ok) shown++;
          }
          for (const det of host.querySelectorAll('details.group')) {
            const n = counts[det.dataset.group] || 0,
              any = !!det.querySelector('[data-search]:not(.hide)');
            det.querySelector('.g-count').textContent = n ? L.changed(n) : '';
            det.classList.toggle('hide', !any);
            if ((q || state.onlyChanged) && any) det.open = true;
          }
          $('v-empty').classList.toggle('hide', shown > 0);
        }
        function setChange(path, value) {
          if (value === null || Object.is(value, baseValue(path))) delete state.changes[path];
          else state.changes[path] = value;
          changed();
        }
        function onNumber(el) {
          const path = el.dataset.path,
            text = el.value.trim().replace(/,/g, '');
          if (text === '') {
            el.classList.remove('bad');
            setChange(path, null);
            return;
          }
          const v = /^(∞|inf|infinity)$/i.test(text) ? Infinity : Number(text);
          if (!Lab.check(base, path, v).ok) {
            el.classList.add('bad');
            return;
          }
          el.classList.remove('bad');
          setChange(path, v);
        }
        $('v-groups').addEventListener('input', e => {
          if (e.target.matches('input.num')) onNumber(e.target);
        });
        $('v-groups').addEventListener('focusout', e => {
          const el = e.target;
          if (!el.matches('input.num')) return;
          el.classList.remove('bad');
          el.value = raw(currentValue(el.dataset.path));
        });
        $('v-groups').addEventListener('click', e => {
          const tog = e.target.closest('.tog');
          if (tog) return setChange(tog.dataset.path, !currentValue(tog.dataset.path));
          const was = e.target.closest('.was');
          if (was) setChange(was.dataset.reset, null);
        });
        $('v-search').addEventListener('input', e => {
          state.search = e.target.value;
          syncValues();
        });
        $('v-only').addEventListener('change', e => {
          state.onlyChanged = e.target.checked;
          syncValues();
        });
        $('v-reset').addEventListener('click', () => {
          const n = changeList().length;
          if (!n || !confirm(L.values.resetConfirm(n))) return;
          state.changes = {};
          changed();
        });

        // ── 난이도 탭: 모드별 적 배율(지금 · 실험) ──
        function renderDifficulty() {
          const E = exp(),
            st = state.stage,
            names = MODES.map(m => T.modeName(m)),
            now = MODES.map(m => Lab.difficulty(base, m, st)),
            ex = MODES.map(m => Lab.difficulty(E, m, st));
          let h =
            '<p class="note">' +
            esc(L.difficulty.note) +
            '</p><div><span class="field-label">' +
            esc(L.difficulty.stage) +
            '</span><div class="seg" data-act="stage">' +
            [1, 10, 30, 60].map(s => segBtn(s, s, st === s)).join('') +
            '<input class="num" id="d-stage" type="text" inputmode="numeric" style="width:76px" value="' +
            st +
            '" aria-label="' +
            esc(L.difficulty.stage) +
            '" /></div></div>' +
            legend();
          for (const k of Object.keys(L.difficulty.metrics)) {
            const a = now.map(d => d[k]),
              b = ex.map(d => d[k]),
              diff = a.some((v, i) => !same(v, b[i]));
            h +=
              '<article class="card"><h3>' +
              esc(L.difficulty.metrics[k]) +
              '</h3>' +
              lineChart(names, diff ? [a, b] : [a]) +
              numsTable(names, a, diff ? b : null) +
              '</article>';
          }
          h +=
            '<p class="note">' +
            esc(L.difficulty.speed(fmt(now[0].speed), fmt(ex[0].speed))) +
            '</p>' +
            method(L.difficulty.method, L.difficulty.formulas);
          $('tab-difficulty').innerHTML = h;
        }
        $('tab-difficulty').addEventListener('click', e => {
          const b = e.target.closest('[data-act="stage"] button');
          if (!b) return;
          state.stage = Number(b.dataset.v);
          renderDifficulty();
          saveDraft();
        });
        $('tab-difficulty').addEventListener('change', e => {
          if (e.target.id !== 'd-stage') return;
          const v = Math.floor(Number(e.target.value));
          state.stage = Number.isFinite(v) ? Math.min(999, Math.max(1, v)) : 1;
          renderDifficulty();
          saveDraft();
        });

        // ── 경제 탭 ──
        function openDB(name) {
          return new Promise(resolve => {
            let req;
            try {
              req = indexedDB.open(name);
            } catch {
              resolve(null);
              return;
            }
            // 없는 저장소는 만들지 않는다: 새로 만들 때만 생기는 업그레이드를 취소한다
            req.onupgradeneeded = () => {
              try {
                req.transaction.abort();
              } catch {
                /* 이미 끝남 */
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          });
        }
        // 같은 주소의 게임 기록을 읽기만 한다(시험 경로 · 실제 주소). 읽은 뒤 바로 닫는다.
        async function readRecords(which) {
          if (typeof indexedDB === 'undefined') return { status: 'unsupported', rows: [], n: 0, skipped: 0 };
          const db = await openDB(Data.DB_BASE + (which === 'test' ? '-test' : ''));
          if (!db) return { status: 'none', rows: [], n: 0, skipped: 0 };
          // 게임이 저장소를 새 버전으로 열려 하면 바로 비켜 준다
          db.onversionchange = () => db.close();
          let list = [];
          try {
            if (db.objectStoreNames.contains('records'))
              list = await new Promise(resolve => {
                const req = db.transaction('records', 'readonly').objectStore('records').getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
              });
          } catch {
            list = [];
          } finally {
            db.close();
          }
          const records = list.map(r => Data.normalizeRecord(r)).filter(Boolean),
            rows = records.map(r => Lab.recordRow(r, base)).filter(Boolean);
          return {
            status: rows.length ? 'ok' : 'none',
            rows,
            n: rows.length,
            skipped: records.length - rows.length,
          };
        }
        function loadRecords(which) {
          if (state.records[which]) return;

        // 판 유형 줄: 예시 줄 하나씩, 또는 기록을 모드 · 출격으로 묶은 것

        function renderEconomy() {

          const lines = econLines().map(l => ({

          if (lines.length) h += legend();

        $('tab-economy').addEventListener('click', e => {
          const src = e.target.closest('[data-act="source"] button');
          if (src) {
            state.source = src.dataset.v;
            renderEconomy();

          }
          const card = e.target.closest('[data-key]');
          if (e.target.closest('[data-act="toggle"]') && card) {

        $('tab-economy').addEventListener('change', e => {

            v = Number(String(el.value).replace(/[,%\s]/g, ''));
          if (!r || !Number.isFinite(v) || v < 0) return renderEconomy();

          else if (k === 'tier') r.tier = Math.min(base.economy.incomeMax, Math.floor(v));

        function rowsChanged() {
          dirty.add('save');
          renderEconomy();
          saveDraft();
        }

        // ── 자동 판 탭 ──
        let running = null,
          fallbackMode = false,
          workerURL = null,
          paintQueued = false;
        const simKey = () => {
          const { tier, ...rest } = state.sim;
          return keyOf({ c: state.changes, s: rest });
        };
        const jobCount = () =>
          state.sim.modes.length * state.sim.crafts.length * state.sim.seeds * (changeList().length ? 2 : 1);
        // 작업자(Web Worker) 안에서 도는 코드: lab-sim 원문 뒤에 붙는다(바깥 변수를 쓰지 않는다)
        function workerMain() {
          var boxes = {},
            initError = null;
          self.onmessage = function (e) {
            var m = e.data;
            if (m.type === 'init') {
              boxes = {};
              initError = null;
              try {
                for (var k in m.balances) boxes[k] = self.NeonLabSim.load(LAB_SRC, m.balances[k]);
              } catch (err) {
                initError = String((err && err.message) || err);
              }
              return;
            }
            if (m.type !== 'job') return;
            try {
              if (initError) throw new Error(initError);
              var r = self.NeonLabSim.start(boxes[m.set], m.opts),
                last = 0;
              while (!r.advance(900)) {
                var now = Date.now();
                if (now - last > 250) {
                  last = now;
                  self.postMessage({ type: 'progress', id: m.id, p: r.progress });
                }
              }
              self.postMessage({ type: 'done', id: m.id, result: r.result() });
            } catch (err) {
              self.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });
            }
          };
        }
        function workerSource() {
          return (
            SOURCES.sim +
            '\n;var LAB_SRC = ' +
            JSON.stringify({ siege: SOURCES.siege, engine: SOURCES.engine }) +
            ';\n(' +
            workerMain.toString() +
            ')();\n'
          );
        }
        // 작업자 여러 개(최대 4)에 판을 나눠 준다. 20초 동안 소식이 없는 판은 끊고 다음 판으로.
        function startPool(jobs, balances, cb) {
          if (typeof Worker === 'undefined' || !SOURCES) return null;
          if (!workerURL)
            try {
              workerURL = URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' }));
            } catch {
              return null;
            }
          const size = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1, jobs.length)),
            slots = [],
            partial = new Map();
          let next = 0,
            finished = 0,
            stopped = false;
          const spawn = slot => {
            try {
              const w = new Worker(workerURL);
              w.onmessage = e => onMessage(slot, e.data);
              w.onerror = ev => {
                ev.preventDefault();
                fail(slot, ev.message || 'error');
              };
              w.postMessage({ type: 'init', balances });
              slot.w = w;
              return true;
            } catch {
              return false;
            }
          };
          const assign = slot => {
            if (stopped) return;
            if (next >= jobs.length) {
              slot.job = null;
              if (slots.every(s => !s.job)) end();
              return;
            }
            slot.job = jobs[next++];
            slot.last = Date.now();
            slot.w.postMessage({ type: 'job', id: slot.job.id, set: slot.job.set, opts: slot.job.opts });
          };
          const onMessage = (slot, m) => {
            if (stopped || !slot.job || m.id !== slot.job.id) return;
            slot.last = Date.now();
            if (m.type === 'progress') {
              partial.set(m.id, m.p);
              return cb.progress();
            }
            partial.delete(m.id);
            finished++;
            if (m.type === 'done') cb.done(slot.job, m.result);
            else cb.error(slot.job, m.message);
            assign(slot);
          };
          const fail = (slot, msg) => {
            if (stopped) return;
            const job = slot.job;
            try {
              slot.w.terminate();
            } catch {
              /* 이미 끝남 */
            }
            slot.job = null;
            if (job) {
              partial.delete(job.id);
              finished++;
              cb.error(job, msg);
            }
            if (spawn(slot)) assign(slot);
            else if (slots.every(s => !s.job)) end();
          };
          const watch = setInterval(() => {
            for (const s of slots) if (s.job && Date.now() - s.last > 20000) fail(s, L.sim.timeout);
          }, 2000);
          function end() {
            if (stopped) return;
            stopped = true;
            clearInterval(watch);
            for (const s of slots)
              try {
                s.w.terminate();
              } catch {
                /* 이미 끝남 */
              }
            cb.end();
          }
          for (let i = 0; i < size; i++) {
            const s = { w: null, job: null, last: 0 };
            if (!spawn(s)) break;
            slots.push(s);
          }
          if (!slots.length) {
            clearInterval(watch);
            return null;
          }
          slots.forEach(assign);
          return {
            total: jobs.length,
            finished: () => finished,
            progress: () => (finished + [...partial.values()].reduce((x, y) => x + y, 0)) / jobs.length,
            stop: end,
          };
        }
        // 작업자를 못 쓰는 브라우저: 화면에서 조금씩 끊어 돌린다
        function startLocal(jobs, balances, cb) {
          const boxes = {};
          let i = 0,
            cur = null,
            finished = 0,
            stopped = false,
            loadError = null;
          try {
            for (const k of Object.keys(balances)) boxes[k] = Sim.load(SOURCES, balances[k]);
          } catch (err) {
            loadError = String((err && err.message) || err);
          }
          const end = () => {
            if (stopped) return;
            stopped = true;
            cb.end();
          };
          const tick = () => {
            if (stopped) return;
            const t0 = performance.now();
            while (performance.now() - t0 < 12) {
              if (!cur) {
                if (i >= jobs.length) return end();
                const job = jobs[i++];
                try {
                  if (loadError) throw new Error(loadError);
                  cur = { job, r: Sim.start(boxes[job.set], job.opts) };
                } catch (err) {
                  finished++;
                  cb.error(job, String((err && err.message) || err));
                  continue;
                }
              }
              try {
                if (cur.r.advance(120)) {
                  finished++;
                  cb.done(cur.job, cur.r.result());
                  cur = null;
                }
              } catch (err) {
                finished++;
                cb.error(cur.job, String((err && err.message) || err));
                cur = null;
              }
            }
            cb.progress();
            setTimeout(tick, 0);
          };
          setTimeout(tick, 0);
          return {
            total: jobs.length,
            finished: () => finished,
            progress: () => (finished + (cur ? cur.r.progress : 0)) / jobs.length,
            stop: end,
          };
        }
        function runSim() {
          if (running) return;
          const s = state.sim,
            sets = changeList().length ? ['now', 'exp'] : ['now'],

            for (const craft of s.crafts)

                      launch: s.launch,

            },
            end() {

              dirty.add('save');

        }
        function paintSim() {
          if (state.tab !== 'sim') return dirty.add('sim');
          if (paintQueued) return;
          paintQueued = true;
          requestAnimationFrame(() => {

          });
        }
        function updateProgress() {
          const box = $('sim-progress');
          if (!box || !running) return;
          box.querySelector('.progress > div').style.width = (running.progress() * 100).toFixed(1) + '%';
          box.querySelector('.note').textContent = L.sim.progress(running.finished(), running.total);
        }
        // 판 결과를 모드 · 기체 · 묶음(지금/실험)별로 더한다. 판당 G는 그 판을 돌린 값 묶음의 경제 규칙으로.
        function simAggregate(r) {
          const bal = {
              now: base,
              exp: r.sets.includes('exp') ? Lab.apply(base, r.changes || {}).balance : null,
            },
            cells = {};
          for (const run of r.runs) {
            const B = bal[run.set];
            if (!B || !B.modes[run.mode]) continue;
            const e = Lab.economy(B, {
              mode: run.mode,
              launch: run.launch,
              minutes: run.minutes,
              level: run.level,
              bosses: run.bosses,
              manualCoins: run.manualCoins,
              autoPicks: run.autoPicks,
              autoGold: r.settings.autoGold && !!B.modes[run.mode].auto,
              autoGoldCoins: run.autoGoldCoins,
              tier: state.sim.tier,
              supplyLv: 0,
              superCoins: run.sSpawned,
            });
            for (const c of [run.craft, '*']) {
              const byMode = (cells[run.mode] = cells[run.mode] || {}),
                byCraft = (byMode[c] = byMode[c] || {}),
                acc = (byCraft[run.set] = byCraft[run.set] || {
                  n: 0,
                  time: 0,
                  level: 0,
                  stage: 0,
                  bosses: 0,
                  score: 0,
                  gold: 0,
                  blue: 0,
                  full: 0,
                });
              acc.n++;
              acc.time += run.time;
              acc.level += run.level;
              acc.stage += run.stage;
              acc.bosses += run.bosses;
              acc.score += run.score || 0;
              acc.gold += e.gold.total;
              acc.blue += e.blue;
              if (run.reason === 'time') acc.full++;
            }
          }
          return cells;
        }
        const avgOf = (acc, k) => (acc && acc.n ? acc[k] / acc.n : NaN);
        const fTime = (acc, v) =>
          Number.isFinite(v) ? time(v) + (acc && acc.full === acc.n ? '+' : '') : '—';
        const SIM_TABLES = [
          [
            ['time', null],
            ['full', null],
            ['level', 0],
            ['stage', 0],
            ['bosses', 1],
          ],
          [
            ['score', null],
            ['ppm', null],
            ['gold', 0],
            ['blue', 1],
          ],
        ];
        const simFields = SIM_TABLES.flat();
        // 큰 Point는 '만' 단위로 줄인다
        const big = v =>
          !Number.isFinite(v)
            ? '—'
            : Math.abs(v) >= 1e4
              ? fmt(v / 1e4, Math.abs(v) >= 1e6 ? 0 : 1) + '만'
              : fmt(v, 0);
        const simValue = (acc, k, d) =>
          !acc || !acc.n
            ? '—'
            : k === 'time'
              ? fTime(acc, avgOf(acc, k))
              : k === 'full'
                ? acc.full + '/' + acc.n
                : k === 'score'
                  ? big(avgOf(acc, k))
                  : k === 'ppm'
                    ? big(acc.time > 0 ? acc.score / (acc.time / 60) : NaN)
                    : fmt(avgOf(acc, k), d);
        function simTable(mode, byMode, crafts, two) {
          return (
            '<h3>' +
            esc(T.modeName(mode)) +
            '</h3>' +
            SIM_TABLES.map(fields => simRows(fields, byMode, crafts, two)).join('')
          );
        }
        function simRows(fields, byMode, crafts, two) {
          const head =
            '<thead><tr><th>' +
            esc(L.sim.cols.craft) +
            '</th>' +
            fields.map(([k]) => '<th>' + esc(L.sim.cols[k]) + '</th>').join('') +
            '</tr></thead>';
          let body = '';
          for (const c of [...crafts, '*']) {
            const cell = byMode && byMode[c];
            if (!cell) continue;
            body +=
              '<tr' +
              (c === '*' ? ' class="avg"' : '') +
              '><td>' +
              esc(c === '*' ? L.sim.average : T.craftName(c)) +
              '</td>' +
              fields
                .map(
                  ([k, d]) =>
                    '<td><span class="n">' +
                    esc(simValue(cell.now, k, d)) +
                    '</span>' +
                    (two ? '<span class="e">' + esc(simValue(cell.exp, k, d)) + '</span>' : '') +
                    '</td>',
                )
                .join('') +
              '</tr>';
          }
          return '<table class="res">' + head + '<tbody>' + body + '</tbody></table>';
        }
        function renderSimResults() {
          const host = $('sim-results');
          if (!host) return;
          const r = state.simResults;
          if (!validResults(r) || (!r.runs.length && !running)) {
            host.innerHTML = '<p class="note">' + esc(L.sim.none) + '</p>';
            return;
          }
          const two = r.sets.includes('exp'),
            cells = simAggregate(r),
            s = r.settings;
          let h = '';
          if (!running && r.key !== simKey()) h += '<p class="warn">' + esc(L.sim.stale) + '</p>';
          if (r.errors.length) h += '<p class="warn">' + esc(L.sim.error(r.errors[0])) + '</p>';
          if (two) h += legend();
          if (s.modes.length > 1) {
            const metric = state.simMetric,
              val = (m, set) => {
                const v = avgOf(cells[m] && cells[m]['*'] && cells[m]['*'][set], metric);
                return metric === 'time' ? v / 60 : v;
              };
            h +=
              '<article class="card"><h3>' +
              esc(L.sim.chart) +
              '</h3><div class="seg" data-act="metric">' +
              Object.keys(L.sim.chartMetrics)
                .map(k => segBtn(k, L.sim.chartMetrics[k], metric === k))
                .join('') +
              '</div>' +
              lineChart(
                s.modes.map(m => T.modeName(m)),
                two
                  ? [s.modes.map(m => val(m, 'now')), s.modes.map(m => val(m, 'exp'))]
                  : [s.modes.map(m => val(m, 'now'))],
              ) +
              '</article>';
          }
          for (const m of s.modes)
            if (cells[m]) h += '<div class="card">' + simTable(m, cells[m], s.crafts, two) + '</div>';
          host.innerHTML = h;
        }
        // 직접 입력 칸(STAGE N · n, 길이). 바뀌면 change 처리기가 정리해 다시 그린다
        const numField = (id, label, v, off) =>
          '<label class="num-field"><span>' +
          esc(label) +
          '</span><input class="num" id="' +
          id +
          '" type="text" inputmode="numeric" value="' +
          v +
          '"' +
          off +
          ' /></label>';
        function renderSim() {
          const s = state.sim,
            off = running ? ' disabled' : '',
            field = (label, html) =>
              '<div><span class="field-label">' + esc(label) + '</span>' + html + '</div>',
            seg = (key, list, isOn, label) =>
              '<div class="seg" data-key="' +
              key +
              '">' +
              list.map(v => segBtn(v, label(v), isOn(v), off)).join('') +
              '</div>';
          let h =
            '<div class="card">' +
            field(
              L.sim.modes,
              seg(
                'modes',
                MODES,
                v => s.modes.includes(v),
                v => T.modeName(v),
              ),
            ) +
            field(
              L.sim.crafts,
              seg(
                'crafts',
                CRAFTS,
                v => s.crafts.includes(v),
                v => T.craftName(v),
              ),
            ) +
            field(
              L.sim.launch,
              seg(
                'launch',
                ['normal', 'super'],
                v => s.launch === v,
                v => L.sim.launches[v],
              ),
            ) +
            field(
              L.sim.stagePlan,
              seg(
                'stage',
                SIM_STAGES,
                v => s.stage === v,
                v => L.sim.stages[v],
              ) +
                (s.stage === 'none'
                  ? ''
                  : '<div class="num-row">' +
                    (s.stage === 'rush' ? numField('sim-rush', L.sim.rushTo, s.rushTo, off) : '') +
                    numField('sim-per', L.sim.perMin, s.perMin, off) +
                    '</div>'),
            ) +
            field(
              L.sim.minutes,
              seg('minutes', SIM_MINUTES, v => s.minutes === v, L.sim.minute) +
                '<div class="num-row">' +
                numField('sim-minutes', L.sim.minutesIn, s.minutes, off) +
                '</div>',
            ) +
            field(
              L.sim.seeds,
              seg('seeds', SIM_SEEDS, v => s.seeds === v, L.sim.seedsOf),
            ) +
            field(
              L.sim.autoGold,
              seg('autoGold', [true, false], v => s.autoGold === v, raw),
            ) +
            field(
              L.sim.tier,
              seg(
                'tier',
                Array.from({ length: base.economy.incomeMax + 1 }, (x, i) => i),
                v => s.tier === v,
                String,
              ),
            ) +
            '</div><div class="btns">' +
            (running
              ? '<button type="button" class="btn" data-act="stop">' + esc(L.sim.stop) + '</button>'
              : '<button type="button" class="btn primary" data-act="run">' +
                esc(L.sim.run(jobCount())) +
                '</button>') +
            '</div><div id="sim-progress"' +
            (running ? '' : ' hidden') +
            '><div class="progress"><div></div></div><p class="note"></p></div>' +
            (fallbackMode ? '<p class="note">' + esc(L.sim.fallback) + '</p>' : '') +
            '<div id="sim-results"></div><p class="note">' +
            esc(L.sim.note) +
            '</p>';
          $('tab-sim').innerHTML = h;
          renderSimResults();
          updateProgress();
        }
        $('tab-sim').addEventListener('click', e => {
          if (e.target.closest('[data-act="run"]')) return runSim();
          if (e.target.closest('[data-act="stop"]')) {
            if (running) running.stop();
            return;
          }
          const m = e.target.closest('[data-act="metric"] button');
          if (m) {
            state.simMetric = m.dataset.v;
            renderSimResults();
            return saveDraft();
          }
          const b = e.target.closest('.seg[data-key] button');
          if (!b || running) return;
          const key = b.closest('.seg').dataset.key,
            s = state.sim,
            v = b.dataset.v;
          if (key === 'modes' || key === 'crafts') {
            const list = s[key],
              at = list.indexOf(v);
            if (at >= 0) {
              if (list.length > 1) list.splice(at, 1);
            } else list.push(v);
            // 화면 순서대로
            s[key] = (key === 'modes' ? MODES : CRAFTS).filter(x => list.includes(x));
          } else if (key === 'autoGold') s.autoGold = v === 'true';
          else if (key === 'launch' || key === 'stage') s[key] = v;
          else s[key] = Number(v);
          dirty.add('save');
          renderSim();
          saveDraft();
        });

        $('tab-sim').addEventListener('change', e => {
          const key = { 'sim-rush': 'rushTo', 'sim-per': 'perMin', 'sim-minutes': 'minutes' }[e.target.id];
          if (!key || running) return;
          state.sim = cleanSim({ ...state.sim, [key]: e.target.value });
          dirty.add('save');
          renderSim();
          saveDraft();
        });

        // ── 저장 탭 ──
        const parsedCache = new Map();
        function parsedSaved(json) {
          if (!parsedCache.has(json)) parsedCache.set(json, Lab.parseScenario(json, base));
          return parsedCache.get(json);
        }
        function savedList() {
          if (!store.saved.length) return '<p class="note">' + esc(L.save.empty) + '</p>';
          return store.saved
            .map((json, i) => {
              const r = parsedSaved(json);
              if (!r.ok) return '';
              const sc = r.scenario;
              return (
                '<div class="saved-item"><div><b>' +
                esc(sc.name) +
                '</b><small>' +
                esc(
                  (sc.savedAt ? dateText(sc.savedAt) + ' · ' : '') +
                    L.changed(Object.keys(sc.changes).length),
                ) +
                '</small></div><div class="btns"><button type="button" class="btn small" data-act="open" data-i="' +
                i +
                '">' +
                esc(L.save.open) +
                '</button><button type="button" class="btn small" data-act="file" data-i="' +
                i +
                '">' +
                esc(L.save.file) +
                '</button><button type="button" class="btn small" data-act="remove" data-i="' +
                i +
                '">' +
                esc(L.save.remove) +
                '</button></div></div>'
              );
            })
            .join('');
        }
        function renderSave() {
          let h = Lab.BUILTIN.length ? '<h2>' + esc(L.save.builtin) + '</h2>' : '';
          for (const b of Lab.BUILTIN) {
            const t = L.save.builtins[b.id] || { name: b.id, desc: '' };
            h +=
              '<article class="card"><h3>' +
              esc(t.name) +
              '</h3><p class="note">' +
              esc(t.desc) +
              '</p><div class="btns"><button type="button" class="btn primary" data-act="builtin" data-id="' +
              esc(b.id) +
              '">' +
              esc(L.save.load) +
              '</button></div></article>';
          }
          for (const n of state.notices) h += '<p class="warn">' + esc(n) + '</p>';
          h +=
            '<h2>' +
            esc(L.save.current) +
            '</h2><div class="card"><label><span class="field-label">' +
            esc(L.save.name) +
            '</span><input class="text" id="s-name" maxlength="60" autocomplete="off" value="' +
            esc(state.name) +
            '" /></label><div class="btns"><button type="button" class="btn primary" data-act="store">' +
            esc(L.save.store) +
            '</button><button type="button" class="btn" data-act="export">' +
            esc(L.save.exportFile) +
            '</button><label class="btn">' +
            esc(L.save.importFile) +
            '<input type="file" id="s-file" accept=".json,application/json" hidden /></label></div><p class="note">' +
            esc(storeOK ? L.save.storage : L.save.storageFail) +
            '</p><details class="method"><summary>' +
            esc(L.save.paste) +
            '</summary><textarea class="out" id="s-paste" placeholder="' +
            esc(L.save.pasteHint) +
            '"></textarea><div class="btns"><button type="button" class="btn" data-act="paste">' +
            esc(L.save.pasteOpen) +
            '</button></div></details></div><h2>' +
            esc(L.save.list) +
            '</h2><div class="card">' +
            savedList() +
            '</div><h2>' +
            esc(L.save.copy) +
            '</h2><div class="card"><div class="btns"><button type="button" class="btn primary" data-act="copy">' +
            esc(L.save.copy) +
            '</button></div><textarea class="out" id="s-text" readonly></textarea></div>';
          $('tab-save').innerHTML = h;
          $('s-text').value = exportText();
        }
        // 지금 바꾼 값이 저장한 시나리오 어디에도 없으면 버리기 전에 묻는다
        function confirmReplace() {
          const n = changeList().length;
          if (!n) return true;
          const k = keyOf(Lab.makeScenario({ changes: state.changes }, base, {}).changes);
          if (store.saved.some(j => parsedSaved(j).ok && keyOf(parsedSaved(j).scenario.changes) === k))
            return true;
          return confirm(L.save.replaceConfirm(n));
        }
        function openParsed(r) {
          applyScenario(r.scenario);
          state.name = r.scenario.name;
          const list = a => a.map(p => L.label(p) + ' (' + p + ')').join(', ');
          state.notices = [];
          if (r.drift.length)
            state.notices.push(
              L.save.drift(
                r.drift.map(d => L.label(d.path) + ' ' + raw(d.saved) + ' → ' + raw(d.now)).join(', '),
              ),
            );
          if (r.missing.length) state.notices.push(L.save.missing(list(r.missing)));
          if (r.rejected.length) state.notices.push(L.save.rejected(list(r.rejected.map(x => x.path))));
          changed();
          toast(L.save.opened(r.scenario.name));
        }
        function fileName(name) {
          const d = new Date(),
            p = n => String(n).padStart(2, '0'),
            safe = String(name || 'lab')
              .replace(/[\\/:*?"<>|\s]+/g, '-')
              .slice(0, 40);
          return (
            'neon-lab-' +
            safe +
            '-' +
            d.getFullYear() +
            p(d.getMonth() + 1) +
            p(d.getDate()) +
            '-' +
            p(d.getHours()) +
            p(d.getMinutes()) +
            '.json'
          );
        }
        function download(name, text) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        }
        $('tab-save').addEventListener('click', e => {
          const b = e.target.closest('[data-act]');
          if (!b) return;
          const act = b.dataset.act,
            i = Number(b.dataset.i);
          if (act === 'builtin') {
            const bi = Lab.BUILTIN.find(x => x.id === b.dataset.id);
            if (!bi || !confirmReplace()) return;
            state.changes = { ...bi.changes };
            state.sim = cleanSim(bi.sim);
            state.simResults = null;
            state.name = (L.save.builtins[bi.id] || {}).name || bi.id;
            state.notices = [];
            changed();
            toast(L.save.opened(state.name) + ' · ' + L.changed(changeList().length));
          } else if (act === 'store') {
            state.name = ($('s-name').value || '').trim().slice(0, 60);
            const json = Lab.toJSON(scenarioNow(state.name));
            store.saved.unshift(json);
            store.saved = store.saved.slice(0, 50);
            writeStore();
            toast(storeOK ? L.save.saved(parsedSaved(json).scenario.name) : L.save.storageFail);
            renderSave();
          } else if (act === 'export') {
            state.name = ($('s-name').value || '').trim().slice(0, 60);
            download(fileName(state.name), Lab.toJSON(scenarioNow(state.name)));
          } else if (act === 'open') {
            const r = parsedSaved(store.saved[i] || '');
            if (!r.ok) return toast(L.save.badFile);
            if (confirmReplace()) openParsed(r);
          } else if (act === 'file') {
            const r = parsedSaved(store.saved[i] || '');
            if (r.ok) download(fileName(r.scenario.name), store.saved[i]);
          } else if (act === 'remove') {
            const r = parsedSaved(store.saved[i] || '');
            if (!confirm(L.save.removeConfirm(r.ok ? r.scenario.name : '?'))) return;
            store.saved.splice(i, 1);
            writeStore();
            renderSave();
          } else if (act === 'paste') {
            // 에이전트가 대화로 준 시나리오 글(JSON)을 붙여 넣어 연다
            const r = Lab.parseScenario($('s-paste').value || '', base);
            if (!r.ok) return toast(L.save.badFile);
            if (!confirmReplace()) return;
            store.saved.unshift(Lab.toJSON(r.scenario));
            store.saved = store.saved.slice(0, 50);
            writeStore();
            openParsed(r);
          } else if (act === 'copy') copyText();
        });
        $('tab-save').addEventListener('change', e => {
          if (e.target.id === 's-name') {
            state.name = e.target.value.trim().slice(0, 60);
            $('s-text').value = exportText();
            return saveDraft();
          }
          if (e.target.id !== 's-file') return;
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          file.text().then(
            text => {
              const r = Lab.parseScenario(text, base);
              if (!r.ok) return toast(L.save.badFile);
              if (!confirmReplace()) return;
              store.saved.unshift(Lab.toJSON(r.scenario));
              store.saved = store.saved.slice(0, 50);
              writeStore();
              openParsed(r);
            },
            () => toast(L.save.badFile),
          );
        });
        async function copyText() {
          const text = exportText(),
            area = $('s-text');
          area.value = text;
          try {
            await navigator.clipboard.writeText(text);
            return toast(L.save.copied);
          } catch {
            /* 아래 방법으로 */
          }
          area.focus();
          area.select();
          let ok = false;
          try {
            ok = document.execCommand('copy');
          } catch {
            ok = false;
          }
          toast(ok ? L.save.copied : L.save.copyFail);
        }

        // ── 글 복사: 바꾼 값 목록 + 핵심 결과(에이전트가 balance.js에 반영할 때 본다) ──
        function exportText() {
          const list = changeList(),
            out = [
              L.text.head(state.name || Lab.makeScenario({}, base, {}).name),
              L.text.meta(VERSION, base.name, dateText(Date.now())),
              list.length ? L.text.changes(list.length) : L.text.none,
            ];
          for (const a of list)
            out.push('- ' + a.path + ' (' + L.label(a.path) + '): ' + raw(a.from) + ' → ' + raw(a.to));
          const E = exp(),
            lines = econLines();
          if (list.length && lines.length) {
            out.push('', L.text.economy(L.economy.sources[state.source]));
            for (const l of lines) {
              const a = Lab.summarize(base, l.rows),
                b = Lab.summarize(E, l.rows);
              out.push(
                '- ' +
                  l.title +
                  ' (' +
                  l.sub +
                  '): ' +
                  pairText(a.perRun.gold.total, b.perRun.gold.total, 0) +
                  ' · ' +
                  L.economy.perMinute +
                  ' ' +
                  pairText(a.perMinute.gold, b.perMinute.gold, 1) +
                  ' · ' +
                  L.economy.blue +
                  ' ' +
                  pairText(a.perRun.blue, b.perRun.blue, 1),
              );
            }
          }
          const r = state.simResults;
          if (validResults(r) && r.runs.length) {
            const s = r.settings,
              cells = simAggregate(r),
              two = r.sets.includes('exp'),
              desc = [
                s.modes.map(m => T.modeName(m)).join('·'),
                s.crafts.map(c => T.craftName(c)).join('·'),
                L.sim.launches[s.launch],
                L.sim.minute(s.minutes),
                L.sim.stageText(s.stage, s.rushTo ?? Sim.RUSH.to, s.perMin ?? 1),
                L.sim.seedsOf(s.seeds),
              ].join(' · ');
            out.push('', L.text.sim(desc) + (r.key !== simKey() ? ' — ' + L.sim.stale : ''));
            for (const m of s.modes)
              for (const c of [...s.crafts, '*']) {
                const cell = cells[m] && cells[m][c];
                if (!cell) continue;
                out.push(
                  '- ' +
                    T.modeName(m) +
                    ' · ' +
                    (c === '*' ? L.sim.average : T.craftName(c)) +
                    ': ' +
                    simFields
                      .map(([k, d]) => {
                        const a = simValue(cell.now, k, d),
                          b = two ? simValue(cell.exp, k, d) : a;
                        return L.sim.cols[k] + ' ' + (a === b ? a : a + ' → ' + b);
                      })
                      .join(' · '),
                );
              }
          }
          return out.join('\n');
        }

        // ── 시작 ──
        $('sub').textContent = L.sub(VERSION, base.name);
        document.querySelector('.tabs').addEventListener('click', e => {
          const b = e.target.closest('.tab');
          if (b) setTab(b.dataset.tab);
        });
        $('changed').addEventListener('click', () => {
          state.onlyChanged = true;
          $('v-only').checked = true;
          setTab('values');
        });
        syncChip();
        setTab(state.tab);
      })();
    </script>
  </body>
</html>
