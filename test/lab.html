st wear = cosWearChange(p, { [slot]: id }, craft);\n      if (!wear) return fail('storage');\n      p.cos = { ...p.cos, wear };\n      return { ok: true, slot, id };\n    },\n    // 꾸미기 조합 적용(R-243): set = { 칸: id | null(기본) } 1~8칸을 한 거래로 — 바뀌는 칸(cosWorn과 다른 칸) 중 안 가진 조각을\n    // 모두 사고(G · S 합계, 예약된 S는 쓰지 않음) 입힌다. 잠긴 조각이 하나라도 있으면 locked(+ id) · 합계가 화면이 본 expect\n    // { g, s }와 다르면 stale(보인 값과 다른 금액을 빼지 않음). 실패면 아무것도 바꾸지 않는다. 칭호 칸은 건드리지 않음\n    applyCos(p, { txId, set, expect, now, craft }) {\n      if (craft !== undefined && !CRAFT_IDS.includes(craft)) return fail('invalid');\n      if (!validId(txId) || !isObj(set) || !isObj(expect)) return fail('invalid');\n      const slots = Object.keys(set);\n      if (slots.length < 1 || slots.length > COS_SLOTS.length) return fail('invalid');\n      for (const slot of slots) {\n        const id = set[slot];\n        if (!COS_SLOTS.includes(slot) || (id !== null && cosItem(id)?.slot !== slot)) return fail('invalid');\n      }\n      if (p.tx.includes(txId)) return dup();\n      if (!p.opened.includes('cos')) return fail('cos_locked');\n      const worn = cosWorn(p, craft),\n        own = cosOwn(p),\n        change = slots.filter(slot => (worn[slot] ?? null) !== set[slot]);\n      if (!change.length) return dup();\n      const bought = change.map(slot => set[slot]).filter(id => id !== null && !own.includes(id));\n      for (const id of bought) if (cosNeed(p, id)) return { ok: false, reason: 'locked', id };\n      const g = bought.reduce((n, id) => n + count(cosItem(id).g), 0),\n        s = bought.reduce((n, id) => n + count(cosItem(id).s), 0);\n      if ((Number(expect.g) || 0) !== g || (Number(expect.s) || 0) !== s) return fail('stale');\n      const short = (s && scShort(p, now, s)) || (p.gold < g ? 'insufficient' : null);\n      if (short) return fail(short);\n      const wear = cosWearChange(p, Object.fromEntries(change.map(slot => [slot, set[slot]])), craft);\n      if (!wear) return fail('storage');\n      p.gold -= g;\ || p.scHold.prepId !== prepId) return dup();\n      p.scHold = null;\n      return { ok: true };\n    },\n    // 출격 확정: kind = 준비 화면의 출격 단계. 예약 수량이 그 단계 값과 다르거나 단계가 닫혔으면 stale(다른 탭이 단계를 바꿨거나\n    // 옛 화면 — 보인 단계와 다른 수량을 빼지 않음)\n    commitSC(p, { prepId, launchId, kind }) {\n      if (!validId(launchId)) return fail('invalid');\n      if (p.tx.includes(launchId)) return dup();\n      if (!p.scHold || p.scHold.prepId !== prepId) return fail('not_held');\n      const cost = holdN(p.scHold.n);\n      if (cost !== launchTier(kind).cost || !tierOpen(p, kind)) return fail('stale');\n      if (p.superCoins < cost) return fail('insufficient');\n      p.superCoins -= cost;\n      p.scHold = null;\n      remember(p, launchId);\n      return { ok: true, cost };\n    },\n    // 모드 해금 평가는 솔로 판만(월드 판은 밖, R-121)\n    unlock(p, run) {\n      if (run?.launch?.type === 'world') return dup({ newlyUnlocked: [] });\n      const target = unlockTarget(run);\n      if (!target || p.unlockedModes.includes(target)) return dup({ newlyUnlocked: [] });\n      p.unlockedModes = MODES.filter(m => p.unlockedModes.includes(m) || m === target);\n      return { ok: true, newlyUnlocked: [target] };\n    },\n    // GM 패널(R-065, GM 저장소에서만): 넘어온 항목만 바꾼다(다른 칸은 그대로). G · B · S는 0~GM_MAX 정수,\n    // 고양이 Lv 0~maxLevel, 해금 = easy · hard + 고른 모드, 히든 탭. 레벨 0이 된 동반 고양이는 뺀다.\n    // 격납고(R-109): hangar 참/거짓 = 열기 · 닫기, paint 'all' = 세 기체 모든 색 가짐(입힌 색 그대로) · 'none' = 모두 없음\n    // 이정표(R-114): mile 'all' = 넘을 수 있는 이정표 모두 지금 시각(마스터 · 월드 잠김 그대로) · 'none' = 비움(감싼 mileCheck가 지금 상태로 다시 채움)\n    gmSet(p, v = {}, now = 0) {\n      const int = (x, max) => Math.min(max, Math.max(0, Math.floor(Number(x) || 0)));\n      for (const k of ['gold', 'blue', 'superCoins']) if (v[k] !== undefined) p[k] = int(v[k], GM_MAX);\n      for (const id of CATS) if (v.cats?.[id] !== undefined) p.cats[id] = int(v.cats[id], B.cats.maxLevel);\n      if (Array.isArray(v.unlocked))\n        p.unlockedModes = MODES.filter(m => m === 'easy' || m === 'h s.store.cache();\n    }\n    serial(fn) {\n      const job = this.queue.then(async () => {\n        await this.ready;\n        return fn();\n      });\n      this.queue = job.catch(() => {});\n      return job;\n    }\n    result(ok, extra = {}) {\n      return { ok, ...extra, profile: this.snapshot() };\n    }\n    // 이관 전이라 쓰지 못함: 저장 제한 안내와 같은 줄로 알린다\n    limit() {\n      this.storageLimited = true;\n      this.storageReason = T().msg.storage.migrate;\n    }\n    // 한 IndexedDB 트랜잭션 안에서 읽고, 규칙으로 계산하고, 쓴다. 메모리 값은 커밋 뒤에만 바꾼다.\n    transaction(change, recordId) {\n      return new Promise(resolve => {\n        let tx;\n        try {\n          tx = this.store.db.transaction(recordId ? ['profiles', 'records'] : ['profiles'], 'readwrite');\n        } catch {\n          return resolve(this.result(false, { reason: 'storage' }));\n        }\n        let next = null,\n          saved = null,\n          out = null;\n        const profiles = tx.objectStore('profiles'),\n          pr = profiles.get(PROFILE_ID);\n        let profileReady = false,\n          recordReady = !recordId,\n          record = null;\n        const apply = () => {\n          if (!profileReady || !recordReady) return;\n          try {\n            // 저장된 main이 아직 v5가 아니면(부팅 이관 실패) 쓰지 않는다 — 처음 값 없이 v5가 되는 길을 막는다(R-100)\n            if (pr.result && pr.result.schemaVersion !== SCHEMA) {\n              out = { ok: false, reason: 'migrate' };\n              return;\n            }\n            const p = migrate(pr.result),\n              r = record ? root.NeonData.normalizeRecord(record) : null;\n            out = change(p, r, pr.result);\n            next = p;\n            if (out.ok && !out.duplicate) {\n              profiles.put(p);\n              if (out.record) {\n                saved = out.record;\n                tx.objectStore('records').put(saved);\n              }\n            }\n            if (out.ok) for (const doc of out.extra || []) profiles.put(doc);\n            if (out.ok && out.pruneImpor 1): 출격 트랜잭션이 비용을 받고 적용한 것만 온다(launch.buffs), 수치 단계는 buffLv.\n      this.buffList = Array.isArray(launch?.buffs) ? BUFF_IDS.filter(id => launch.buffs.includes(id)) : [];\n      this.buffs = Object.fromEntries(BUFF_IDS.map(id => [id, this.buffList.includes(id)]));\n      this.buffLv = {\n        regen:\n          Number.isSafeInteger(launch?.buffLv?.regen) &&\n          launch.buffLv.regen >= 0 &&\n          launch.buffLv.regen <= 100\n            ? launch.buffLv.regen\n            : BF.regen.hp,\n        revive:\n          Number.isSafeInteger(launch?.buffLv?.revive) &&\n          launch.buffLv.revive >= 0 &&\n          launch.buffLv.revive <= 9\n            ? launch.buffLv.revive\n            : (BF.revive.n ?? 1),\n      };\n      // 도색(R-107): 입힌 색 · 모음 효과. 부활 = 버프 단계 + 도색 · 모음, reviveMax로 자름 · 쓴 수는 revivesUsed\n      this.paint = cleanPaint(launch?.paint);\n      this.reviveTotal = Math.min(\n        PAINT.reviveMax,\n        (this.buffs.revive ? this.buffLv.revive : 0) + this.paint.revive,\n      );\n      this.reviveLeft = this.reviveTotal;\n      this.revivesUsed = 0;\n      this.revived = false;\n      // 출처별 스택: 기체·도색·고양이·영구·준비는 출격 때 고정(판 도중 영구 구매는 다음 출격부터), 획득은 upgrades.\n      // 도색 = 기체 시작 스킬마다 paint.start(정비사 미오와 같은 길, 방어 한도에 세지 않음)\n      this.stacks = {\n        craft: { ...CRAFT_START[this.craft] },\n        paint: this.paint.start\n          ? Object.fromEntries(Object.keys(CRAFT_START[this.craft]).map(id => [id, this.paint.start]))\n          : {},\n        cat: engineer\n          ? Object.fromEntries(Object.keys(CRAFT_START[this.craft]).map(id => [id, engineer]))\n          : {},\n        perma: cleanStacks(launch?.perma),\n        prep: sc ? cleanStacks(launch?.prep) : {},\n      };\n      // 월드: 번개 코일 = 출격 때 연쇄 번개 +단(출처 '월드', 방어 한도 무관) · 필드 스킬 · 월드 보스 대기열 · 전용 난수 둘\n      // (출현 종류 · 각도 · 첫 사격 = spawn 줄, 필드 스킬 종류 · 자리 = drop 줄 → 같은 주는 모두 같은 순서)\n      this.items = [];\n      this.itemSerial = 0;\n      if (this.world) {\n        const coil = (this.world.sk.coil || 0) * WB.sk.coil;\n        this.stacks.world = coil ? { chain: coil } : {};\n        this.wq = [];\n        this.wqSerial = 0;\n        this.spawnLine = { v: (this.initialSeed ^ 0x27d4eb2f) >>> 0 };\n        this.dropLine = { v: (this.initialSeed ^ 0x165667b1) >>> 0 };\n      }\n      this.sCoins = [];\n      this.sCoinSerial = 0;\n      // 월드 판은 재화가 생기지 않는다(S 시간 · 레벨업 · 보스, B 필드 · 코인 칸)\n      this.sCoinNext = this.difficultyId === S_COIN.mode && !this.world ? S_COIN.every : Infinity;\n      this.bCoins = [];\n      this.bCoinSerial = 0;\n      this.bCoinNext = B.bCoin.every;\n      // 맵 물건(R-061): 물건 난수 · 회복 구역(지금 하나 · 번호 · 다음 시각) · 회복한 양 · 보스 S 수\n      this.itemSeed = (this.initialSeed ^ 0x2c1b3c6d) >>> 0;\n      this.bCoinSeed = (this.initialSeed ^ 0x4b1d5e57) >>> 0;\n      // 붕괴 구역(R-072): 전용 난수 · 이번 묶음에 남은 개수 · 다음 하나까지 남은 초\n      this.hazardSeed = (this.initialSeed ^ 0x5bd1e995) >>> 0;\n      this.hazardLeft = 0;\n      this.hazardGap = 0;\n      this.zone = null;\n      this.zoneSerial = 0;\n      this.zoneNext = HEAL.first;\n      this.healed = { zone: 0, buff: 0 };\n      // 시간 압박(R-101): 모드 late 값(hp · damage · density) 중 하나라도 0보다 크면 late.from분에 한 번 —\n      // 떠 있던 회복 구역을 지우고 새로 만들지 않으며 초당 회복(구역 · HP 회복 버프)이 멈춘다. 부활은 그대로.\n      // GM 화면은 launch.gmLate(1~60분)로 앞당겨 시험한다(창 · 회복 멈춤만, 난이도 식은 그대로)\n      const L = this.profile.late,\n        gmLate = Number(launch?.gmLate);\n      this.lateAt =\n        L.hp > 0 || L.damage > 0 || L.density > 0\n          ? (Number.isInteger(gmLate) && gmLate >= 1 ? Math.min(60, gmLate) : L.from) * 60\n          : Infinity;\n      this.lateOn = false;\n      this.bossS = 0;\n      this.siege = Siege()?.create(0) || null;\n      this.siegeStep = { time: 0, stage: 1 };\n      this.siegeWaves = 0;\n      this.p = {\n        x: W / 2,\n        y: H / 2,\n        r: B.player.r,\n        hp: c.hp,\n        maxHp: c.hp,\n        shield: c.shield,\n        maxShield: c.shield,\n        speed: c.speed,\n        damage: c.damage,\n        fire: c.fire,\n        shotCD: 0,\n        dashCD: 0,\n        dashMax: c.dash,\n        dashTime: 0,\n        dx: 1,\n        dy: 0,\n        aim: 0,\n        invuln: 0,\n        novaCD: 0,\n        novaMax: B.nova.cooldown,\n        novaRadius: B.nova.radius,\n        novaDamage: B.nova.damage,\n        magnet: B.player.magnet,\n        multi: 1,\n        pierce: 0,\n        crit: B.player.crit,\n        critScale: B.player.critScale,\n        orbits: 0,\n        orbitDamage: B.orbit.damage,\n        xp: 0,\n        level: 1,\n        nextXP: B.level.base,\n        noHit: 0,\n      };\n      const p = this.p;\n      // GM 실험 칸(R-065): 일반 출격의 시작 STAGE(2 이상 정수, 최대 999). 지난 보스는 없고 보스는 다음 every 배수부터\n      const gm = Number(launch?.gmStage);\n      if (!sc && Number.isInteger(gm) && gm >= 2) this.launch.startStage = Math.min(999, gm);\n      this.stage = this.launch.startStage;\n      p.level = this.launch.startLevel;\n      p.nextXP = B.level.base + (p.level - 1) * B.level.step;\n      this.recalculate();\n      p.hp = p.maxHp;\n      p.shield = p.maxShield;\n      // 출격 때 보호막이 가득이면 처음부터 준비(최대치 0이면 없음)\n      this.shieldReady = this.link.shield > 0 && p.maxShield > 0;\n      return this;\n    }\n    // 스킬 스택 합계(기체·도색·고양이·영구·준비·획득). 능력치와 상한은 합계로 계산한다.\n    stack(id) {\n      const s = this.stacks;\n      return (\n        (s.craft[id] || 0) +\n        (s.paint[id] || 0) +\n        (s.cat[id] || 0) +\n        (s.perma[id] || 0) +\n        (s.prep[id] || 0) +\n        (this.upgrades[id] || 0) +\n        ((s.world && s.world[id]) || 0)\n      );\n    }\n    // 월드 판에서 방어 스킬이 그 모드 방어 한도에 닿았는가(필드 스킬을 주울 수 없음, R-120)\n    defenseFull(id) {\n      return B.defense.includes(id) && this.defenseUsed(id) >= this.profile.defenseCap;\n    }\n    // 월드 판은 화면과 상관없는 고정 출현 거리(R-119 결정 조건)\n    spawnDist() {\n      return this.world ? WB.view.spawn : this.spawnRadius;\n    }\n    spawnRng() {\n      return stream(this.spawnLine);\n    }\n    dropRng() {\n      return stream(this.dropLine);\n    }\n    // 물리 상한에 닿은 스킬(넘친 스택만 남음). 상한이 없는 스킬은 false.\n    isCapped(id) {\n      const cap = skillCaps(this.craft)[id];\n      return cap !== undefined && this.stack(id) >= cap;\n    }\n    // 방어 한도는 준비+획득만 센다.\n    defenseUsed(id) {\n      return (this.stacks.prep[id] || 0) + (this.upgrades[id] || 0);\n    }\n    emit(type, data = {}) {\n      const event = { type, t: Number(this.time.toFixed(3)), stage: this.stage, ...data };\n      if (this.events.length < 600) this.events.push(event);\n      if (this.onEvent && !['hit', 'shoot', 'pickup'].includes(type)) this.onEvent(event);\n    }\n    drain() {\n      const a = this.events;\n      this.events = [];\n      return a;\n    }\n    pause() {\n      if (this.mode === 'playing') {\n        this.mode = 'paused';\n        this.emit('pause');\n      }\n    }\n    resume() {\n      if (this.mode === 'paused') {\n        this.mode = 'playing';\n        this.emit('resume');\n      }\n    }\n    stageUp() {\n      if (this.mode !== 'playing') return false;\n      return this.raiseStage(false);\n    }\n    // 최종전 관문(R-298, 솔로만): 'lock' = final.stage − 1에서 보스 웨이브가 남음 · 'ready' = 다 끝내 한 번에 오를 수 있음 ·\n    // 'on' = HELIOS 웨이브가 있음(오르지 못함). 해당 없으면 null(월드 · 이미 이긴 판 · 다른 STAGE)\n    finalState() {\n      if (!FIN || this.world) return null;\n      if (this.bossWaves.some(w => w.final)) return 'on';\n      if (this.finalDone || this.stage !== FIN.stage - 1) return null;\n      return this.bossWaves.length ? 'lock' : 'ready';\n    }\n    // Stage를 한 칸 올린다(버튼 · 자동 승격 공통). 보스 Stage면 수동과 똑같이 보스 웨이브를 만든다.\n    // 최종전 관문: 자동 승격은 final.stage − 1에서 기다리고, 버튼은 그 STAGE 보스 웨이브까지 다 끝낸 뒤 한 번에 final.stage로.\n    // HELIOS가 있는 동안은 오르지 않는다. 오르지 못하면 false\n    raiseStage(auto) {\n      const gate = this.finalState();\n      if (gate === 'on' || gate === 'lock' || (gate === 'ready' && auto)) return false;\n      this.stage++;\n      if (gate === 'ready') {\n        this.bossWaves.push({\n          waveId: ++this.waveSerial,\n          originStage: this.stage,\n          total: 1,\n          remaining: 1,\n          alive: 0,\n          final: true,\n        });\n        this.pendingBoss = this.bossWaves.length;\n      } else if (this.stage % B.boss.every === 0) {\n        const total = B.boss.base + Math.floor(this.stage / B.boss.per);\n        this.bossWaves.push({\n          waveId: ++this.waveSerial,\n          originStage: this.stage,\n          total,\n          remaining: total,\n          alive: 0,\n        });\n        this.pendingBoss = this.bossWaves.length;\n      }\n      this.emit('stage', {\n        to: this.stage,\n        rules: stageRules(this.stage, this.profile, this.time),\n        hp: this.p.hp,\n        level: this.p.level,\n        skills: { ...this.upgrades },\n        ...(auto ? { auto: true } : {}),\n        ...(gate === 'ready' ? { final: true } : {}),\n      });\n      return true;\n    }\n    // Insane S 코인 하나: 기체에서 near~far 거리의 무작위 방향, 맵 가장자리 margin 안(벗어나면 방향을 다시 뽑는다).\n    spawnSCoin() {\n      const p = this.p,\n        C = S_COIN,\n        inside = (x, y) => x >= C.margin && x <= W - C.margin && y >= C.margin && y <= H - C.margin;\n      let x = p.x,\n        y = p.y;\n      for (let i = 0; i < 8; i++) {\n        const a = this.rng() * TAU,\n          d = C.near + this.rng() * (C.far - C.near);\n        x = p.x + M.cos(a) * d;\n        y = p.y + M.sin(a) * d;\n        if (inside(x, y)) break;\n      }\n      const coin = {\n        id: ++this.sCoinSerial,\n        x: clamp(x, C.margin, W - C.margin),\n        y: clamp(y, C.margin, H - C.margin),\n        r: C.r,\n      };\n      this.sCoins.push(coin);\n      this.emit('s_spawn', { id: coin.id, x: coin.x, y: coin.y, src: 'time' });\n    }\n    // 맵 전역 S 코인(R-061): src 'level'(레벨업) · 'boss'(보스 웨이브 격파). 번호 줄 · 줍기 · 지급 길은 5분 S와 같다.\n    dropSCoin(src) {\n      const at = this.mapPoint(S_COIN.margin),\n        coin = { id: ++this.sCoinSerial, x: at.x, y: at.y, r: S_COIN.r };\n      this.sCoins.push(coin);\n      this.emit('s_spawn', { id: coin.id, x: coin.x, y: coin.y, src });\n    }\n    dropBCoin(src) {\n      const at = this.bCoinPoint(B.bCoin.margin),\n        coin = { id: ++this.bCoinSerial, x: at.x, y: at.y, r: B.bCoin.r };\n      this.bCoins.push(coin);\n      this.emit('b_spawn', { id: coin.id, x: coin.x, y: coin.y, src });\n    }\n    // 붕괴 구역 하나(R-072): 기체에서 offset 거리, 방향은 붕괴 구역 난수. 자리가 맵 가장자리 100 밖이면 방향을 다시\n    // 뽑고(최대 4번) 그래도 밖이면(구석) 맵 가운데 쪽 방향으로 놓는다 → 벽 · 구석에서도 거리가 지켜진다.\n    // 마지막으로 가장자리 100 안에 잘라 붙인다(기체가 맵 끝에 붙어 있을 때만 몇 px). 반경은 생길 때 Stage로(0.01 단위)\n    spawnHazard() {\n      const HZ = B.hazard,\n        p = this.p,\n        inside = (x, y) => x >= 100 && x <= W - 100 && y >= 100 && y <= H - 100;\n      let x = p.x,\n        y = p.y;\n      for (let i = 0; i < 4; i++) {\n        const a = this.hazardRng() * TAU;\n        x = p.x + M.cos(a) * HZ.offset;\n        y = p.y + M.sin(a) * HZ.offset;\n        if (inside(x, y)) break;\n      }\n      if (!inside(x, y)) {\n        const a = M.atan2(H / 2 - p.y, W / 2 - p.x);\n        x = p.x + M.cos(a) * HZ.offset;\n        y = p.y + M.sin(a) * HZ.offset;\n      }\n      const grow = Math.min(HZ.growMax, Math.floor(this.stage / HZ.growEvery)),\n        r = Math.round(HZ.r * (1 + HZ.grow * grow) * 100) / 100;\n      this.hazards.push({\n        x: clamp(x, 100, W - 100),\n        y: clamp(y, 100, H - 100),\n        r,\n        timer: HZ.delay,\n        fuse: HZ.delay,\n        done: false,\n        stage: this.stage,\n      });\n      this.emit('warning', { r });\n    }\n    // 회복 구역(R-061): 맵 아무 곳에 life초 동안 하나(동시 1개). 반지름 = 보스 반지름 × sizes 중 하나\n    spawnZone() {\n      const sizes = HEAL.sizes,\n        r = STATS.boss.r * sizes[Math.floor(this.itemRng() * sizes.length)],\n        at = this.mapPoint(HEAL.margin);\n      this.zone = { id: ++this.zoneSerial, x: at.x, y: at.y, r, until: this.time + HEAL.life };\n      this.emit('zone', { id: this.zone.id, x: at.x, y: at.y, r });\n    }\n    // regular: 월드 판의 정규 출현(종류 · 각도 · 첫 사격을 spawn 줄에서). 분열 · 포위 · 보스 · 졸개는 엔진 rng.\n    // spawn 줄은 적 상한으로 못 내는 때에도 먼저 뽑아 둔다(같은 주의 출현 순서가 모두 같게)\n    spawn(kind, x, y, originStage = this.stage, regular = false) {\n      const wboss = Object.prototype.hasOwnProperty.call(WSTATS, kind),\n        line = regular && this.world ? [this.spawnRng(), this.spawnRng()] : null;\n      if (this.enemies.length >= B.caps.enemies) {\n        if (kind !== 'boss' && !wboss) return null;\n        const idx = this.enemies.findIndex(e => e.kind !== 'boss' && !e.wboss);\n        if (idx < 0) return null;\n        this.enemies.splice(idx, 1);\n      }\n      if (kind === 'boss' && this.enemies.filter(e => !e.dead && e.kind === 'boss').length >= B.boss.alive)\n        return null;\n      const s = (wboss && WSTATS[kind]) || STATS[kind] || STATS.chaser,\n        rules = stageRules(originStage, this.profile, this.time),\n        a = (line ? line[0] : this.rng()) * TAU;\n      if (x === undefined) {\n        const r = this.spawnDist();\n        x = clamp(this.p.x + M.cos(a) * r, 40, W - 40);\n        y = clamp(this.p.y + M.sin(a) * r, 40, H - 40);\n      }\n      const e = {\n        id: ++this.serial,\n        kind,\n        x,\n        y,\n        ...s,\n        hp: s.hp * rules.hp * this.profile.hp,\n        maxHp: s.hp * rules.hp * this.profile.hp,\n        speed: s.speed * rules.speed,\n        damage: s.damage * rules.damage * this.profile.damage,\n        xp: s.xp * rules.xp * this.profile.xp,\n        reward: s.score * rules.score * this.profile.score,\n        stage: originStage,\n        // 보스 단계(R-057, 1 → 2 → 3). 다른 적은 0\n        phase: kind === 'boss' ? 1 : 0,\n        born: B.spawn.born,\n        shot: B.hostile.firstShot + (line ? line[1] : this.rng()),\n        orbitCD: 0,\n        angle: a,\n        dead: false,\n      };\n      // 월드 보스(R-120): ws = 0 다가옴 · 1 예고 · 2 돌진(LANCER), wt = 다음 행동까지 남은 초. HUD 보스 칸 · 경고음은 'boss' 길\n      if (wboss) {\n        e.wboss = true;\n        e.ws = 0;\n        e.wt = s.every;\n        if (kind === 'hive') e.shot = s.shot;\n      }\n      this.enemies.push(e);\n      if (kind === 'boss') this.emit('boss', { enemyStage: originStage, id: e.id });\n      if (wboss) this.emit('boss', { enemyStage: originStage, id: e.id, world: kind });\n      return e;\n    }\n    abilityContext(ability, refresh = false) {\n      if (refresh || !this.contextCache) {\n        const p = this.p;\n        let nearEnemies = 0,\n          novaEnemies = 0,\n          nearProjectiles = 0,\n          incomingProjectiles = 0,\n          hazards = 0;\n        const threats = {};\n        const add = (kind, attack) => {\n          const key = kind + '/' + attack;\n          threats[key] = (threats[key] || 0) + 1;\n        };\n        for (const e of this.enemies) {\n          if (e.dead || e.born > 0) continue;\n          const d2 = sq(e.x - p.x) + sq(e.y - p.y);\n          if (d2 < 250 * 250) {\n            nearEnemies++;\n            add(e.kind, 'contact');\n          }\n          if (d2 < sq(p.novaRadius + e.r)) novaEnemies++;\n        }\n        for (const b of this.hostiles) {\n          if (b.ttl <= 0) continue;\n          const dx = b.x - p.x,\n            dy = b.y - p.y,\n            d2 = dx * dx + dy * dy;\n          if (d2 < 250 * 250) {\n            nearProjectiles++;\n            add(b.source?.kind || 'unknown', 'projectile');\n          }\n          const v2 = b.vx * b.vx + b.vy * b.vy,\n            t = v2 ? clamp(-(dx * b.vx + dy * b.vy) / v2, 0, 0.6) : 0;\n          if (t > 0 && sq(dx + b.vx * t) + sq(dy + b.vy * t) < 55 * 55) incomingProjectiles++;\n        }\n        for (const h of this.hazards)\n          if (!h.done && h.timer <= 0.7 && sq(h.x - p.x) + sq(h.y - p.y) < sq(h.r + p.r + 25)) {\n            hazards++;\n            add('hazard', 'floor');\n          }\n        this.contextCache = {\n          sampledAt: this.time,\n          nearEnemies,\n          novaEnemies,\n          nearProjectiles,\n          incomingProjectiles,\n          hazards,\n          threat: nearEnemies + incomingProjectiles + hazards,\n          threatSources: threats,\n          hp: p.hp,\n          maxHp: p.maxHp,\n          shield: p.shield,\n          maxShield: p.maxShield,\n        };\n      }\n      const c = this.contextCache;\n      return {\n        ...c,\n        threatSources: { ...c.threatSources },\n        ability,\n        opportunity:\n          ability === 'nova'\n            ? c.novaEnemies >= 3 || c.incomingProjectiles >= 2 || c.hazards > 0\n            : c.nearEnemies >= 3 || c.incomingProjectiles > 0 || c.hazards > 0,\n      };\n    }\n    // 대시·충격파 시도. 재충전 중·전투 밖 누름은 개수만 센다(주변 위험 계산·상세 기록 없음, R-003).\n    abilityAttempt(ability, source) {\n      const u = this.abilityUsage[ability],\n        cooldown = this.p[ability + 'CD'];\n      u.attempts++;\n      if (this.mode !== 'playing' || cooldown > 0) {\n        u.rejects++;\n        if (cooldown > 0) u.cooldownRejects++;\n        this.emit('ability_rejected', {\n          ability,\n          source,\n          reason: this.mode === 'playing' ? 'cooldown' : 'state',\n        });\n        return null;\n      }\n      const context = this.abilityContext(ability, true);\n      this.emit('ability_attempt', { ability, source, accepted: true, cooldown, context });\n      u.activations++;\n      if (context.opportunity) {\n        u.opportunityActivations++;\n        u.usesInOpportunity++;\n      }\n      return context;\n    }\n    finishDashEffect() {\n      const f = this.dashEffect;\n      if (!f) return;\n      const post = this.abilityContext('dash', true),\n        effect = {\n          distanceMoved: f.distance,\n          threatReductionUses: Number(post.threat < f.context.threat),\n          protectedThreatEpisodes: Number(f.protectedThreat),\n          healthDamage: f.healthDamage,\n          absorbed: f.absorbed,\n          preThreat: f.context.threat,\n          postThreat: post.threat,\n          proxy: true,\n        };\n      for (const [k, v] of Object.entries(effect))\n        if (typeof v === 'number') {\n          this.abilityUsage.dash.effects[k] = (this.abilityUsage.dash.effects[k] || 0) + v;\n          if (k in this.abilityUsage.dash) this.abilityUsage.dash[k] += v;\n        }\n      this.emit('ability_effect', {\n        ability: 'dash',\n        source: f.source,\n        context: f.context,\n        postContext: post,\n        effect,\n      });\n      this.dashEffect = null;\n    }\n    dash(input = {}, source = 'keyboard') {\n      const p = this.p,\n        context = this.abilityAttempt('dash', source);\n      if (!context) return false;\n      this.finishDashEffect();\n      let x = Number(input.x) || 0,\n        y = Number(input.y) || 0;\n      if (!x && !y) {\n        x = p.dx;\n        y = p.dy;\n      }\n      const n = M.hypot(x, y) || 1;\n      p.dx = x / n;\n      p.dy = y / n;\n      const previousInvuln = p.invuln;\n      p.dashTime = B.dash.time;\n      p.dashCD = p.dashMax;\n      p.invuln = Math.max(p.invuln, B.dash.invuln);\n      this.dashEffect = {\n        source,\n        context,\n        distance: 0,\n        healthDamage: 0,\n        absorbed: 0,\n        protectedThreat: false,\n        previousInvulnRemaining: previousInvuln,\n        dashInvulnRemaining: B.dash.invuln,\n      };\n      // 연계 회복 자격(R-300): 이 대시의 시작 시각\n      if (this.link.heal) this.linkDash = this.time;\n      this.emit('dash', { x: p.x, y: p.y, source, context });\n      return true;\n    }\n    nova(source = 'keyboard') {\n      const p = this.p,\n        context = this.abilityAttempt('nova', source);\n      if (!context) return false;\n      p.novaCD = p.novaMax;\n      this.novaFlash = 0.65;\n      this.shake = 0.2;\n      this.emit('nova', { x: p.x, y: p.y, r: p.novaRadius, source, context });\n      // 연계 회복(R-300): 성공한 대시 시작부터 window초 미만의 수동 충격파 → HP(대시 하나에 한 번 · 최대 HP까지, full이어도 씀)\n      if (this.linkDash !== null && this.time - this.linkDash < LK.window) {\n        const v = Math.min(p.maxHp - p.hp, LK.heal[this.link.heal - 1]);\n        p.hp += v;\n        this.linkDash = null;\n        this.emit('link_heal', { x: p.x, y: p.y, value: Math.round(v) });\n      }\n      // 처치 원인(R-300): 이 충격파의 직접 처치만 'nova'(부활 충격파 · 보호막 붕괴 · 레이저는 아님)\n      this.cause = 'nova';\n      const effect = this.blast();\n      this.cause = null;\n      for (const [k, v] of Object.entries(effect)) {\n        this.abilityUsage.nova.effects[k] += v;\n        this.abilityUsage.nova[k] += v;\n      }\n      this.emit('ability_effect', { ability: 'nova', source, context, effect });\n      return true;\n    }\n    // 충격파 한 번의 효과: 반경 안 적 피해 · 밀어내기 · 적 탄 지우기(보스 웨이브 끝은 다 맞힌 뒤에 본다).\n    // 충격파 버튼(nova)과 1회 부활(R-062)이 함께 쓴다. 재충전 · 사용 기록은 nova만 한다.\n    blast() {\n      const p = this.p,\n        effect = { effectiveDamage: 0, kills: 0, targetsHit: 0, projectilesCleared: 0 },\n        wave = this.bossWaves[0];\n      this.deferWaveCompletion = true;\n      for (const e of [...this.enemies])\n        if (!e.dead && e.born <= 0 && dist(e, p) < p.novaRadius + e.r) {\n          effect.effectiveDamage += Math.min(Math.max(0, e.hp), p.novaDamage);\n          effect.targetsHit++;\n          this.hit(e, p.novaDamage, true);\n          if (e.dead) effect.kills++;\n          const a = M.atan2(e.y - p.y, e.x - p.x);\n          e.x += M.cos(a) * B.nova.push;\n          e.y += M.sin(a) * B.nova.push;\n        }\n      this.hostiles = this.hostiles.filter(b => {\n        if (dist(b, p) <= p.novaRadius) {\n          effect.projectilesCleared++;\n          return false;\n        }\n        return true;\n      });\n      this.deferWaveCompletion = false;\n      this.finishBossWave(wave);\n      return effect;\n    }\n    bossInfo() {\n      const wave = this.bossWaves[0],\n        bosses = this.enemies.filter(e => !e.dead && (e.kind === 'boss' || e.wboss));\n      return {\n        alive: bosses.length,\n        total: wave?.total || bosses.length,\n        remaining: wave?.remaining || 0,\n        originStage: wave?.originStage || bosses[0]?.stage || 0,\n        hp: bosses.reduce((n, e) => n + Math.max(0, e.hp), 0),\n        maxHp: bosses.reduce((n, e) => n + e.maxHp, 0),\n        pending: this.bossWaves.slice(1).reduce((n, w) => n + w.remaining, 0),\n      };\n    }\n    finishBossWave(wave = this.bossWaves[0]) {\n      if (!wave || wave !== this.bossWaves[0] || wave.remaining || wave.alive || this.deferWaveCompletion)\n        return;\n      const cleared = this.hostiles.length;\n      this.hostiles = [];\n      this.gems.forEach(b => {\n        b.x = this.p.x;\n        b.y = this.p.y;\n      });\n      this.bossWaves.shift();\n      this.pendingBoss = this.bossWaves.length;\n      this.bossTop = Math.max(this.bossTop, wave.originStage || 0);\n      this.emit('boss_wave_complete', {\n        waveId: wave.waveId,\n        originStage: wave.originStage,\n        total: wave.total,\n        cleared,\n        ...(wave.final ? { final: true } : {}),\n      });\n      // 레이저 강화(R-301): 솔로 Insane 일반 보스 웨이브(HELIOS 아님)를 다 끝냈고 원래 STAGE ≥ 다음 문턱이면 +1(웨이브 하나에 한 번).\n      // 재충전 진행률 보존: 남은 시간 ÷ 옛 간격 × 새 간격\n      if (\n        this.lzLv >= 1 &&\n        this.lzLv < LZ.every.length &&\n        this.difficultyId === LZ_MODE &&\n        !this.world &&\n        !wave.final &&\n        (wave.originStage || 0) >= LZ.need[this.lzLv - 1]\n      ) {\n        const old = LZ.every[this.lzLv - 1];\n        this.lzLv++;\n        this.lzLeft = (this.lzLeft / old) * LZ.every[this.lzLv - 1];\n        this.emit('laser_up', { waveId: wave.waveId, lv: this.lzLv, every: LZ.every[this.lzLv - 1] });\n      }\n      // 보스 S(R-061): Insane에서 웨이브를 다 잡을 때마다 맵 아무 곳에 1개(판당 bossMax)\n      if (\n        this.difficultyId === S_COIN.mode &&\n        !this.world &&\n        this.bossS < S_COIN.bossMax &&\n        this.sCoins.length < S_COIN.max\n      ) {\n        this.bossS++;\n        this.dropSCoin('boss');\n      }\n    }\n    spawnBossWave() {\n      const wave = this.bossWaves[0];\n      if (!wave) return;\n      // 동시에 나와 있는 보스는 boss.alive마리까지(spawn이 전체 보스 수로 한 번 더 막는다)\n      while (wave.remaining > 0 && wave.alive < B.boss.alive) {\n        const e = wave.final\n          ? this.spawnFinal(wave)\n          : this.spawn('boss', undefined, undefined, wave.originStage);\n        if (!e) break;\n        e.waveId = wave.waveId;\n        wave.remaining--;\n        wave.alive++;\n      }\n      this.finishBossWave(wave);\n    }\n    // HELIOS 한 마리(R-298): 보스 길(kind 'boss' · 보상 · 보스 줄 · 화면 밖 화살표)을 쓰고 final 값으로 바꾼다.\n    // 체력 · Point · XP = 기본 × 모드 · STAGE 배율(진입 시각 시간 압박 포함, 뒤에 다시 늘리지 않음)\n    spawnFinal(wave) {\n      const e = this.spawn('boss', undefined, undefined, wave.originStage);\n      if (!e) return null;\n      const rules = stageRules(wave.originStage, this.profile, this.time),\n        pf = this.profile;\n      Object.assign(e, {\n        final: 1,\n        r: FIN.r,\n        hp: FIN.hp * rules.hp * pf.hp,\n        maxHp: FIN.hp * rules.hp * pf.hp,\n        xp: FIN.xp * rules.xp * pf.xp,\n        reward: FIN.score * rules.score * pf.score,\n        speed: FIN.move,\n        // fp 단계 1~5 · swap 전환 남은 초 · ct 공격 주기 안 시각 · len 주기 길이 · cy 이 단계 주기 수 · oa 기체 둘레 자리 각\n        fp: 1,\n        swap: 0,\n        ct: 0,\n        len: 0,\n        cy: 0,\n        oa: M.atan2(e.y - this.p.y, e.x - this.p.x),\n        gapA: 0,\n        spin: 1,\n        sa: 0,\n        fa: 0,\n        ga: 0,\n        tell: null,\n        ray: null,\n        dashT: 0,\n        shift: 0,\n      });\n      e.damage = this.finDamage(1) * FIN.bodyX;\n      return e;\n    }\n    // HELIOS 탄 피해 = 모드 1단계 피해 × 단계 배율 × 시간 압박(1 + late.damage × 넘은 분). 쏜 순간 값으로 고정\n    finDamage(ph) {\n      const L = this.profile.late,\n        over = Math.max(0, this.time / 60 - L.from);\n      return (FIN.damage[this.difficultyId] ?? FIN.damage.easy) * FIN.phaseX[ph - 1] * (1 + L.damage * over);\n    }\n    // 휴지 구간 배율: 시간 압박의 출현 배율로 줄이되 minGap 아래로는 줄이지 않는다(예고 · 정지는 그대로)\n    finRest() {\n      const L = this.profile.late,\n        over = Math.max(0, this.time / 60 - L.from);\n      return Math.max(FIN.minGap, 1 / (1 + L.density * over));\n    }\n    // HELIOS 탄 한 발: 단계 속도 × 모드 탄속(max까지). HELIOS 탄 cap · 전역 상한이면 버린다(나중에 몰아 내지 않음)\n    finShot(e, a, dmg) {\n      if (this.finShots >= FIN.cap || this.hostiles.length >= B.caps.hostiles) return;\n      const sp = Math.min(FIN.shot.max, FIN.shot.speed[e.fp - 1] * this.profile.bulletSpeed),\n        c = M.cos(a),\n        n = M.sin(a);\n      this.hostiles.push({\n        x: e.x + c * e.r,\n        y: e.y + n * e.r,\n        vx: c * sp,\n        vy: n * sp,\n        ttl: FIN.shot.life,\n        damage: dmg,\n        fin: 1,\n        source: { kind: 'boss', stage: e.stage, attack: 'projectile' },\n      });\n      this.finShots++;\n    }\n    // 고리 n방향(gapA 둘레 gap 라디안은 비움). 상한 때문에 다 못 내면 남은 방향을 고르게 줄인다(틈은 그대로)\n    finRing(e, n, a0, gapA, gap, dmg) {\n      const list = [];\n      for (let i = 0; i < n; i++) {\n        const a = a0 + (i * TAU) / n;\n        if (!(gap > 0 && Math.abs(angDiff(a, gapA)) < gap / 2)) list.push(a);\n      }\n      const room = Math.min(list.length, FIN.cap - this.finShots, B.caps.hostiles - this.hostiles.length);\n      for (let k = 0; k < room; k++) this.finShot(e, list[Math.floor((k * list.length) / room)], dmg);\n    }\n    // HELIOS 행동(R-298, PLANNING 4.2): 체력 경계마다 단계(한 타격에 여럿이면 도달 단계로 한 번) → swap초 멈춤 · HELIOS 탄 · 광선만 지움.\n    // 단계별 주기: 1 틈 고리 · 2 부채꼴 두 묶음 · 3 나선(두 주기마다 반전) · 4 광선 + 틈 고리 · 5 돌진 + 틈 고리 세 겹.\n    // 예고(tell)는 렌더러가 그린다. lockT(봉쇄)면 공격 · 광선 · 돌진이 멈추고(해제 뒤 예고부터), freezeT(빙결)면 이동 · 돌진이 멈춘다.\n    // aim = HELIOS에서 기체 쪽 각\n    finalAI(e, dt, aim) {\n      const p = this.p,\n        ph = 1 + FIN.phases.filter(t => e.hp <= e.maxHp * t).length;\n      if (ph > e.fp) {\n        e.fp = ph;\n        e.swap = FIN.swap;\n        e.ct = e.len = e.cy = e.dashT = e.shift = 0;\n        e.tell = e.ray = null;\n        this.hostiles = this.hostiles.filter(b => !b.fin);\n        this.finShots = 0;\n        this.emit('final_phase', { x: e.x, y: e.y, id: e.id, phase: ph });\n      }\n      const dmg = this.finDamage(e.fp);\n      e.damage = dmg * FIN.bodyX;\n      if (e.tell && (e.tell.t -= dt) <= 0) e.tell = null;\n      if (e.swap > 0) {\n        e.swap -= dt;\n        return;\n      }\n      const lock = e.lockT > 0,\n        freeze = e.freezeT > 0;\n      // 이동: 돌진 · 재배치 · 기체 둘레(보이는 영역 안 타원) 자리로 다가감\n      if (!freeze) {\n        if (e.dashT > 0) {\n          e.dashT -= dt;\n          e.x += e.vx * dt;\n          e.y += e.vy * dt;\n        } else {\n          const v = this.view,\n            rx = v ? Math.min(300, v.hw * 0.7) : 300,\n            ry = v ? Math.min(300, v.hh * 0.7) : 300,\n            tx = clamp(p.x + M.cos(e.oa) * rx, 90, W - 90),\n            ty = clamp(p.y + M.sin(e.oa) * ry, 90, H - 90),\n            dx = tx - e.x,\n            dy = ty - e.y,\n            d = M.hypot(dx, dy),\n            sp = (e.shift > 0 ? FIN.shift : FIN.move) * dt;\n          if (e.shift > 0) e.shift -= dt;\n          if (d > 2) {\n            e.x += (dx / d) * Math.min(d, sp);\n            e.y += (dy / d) * Math.min(d, sp);\n          }\n        }\n      } else e.dashT = 0;\n      // 광선 피해(폭 24 · 프레임마다 겹치지 않음 = 피격 무적)\n      if (e.ray && (e.ray.t -= dt) > 0 && !lock) {\n        const dx = p.x - e.x,\n          dy = p.y - e.y,\n          c = M.cos(e.ray.a),\n          n = M.sin(e.ray.a);\n        if (dx * c + dy * n > 0 && Math.abs(dy * c - dx * n) < 12 + p.r)\n          this.hurt(dmg * FIN.rayX, { kind: 'boss', stage: e.stage, attack: 'ray' });\n      } else e.ray = null;\n      if (lock) {\n        // 봉쇄: 진행 공격 취소 → 해제 뒤 새 주기(예고부터)\n        e.ct = e.len = e.dashT = 0;\n        e.tell = e.ray = null;\n        return;\n      }\n      const r = this.finRest(),\n        t0 = e.ct,\n        at = t => t0 <= t && t0 + dt > t,\n        gap = Math.PI / 3;\n      if (!e.len) {\n        // 새 주기: 길이(휴지 구간만 r배) · 자리 이동 · 첫 예고\n        e.len = [0.6 + 1.4 * r, 0.95 + 1.05 * r, 2 + r, 1.6 + 2.4 * r, 2.5 + 1.5 * r][e.fp - 1];\n        e.oa += e.cy % 2 ? -0.45 : 0.45;\n        if (e.fp === 2 && e.cy === 0) {\n          // 2단계 시작: 옆으로 재배치\n          e.oa += Math.PI / 2;\n          e.shift = 0.35;\n        }\n        if (e.fp === 1) {\n          e.gapA = aim + Math.PI / 2 + e.cy * 0.35;\n          e.tell = { k: 'gap', t: 0.6, a: e.gapA };\n        } else if (e.fp === 2) e.tell = { k: 'fan', t: 0.6, a: aim };\n        else if (e.fp === 4) e.tell = { k: 'ray', t: 0.8, a: aim };\n        else if (e.fp === 5) {\n          const len = FIN.charge * 0.4;\n          e.tell = {\n            k: 'dash',\n            t: 0.6,\n            a: aim,\n            x: clamp(e.x + M.cos(aim) * len, 18, W - 18),\n            y: clamp(e.y + M.sin(aim) * len, 18, H - 18),\n          };\n        }\n      }\n      if (e.fp === 1) {\n        if (at(0.6)) this.finRing(e, 24, e.gapA, e.gapA, gap, dmg);\n      } else if (e.fp === 2) {\n        // 폭 120° · 9발 부채꼴 두 묶음(0.35초 간격, 둘째는 반 칸 엇갈림)\n        const fan = (c, off) => {\n          for (let i = 0; i < 9; i++) this.finShot(e, c - Math.PI / 3 + (i * Math.PI) / 12 + off, dmg);\n        };\n        if (at(0.6)) {\n          e.fa = e.tell?.a ?? aim;\n          fan(e.fa, 0);\n        }\n        if (at(0.95)) fan(e.fa, Math.PI / 24);\n      } else if (e.fp === 3) {\n        // 2초 동안 0.1초마다 나선 2발 · 1초 휴지, 두 주기마다 반전(0.6초 전 예고)\n        for (let k = 0; k < 20; k++)\n          if (at(k * 0.1)) {\n            e.sa += 0.32 * e.spin;\n            this.finShot(e, e.sa, dmg);\n            this.finShot(e, e.sa + Math.PI, dmg);\n          }\n        if (e.cy % 2 === 1 && at(e.len - 0.6)) e.tell = { k: 'spin', t: 0.6, d: -e.spin };\n      } else if (e.fp === 4) {\n        // 예고 동안 기체를 따라가다 끝나기 0.2초 전에 방향 고정 → 광선 0.8초 → 휴지 → 32방향 틈 고리\n        if (e.tell?.k === 'ray' && e.tell.t > 0.2) e.tell.a = aim;\n        if (at(0.8)) e.ray = { a: e.tell?.a ?? aim, t: 0.8 };\n        if (at(1.6 + 0.8 * r)) this.finRing(e, 32, aim, aim, gap, dmg);\n      } else if (e.fp === 5) {\n        // 예고(직선 · 끝점) → 돌진 0.4초 → 정지 1초 → 틈을 맞춘 32방향 고리 세 겹(0.25초 간격)\n        if (at(0.6) && !freeze) {\n          const ang = e.tell?.a ?? aim;\n          e.vx = M.cos(ang) * FIN.charge;\n          e.vy = M.sin(ang) * FIN.charge;\n          e.dashT = 0.4;\n        }\n        if (at(2)) e.ga = aim;\n        for (const t of [2, 2.25, 2.5]) if (at(t)) this.finRing(e, 32, e.ga, e.ga, gap, dmg);\n      }\n      e.ct += dt;\n      if (e.ct >= e.len) {\n        if (e.fp === 3 && e.cy % 2 === 1) e.spin = -e.spin;\n        e.ct = e.len = 0;\n        e.cy++;\n      }\n    }\n    // 성공 창에서 '이어서 하기'(R-298): 정규 출현 · 붕괴가 돌아오고 다음 STAGE부터 기존 규칙. 쓰러진 채면 이어갈 수 없다\n    continueFinal() {\n      if (this.mode !== 'final' || this.dying) return false;\n      this.mode = 'playing';\n      this.emit('final_continue');\n      return true;\n    }\n    // 월드 보스 대기열(R-120): 동시에 boss.alive마리까지 기체에서 출현 거리에 낸다(넘으면 줄 서서 기다림)\n    spawnWorldBosses() {\n      let alive = 0;\n      for (const e of this.enemies) if (!e.dead && e.wboss) alive++;\n      while (this.wq.length && alive < WB.boss.alive) {\n        if (!this.spawn(this.wq[0])) break;\n        this.wq.shift();\n        alive++;\n      }\n    }\n    // HIVE 졸개(R-120): 살아 있는 졸개가 broodMax보다 적으면 brood마리까지 HIVE 둘레에 돌격(예고 등장)\n    brood(e) {\n      const HB = WB.hive;\n      let alive = 0;\n      for (const x of this.enemies) if (!x.dead && x.hive === e.id) alive++;\n      for (let i = 0, n = Math.min(HB.brood, HB.broodMax - alive); i < n; i++) {\n        const a = this.rng() * TAU,\n          c = this.spawn(\n            'runner',\n            clamp(e.x + M.cos(a) * (e.r + 30), 30, W - 30),\n            clamp(e.y + M.sin(a) * (e.r + 30), 30, H - 30),\n          );\n        if (c) c.hive = e.id;\n      }\n    }\n    // 필드 스킬 하나(R-120 · Q213 · Q216): 종류 = 월드 스킬 12종 고르게, 자리 = 기체에서 near~far(방향 · 거리 drop 줄).\n    // 맵 가장자리 margin 밖이면 반대 → 직각 두 방향 순으로(새 뽑기 없음 — 같은 주의 드롭 순서가 모두 같다), 마지막에 잘라 붙인다.\n    // 사라지지 않고 상한이 없다. merge개가 넘으면 같은 종류 칸에 합친다(×n)\n    dropSkill() {\n      const D = WB.drop,\n        p = this.p,\n        id = WORLD_IDS[Math.floor(this.dropRng() * WORLD_IDS.length)],\n        a = this.dropRng() * TAU,\n        d = D.near + this.dropRng() * (D.far - D.near),\n        c = M.cos(a) * d,\n        s = M.sin(a) * d,\n        inside = (x, y) => x >= D.margin && x <= W - D.margin && y >= D.margin && y <= H - D.margin;\n      let x = p.x + c,\n        y = p.y + s;\n      for (const [ox, oy] of [\n        [-c, -s],\n        [-s, c],\n        [s, -c],\n      ]) {\n        if (inside(x, y)) break;\n        x = p.x + ox;\n        y = p.y + oy;\n      }\n      x = clamp(x, D.margin, W - D.margin);\n      y = clamp(y, D.margin, H - D.margin);\n      this.world.drop++;\n      const same = this.items.length >= D.merge ? this.items.find(it => it.sk === id) : null;\n      if (same) same.n++;\n      else this.items.push({ id: ++this.itemSerial, sk: id, x, y, n: 1 });\n      this.emit('drop', { id: same ? same.id : this.itemSerial, sk: id, x, y });\n    }\n    // 스킬 하나 얻기 — 레벨업 카드(choose)와 필드 스킬(월드)이 같은 길: 스택 · 장갑 회복 · 실드 채움 · 자력 XP · 회복\n    applySkill(id) {\n      this.upgrades[id] = (this.upgrades[id] || 0) + 1;\n      this.recalculate();\n      if (id === 'vital') this.p.hp = Math.min(this.p.maxHp, this.p.hp + S.vital.heal);\n      if (id === 'shield') this.p.shield = this.p.maxShield;\n      if (id === 'magnet') this.p.xp += S.magnet.xp * this.profile.xp;\n      this.p.hp = Math.min(this.p.maxHp, this.p.hp + B.player.choiceHeal);\n    }\n    // 필드 스킬 줍기(스텝 안): 기체 반경 + drop.r 안에 닿으면 얻는다. 방어 한도에 닿은 방어 스킬은 잠겨 남는다.\n    // 하나 얻을 때마다 회수 정비(최대 체력 × salvage × 단) 회복\n    pickItems() {\n      const p = this.p,\n        reach = p.r + WB.drop.r,\n        heal = WB.sk.salvage * (this.world.sk.salvage || 0);\n      let took = false;\n      for (const it of this.items) {\n        if (sq(it.x - p.x) + sq(it.y - p.y) >= reach * reach) continue;\n        while (it.n > 0 && !this.defenseFull(it.sk)) {\n          it.n--;\n          this.applySkill(it.sk);\n          if (heal) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * heal);\n          this.world.got++;\n          this.emit('upgrade', {\n            source: 'field',\n            id: it.sk,\n            count: this.upgrades[it.sk],\n            level: p.level,\n            offered: [],\n            wait: 0,\n          });\n        }\n        if (it.n <= 0) took = true;\n      }\n      if (took) this.items = this.items.filter(it => it.n > 0);\n    }\n    // 연쇄 번개(R-120): 탄환 · 칼날 · 충격파 처치 자리(e)에서 튀는 수만큼 가장 가까운(안 맞은) 적에게 튄다.\n    // 튈 때마다 적 목록 한 번 · 피해 = 탄환 피해 × chain.damage(치명 없음). 번개 처치는 새 번개를 만들지 않는다\n    chain(e) {\n      const C = WB.chain,\n        jumps = Math.min(C.max, this.stack('chain'));\n      if (jumps <= 0) return;\n      const hit = new Set([e.id]),\n        pts = [e.x, e.y],\n        dmg = this.p.damage * C.damage;\n      let cur = { x: e.x, y: e.y };\n      for (let j = 0; j < jumps; j++) {\n        let best = null,\n          near = C.range * C.range;\n        for (const t of this.enemies) {\n          if (t.dead || t.born > 0 || hit.has(t.id)) continue;\n          const d2 = sq(t.x - cur.x) + sq(t.y - cur.y);\n          if (d2 < near) {\n            near = d2;\n            best = t;\n          }\n        }\n        if (!best) break;\n        hit.add(best.id);\n        pts.push(best.x, best.y);\n        cur = { x: best.x, y: best.y };\n        this.hit(best, dmg, false, true);\n      }\n      if (pts.length > 2) this.emit('chain', { pts });\n    }\n    // 판 비교 값(R-119): 월드 판 300스텝마다와 끝에 정수 상태를 섞는다. 라이브와 재생이 같은 코드로 만든다\n    mixSig() {\n      const w = this.world,\n        p = this.p;\n      let h = w.h;\n      for (const v of [\n        w.n,\n        this.score % 4294967296,\n        Math.floor(this.score / 4294967296),\n        this.kills,\n        p.level,\n        this.stage,\n        Math.round(p.x * 100),\n        Math.round(p.y * 100),\n        Math.round(p.hp * 100),\n        this.enemies.length,\n        w.got,\n      ])\n        h = fnvInt(h, v >>> 0);\n      w.h = h;\n      w.sig = h.toString(16).padStart(8, '0');\n    }\n    // 최종전 중 마지막 부활까지 쓰러지면(R-298, PLANNING 4.5-1) 같은 스텝의 HELIOS 격파를 먼저 보고 스텝 끝에 패배한다(dying)\n    hurt(amount, source = { kind: 'unknown', attack: 'unknown' }) {\n      const p = this.p;\n      if (this.mode !== 'playing' || p.invuln > 0 || this.dying) return false;\n      const absorbed = Math.min(p.shield, amount),\n        had = p.shield;\n      p.shield -= absorbed;\n      // 보호막 붕괴(R-300): 준비된 보호막이 이 피해로 양수 → 0이 되면 탄을 지운다(남은 HP 피해 · 사망은 그대로)\n      if (this.shieldReady && had > 0 && p.shield <= 0) this.shieldBurst();\n      const loss = Math.max(0, amount - absorbed);\n      p.hp = Math.max(0, p.hp - loss);\n      p.invuln = B.player.hurtInvuln;\n      p.noHit = 0;\n      this.damageTaken += loss;\n      if (this.dashEffect) {\n        this.dashEffect.healthDamage += loss;\n        this.dashEffect.absorbed += absorbed;\n      }\n      this.shake = 0.18;\n      this.emit('hurt', {\n        x: p.x,\n        y: p.y,\n        value: Math.ceil(amount),\n        healthDamage: loss,\n        absorbed,\n        hp: p.hp,\n        source,\n      });\n      if (p.hp <= 0) {\n        // 부활(R-062 · R-107): 쓰러질 때마다 남은 부활 하나, 최대 HP × hp로 일어나 invuln초 무적 + 충격파 한 번(재충전 그대로)\n        if (this.reviveLeft > 0) {\n          this.reviveLeft--;\n          this.revivesUsed++;\n          this.revived = true;\n          p.hp = p.maxHp * BF.revive.hp;\n          p.invuln = BF.revive.invuln;\n          this.emit('revive', { x: p.x, y: p.y, r: p.novaRadius });\n          this.blast();\n        } else if (this.bossWaves[0]?.final) this.dying = true;\n        else this.end('defeated');\n      }\n      return true;\n    }\n    // 제어 레이저 한 번(R-301): 켜 둔 재고가 있는 종류마다 1개(보스 수와 관계없이), 출현을 마친 살아 있는 보스 모두에게 —\n    // 봉쇄 lockT(공격 · 광선 · 돌진 · 접촉 멈춤, HELIOS는 finalAI가 진행 공격을 취소) · 빙결 freezeT(이동 · 돌진 멈춤) ·\n    // 소거(보스 중심 clearR 안 적 탄, 겹친 원의 같은 탄은 한 번). 쓸 종류나 대상이 없으면 준비로 기다림. HP 피해 없음\n    fireLaser() {\n      const use = {};\n      for (const k of LZ_KINDS) if (this.lzN[k] > 0) use[k] = 1;\n      if (!use.g && !use.b && !use.s) return false;\n      const targets = this.enemies.filter(e => !e.dead && e.born <= 0 && e.kind === 'boss');\n      if (!targets.length) return false;\n      this.lzFire++;\n      for (const k of Object.keys(use)) {\n        this.lzN[k]--;\n        this.lzUsed[k]++;\n      }\n      let cleared = 0;\n      for (const e of targets) {\n        if (use.g) e.lockT = LZ.lock;\n        if (use.b) e.freezeT = LZ.freeze;\n        if (use.s)\n          for (const b of this.hostiles)\n            if (b.ttl > 0 && dist(b, e) <= LZ.clearR) {\n              b.ttl = 0;\n              cleared++;\n            }\n      }\n      this.lzLeft = LZ.every[this.lzLv - 1];\n      this.emit('laser', {\n        fireNo: this.lzFire,\n        use,\n        cleared,\n        x: this.p.x,\n        y: this.p.y,\n        to: targets.map(e => [e.x, e.y]),\n      });\n      return true;\n    }\n    // 보호막 붕괴(R-300): 기체 중심 반경 안의 적 탄(주인 무관)만 지우고 준비를 푼다. 다음은 다시 완전 충전 뒤.\n    // 적 탄 갱신 중(hurt 안)에도 부를 수 있어 배열을 바꾸지 않고 ttl 0으로 표시만 한다(스텝 끝 compact가 뺌, 같은 스텝 재피격은 피격 무적)\n    shieldBurst() {\n      const p = this.p,\n        r = LK.shieldR[this.link.shield - 1];\n      let n = 0;\n      this.shieldReady = false;\n      for (const b of this.hostiles)\n        if (b.ttl > 0 && dist(b, p) <= r) {\n          b.ttl = 0;\n          n++;\n        }\n      this.emit('link_burst', { x: p.x, y: p.y, r, cleared: n });\n    }\n    // bolt: 연쇄 번개가 낸 피해(그 처치는 번개를 다시 만들지 않는다)\n    hit(e, amount, critical = false, bolt = false) {\n      if (e.dead) return;\n      e.hp -= amount;\n      this.emit('hit', { x: e.x, y: e.y, value: Math.round(amount), critical, kind: e.kind, phase: e.phase });\n      if (e.hp <= 0) this.kill(e, bolt);\n    }\n    kill(e, bolt = false) {\n      if (e.dead) return;\n      e.dead = true;\n      this.kills++;\n      this.combo++;\n      this.comboTTL = B.score.comboWindow;\n      this.maxCombo = Math.max(this.maxCombo, this.combo);\n      const base = Math.round(e.reward),\n        // 충격파 득점(R-300): 수동 충격파 직접 처치마다 기본 처치 Point × 비율(콤보 가산 · 포상은 빼고 셈)\n        bonus =\n          this.cause === 'nova' && this.link.score ? Math.floor(base * LK.score[this.link.score - 1]) : 0,\n        reward = base + Math.min(B.score.comboMax, this.combo * B.score.comboStep) + bonus;\n      this.score += reward;\n      // 콤보 포상(R-300): 이 연속 콤보가 산 단계까지의 목표를 처음 넘을 때마다 Point만(콤보 · 처치 · XP는 그대로)\n      while (this.comboPaid < this.link.combo && this.combo >= LK.goals[this.comboPaid]) {\n        const prize = LK.prize[this.comboPaid];\n        this.score += prize;\n        this.emit('link_combo', { goal: LK.goals[this.comboPaid], prize });\n        this.comboPaid++;\n      }\n      this.emit('kill', {\n        x: e.x,\n        y: e.y,\n        big: e.kind === 'boss' || e.kind === 'splitter' || !!e.wboss,\n        kind: e.kind,\n        phase: e.phase,\n        enemyStage: e.stage,\n        reward,\n        xp: e.xp,\n      });\n      if (this.gems.length < B.caps.gems)\n        this.gems.push({ x: e.x, y: e.y, value: e.xp, r: e.kind === 'boss' || e.wboss ? 11 : 5 });\n      else this.gems[0].value += e.xp;\n      if (e.kind === 'splitter')\n        for (let i = 0; i < STATS.splitter.split; i++)\n          this.spawn('runner', clamp(e.x + (i - 1) * 23, 30, W - 30), clamp(e.y + 14, 30, H - 30), e.stage);\n      if (e.kind === 'boss') {\n        this.bossKills++;\n        this.emit('bossdown', { enemyStage: e.stage, waveId: e.waveId, id: e.id });\n        const wave = this.bossWaves.find(w => w.waveId === e.waveId);\n        if (wave) {\n          wave.alive = Math.max(0, wave.alive - 1);\n          this.finishBossWave(wave);\n        } else if (!this.enemies.some(b => b.kind === 'boss' && !b.dead)) {\n          this.hostiles = [];\n          this.gems.forEach(b => {\n            b.x = this.p.x;\n            b.y = this.p.y;\n          });\n        }\n      }\n      // 최종전 승리(R-298): 판마다 한 번. 전투를 멈추고(mode 'final' — 남은 피해 판정 없음) 성공 창을 기다린다\n      if (e.final && !this.finalDone && this.mode === 'playing') {\n        this.finalDone = true;\n        this.finalT = this.time;\n        this.mode = 'final';\n        this.emit('final_clear', { x: e.x, y: e.y, id: e.id, t: Number(this.time.toFixed(2)) });\n      }\n      // 월드 보스: 보스 처치 수 · 월드 보스 수(R-120). STAGE 보스 웨이브와 따로\n      if (e.wboss) {\n        this.bossKills++;\n        this.world.wb++;\n        this.emit('bossdown', { enemyStage: e.stage, id: e.id, world: e.kind });\n      }\n      if (this.world && !bolt) this.chain(e);\n    }\n    recalculate() {\n      const totals = stackTotals(this.stacks, this.upgrades);\n      Object.assign(this.p, calculateStats(this.craft, totals, this.cats, this.p.level, this.world));\n    }\n    choose(id, wait = 0, source = 'manual') {\n      if (this.mode !== 'upgrade' || !this.choices.some(u => u.id === id)) return false;\n      this.applySkill(id);\n      if (source === 'auto') {\n        this.autoChoices++;\n        this.autoUsed = true;\n      }\n      this.emit('upgrade', {\n        source,\n        id,\n        count: this.upgrades[id],\n        level: this.p.level,\n        offered: this.choices.map(x => x.id),\n        wait,\n      });\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    checkLevel() {\n      const p = this.p;\n      if (this.mode !== 'playing' || p.xp + 1e-6 < p.nextXP) return;\n      p.xp -= p.nextXP;\n      p.level++;\n      p.nextXP = B.level.base + (p.level - 1) * B.level.step;\n      // 월드(R-120 · Q213): 카드 · AUTO 없이 필드 스킬 하나 · boss.every LV마다 월드 보스 대기열(번갈아). 재화 없음.\n      // 칼날 피해(LV) 등은 카드를 고른 것처럼 레벨업마다 다시 계산한다. 한 스텝에 여러 LV가 오르면 하나씩 다 처리한다\n      if (this.world) {\n        this.recalculate();\n        this.dropSkill();\n        if (p.level % WB.boss.every === 0)\n          this.wq.push(WB.boss.order[this.wqSerial++ % WB.boss.order.length]);\n        this.emit('level', { level: p.level, offered: [] });\n        this.checkLevel();\n        return;\n      }\n      // 레벨업 S(R-061): Insane에서 (시드, LV) 해시가 levelChance 미만이면 맵 아무 곳에 1개\n      if (\n        this.difficultyId === S_COIN.mode &&\n        this.sCoins.length < S_COIN.max &&\n        levelDrop(this.initialSeed, p.level) < S_COIN.levelChance\n      )\n        this.dropSCoin('level');\n      const pool = UPGRADES.filter(\n        u => !B.defense.includes(u.id) || this.defenseUsed(u.id) < this.profile.defenseCap,\n      );\n      this.choices = [];\n      while (this.choices.length < this.profile.choices && pool.length)\n        this.choices.push(pool.splice(Math.floor(this.rng() * pool.length), 1)[0]);\n      const blue = this.profile.blueCoin || 0;\n      this.coinKind = blue > 0 && blueRoll(this.initialSeed, p.level) < blue ? 'blue' : 'gold';\n      this.mode = 'upgrade';\n      this.emit('level', { level: p.level, offered: this.choices.map(x => x.id) });\n    }\n    chooseCoin(wait = 0) {\n      if (this.mode !== 'upgrade') return false;\n      this.emit('coin_choice', this.takeCoin({ level: this.p.level, wait }));\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    // 코인 칸(coinKind)을 센다: G 코인은 coinChoices(손)·coinsEarned(G 전체), B 코인은 blueCoins(손 + AUTO). 이벤트 내용을 돌려준다.\n    takeCoin(e, auto = false) {\n      const blue = this.coinKind === 'blue';\n      if (blue) this.blueCoins++;\n      else {\n        this.coinsEarned++;\n        if (!auto) this.coinChoices++;\n      }\n      e.amount = blue ? B.economy.coinChoiceBlue : B.economy.coinChoice;\n      e.offered = this.choices.map(u => u.id);\n      if (auto) e.auto = true;\n      if (blue) e.blue = true;\n      return e;\n    }\n    // 자동 G 습득(R-025): AUTO가 고를 때만 부른다. 엔진 난수가 확률 미만이면 스킬 대신 레벨업 코인을 받고\n    // choose처럼 전투로 돌아간다(같은 시드면 같은 결과). 아니면 false. 확률은 autoGoldChance, 제시된 카드가 모두 상한이면\n    // autoGoldCapped이고, 1이면 난수를 쓰지 않는다(항상).\n    chooseAutoGold(wait = 0) {\n      if (this.mode !== 'upgrade' || !this.choices.length) return false;\n      const chance = this.choices.every(u => this.isCapped(u.id))\n        ? B.economy.autoGoldCapped\n        : B.economy.autoGoldChance;\n      if (chance < 1 && this.rng() >= chance) return false;\n      this.autoChoices++;\n      this.autoUsed = true;\n      this.emit('coin_choice', this.takeCoin({ level: this.p.level, wait }, true));\n      this.mode = 'playing';\n      this.choices = [];\n      this.checkLevel();\n      return true;\n    }\n    recommendUpgrade() {\n      if (this.mode !== 'upgrade' || !this.choices.length) return null;\n      const p = this.p,\n        score = id => {\n          if (id === 'vital' && p.hp / p.maxHp < 0.6) return 120 + (1 - p.hp / p.maxHp) * 20;\n          if (id === 'shield' && p.shield < Math.max(16, p.maxShield * 0.6)) return 115;\n          return (\n            {\n              multi: p.multi < S.multi.max ? 95 : 68,\n              orbit: p.orbits < B.orbit.max ? 90 : 65,\n              rapid: p.fire > S.rapid.minFire + 0.001 ? 85 : 70,\n              power: 80,\n              crit: 75,\n              nova: 72,\n              vital: 40,\n              shield: 45,\n              speed: p.speed < 300 ? 66 : 35,\n              magnet: p.magnet < 300 ? 64 : 30,\n              pierce: p.pierce < 3 ? 63 : 38,\n            }[id] || 0\n          );\n        };\n      return [...this.choices].sort(\n        (a, b) => score(b.id) - score(a.id) || SKILL_IDS.indexOf(a.id) - SKILL_IDS.indexOf(b.id),\n      )[0].id;\n    }\n    end(reason = 'retired') {\n      if (!['playing', 'paused', 'final'].includes(this.mode)) return false;\n      this.dying = false;\n      this.finishDashEffect();\n      this.reason = reason;\n      this.mode = 'ended';\n      this.score += Math.floor(this.time);\n      if (this.world) this.mixSig();\n      this.emit('end', { reason });\n      return true;\n    }\n    fire() {\n      const p = this.p,\n        // 월드 판: 기체 중심 고정 조준 상자 · 조준 거리(화면 크기 · 카메라와 무관, R-119 결정 조건)\n        V = this.world ? WB.view : null,\n        view = V ? { x: p.x, y: p.y, hw: V.hw, hh: V.hh } : this.view;\n      let target = null,\n        near = V ? V.range : this.targetRange;\n      for (const e of this.enemies) {\n        if (e.dead || e.born > 0) continue;\n        if (view && (Math.abs(e.x - view.x) > view.hw + e.r || Math.abs(e.y - view.y) > view.hh + e.r))\n          continue;\n        const d = dist(e, p);\n        if (d < near) {\n          near = d;\n          target = e;\n        }\n      }\n      if (!target && !this.manualAim) return;\n      p.aim = this.manualAim\n        ? M.atan2(this.manualAim.y - p.y, this.manualAim.x - p.x)\n        : M.atan2(target.y - p.y, target.x - p.x);\n      for (let i = 0; i < p.multi && this.bullets.length < B.caps.bullets; i++) {\n        const a = p.aim + (i - (p.multi - 1) / 2) * B.shot.spread,\n          critical = this.rng() < p.crit;\n        this.bullets.push({\n          x: p.x + M.cos(a) * B.shot.muzzle,\n          y: p.y + M.sin(a) * B.shot.muzzle,\n          vx: M.cos(a) * B.shot.speed,\n          vy: M.sin(a) * B.shot.speed,\n          ttl: B.shot.ttl,\n          damage: p.damage * (critical ? p.critScale : 1),\n          critical,\n          left: 1 + p.pierce,\n          hits: new Set(),\n        });\n      }\n      p.shotCD = p.fire;\n      this.emit('shoot');\n    }\n    step(dt, input = {}) {\n      if (this.mode !== 'playing' || !Number.isFinite(dt) || dt <= 0) return;\n      dt = Math.min(dt, 0.05);\n      this.time += dt;\n      if (this.world) this.world.n++;\n      // 제어 레이저 재충전(R-301): 전투 중에만(보스가 없어도) 줄고 0이면 준비로 기다린다(비축 없음)\n      if (this.lzLv) this.lzLeft = Math.max(0, this.lzLeft - dt);\n      // 시간 압박 시작(R-101): 회복 구역 생성 판정보다 앞\n      if (!this.lateOn && this.time >= this.lateAt) {\n        this.lateOn = true;\n        this.zone = null;\n        this.zoneNext = Infinity;\n        this.emit('late', { minute: Math.round(this.lateAt / 60) });\n      }\n      // 최종전(R-298): HELIOS 웨이브가 있는 동안 정규 출현 · 새 붕괴 구역을 멈춘다(포위 · 시간 압박 · 회복 구역은 그대로)\n      const finalLive = !!this.bossWaves[0]?.final;\n      // Stage 자동 승격(R-022): 실제 LV autoLevel마다 Stage 최소값 +1. 낮으면 한 스텝에 한 칸씩 올린다.\n      if (this.stage < 1 + Math.floor(this.p.level / B.stage.autoLevel)) this.raiseStage(true);\n      if (this.time >= this.sCoinNext) {\n        this.sCoinNext = (Math.floor(this.time / S_COIN.every) + 1) * S_COIN.every;\n        // 필드 동시 상한(R-081): max개면 이번 차례는 건너뛴다\n        if (this.sCoins.length < S_COIN.max) this.spawnSCoin();\n      }\n      if (this.time >= this.bCoinNext) {\n        this.bCoinNext = (Math.floor(this.time / B.bCoin.every) + 1) * B.bCoin.every;\n        if (\n          this.bCoins.length < B.bCoin.max &&\n          this.profile.blueCoin > 0 &&\n          this.bCoinRng() < this.profile.blueCoin\n        )\n          this.dropBCoin('time');\n      }\n      // 회복 구역(R-061): 전투 시계 first초부터 every초마다 하나, life초 뒤 사라진다\n      if (this.time >= this.zoneNext) {\n        this.zoneNext = HEAL.first + (Math.floor((this.time - HEAL.first) / HEAL.every) + 1) * HEAL.every;\n        this.spawnZone();\n      }\n      if (this.zone && this.time >= this.zone.until) this.zone = null;\n      // 전투 시계(일시정지·선택 중에는 멈춤)로 1분마다 알린다. 시간 보상과 포위 발동이 같은 시계를 쓴다.\n      const minute = Math.floor(this.time / 60);\n      if (minute > this.minute) {\n        this.minute = minute;\n        this.emit('minute', { minute });\n      }\n      const SG = this.siege && Siege();\n      if (SG) {\n        this.siegeStep.time = this.time;\n        this.siegeStep.stage = this.stage;\n        for (const ev of SG.update(this.siege, this.siegeStep)) {\n          if (ev.type === 'siege') this.siegeWaves++;\n          this.emit(ev.type, ev);\n        }\n      }\n      const p = this.p;\n      this.contextClock -= dt;\n      if (!this.contextCache || this.contextClock <= 0) {\n        this.abilityContext('dash', true);\n        this.contextClock = 0.2;\n      }\n      const c = this.contextCache;\n      for (const ability of ['dash', 'nova']) {\n        const ready = Math.max(0, dt - Math.min(dt, p[ability + 'CD'])),\n          opportunity =\n            ability === 'nova'\n              ? c.novaEnemies >= 3 || c.incomingProjectiles >= 2 || c.hazards > 0\n              : c.nearEnemies >= 3 || c.incomingProjectiles > 0 || c.hazards > 0,\n          active = ready > 0 && opportunity,\n          u = this.abilityUsage[ability];\n        u.readySec += ready;\n        if (active) {\n          u.opportunitySec += ready;\n          if (!this.opportunityState[ability]) u.opportunityEpisodes++;\n        }\n        this.opportunityState[ability] = active;\n      }\n      if (this.dashEffect) {\n        const f = this.dashEffect,\n          dashProtectedSlice = Math.max(\n            0,\n            Math.min(dt, p.invuln, f.dashInvulnRemaining) - Math.min(dt, f.previousInvulnRemaining),\n          );\n        if (dashProtectedSlice > 0 && c.threat > 0) f.protectedThreat = true;\n        f.previousInvulnRemaining = Math.max(0, f.previousInvulnRemaining - dt);\n        f.dashInvulnRemaining = Math.max(0, f.dashInvulnRemaining - dt);\n      }\n      for (const k of ['dashCD', 'dashTime', 'invuln', 'shotCD', 'novaCD']) p[k] = Math.max(0, p[k] - dt);\n      p.noHit += dt;\n      if (p.noHit > B.player.shieldDelay)\n        p.shield = Math.min(\n          p.maxShield,\n          p.shield + dt * (B.player.shieldRegen + S.shield.regen * this.stack('shield')) * this.paint.shieldX,\n        );\n      // 보호막 붕괴 준비(R-300): 실제로 최대치까지 찬 때(재생 · 스킬 · 필드 모두, 반올림 아님)\n      if (this.link.shield && !this.shieldReady && p.maxShield > 0 && p.shield >= p.maxShield)\n        this.shieldReady = true;\n      // 회복(R-061 · R-062): 회복 구역 안(기체 중심이 원 안)이면 초당 HEAL.hp, HP 회복 버프면 초당 regen.hp + 도색 regen(R-107, 같은 몫).\n      // 최대 HP까지, 구역 몫을 먼저 채우고 남은 빈칸에 버프 몫. 회복한 양은 healed에 센다\n      // 시간 압박(R-101) 뒤에는 두 몫 모두 0\n      const zoneHeal = !this.lateOn && this.zone && dist(this.zone, p) < this.zone.r ? HEAL.hp : 0,\n        buffHeal = this.lateOn ? 0 : (this.buffs.regen ? this.buffLv.regen : 0) + this.paint.regen;\n      if ((zoneHeal || buffHeal) && p.hp < p.maxHp) {\n        const z = Math.min(p.maxHp - p.hp, zoneHeal * dt);\n        p.hp += z;\n        this.healed.zone += z;\n        const b = Math.min(p.maxHp - p.hp, buffHeal * dt);\n        p.hp += b;\n        this.healed.buff += b;\n      }\n      this.novaFlash = Math.max(0, this.novaFlash - dt);\n      this.shake = Math.max(0, this.shake - dt);\n      this.comboTTL -= dt;\n      if (this.comboTTL <= 0) {\n        this.combo = 0;\n        this.comboPaid = 0;\n      }\n      let ix = clamp(Number(input.x) || 0, -1, 1),\n        iy = clamp(Number(input.y) || 0, -1, 1),\n        norm = M.hypot(ix, iy);\n      if (norm > 1) {\n        ix /= norm;\n        iy /= norm;\n      }\n      if (norm > 0.05 && p.dashTime <= 0) {\n        const n = M.hypot(ix, iy) || 1;\n        p.dx = ix / n;\n        p.dy = iy / n;\n      }\n      const dash = p.dashTime > 0,\n        oldX = p.x,\n        oldY = p.y;\n      p.x = clamp(p.x + (dash ? p.dx * B.dash.speed : ix * p.speed) * dt, 25, W - 25);\n      p.y = clamp(p.y + (dash ? p.dy * B.dash.speed : iy * p.speed) * dt, 25, H - 25);\n      if (this.dashEffect) {\n        if (dash) this.dashEffect.distance += M.hypot(p.x - oldX, p.y - oldY);\n        if (!dash && this.dashEffect.dashInvulnRemaining <= 0) this.finishDashEffect();\n      }\n      if (input.dash) this.dash({ x: ix, y: iy }, input.dashSource || 'keyboard');\n      if (input.nova) this.nova(input.novaSource || 'keyboard');\n      // 마우스 조준은 월드 판에서 끈다(재생 일치)\n      this.manualAim =\n        !this.world && input.aim && Number.isFinite(input.aim.x) && Number.isFinite(input.aim.y)\n          ? input.aim\n          : null;\n      this.spawnBossWave();\n      if (this.world && this.wq.length) this.spawnWorldBosses();\n      // 포위 대기열이 남아 있으면 일반 출현을 멈추고, 적 상한 미만일 때 스텝마다 몇 마리씩 사방 가장자리에 낸다.\n      if (SG && SG.pending(this.siege)) {\n        for (const o of SG.take(this.siege, this.enemies.length)) {\n          const at = SG.edgePoint(o.side, o.lane, p.x, p.y, this.spawnDist()),\n            e = this.spawn(o.kind, clamp(at.x, 40, W - 40), clamp(at.y, 40, H - 40), o.stage);\n          if (!e) continue;\n          // n회차 포위 적만 빨라진다(R-021). 분열 적이 남기는 돌격은 일반 적과 같다.\n          e.speed *= SG.speedOf(o.wave);\n          if (o.shotDelay !== null) e.shot = o.shotDelay;\n        }\n      } else if (!finalLive) {\n        this.spawnClock -= dt;\n        if (this.spawnClock <= 0) {\n          const mix = B.spawn.mix,\n            rules = stageRules(this.stage, this.profile, this.time);\n          this.spawnClock =\n            Math.max(B.spawn.min, B.spawn.interval / rules.density) / (this.profile.spawn * B.spawn.rate);\n          const r = this.world ? this.spawnRng() : this.rng(),\n            split = mix.splitter.base + Math.min(mix.splitter.max, (this.stage - 1) * mix.splitter.step),\n            shoot = mix.shooter.base + Math.min(mix.shooter.max, (this.stage - 1) * mix.shooter.step);\n          this.spawn(\n            r < split\n              ? 'splitter'\n              : r < split + shoot\n                ? 'shooter'\n                : r < split + shoot + mix.runner\n                  ? 'runner'\n                  : 'chaser',\n            undefined,\n            undefined,\n            this.stage,\n            true,\n          );\n        }\n      }\n      if (p.shotCD <= 0) this.fire();\n      // 붕괴 구역(R-072): 묶음 시계가 다 되면 이번 묶음 개수(전투 시계가 more의 분을 지날 때마다 +1)를 정하고\n      // gap초 간격으로 하나씩 놓는다(각각 그때 기체 기준, 남은 순번은 다음 묶음이 오면 버림). 동시 max개를 넘으면 그 하나는 건너뜀\n      this.hazardClock -= dt;\n      const HZ = B.hazard;\n      if (finalLive) this.hazardLeft = 0;\n      else if (this.stage >= HZ.fromStage && this.hazardClock <= 0) {\n        this.hazardClock = Math.max(HZ.min, HZ.interval - this.stage * HZ.step);\n        this.hazardLeft = 1 + HZ.more.filter( \n      my += Math.sin(g.time * 0.45) * 0.6;\n    }\n    const n = Math.hypot(mx, my) || 1,\n      input = { x: mx / n, y: my / n, dash: false, nova: false, aim: null };\n    // 최근 HP 기록(충격파 '많이 맞은 뒤' 판단용)\n    st.hpLog.push([g.time, p.hp]);\n    while (st.hpLog.length && st.hpLog[0][0] < g.time - K.hurtWindow) st.hpLog.shift();\n    let peak = p.hp;\n    for (const [, hp] of st.hpLog) if (hp > peak) peak = hp;\n    const hurt = K.novaHurt > 0 && peak - p.hp >= K.novaHurt * p.maxHp;\n    if (p.dashCD <= 0 && (near >= 3 || incoming >= K.dashIncoming || (K.dashAhead && imminent)))\n      input.dash = true;\n    if (p.novaCD <= 0 && (near >= K.novaNear || hurt)) input.nova = true;\n    if (K.aim) input.aim = aimPoint(g, seen);\n    return input;\n  }\n\n  // 손 조준 지점: 화면에 보이는 보스가 있으면 보스, 없으면 적이 3마리 이상 모인 곳의 가운데. 없으면 null(자동 조준).\n  // 손 조준 지점(빠른 판): 거리 제곱으로 비교하고, 가까운 8개만 골라 정렬한다(같은 거리면 먼저 나온 적이 앞). 결과는 전체 정렬과 같다.\n  function aimPoint(g, seen) {\n    const p = g.p,\n      vis = [],\n      d2 = [];\n    let boss = null,\n      bossD2 = Infinity;\n    for (const e of g.enemies) {\n      if (e.dead || e.born > 0 || !seen(e.x, e.y, e.r)) continue;\n      vis.push(e);\n      const dx = e.x - p.x,\n        dy = e.y - p.y,\n        k = dx * dx + dy * dy;\n      d2.push(k);\n      if (e.kind === 'boss' && k < bossD2) {\n        boss = e;\n        bossD2 = k;\n      }\n    }\n    if (boss) return { x: boss.x, y: boss.y };\n    // 가까운 순 상위 8개(삽입 정렬, 같은 거리는 먼저 온 쪽 우선)\n    const top = [];\n    for (let i = 0; i < vis.length; i++) {\n      let j = top.length;\n      if (j < 8) top.push(i);\n      else if (d2[i] >= d2[top[7]]) continue;\n      else j = 7;\n      while (j > 0 && d2[top[j - 1]] > d2[i]) {\n        if (j < top.length) top[j] = top[j - 1];\n        j--;\n      }\n      top[j] = i;\n      if (top.length > 8) top.length = 8;\n    }\n    let best = null,\n      bestN = 0;\n    for (const ci of top) {\n      const c = vis[ci];\n      let n = 0,\n        sx = 0,\n        sy = 0;\n      for (const e of vis) {\n        const dx = e.x - c.x,\n          dy = e.y - c.y;\n        if (dx * dx + dy * dy < 180 * 180) {\n          n++;\n          sx += e.x;\n          sy += e.y;\n        }\n      }\n      if (n > bestN) {\n        bestN = n;\n        best = { x: sx / n, y: sy / n };\n      }\n    }\n    return bestN >= 3 ? best : null;\n  }\n\n  // 같은 seed면 같은 선택이 나오는 난수(레벨업 무작위 고르기 · 실력 봇 전용, 엔진 난수와 따로)\n  function botRandom(seed) {\n    let a = ((Math.trunc(Number(seed)) || 0) ^ 0x2a7f3c1d) >>> 0;\n    return () => {\n      a = (a + 0x6d2b79f5) >>> 0;\n      let t = a;\n      t = Math.imul(t ^ (t >>> 15), t | 1);\n      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n\n  function options(box, opts = {}) {\n    if (opts.loadout && typeof opts.loadout === 'object') {\n      if (!box.Loadout) throw new Error('출격 조건 계산 모듈을 읽지 못했습니다');\n      opts = { ...opts, ...box.Loadout.launch(opts.loadout, { launch: opts.launch }) };\n    }\n    const B = box.balance,\n      has = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);\n    if (opts.world && !box.Week) throw new Error('월드 주 계산을 읽지 못했습니다');\n    const launch = ['super', 'ss', 'sss'].includes(opts.launch) ? opts.launch : 'normal';\n    const launchSpec = { super: B.superLaunch, ss: B.ssLaunch, sss: B.sssLaunch }[launch];\n    const m = Number(opts.minutes),\n      s = Number(opts.seed),\n      to = Math.trunc(Number(opts.rushTo)),\n      per = Math.trunc(Number(opts.perMin)),\n      profile = PROFILE_IDS.includes(opts.profile) ? opts.profile : 'basic',\n      cats = opts.cats && typeof opts.cats === 'object' ? opts.cats : {},\n      mode = has(B.modes, opts.mode) ? opts.mode : 'insane',\n      rawWorld = opts.world && typeof opts.world === 'object' ? opts.world : null,\n      requestedWeek = typeof rawWorld?.week === 'string' ? rawWorld.week : '',\n      worldKind = rawWorld\n        ? rawWorld.kind === 'practice'\n          ? 'practice'\n          : rawWorld.kind === 'daily'\n            ? 'daily'\n            : 'weekly'\n        : null,\n      validPeriod =\n        box.Week &&\n        (worldKind === 'daily'\n          ? Number.isInteger(box.Week.dayIndexOf(requestedWeek))\n          : Number.isInteger(box.Week.indexOf(requestedWeek))),\n      week = validPeriod\n        ? requestedWeek\n        : worldKind === 'daily'\n          ? box.Week?.dayIdOf(box.Week.dayIndex(Date.now())) || '1970-01-01'\n          : box.Week?.id(Date.now()) || '1970-W01',\n      periodIndex =\n        worldKind === 'daily' ? box.Week.dayIndexOf(week) : validPeriod ? box.Week.indexOf(week) : null,\n      challengeMode =\n        worldKind === 'daily' && Number.isInteger(periodIndex)\n          ? box.Week.dayMode(periodIndex)\n          : worldKind === 'weekly' && Number.isInteger(periodIndex)\n            ? box.Week.mode(periodIndex)\n            : null,\n      runMode = challengeMode && has(B.modes, challengeMode) ? challengeMode : mode,\n      fixedChallenge = worldKind === 'weekly' || worldKind === 'daily',\n      world = worldKind\n        ? {\n            kind: worldKind,\n            week,\n            mode: runMode,\n            sk: rawWorld.sk && typeof rawWorld.sk === 'object' ? { ...rawWorld.sk } : {},\n            fx: rawWorld.fx && typeof rawWorld.fx === 'object' ? { ...rawWorld.fx } : null,\n          }\n        : null;\n    return {\n      craft: has(B.crafts, opts.craft) ? opts.craft : 'striker',\n      mode: runMode,\n      world,\n      launch: world ? 'world' : launch,\n      encounter: !world && ['final', 'stage'].includes(opts.encounter) ? opts.encounter : 'run',\n      entryStage: Math.min(B.final.stage - 1, Math.max(1, Math.floor(Number(opts.entryStage) || 30))),\n      entryMinutes: Math.min(60, Math.max(0, Number(opts.entryMinutes) || 0)),\n      link: world ? 0 : Math.min(20, Math.max(0, Math.floor(Number(opts.link) || 0))),\n      laser: world\n        ? null\n        : {\n            lv function lineFigure(series, { xLabel = '', yLabel = '', log = false, legend = true } = {}) {
  const w = 420,
    h = 230,
    l = 64,
    r = 18,
    t = 14,
    b = 38,
    points = series.flatMap(s => s.points).filter(p => Number.isFinite(p.y));
  if (!points.length) return '<p class="note">' + esc(R.noObservations) + '</p>';
  const xmin = Math.min(...points.map(p => p.x)),

    rawMin = Math.min(0, ...points.map(p => (Number.isFinite(p.lo) ? Math.min(p.y, p.lo) : p.y))),
    f = v => (log ? Math.log10(Math.max(0, v) + 1) : v),

    '<svg class="lab-plot" viewBox="0 0 ' +

    ' ' +

    '" role="img" aria-label="' +
    esc(yLabel + ' · ' + xLabel) +
    '">';
  for (let i = 0; i <= 4; i++) {
    const q = i / 4,
      v = log ? Math.pow(10, lo + (hi - lo) * q) - 1 : rawMin + (rawMax - rawMin) * q,
      y = Y(v);
    html +=
      '<path class="plot-grid" d="M' +
      l +
      ' ' +
      y +
      'H' +
      (w - r) +
      '"/><text x="' +
      (l - 6) +
      '" y="' +
      (y + 4) +
      '" text-anchor="end">' +
      esc(chartShort(v)) +
      '</text>';
    const x = xmin + (xmax - xmin) * q;
    html +=
      '<text x="' + X(x) + '" y="' + (h - b + 20) + '" text-anchor="middle">' + esc(fmt(x, 2)) + '</text>';
  }

    const valid = s.points.filter(p => Number.isFinite(p.y)),
      band = valid.filter(p => Number.isFinite(p.lo) && Number.isFinite(p.hi));

      '"/>';
    for (const [pi, p] of valid.entries()) {
      if (pi % Math.max(1, Math.ceil(valid.length / 24)) && pi !== valid.length - 1) continue;
      html += chartMark(

        'cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="3.5" fill="' + s.color + '"',

      ? '<div class="plot-legend">' +

          .map(

}

    slots = [],

    try {
      const w = new Worker(workerURL);
      w.onmessage = e => onMessage(slot, e.data);
      w.onerror = ev => {
        ev.preventDefault();
        fail(slot, ev.message || 'error');

    }
    slot.job = jobs[next++];
    slot.last = Date.now();

  };

    if (stopped || !slot.job || m.id !== slot.job.id) return;

      partial.set(m.id, m.p);
      return cb.progress();

    partial.delete(m.id);

    if (m.type === 'done') cb.done(slot.job, m.result);

    assign(slot);

    if (stopped) return;
    const job = slot.job;

      slot.w.terminate();

    }
    slot.job = null;
    if (job) {
      partial.delete(job.id);
      finished++;
      cb.error(job, msg);

    else if (slots.every(s => !s.job)) end();

    for (const s of slots) if (s.job && Date.now() - s.last > 20000) fail(s, L.sim.timeout);

    if (stopped) return;

        s.w.terminate();

      }

    const s = { w: null, job: null, last: 0 };
    if (!spawn(s)) break;
    slots.push(s);
  }
  if (!slots.length) {
    clearInterval(watch);
    return null;
  }
  slots.forEach(assign);

    total: jobs.length,
    finished: () => finished,
    progress: () => (finished + [...partial.values()].reduce((x, y) => x + y, 0)) / jobs.length,

  };
}

function startLocal(jobs, balances, cb) {

    cur = null,
    finished = 0,
    stopped = false,
    loadError = null;
  try {
    for (const k of Object.keys(balances)) boxes[k] = Sim.load(SOURCES, balances[k]);
  } catch (err) {
    loadError = String((err && err.message) || err);
  }

    if (stopped) return;

    if (stopped) return;
    const t0 = performance.now();
    while (performance.now() - t0 < 12) {
      if (!cur) {
        if (i >= jobs.length) return end();
        const job = jobs[i++];
        try {
          if (loadError) throw new Error(loadError);
          cur = { job, r: Sim.start(boxes[job.set], job.opts) };
        } catch (err) {
          finished++;
          cb.error(job, String((err && err.message) || err));
          continue;
        }
      }
      try {
        if (cur.r.advance(120)) {
          finished++;
          cb.done(cur.job, cur.r.result());
          cur = null;
        }
      } catch (err) {
        finished++;

    setTimeout(tick, 0);

    finished: () => finished,
    progress: () => (finished + (cur ? cur.r.progress : 0)) / jobs.length,

  if (act === 'stop') return running?.stop();
  if (act === 'cond') {
    state.simOpen = !state.simOpen;

  if (act === 'run') return runSim();

    state.sim = cleanSim({ ...state.sim, modes: MODES.slice() });
    return simChanged();
  }
  if (act === 'fresh' || act === 'developed') {
    const lo = globalThis.NeonLoadout.empty();
    if (act === 'developed') {
      lo.perma = Object.fromEntries(Object.entries(base.economy.perma).map(([k, v]) => [k, v.max]));
      lo.cats = Object.fromEntries(base.cats.list.map(k => [k, base.cats.maxLevel]));

    v = btn.dataset.v,

    s.modes = MODES.filter(x => (x === v ? !s.modes.includes(x) : s.modes.includes(x)));

$('tab-sim').addEventListener('change', e => {

    id = el.id,
    v = el.value,

    s.loadout = globalThis.NeonLoadout.edit(s.loadout, el, { launch: s.launch });

      el.value =
        el.dataset.loKey === 'best' ? s.loadout.best : s.loadout[el.dataset.loKey][el.dataset.loId] || 0;
      return simChanged(false);
    }

  }
  if (id === 'sim-backup') {
    const file = el.files?.[0];
    if (!file) return;
    file.text().then(text => {
      const got = globalThis.NeonLoadout.importBackup(text, s.loadout, { launch: s.launch });
      if (!got) return toast(L.sim.loadoutBad);
      state.sim = cleanSim({
        ...s,
        loadout: got.loadout,
        link: got.link,
        laser: { lv: got.laser.lv, n: { g: got.laser.g, b: got.laser.b, s: got.laser.s } },
        worldSkills: got.worldSkills,
      });
      simChanged();
      toast(L.sim.loadoutImported);

  }
  if (id === 'sim-craft') {
    s.crafts = [v];
    state.craft = v;
  } else if (id === 'sim-entry') s.entryMinutes = v;
  else if (id === 'sim-entry-stage') s.entryStage = v;
  else if (id === 'sim-link') s.link = v;

  else if (id === 'sim-seeds') s.seeds = v;

  else if (id === 'sim-world-week') s.worldWeek = v;

  state.sim = cleanSim(s);

    simChanged();

    const k = {
      'sim-entry': 'entryMinutes',
      'sim-entry-stage': 'entryStage',
      'sim-link': 'link',
      'sim-minutes': 'minutes',
      'sim-seeds': 'seeds',
    }[id];
    if (k) el.value = state.sim[k];
    else if (id === 'sim-laser-level') el.value = state.sim.laser.lv;
    else if (id.startsWith('sim-sk-')) el.value = state.sim.worldSkills[id.slice(7)];
