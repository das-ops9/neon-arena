<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070b13" />
    <title>밸런스 실험실 · NEON ARENA</title>
    <style>
      /* NEON ARENA v4 디자인 토큰과 기본 규칙. 근거: docs/history/UI_RESEARCH.md
   글자는 rem(사용자 글자 크기 설정을 따름), 간격·터치 영역은 px로 고정한다. */
:root {
  color-scheme: dark;

  /* 면 */
  --bg: #070b13;
  --bg-raise: #0b1420;
  --surface: #0f1b29;
  --surface-2: #142538;
  --surface-3: #1a3048;
  --line: #20364a;
  --line-strong: #2e4c66;

  /* 글자 (배경 #070b13 기준 대비: ink 17:1, ink-2 11:1, muted 7:1) */
  --ink: #ebf3f6;
  --ink-2: #b9c9d4;
  --muted: #8aa0ae;

  /* 강조 */
  --cyan: #50f3d6;
  --cyan-deep: #0f3a37;
  --gold: #f4ce72;
  --gold-deep: #3a2d12;
  --blue: #68b9ff;
  --blue-deep: #12304d;
  --violet: #c4a3ff;
  --violet-deep: #2b1f48;
  --pink: #ff4e8e;
  --danger: #ff5f6d;
  --orange: #ff9a4d;

  /* 한 줄 남기기 글자색(R-161). 기존 팔레트를 가리키고, 색은 글자에만 적용 */
  --note-base: var(--ink-2);
  --note-cyan: var(--cyan);
  --note-mint: var(--cos-mint);
  --note-gold: var(--gold);
  --note-pink: var(--pink);
  --note-violet: var(--violet);

  /* 재화 */
  --c-gold: var(--gold);
  --c-blue: var(--blue);
  --c-sc: var(--violet);

  /* 색은 모두 이 파일 한 곳(팔레트, R-054). 다른 파일은 이름(var(--…))으로만 쓴다.
     같은 값이 이미 있으면 그 토큰을 가리킨다. 캔버스 · 그래프는 처음 한 번 읽어 풀린 값을 쓴다 */

  /* 낱색: 한두 곳에서만 쓰는 색(이름은 쓰임새) */
  --white: #ffffff;
  --black: #000000;
  --lilac: #b895ff;
  --on-cyan: #04201c;
  --on-danger: #1a0508;
  --on-white: var(--bg); /* 흰 바탕 위 글자(결과 NEW BEST) */
  --blue-ink: #cfe7ff;
  --violet-ink: #e9ddff;
  --danger-ink: #ffd0d5;
  --danger-deep: #3a1219;
  --logo-ink: #e9fffb;
  --title-top: #18153f;
  --title-mid: #100d2a;
  --title-bottom: #0a0918;
  --title-glow: #7a5cff;
  --grid-line: #16313d;
  --area-line: #24394b;
  --area-bg: #08101a;
  --area-label: #8fb3c4;
  --gold-tint: #2a2412;
  --cyan-tint: #10302d;
  --danger-tint: #2a1218;
  --soon-line: #2a3d50;
  --soon-bg: #0b121c;
  --scrim: #03060b;
  --overlay-bg: #04070c;
  --stage-bg: #1d170a;
  --bar-bg: #1b2a38;
  --action-bg: #0a1520;
  --vignette: #050810;
  --shine: #ffd36a;
  --shine-core: #fff6d8;
  --debug-mark: #ffe45c;
  --warn: var(--danger);

  /* 스킬(terms.js skills의 color → 카드 · HUD 스킬 줄 --c) */
  --sk-power: var(--cyan);
  --sk-rapid: var(--cyan);
  --sk-multi: var(--gold);
  --sk-pierce: #af9bff;
  --sk-speed: var(--cyan);
  --sk-magnet: var(--gold);
  --sk-orbit: var(--sk-pierce);
  --sk-vital: #8ce8a2;
  --sk-nova: var(--sk-pierce);
  --sk-crit: var(--gold);
  --sk-shield: #50b6ff;
  /* 연쇄 번개(R-120, 월드 전용): 연두 전기 — 적 탄(빨강 · 주황) · 칼날(흰빛) · 시안과 다른 색 */
  --sk-chain: #d8ff5c;
  /* 월드(R-122 · R-123): 흑백(은빛) 화면 색 · 연쇄 번개 */
  --world: #dfe4ee;
  --world-2: #aab1bf;
  --world-line: #4c525e;
  --world-deep: #15181f;
  --chain: var(--sk-chain);

  /* 회복(R-061 회복 구역 · R-062 HP 회복 버프 · 버프 표시): 장갑 강화와 같은 초록 계열(전장에 없는 색) */
  --heal: var(--sk-vital);
  /* GM 실험 칸 표시(R-065, 시험 경로에만) */
  --gm: var(--pink);
  /* 튜토리얼 · 팁(R-073): TIP 줄 · 할 일 칩 · 가리킴. 플레이어 쪽 색(시안) */
  --tip: var(--cyan);
  /* 탭 새 소식 점(R-074): 모바일 새 소식 관례의 빨강 */
  --dot: var(--danger);
  /* 고양이 비행사 소품 · 배지 색(R-075): 정비사 미오 렌치 · 보급관 토토 상자 · 조종사 루나 고글 · 종이비행기 */
  --cat-engineer: var(--orange);
  --cat-supply: #e3b277;
  --cat-pilot: #7fd4ff;

  /* 모드 배지(badges.js, 모양은 그 파일): 색 · 판 위(tone) · 판 아래(tone2) · 글자 */
  --mode-easy: #52ead1;
  --mode-easy-tone: #123033;
  --mode-easy-tone2: #0a1d20;
  --mode-easy-text: #d2fff6;
  --mode-hard: #f2c768;
  --mode-hard-tone: #3d3019;
  --mode-hard-tone2: #231b0e;
  --mode-hard-text: #fff0c8;
  --mode-extream: var(--blue);
  --mode-extream-tone: #173351;
  --mode-extream-tone2: #0d1f33;
  --mode-extream-text: #dbeeff;
  --mode-super: #b996ff;
  --mode-super-tone: #30224c;
  --mode-super-tone2: #1b1330;
  --mode-super-text: #efe6ff;
  --mode-ultra: #ffd98a;
  --mode-ultra-tone: #4c3a19;
  --mode-ultra-tone2: #2b200d;
  --mode-ultra-text: #fff5dc;
  --mode-insane: #ff5a7a;
  --mode-insane-tone: #4d1728;
  --mode-insane-tone2: #2a0b16;
  --mode-insane-text: #ffe3ea;

  /* 전장(renderer.js가 처음 한 번 읽는다. 캔버스용이라 #rrggbb나 그 값을 가리키는 var()만, 빠지면 자홍) */
  --cv-base-bg: #070c16;
  --cv-base-grid: var(--grid-line);
  --cv-base-border: #386b76;
  --cv-super-bg: #0c0a18;
  --cv-super-grid: #252039;
  --cv-super-border: #514369;
  --cv-ultra-bg: #120f0a;
  --cv-ultra-grid: #302a1b;
  --cv-ultra-border: #625538;
  --cv-insane-bg: #150b12;
  --cv-insane-grid: #33202d;
  --cv-insane-border: #6c3e52;
  --cv-craft-fill: #123b40;
  --cv-craft-line: #97ffe9;
  --cv-craft-core: #f1fffb;
  --cv-craft-2d: var(--cyan);
  --cv-glow: var(--cyan);
  --cv-chaser: var(--pink);
  --cv-runner: #ffad66;
  --cv-shooter: var(--lilac);
  --cv-splitter: var(--pink);
  --cv-boss: #ffca74;
  --cv-boss-2: var(--orange);
  --cv-boss-3: var(--danger);
  --cv-boss-inner: #ffd68b;
  /* HELIOS 다섯 단계(R-299): 황금 → 주황 → 진홍 → 백금 → 청백. 색만이 아니라 코로나 모양 · 보스 줄 'n단계'로도 구분 */
  --cv-helios-1: #ffd166;
  --cv-helios-2: #ff9a3c;
  --cv-helios-3: #ff4d6d;
  --cv-helios-4: #eef1ff;
  --cv-helios-5: #8fd3ff;
  --cv-boss-tell: var(--gold);
  --cv-enemy-fill: #301a2b;
  --cv-shooter-fill: #251c38;
  --cv-boss-fill: #362a23;
  --cv-gem: #ffde85;
  --cv-gem-2d: var(--gold);
  --cv-shot: #a1ffec;
  --cv-shot-tint: #8affea;
  --cv-crit-tint: #ffdb8a;
  --cv-shot-2d: #9fffe7;
  --cv-hostile-red: #ff4d5e;
  --cv-hostile-orange: #ff7a45;
  --cv-hostile-edge: #2a0b0b;
  --cv-hostile-core: #ffe0c8;
  --cv-blade: var(--cyan);
  --cv-blade-core: #f4fffd;
  --cv-spark: var(--white);
  --cv-hurt: var(--pink);
  --cv-dash: var(--cyan);
  --cv-nova: var(--lilac);
  /* 붕괴 구역(R-072) = 빨강(바닥의 큰 원 · 차오름으로 작은 적 탄과 구분) → 마지막에 노랗게 → 흰 섬광. 회복 구역 초록과 짝 */
  --cv-hazard: #ff4060;
  --cv-hazard-hot: var(--shine);
  --cv-hazard-flash: var(--white);
  --cv-shield: #65baff;
  --cv-shield-max: #9fdcff;
  --cv-number: var(--gold);
  --cv-scoin: var(--violet);
  --cv-scoin-fill: var(--violet-deep);
  --cv-scoin-ink: #eee2ff;
  --cv-bcoin: var(--blue);
  --cv-bcoin-fill: var(--blue-deep);
  --cv-bcoin-ink: var(--blue-ink);
  --cv-heal: var(--heal);
  --cv-revive: var(--gold);
  /* 월드 판(R-122): 모드와 상관없이 흑백 전장 · 필드 스킬 패(짙은 채움 · 잠김 회색) · 연쇄 번개(연두 빛 + 흰 심) */
  --cv-world-bg: #0a0b0e;
  --cv-world-grid: #22252c;
  --cv-world-border: #5d626c;
  --cv-item-fill: #0b1220;
  --cv-item-lock: #7d8494;
  --cv-chain: var(--chain);
  --cv-chain-core: #f6ffd6;
  /* 도색(R-108): 몸체 선 · 빛(밝은 색) + 몸체 채움(짙은 색). 기체 가운데 흰 점은 그대로.
     구분: 칼(시안 + 흰 심) · 적 탄(빨강 · 주황)과 겹치지 않게 빨강 · 주황 계열 없음.
     노랑 = 레몬(54°) ↔ 경험치 젬 옅은 금색 · 보스 금색: 채도 · 밝기로 가름.
     파랑 = 코발트(229°) ↔ 보호막 · B 코인 하늘색(208°): 색상을 20° 넘게 띄움.
     보라 = 짙은 보라(270°, 채도 높음) ↔ S 코인 · 충격파 · 사수 연보라(채도 낮음): 채도로 가름 */
  --paint-yellow: #ffe23a;
  --paint-yellow-fill: #3a3108;
  --paint-blue: #4f6bff;
  --paint-blue-fill: #111c55;
  --paint-violet: #a855ff;
  --paint-violet-fill: #2a1250;
  --cv-paint-yellow: var(--paint-yellow);
  --cv-paint-yellow-fill: var(--paint-yellow-fill);
  --cv-paint-blue: var(--paint-blue);
  --cv-paint-blue-fill: var(--paint-blue-fill);
  --cv-paint-violet: var(--paint-violet);
  --cv-paint-violet-fill: var(--paint-violet-fill);
  /* 꾸미기(R-116 · R-118): 무늬 색 · 엔진 불꽃 · 꼬리 자국(자국 색 = 불꽃 색). 빨강 · 주황 · 분홍 계열은 없다
     (적 탄 · 붕괴 구역 · 추적 적 색과 구분). 오로라 = 시안 → 하늘 → 보라 → 민트 → 금빛 띠(렌더러가 이 다섯을 섞음) */
  --cos-white: #f4fffd;
  --cos-cyan: var(--cyan);
  --cos-sky: #7fd4ff;
  --cos-mint: #7cf2b4;
  --cos-violet: var(--violet);
  --cos-silver: #cfd8e6;
  --cos-gold: var(--shine);
  --cv-cos-white: var(--cos-white);
  --cv-cos-cyan: var(--cos-cyan);
  --cv-cos-sky: var(--cos-sky);
  --cv-cos-mint: var(--cos-mint);
  --cv-cos-violet: var(--cos-violet);
  --cv-cos-silver: var(--cos-silver);
  --cv-cos-gold: var(--cos-gold);
  /* 꾸미기 확장(R-160): 기본 · 고급 · 특별의 색. INSANE RED 색(진홍 · 적철 · 흑진홍 · 진홍 은맥 · 루비 유리)은
     선체 안의 무광 면 · 짧은 점에만 쓴다. 불꽃 · 꼬리 자국의 빨강은 없다(백청 · 은백 · 흰빛). 등급 줄 색은 --tier-*. */
  --cos-aqua: #2fc7e8;
  --cos-ice: #c9f0ff;
  --cos-cobalt: #4f6dff;
  --cos-jade: #3fd9a0;
  --cos-ion: #3d9bff;
  --cos-pearlblue: #b4d2ff;
  --cos-spectrum: #c9a8ff;
  --cos-pearlchrome: #eef2fa;
  --cos-prismshift: #f2c9ff;
  --cos-deepblue: #2452d6;
  --cos-whiteblue: #d6f7ff;
  --cos-crimson: #8f1c31;
  --cos-ironred: #b84a5e;
  --cos-darkred: #5a1224;
  --cos-redvein: #c8334f;
  --cos-rubyglass: #e2506b;
  --cv-cos-aqua: var(--cos-aqua);
  --cv-cos-ice: var(--cos-ice);
  --cv-cos-cobalt: var(--cos-cobalt);
  --cv-cos-jade: var(--cos-jade);
  --cv-cos-ion: var(--cos-ion);
  --cv-cos-pearlblue: var(--cos-pearlblue);
  --cv-cos-spectrum: var(--cos-spectrum);
  --cv-cos-pearlchrome: var(--cos-pearlchrome);
  --cv-cos-prismshift: var(--cos-prismshift);
  --cv-cos-deepblue: var(--cos-deepblue);
  --cv-cos-whiteblue: var(--cos-whiteblue);
  --cv-cos-crimson: var(--cos-crimson);
  --cv-cos-ironred: var(--cos-ironred);
  --cv-cos-darkred: var(--cos-darkred);
  --cv-cos-redvein: var(--cos-redvein);
  --cv-cos-rubyglass: var(--cos-rubyglass);
  /* 등급 줄(R-160 · 꾸미기 화면 안): INSANE RED 테두리 · 글자 = 은백, 면 = 무광 진홍 어두운 바탕 */
  --tier-insane: var(--cos-silver);
  --tier-insane-bg: #2a0f17;

  /* 분석 페이지(analysis.html, 그래프 색은 페이지를 열 때 읽는다) */
  --an-bg: #090f18;
  --an-ink: #dcebf1;
  --an-text: #8fa9b9;
  --an-on-cyan: #0c2520;
  --an-line: #2b414d;
  --an-card: #10202b;
  --an-label: #83a0b1;
  --an-chart-line: #253c48;
  --an-chart-bg: #0e1a25;
  --an-status-bg: #11252a;
  --an-status-ink: #b4cdd4;
  --an-empty-ink: #91a8b7;
  --an-notes-line: #2c414d;
  --an-notes-ink: #9fb8c6;
  --an-version: #667e8b;
  --an-plot-title: #bfd8e1;
  --an-plot-ink: #87a5b5;
  --an-plot-note: #86a2b0;
  --an-plot-grid: #233a46;
  --an-shield: #7dafff;
  --an-damage: #ff6e9d;
  --an-fps: #79b9ff;

  /* 글꼴 */
  --font: system-ui, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  /* 굵기 4단(R-098): 1 보조 · 2 기본 · 3 라벨 · 제목 · 4 큰 숫자 · 로고 */
  --fw-1: 500;
  --fw-2: 700;
  --fw-3: 800;
  --fw-4: 900;
  /* HUD 글자 단계(R-090 · R-098): 9 작은 표지 · 11 값 · 18 · 20 STAGE · 24 큰 수. px라 HUD zoom만 따른다 */
  --hfs-1: 9px;
  --hfs-2: 11px;
  --hfs-3: 18px;
  --hfs-4: 20px;
  --hfs-5: 24px;

  /* 간격·모서리 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;

  /* 터치 영역 */
  --tap: 44px;
  /* HUD 크기(R-091 · R-232): body[data-hud] m(기본 1.1) | s(작게 1.0). 위 덩어리 · 아래 행동 줄에만 zoom으로 걸린다(ui.css) */
  --hud-z: 1.1;
  --tap-lg: 48px;
  --action-h: 56px;
  --action-w: 72px;

  /* 층 */
  --z-hud: 10;
  --z-overlay: 20;
  --z-menu: 30;
  --z-sheet: 40;
  --z-dialog: 50;

  /* 움직임 */
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);

  /* 안전 영역 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  /* 화면 위 · 아래 끝 여백(R-047): 위는 로고 글씨 높이의 70%(편집장 +20%, 앞 카메라 구멍), 아래는 50%.
     모든 화면(메뉴 · 준비 · 전투 HUD · 창 · 시트)이 쓴다. 가로 화면은 0(ui.css) */
  --edge-top: calc(var(--fs-lg) * 0.7);
  --edge-bottom: calc(var(--fs-lg) * 0.5);

  /* 화면 높이: 주소창이 펼쳐진 작은 높이 기준 */
  --vh-full: 100vh;
}
@supports (height: 100svh) {
  :root {
    --vh-full: 100svh;
  }
}
/* 세로 전체 화면(설정 '전체 화면'): 삼성 인터넷은 앞 카메라 자리를 화면 밖 흰 띠로 비워 두지만, 바로 아래는
   로고 줄이 카메라에 너무 붙어 보인다. 위 안전 영역을 최소 9px 둔다(R-053, 편집장: 0은 너무 가깝고 28px는 너무 멂 → 30% → 1px 더) */
@media (orientation: portrait) {
  :root:fullscreen {
    --safe-t: max(env(safe-area-inset-top, 0px), 9px);
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 100%;
  -webkit-text-size-adjust: 100%;

    const parts = [];
    if (u.time) parts.push(u.time / 60 + '분' + (u.score || u.level ? '' : ' 생존'));

  // 예: modeGroups('blue', ' ', '개') → ['Ultra 이상 2개'], modeGroups('goldBonus', ' +') → ['Extreme · Super +1', 'Ultra 이상 +2']
  const modeGroups = (key, sep, unit = '') => {
    const m = B().modes,
      ids = Object.keys(m),
      groups = [];
    for (const id of ids) {
      if (m[id][key] === m.easy[key]) continue;
      const last = groups[groups.length - 1];
      if (last && last.value === m[id][key] && ids.indexOf(id) === ids.indexOf(last.ids.at(-1)) + 1)
        last.ids.push(id);
      else groups.push({ value: m[id][key], ids: [id] });
    }
    return groups.map(g => {
      const name =
        g.ids.length > 1 && g.ids.at(-1) === ids.at(-1)
          ? modeName(g.ids[0]) + ' 이상'
          : g.ids.map(modeName).join(' · ');
      return name + sep + g.value + unit;

    return count(ECONOMY.perma[id]?.max);

  function permaDoor(id) {
    const c = ECONOMY.perma[id];
    return count(c?.door ?? c?.max);
  }
  function permaCost(id, k) {
    const c = ECONOMY.perma[id];
    if (!c) return 0;
    const base = c.price + c.step * k;
    return k >= permaDoor(id) ? base * ECONOMY.permaOver.x : base;

  }

      for (let k = max; k < n; k++)

  // 이 판으로 열리는 모드(balance.js unlock). 판 도중 알림과 판 끝 평가가 같은 규칙을 쓴다.
  function unlockTarget(run) {
    const id = modeId(run?.difficultyId),
      time = Number(run?.time) || 0,
      score = Number(run?.score) || 0,
      level = Number(run?.level) || 0;
    for (const [target, u] of Object.entries(B.unlock))
      if (u.from === id && time >= (u.time || 0) && score >= (u.score || 0) && level >= (u.level || 0))

    return null;
  }
  // 글자당 G는 프로필 모음으로, 색 추가 G는 balance로 계산한다.
  function noteQuote(value, perChar = ECONOMY.notePerChar, noteColor) {

      .trim()
      .normalize('NFC');
    const color = noteColor == null ? 'base' : noteColor,
      colorValid = NOTE_COLOR.list.includes(color),
      colorCost = colorValid && color !== 'base' ? NOTE_COLOR.price : 0;

      supported = true;

  function pointBonus(score) {
    const points = Number.isSafeInteger(score) && score > 0 ? score : 0,
      scale = B.pointBonus;
    return {

      blue: Math.floor(points / scale.blueEvery),
      super: Math.floor(points / scale.superEvery),

  }

  function blank() {
    return {
      id: PROFILE_ID,
      schemaVersion: SCHEMA,
      gold: 0,
      blue: 0,
      superCoins: 0,
      incomeTier: 0,
      ownedAuto: false,
      unlockedModes: ['easy', 'hard'],
      perma: {},
      runs: {},
      tx: [],
      scHold: null,
      legacyBest: 0,

      ...blankV5(),

  // ── schemaVersion 5 새 칸(R-100, DATA.md 2절). 모양만 검사한다: 키 · id 꼴 하나 · 0 이상 수 · 개수 상한.
  // 모르는 id라도 꼴이 맞으면 남기고(뜻은 쓰는 단계가 판단), 상한을 넘으면 앞에서부터 N개를 남긴다. 상한은 낮추지 않는다.

  function cleanCareer(raw) {

      } catch {

  function cleanV5(raw) {

      mile: cleanIdMap(raw?.mile, 300, natural),
      opened: cleanIdList(raw?.opened, 50),
      paint: cleanPaint(raw?.paint),
      promo: cleanPromo(raw?.promo),

      out[id] = {
        mode: modeId(r.mode),
        m: count(r.m),
        l: count(r.l),
        c: numbers(r.c),
        b: numbers(r.b),
        s: numbers(r.s),
        bc: numbers(r.bc),
        pb:

            ? { gold: count(r.pb.gold), blue: count(r.pb.blue), super: count(r.pb.super) }

  // v2(지갑) 문서는 지갑 → gold, v3 문서는 기존 값을 옮기고 새 항목은 기본값, v4 문서는 고양이 칸까지,
  // v5 문서는 새 칸 아홉까지 검증한다. v4 이하 → v5의 경력 처음 값은 rules.migrate5 한 곳에서만 만든다.
  function migrate(raw) {
    const p = blank();
    if (!raw || typeof raw !== 'object') return p;
    const sv = raw.schemaVersion,
      v3 = sv === 3 || sv === 4 || sv === SCHEMA,
      v4 = sv === 4 || sv === SCHEMA;
    p.gold = count(v3 ? raw.gold : raw.wallet);
    p.ownedAuto = raw.ownedAuto === true;
    p.unlockedModes = MODES.filter(
      id =>
        id === 'easy' ||
        id === 'hard' ||

    );
    p.legacyBest = count(raw.legacyBest);
    if (v3) {
      p.blue = count(raw.blue);
      p.superCoins = count(raw.superCoins);
      p.incomeTier = Math.min(ECONOMY.incomeMax, count(raw.incomeTier));
      for (const id of SKILLS) if (count(raw.perma?.[id])) p.perma[id] = count(raw.perma[id]);

      const excess = permaExcess(raw);
      if (excess) {

        p.blue += excess.blue;

      p.tx = Array.isArray(raw.tx) ? raw.tx.filter(validId).slice(-TX_KEEP) : [];

        raw.scHold && validId(raw.scHold.prepId)
          ? {
              prepId: raw.scHold.prepId,
              at: Number(raw.scHold.at) || 0,
              n: holdN(raw.scHold.n),

          : null;

      for (const id of CATS) {
        const lv = raw.cats?.[id];
        if (Number.isSafeInteger(lv) && lv >= 0 && lv <= B.cats.maxLevel) p.cats[id] = lv;
      }

  // ── 비행 경력(R-100, DATA.md 4 · 7절). 모두 순수 함수. 지킬 사실: 기록의 careerAt이 0이 아니면 그 판은 경력에 들어 있다.
  const Data = () => root.NeonData || (typeof require === 'function' ? require('./data.js') : null);
  // 정상 종료 판(패배 · 직접 종료)만 센다 — Point 정산(R-082)과 같은 규칙. 중단 판은 세지 않는다
  const careerRun = r => !!r && (r.reason === 'defeated' || r.reason === 'retired');
  // 기록(정규화된 것 또는 같은 꼴) 한 판을 더한 새 경력. 없는 값은 건너뛴다(로그만 있는 판은 충격파 · 대시 · CHAIN · 고양이 없음)

      },
      time = Math.round(num(r?.time)),
      u = r?.abilityUsage || {},
      by = (kind, id) => {
        if (!isId(id)) return;
        add(kind + '.' + id + '.runs', 1);
        add(kind + '.' + id + '.time', time);
      };
    add('runs', 1);
    add('time', time);
    add('kills', r?.kills);
    add('bosses', r?.bossKills);
    add('point', r?.score);
    add('gold', r?.earned?.gold);
    add('blue', r?.earned?.blue);
    add('super', r?.earned?.super);
    add('nova.kills', u.nova?.kills);
    add('nova.clears', u.nova?.projectilesCleared);
    add('dash', u.dash?.activations);
    add('siege', r?.siegeWaves);
    add('late', r?.late === true ? 1 : 0);
    add('revive', r?.revives);
    add('sc', r?.launch?.type === 'super' ? 1 : 0);

      add('mode.' + r.difficultyId + '.final', r?.final ? 1 : 0);
      top('mode.' + r.difficultyId + '.point', r?.score);

    top('chain', r?.maxCombo);
    top('kills', r?.kills);
    const date = natural(Math.floor(Number(r?.date) || 0)) || 0;

      c.last = Math.max(c.last, date);
    }

  }
  // 플레이 로그 판 줄 → careerAdd가 읽는 꼴(있는 값만)
  const logRun = e => ({
    date: e.at,
    reason: e.reason,
    time: e.time,
    kills: e.kills,
    bossKills: e.bosses,
    score: e.score,
    earned: { gold: e.earned?.gold, blue: e.earned?.blue, super: e.earned?.sc },
    difficultyId: e.mode,
    craft: e.craft,
    launch: { type: e.launch },
    revives: e.revived === true ? 1 : 0,
    level: e.level,
    stage: e.stage,
  });
  // 경력 처음 값(이관 때 한 번): 정상 종료 기록 + 플레이 로그에만 있는 판. 깨진 줄은 건너뛰고 예외를 던지지 않는다.
  // 로그는 배열 순서대로 — 판 줄은 목록에 더하고, 'reset'이면 지금 목록을 보관하고 비우며, 'undo'면 보관본으로(없으면 빈 목록).
  // 남은 판 줄 중 어떤 기록(끝난 이유 · 날짜와 상관없이)과도 at · score가 같지 않은 판만 센다.
  // → { career(since = 넣은 판 중 가장 늦은 날짜), ids: [처음 값에 넣은 기록 id], records, log }
  function careerSeed({ records, history: entries } = {}) {
    let career = blankCareer(),
      fromLog = 0;
    const ids = [],
      seen = new Set();
    for (const raw of Array.isArray(records) ? records : []) {
      try {
        const r = Data().normalizeRecord(raw);
        if (!r) continue;
        seen.add(r.date + '|' + count(r.score));
        if (!careerRun(r)) continue;
        career = careerAdd(career, r);
        ids.push(r.id);

      }

      saved = null;
    for (const e of Array.isArray(entries) ? entries : []) {
      if (!e || typeof e !== 'object') continue;
      if (e.kind === 'run') list.push(e);
      else if (e.kind === 'reset') {
        saved = list;
        list = [];
      } else if (e.kind === 'undo') {
        list = saved || [];
        saved = null;
      }
    }
    for (const e of list)
      try {
        const at = Number(e.at);
        if (!Number.isSafeInteger(at) || at <= 0 || e.reason === 'interrupted') continue;

        career = careerAdd(career, logRun(e));
        fromLog++;
      } catch {

      }

  // 두 경력 합치기(백업 가져오기): 항목마다 큰 값, first는 0 아닌 작은 값, since는 a(지금 값) 그대로.
  // 두 기기에서 따로 쌓은 몫은 더해지지 않고 큰 쪽만 남는다(DATA.md 9절)
  function careerMerge(a, b) {
    const x = cleanCareer(a),
      y = cleanCareer(b),
      both = (o, q) => {
        const out = { ...o };

      };
    return cleanCareer({
      v: Math.max(x.v, y.v),
      since: x.since,
      first: x.first && y.first ? Math.min(x.first, y.first) : x.first || y.first,
      last: Math.max(x.last, y.last),
      sum: both(x.sum, y.sum),
      max: both(x.max, y.max),
    });
  }
  // 이정표 합치기: 아이디마다 이른 시각(0이 아닌 쪽)
  function mileMerge(a, b) {
    const out = cleanIdMap(a, 300, natural);

  // 판정 한 곳: 아직 없는 이정표 중 조건을 넘은 것을 적는다(retro면 1) → { ok, ids: [새로 넘은 id, 사다리 순] } · 없으면 dup
  function mileCheck(p, { now, retro } = {}) {
    if (!isObj(p.mile)) p.mile = {};

      ids = [];

  }
  // 화면 상태(비행 일지): 넘음 · 시각 + 못 넘은 것의 진행(have/need) · 잠김(lock) · 준비 중(soon)
  function mileState(p) {
    const cap = promoCap(),
      top = topRank(p);
    return MILE.map(m => {
      const at = natural(p?.mile?.[m.id]) || 0,
        x = { id: m.id, col: m.col, title: !!m.title, done: at > 0, at };
      if (m.play === 'insane') Object.assign(x, { have: insanePlayed(p) ? 1 : 0, need: 1 });
      else if (m.sum) Object.assign(x, { have: mileSum(p, m.sum), need: m.need });

  // 가진 칭호는 mile에서 계산한다. 새 배열을 우선하고, 옛 단일 칭호는 그대로 읽는다.
  const titlesOf = p => TITLE_IDS.filter(id => natural(p?.mile?.[id]) > 0);

    const selected = Array.isArray(p?.cos?.titles) ? p.cos.titles : [p?.cos?.wear?.title];
    return titlesOf(p).filter(id => selected.includes(id));
  }
  function titleOf(p) {
    return wornTitles(p)[0] || null;
  }

  // ── 꾸미기 · 보급 캡슐(R-116). 목록 · 값 · 열림은 balance.cos(없는 옛 balance면 빈 목록), 이름 · 글은 terms.cos.
  // 저장 = cos.own(가진 조각 id) · cos.wear(칸 → id, 13단계 title과 같은 곳) · cnt.capsule · opened 'cos'. 판 진행 영향 0
  const COS = Object.freeze([...(B.cos?.items || [])]),
    COS_BY = new Map(COS.map(x => [x.id, x])),
    COS_SLOTS = Object.freeze([...new Set(COS.map(x => x.slot))]),
    CAPSULE = B.cos?.capsule || null;
  const cosItem = id => COS_BY.get(id) || null;
  const cosOwn = p => (Array.isArray(p?.cos?.own) ? p.cos.own : []);
  // 소품 칸(prop.<고양이>)의 고양이
  const slotCat = slot => (typeof slot === 'string' && slot.startsWith('prop.') ? slot.slice(5) : null);
  // 상점 네 칸(시간 코인 모두 · 자동 강화 · 자동 G)을 모두 샀다 → 꾸미기 문
  const shopFull = p =>
    count(p?.incomeTier) >= ECONOMY.incomeMax && p?.ownedAuto === true && p?.ownedAutoGold === true;
  // 조각 열림(순수): null = 열림 · { kind: 'cat' | 'rank' | 'tier' | 'mile' | 'soon', id }. 모르는 id = { kind: 'invalid' }.
  // 소품 = 그 고양이를 깨움(Lv ≥ 1) · rank = 그 고양이 승진 단계 · tier = 등급 문(balance.cos.tiers · INSANE RED = insane1, R-160) ·
  // mile = 그 이정표 넘음('이전 기록' 1 포함) · world = 15단계 전 준비 중. 등급 문을 먼저 보고, 항목 조건은 그 뒤에 따로 본다
  function cosNeed(p, id) {
    const it = cosItem(id);
    if (!it) return { kind: 'invalid', id };
    const cat = slotCat(it.slot);
    if (cat && !(catLevel(p?.cats?.[cat]) >= 1)) return { kind: 'cat', id: cat };
    const door = it.tier && B.cos?.tiers?.[it.tier]?.need?.mile;
    if (door && !(natural(p?.mile?.[door]) > 0)) return { kind: 'tier', id: door, tier: it.tier };
    if (it.need?.rank && !(promoRank(p, cat) >= it.need.rank))
      return { kind: 'rank', id: cat, need: it.need.rank };
    const m = it.need?.mile;
    if (m === 'world' && !B.world) return { kind: 'soon', id: m };
    if (m && !(natural(p?.mile?.[m]) > 0)) return { kind: 'mile', id: m };

  // 입은 것(순수): 칸마다 가진 · 아는 · 그 칸 조각만(모르는 id · 안 가진 것은 기본으로 읽고 지우지 않는다 — 뒤 단계 조각 보존).
  // 옛 탭도 wear의 모르는 슬롯은 보존한다. 표식 없는 기체는 옛 공통 복장, 표식만 있으면 기본 복장.
  const COS_CRAFT_SLOTS = ['mark', 'mcol', 'flame', 'trail'];
  const cosCraftKey = craft => 'craft.' + craft;
  function cosWorn(p, craft) {
    const wear = isObj(p?.cos?.wear) ? p.cos.wear : {},
      personal = CRAFT_IDS.includes(craft) && wear[cosCraftKey(craft)] === 'base',
      own = cosOwn(p),
      out = {};
    for (const slot of COS_SLOTS) {
      const key = personal && COS_CRAFT_SLOTS.includes(slot) ? cosCraftKey(craft) + '.' + slot : slot,

  // 첫 변경 때 공통 네 칸을 해당 기체 슬롯에 복사한다. 기본으로 벗겨도 표식을 남겨 다른 기체와 분리한다.
  function cosWearChange(p, set, craft) {
    const wear = { ...(p.cos?.wear || {}) },
      personal = CRAFT_IDS.includes(craft),
      key = personal ? cosCraftKey(craft) : null;
    if (personal && Object.keys(set).some(slot => COS_CRAFT_SLOTS.includes(slot)) && wear[key] !== 'base') {
      for (const slot of COS_CRAFT_SLOTS) if (wear[slot]) wear[key + '.' + slot] = wear[slot];
      wear[key] = 'base';

    for (const [slot, id] of Object.entries(set)) {
      const target = personal && COS_CRAFT_SLOTS.includes(slot) ? key + '.' + slot : slot;

  // 문자열 → 0 이상 1 미만(FNV-1a + 섞기). 보급 캡슐 전용 난수 줄 — 엔진 rng와 따로, 같은 글자 = 같은 값
  function hash01(str) {
    const s = String(str);

      h = Math.imul(h, 0x01000193);

    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;

    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;

  // 캡슐에서 나올 수 있는 조각: G 조각 중 열렸고 아직 없는 것(특별 S · INSANE RED · 잠긴 조각은 안 나옴 — 노력형 원칙), 목록 순서
  const capsulePool = p =>
    COS.filter(x => x.g > 0 && x.tier !== 'insane' && !cosOwn(p).includes(x.id) && !cosNeed(p, x.id)).map(
      x => x.id,
    );
  // 보급 캡슐(Q211, 순수 — addCareer · sweepCareer 안에서만 불러 careerAt이 중복을 막는다): 정상 종료 · 솔로 · 문 'cos' ·
  // time초 이상 · 고를 조각 있음 · 기록 id 해시 < 모드 확률이면 조각 하나를 own에 더하고 cnt.capsule += 1 → id(아니면 null).
  // 입히지 않는다 · 재화 0. force(GM '캡슐 항상') = 확률 1 · 시간 0
  function capsuleRun(p, record, { force } = {}) {
    if (!CAPSULE || !careerRun(record) || !Data().isSolo(record) || !p.opened?.includes('cos')) return null;
    if (!force && !((nonNeg(Number(record.time)) || 0) >= CAPSULE.time)) return null;
    const pool = capsulePool(p);
    if (!pool.length) return null;
    if (!force && !(hash01('cap:' + record.id) < (CAPSULE.chance[modeId(record.difficultyId)] || 0)))
      return null;

  // 출격 단계 해금 거래(buySS · buySSS 공용)
  function buyTier(p, kind, { txId, now, needs }) {
    if (!validId(txId)) return fail('invalid');

    if (needs && !p.opened.includes(needs)) return fail('needs_' + needs);

  // 순수 규칙: p(프로필 사본)를 바꾸고 결과를 돌려준다.
  const rules = {
    // 출격(R-062 · R-161): launch.buffs(요청 id 배열)를 BUFFS 순서로 본다. 비용 · buffLv는 계정 최고 Point 단계로 정한다.
    // 비용(B · S)이 모자라면 건너뜀('insufficient', 예약된 S 때문이면 'sc_reserved'), 아니면 이 트랜잭션에서 낸다.
    // 적용한 버프는 runs[runId].bf. 같은 판 id의 두 번째 출격은 아무것도 내지 않고 그 판의 버프를 돌려준다.
    // 도색 효과(R-107)는 이 판 기체(craft)로 출격 순간 고정 — 분당 G 배율은 runs[runId].x.gx(1이면 적지 않음)
    startRun(p, { runId, mode, launch, now, craft }) {
      if (!validId(runId)) return fail('invalid');
      const cats = catEffects(p),
        paint = paintEffects(p, craft),
        // 월드 판(R-121): 버프 · 고양이 분당 G 없음, 판 고정값 x.w = 1(지급 함수들이 0)
        world = launch?.type === 'world';
      if (p.runs[runId])
        return dup({
          cats,
          paint,
          buffs: [...p.runs[runId].bf],
          buffLv: { ...p.runs[runId].bl },
          skipped: [],
        });
      const buffLv = {
          regen: buffSpec(p, 'regen').hp,
          revive: buffSpec(p, 'revive').n,
        },
        startLevel = count(launch?.startLevel) || 1,
        want = world ? [] : buffList(launch?.buffs),
        buffs = [],
        skipped = [];
      for (const id of want) {
        if (!buffOk(mode)) {
          skipped.push({ id, reason: 'mode' });

        }
        const spec = buffSpec(p, id),
          b = spec.b,
          s = spec.s,
          short = (s && scShort(p, now, s)) || (p.blue < b ? 'insufficient' : null);
        if (short) {
          skipped.push({ id, reason: short });
          continue;

        p.blue -= b;
        p.superCoins -= s;
        buffs.push(id);
      }

      p.runs[runId] = {
        mode: modeId(mode),
        m: 0,
        l: Math.floor(startLevel / ECONOMY.blueEvery) * ECONOMY.blueEvery,
        c: [],
        b: [],
        s: [],
        bc: [],
        pb: null,
        cg: world ? 0 : cats.supply,
        t: Number(now) || 0,
        bf: buffs,
        bl: { ...buffLv },

        return { ok: true, cats, paint, buffs: [], buffLv: { ...buffLv }, skipped: [] };

      // 판 고정값 x: 모음 분당 G 배율 gx(1이면 적지 않음) · 승진 보급관(R-111) B/분 cb · S 분 간격 cs(supplyFrom 모드부터, 0이면 적지 않음)
      const x = {},
        supplyOk = PROMO && MODES.indexOf(modeId(mode)) >= MODES.indexOf(PROMO.supplyFrom);
      if (paint.gx !== 1) x.gx = paint.gx;
      if (supplyOk && cats.supplyBlue > 0) x.cb = cats.supplyBlue;
      if (supplyOk && cats.supplySuper > 0) x.cs = cats.supplySuper;
      if (Object.keys(x).length) p.runs[runId].x = x;
      // 실제 시작을 저장한 같은 거래에서 해금한다. 중단·앱 종료 여부와 상관없이 첫 플레이는 남는다.
      if (modeId(mode) === 'insane') {

          ok: true,
          cats,
          paint,

    },
    // 분마다 분당 G × 이 판의 모음 배율(x.gx, R-107) + 고양이 분당 G(cg, 배율 없음). cat은 그중 고양이 몫.
    // 승진 보급관(R-111): 분마다 x.cb B · 전투 분이 x.cs의 배수를 지날 때마다 1 S(blue · super는 모두 고양이 몫)
    awardMinute(p, { runId, minute }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ gold: 0, cat: 0, blue: 0, super: 0 });
      if (!Number.isSafeInteger(minute) || minute <= r.m) return dup({ gold: 0, cat: 0, blue: 0, super: 0 });
      const minutes = minute - r.m,
        gx = r.x?.gx > 0 ? r.x.gx : 1,
        cat = minutes * count(r.cg),

        cs = count(r.x?.cs),
        blue = minutes * count(r.x?.cb),
        sup = cs ? Math.floor(minute / cs) - Math.floor(r.m / cs) : 0;

      p.blue += blue;

      return { ok: true, gold, cat, blue, super: sup };
    },
    awardLevel(p, { runId, level }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ blue: 0 });
      if (!Number.isSafeInteger(level) || level < 1) return fail('invalid');

    awardCoin(p, { runId, level, kind = 'gold' }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ gold: 0, blue: 0 });
      if (!Number.isSafeInteger(level) || level < 1) return fail('invalid');
      if (kind !== 'gold' && kind !== 'blue') return fail('invalid');
      if (kind === 'blue' && !(B.modes[r.mode].blueCoin > 0)) return fail('invalid');
      if (r.c.includes(level)) return dup({ gold: 0, blue: 0 });
      r.c.push(level);
      if (kind === 'blue') {
        p.blue += ECONOMY.coinChoiceBlue;
        return { ok: true, blue: ECONOMY.coinChoiceBlue };
      }
      p.gold += ECONOMY.coinChoice;
      return { ok: true, gold: ECONOMY.coinChoice };
    },
    // 보스 처치 G + B(R-002 · R-079): 보스 번호로 한 번만, 모드별 G와 B.bCoin.boss를 함께 지급한다.
    awardBoss(p, { runId, bossId }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ gold: 0 });
      if (!Number.isSafeInteger(bossId) || bossId < 1) return fail('invalid');
      if (r.b.includes(bossId)) return dup({ gold: 0 });
      r.b.push(bossId);
      if (r.b.length > 400) r.b.splice(0, r.b.length - 400);
      const gold = B.modes[r.mode].bossGold;
      p.gold += gold;
      p.blue += B.bCoin.boss;
      return { ok: true, gold };
    },
    // Insane S 코인(R-023): superCoin.mode 판에서 판 안 S 코인 번호로 한 번만 1 S.
    awardBlueCoin(p, { runId, coinId }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ blue: 0 });
      if (!Number.isSafeInteger(coinId) || coinId < 1) return fail('invalid');
      if (!(B.modes[r.mode].blueCoin > 0)) return fail('invalid');
      if (r.bc.includes(coinId)) return dup({ blue: 0 });
      r.bc.push(coinId);
      if (r.bc.length > 400) r.bc.splice(0, r.bc.length - 400);
      p.blue += B.bCoin.value;
      return { ok: true, blue: B.bCoin.value };
    },
    awardPointBonus(p, { runId, score }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ gold: 0, blue: 0, super: 0 });
      if (!Number.isSafeInteger(score) || score < 0) return fail('invalid');
      if (r.pb) return dup({ ...r.pb });
      const reward = pointBonus(score);
      r.pb = { ...reward };
      p.gold += reward.gold;
      p.blue += reward.blue;
      p.superCoins += reward.super;
      return { ok: true, ...reward };
    },
    awardSuper(p, { runId, coinId }) {
      const r = p.runs[runId];
      if (!r) return fail('run_unknown');
      if (isWorldRun(r)) return dup({ super: 0 });
      if (!Number.isSafeInteger(coinId) || coinId < 1) return fail('invalid');
      if (r.mode !== B.superCoin.mode) return fail('invalid');
      if (r.s.includes(coinId)) return dup({ super: 0 });
      r.s.push(coinId);
      if (r.s.length > 400) r.s.splice(0, r.s.length - 400);

    // 최종전 승리 표식(R-297): 격파 순간 runs[runId].x.f = 1(한 번). 화면은 바로 체크포인트를 'retired'로 쓴다
    finalRun(p, { runId }) {
      const r = p.runs[runId];

      if (r.x?.f === 1) return dup();
      r.x = { ...(r.x || {}), f: 1 };
      return { ok: true };

      delete p.runs[runId];
      return { ok: true };
    },
    // 앱을 열 때: 오래된 판 보상 기록과 남은 SC 예약을 정리한다.
    cleanup(p, { now }) {
      let changed = false;
      for (const [id, r] of Object.entries(p.runs))
        if (now - r.t > RUN_STALE_MS) {
          delete p.runs[id];
          changed = true;
        }
      if (p.scHold) {
        p.scHold = null;
        changed = true;
      }

      // 동반 정리(R-237): 정리 결과가 원 목록과 다르면 바로 저장(원본을 남기면 빠진 고양이가 Lv5 뒤 저절로 돌아온다)
      const raw = partyRaw(p),
        party = partyOf(p),
        partyCut = raw.filter(id => !party.includes(id));
      if (partyCut.length) {

        changed = true;

    },

    note(p, { record: r, value, noteColor }) {

    // 새 이정표가 있으면 결과에 mile: [id]를 붙이고 쓰기(규칙이 dup이어도). ok가 아니면 그대로

    // 한 트랜잭션에서. 효과는 다음 출격부터(엔진은 출격 순간 구매 수로 단계를 계산). txId로 두 번 눌러도 한 번만

    // 자동 G 습득(R-025): 자동 강화를 먼저 사야 하고 한 번만 산다. 켜기/끄기는 브라우저 설정이라 여기 없다.

    // 고양이 해금(R-026, Lv0 → Lv1): S만 낸다. 예약된 S는 쓰지 않는다.

      if ((Number(expect.g) || 0) !== g || (Number(expect.s) || 0) !== s) return fail('stale');
      const short = (s && scShort(p, now, s)) || (p.gold < g ? 'insufficient' : null);
      if (short) return fail(short);
      const wear = cosWearChange(p, Object.fromEntries(change.map(slot => [slot, set[slot]])), craft);
      if (!wear) return fail('storage');
      p.gold -= g;
      p.superCoins -= s;
      p.cos = { ...p.cos, own: [...own, ...bought], wear };
      remember(p, txId);
      return { ok: true, price: { g, s }, bought, set: { ...set } };
    },
    // 옛 종료 호출도 첫 플레이의 근거로 받아 같은 문을 연다. 새 판은 startRun에서 이미 열린다.
    unlockHidden(p, { difficultyId, reason, world }) {
      if (p.hidden || world) return dup({ unlocked: false });
      if (modeId(difficultyId) !== B.cats.hiddenFrom || (reason !== 'defeated' && reason !== 'retired'))
        return dup({ unlocked: false });
      if (!isObj(p.cnt)) p.cnt = {};
      p.cnt['insane.played'] = 1;
      return { ...rules.openDoors(p), unlocked: true };
    },
    craftSC(p, { txId }) {
      if (!validId(txId)) return fail('invalid');
      if (p.tx.includes(txId)) return dup();
      if (p.gold < ECONOMY.scGold || p.blue < ECONOMY.scBlue) return fail('insufficient');
      // 파랑 모음(R-107)이면 한 번에 scMake개 — 값은 그대로, 거래 안에서 프로필로 계산
      const made = scCraftAmount(p);
      p.gold -= ECONOMY.scGold;
      p.blue -= ECONOMY.scBlue;
      p.superCoins += made;
      remember(p, txId);
      return { ok: true, made };
    },
    // S 예약(R-161 · R-240): n = 단계 cost 목록(HOLD_SIZES) 중 하나. 같은 준비(prepId)가 다른 n을 잡으면 그 자리에서
    // n과 at을 바꾼다(한 거래 — release 후 hold 두 번이 아님, 잔액이 모자라면 옛 예약 그대로)
    holdSC(p, { prepId, now, n = 1 }) {
      if (!validId(prepId)) return fail('invalid');
      if (!HOLD_SIZES.includes(n)) return fail('invalid');
      if (p.scHold?.prepId === prepId) {
        if (holdN(p.scHold.n) === n) return dup();
        if (p.superCoins < n) return fail('insufficient');
        p.scHold = { prepId, at: Number(now) || 0, n };
        return { ok: true };
      }
      if (p.superCoins < n) return fail('insufficient');
      if (p.scHold && now - p.scHold.at < HOLD_STALE_MS) return fail('held_elsewhere');
      p.scHold = { prepId, at: Number(now) || 0, n };
      return { ok: true };
    },
    releaseSC(p, { prepId }) {
      if (!p.scHold || p.scHold.prepId !== prepId) return dup();
      p.scHold = null;
      return { ok: true };
    },
    // 출격 확정: kind = 준비 화면의 출격 단계. 예약 수량이 그 단계 값과 다르거나 단계가 닫혔으면 stale(다른 탭이 단계를 바꿨거나
    // 옛 화면 — 보인 단계와 다른 수량을 빼지 않음)
    commitSC(p, { prepId, launchId, kind }) {
      if (!validId(launchId)) return fail('invalid');
      if (p.tx.includes(launchId)) return dup();
      if (!p.scHold || p.scHold.prepId !== prepId) return fail('not_held');
      const cost = holdN(p.scHold.n);
      if (cost !== launchTier(kind).cost || !tierOpen(p, kind)) return fail('stale');
      if (p.superCoins < cost) return fail('insufficient');
      p.superCoins -= cost;
      p.scHold = null;
      remember(p, launchId);
      return { ok: true, cost };
    },
    // 모드 해금 평가는 솔로 판만(월드 판은 밖, R-121)
    unlock(p, run) {
      if (run?.launch?.type === 'world') return dup({ newlyUnlocked: [] });
      const target = unlockTarget(run);
      if (!target || p.unlockedModes.includes(target)) return dup({ newlyUnlocked: [] });
      p.unlockedModes = MODES.filter(m => p.unlockedModes.includes(m) || m === target);
      return { ok: true, newlyUnlocked: [target] };
    },
    // GM 패널(R-065, GM 저장소에서만): 넘어온 항목만 바꾼다(다른 칸은 그대로). G · B · S는 0~GM_MAX 정수,
    // 고양이 Lv 0~maxLevel, 해금 = easy · hard + 고른 모드, 히든 탭. 레벨 0이 된 동반 고양이는 뺀다.
    // 격납고(R-109): hangar 참/거짓 = 열기 · 닫기, paint 'all' = 세 기체 모든 색 가짐(입힌 색 그대로) · 'none' = 모두 없음
    // 이정표(R-114): mile 'all' = 넘을 수 있는 이정표 모두 지금 시각(마스터 · 월드 잠김 그대로) · 'none' = 비움(감싼 mileCheck가 지금 상태로 다시 채움)
    gmSet(p, v = {}, now = 0) {
      const int = (x, max) => Math.min(max, Math.max(0, Math.floor(Number(x) || 0)));
      for (const k of ['gold', 'blue', 'superCoins']) if (v[k] !== undefined) p[k] = int(v[k], GM_MAX);
      for (const id of CATS) if (v.cats?.[id] !== undefined) p.cats[id] = int(v.cats[id], B.cats.maxLevel);
      if (Array.isArray(v.unlocked))
        p.unlockedModes = MODES.filter(m => m === 'easy' || m === 'hard' || v.unlocked.includes(m));
      if (typeof v.hidden === 'boolean') p.hidden = v.hidden;
      if (v.hangar === true && !p.opened.includes('hangar')) p.opened.push('hangar');
      if (v.hangar === false) p.opened = p.opened.filter(id => id !== 'hangar');
      if (v.paint === 'all') for (const id of CRAFT_IDS) p.paint.own[id] = [...COLORS];
      if (v.paint === 'none') p.paint = { own: {}, wear: {} };
      // 승진(R-113): promo { 고양이: 0~cap } → rank = n · open = min(cap, n + 1)(다음 시험이 열린 상태) · best 비움
      const cap = promoCap();
      for (const id of CATS)
        if (v.promo?.[id] !== undefined) {
          const n = int(v.promo[id], cap);
          p.promo[id] = { rank: n, open: Math.min(cap, n + 1), best: {} };
        }
      if ((p.companion && !(p.cats[p.companion] >= 1)) || Array.isArray(p.x?.party))
        writeParty(p, partyOf(p));
      if (v.mile === 'none') p.mile = {};
      if (v.mile === 'all') {
        const at = natural(now) > MILE_RETRO ? now : MILE_RETRO;
        for (const m of MILE)
          if (!(natural(p.mile[m.id]) > 0) && !(m.rank > cap) && !(m.door === 'world' && !B.world))
            p.mile[m.id] = at;
      }
      // 월드(R-121): world.door 참/거짓 = 문 열기 · 닫기, world.sk n = 월드 스킬 다섯 모두 n단(0~5)
      if (v.world?.door === true && !p.opened.includes('world')) p.opened.push('world');
      if (v.world?.door === false) p.opened = p.opened.filter(id => id !== 'world');
      if (v.world?.sk !== undefined)
        p.world = { ...p.world, sk: Object.fromEntries(WSK.map(id => [id, int(v.world.sk, WSK_MAX)])) };
      // 꾸미기(R-116): 'all' = 40조각 모두 가짐(입은 것 그대로) · 'none' = own 비우고 wear는 칭호만 남김. 문은 그대로
      // 연계 · 레이저(R-297): link = 구매 수 0~LINK_MAX · laser { lv 0~5, g · b · s 재고 } — 넘어온 칸만
      if (v.link !== undefined) p.x = { ...(isObj(p.x) ? p.x : {}), link: int(v.link, LINK_MAX) };
      if (isObj(v.laser)) {
        const set = {};
        if (v.laser.lv !== undefined) set.lv = int(v.laser.lv, LASER_MAX);
        for (const k of LASER_KINDS) if (v.laser[k] !== undefined) set[k] = int(v.laser[k], GM_MAX);
        writeLaser(p, set);
      }
      if (v.cos === 'all') p.cos = { ...p.cos, own: [...new Set([...cosOwn(p), ...COS.map(x => x.id)])] };
      if (v.cos === 'none') {
        const title = p.cos?.wear?.title;
        p.cos = {
          own: [],
          wear: title ? { title } : {},
          ...(Array.isArray(p.cos?.titles) ? { titles: [...p.cos.titles] } : {}),
        };
      }
      return { ok: true };
    },
    // 판 끝(R-100): 정상 종료이고 careerAt이 0인 기록이면 경력에 더하고 기록 careerAt = now(같은 트랜잭션).
    // 이미 더한 판은 중복(아무것도 안 함). 뒤 단계의 '판 끝에 한 번만' 일도 이 자리에 넣어 careerAt을 중복 막이로 쓴다
    // 승진 판정(R-111)도 여기서 한 번 — events는 화면이 결과 고양이 말풍선에 쓴다.
    // 보급 캡슐(R-116)도 여기서 한 번 — capsule = 받은 조각 id(없으면 null). force = GM '캡슐 항상'
    addCareer(p, { record, now, force }) {
      if (!careerRun(record) || record.careerAt > 0) return dup({ events: [], capsule: null });
      p.career = careerAdd(p.career, record);
      rules.openDoors(p);
      const events = promoRun(p, record),
        capsule = capsuleRun(p, record, { force });
      return { ok: true, record: { ...record, careerAt: natural(now) || 1 }, events, capsule };
    },
    // 열 때 줍기(R-100): 정상 종료 · careerAt 0 · date > since인 기록을 모두 더한다 → { records: [careerAt을 쓴 기록] }
    sweepCareer(p, { records, now }) {
      const out = [],
        capsules = [];
      const rows = (Array.isArray(records) ? records : [])
        .map(raw => Data().normalizeRecord(raw))
        .filter(Boolean);
      let bossBackfill = false;
      // 보관된 옛 월드 기록은 확인 가능한 합계의 하한만 보충한다. 전체 경력은 다시 더하지 않으며,
      // max를 써서 재스캔·자기 백업 가져오기·일부 기록 삭제 뒤에도 중복 누적되지 않는다.
      let worldBackfill = false;
      const retained = {};
      for (const r of rows) {
        if (!careerRun(r) || r.launch?.type !== 'world' || !(r.careerAt > 0 || r.date <= p.career.since))
          continue;
        retained['world.runs'] = (retained['world.runs'] || 0) + 1;
        if (r.world?.kind === 'practice' || r.world?.kind === 'daily') {
          const key = 'world.' + r.world.kind + '.runs';
          retained[key] = (retained[key] || 0) + 1;
        }
        retained['world.bosses'] = (retained['world.bosses'] || 0) + count(r.world?.wb);
      }
      for (const [key, value] of Object.entries(retained))
        if (value > (p.career.sum[key] || 0)) {
          p.career.sum[key] = value;
          worldBackfill = true;
        }
      if (p.career?.max?.bossby === undefined) {
        const career = cleanCareer(p.career);
        for (const r of rows) {
          if (!careerRun(r) || !Data().isSolo(r)) continue;
          const key = 'mode.' + r.difficultyId + '.boss',
            top = natural(r.bossTop) || 0;
          if (top > (career.max[key] || 0)) career.max[key] = top;
        }
        career.max.bossby = 1;
        p.career = career;
        bossBackfill = true;
      }
      // 모드 한 판 최고 Point(R-297, 연계 회로 조건): 남은 솔로 정상 종료 기록으로 한 번 소급(bossby와 같은 길)
      if (p.career?.max?.pointby === undefined) {
        const career = cleanCareer(p.career);
        for (const r of rows) {
          if (!careerRun(r) || !Data().isSolo(r) || !B.modes[r.difficultyId]) continue;
          const key = 'mode.' + r.difficultyId + '.point',
            score = nonNeg(Number(r.score)) || 0;
          if (score > (career.max[key] || 0)) career.max[key] = score;
        }
        career.max.pointby = 1;
        p.career = career;
        bossBackfill = true;
      }
      for (const r of rows) {
        if (!careerRun(r) || r.careerAt > 0 || !(r.date > p.career.since)) continue;
        p.career = careerAdd(p.career, r);
        promoRun(p, r);
        const cap = capsuleRun(p, r);
        if (cap) capsules.push(cap);
        out.push({ ...r, careerAt: natural(now) || 1 });
      }
      // 이정표(R-114): 주운 판 · 다른 길로 넘은 것까지 이 자리에서 한 번
      const doors = rules.openDoors(p),
        m = mileCheck(p, { now });
      return out.length || bossBackfill || worldBackfill || !doors.duplicate || !m.duplicate
        ? { ok: true, records: out, mile: m.ids, capsules }
        : dup({ records: [], mile: [], capsules: [] });
    },
    // 백업 가져오기(R-100): 경력 · 이정표는 '프로필 교체' 체크와 상관없이 합친다(잃는 것 없음)
    mergeMemory(p, { profile }) {
      if (!isObj(profile)) return fail('invalid');
      const career = careerMerge(p.career, profile.career),
        mile = mileMerge(p.mile, profile.mile);
      if (
        JSON.stringify(career) === JSON.stringify(p.career) &&
        JSON.stringify(mile) === JSON.stringify(p.mile)
      )
        return dup();
      p.career = career;
      p.mile = mile;
      rules.openDoors(p);
      return { ok: true };
    },
    // v4 이하 → v5 이관(R-100, 이관은 이곳 한 곳): 원본 사본 · 새 칸 기본값 · cleanup · MAX 정리 · 경력 처음 값 +
    // 처음 값에 넣은 기록마다 careerAt · 플레이 로그 'career' 줄. 저장 계층은 이 결과를 한 트랜잭션에서 쓴다.
    // raw = 저장된 main(없으면 null, fallback = 옛 localStorage 문서), seed가 거짓이면 처음 값 없이(since 0, 기록은 다음 줍기가 셈)
    migrate5(
      raw,
      { fallback = null, records = [], history: entries = [], now = 0, seed = true, version = '' } = {},
    ) {
      const src = isObj(raw) ? raw : isObj(fallback) ? fallback : null,
        p = migrate(src),
        capped = permaExcess(src),
        partyCut = rules.cleanup(p, { now }).partyCut || null;
      let s = { career: blankCareer(), ids: [], records: 0, log: 0 };
      if (seed)
        try {
          s = careerSeed({ records, history: entries });
        } catch {
          /* 처음 값 없이 */
        }
      p.career = s.career;
      rules.openDoors(p);
      // 이정표(R-114): 이관 때 이미 넘은 것은 '이전 기록'(값 1, 날짜 모름)
      mileCheck(p, { retro: true });
      const byId = new Map((Array.isArray(records) ? records : []).filter(r => r?.id).map(r => [r.id, r]));
      return {
        ok: true,
        profile: p,
        capped,
        partyCut,
        extra: isObj(raw) ? [{ ...raw, id: mainBackupId(raw.schemaVersion) }] : [],
        records: s.ids
          .filter(id => byId.has(id))
          .map(id => ({ ...byId.get(id), careerAt: natural(now) || 1 })),
        entry: history.mark(
          'career',
          { at: now, version },
          {
            from: src ? count(src.schemaVersion) : 0,
            runs: s.records + s.log,
            records: s.records,
            log: s.log,
          },
        ),
      };
    },
    // 백업 파일의 잔액·해금·영구 스택·고양이·구매로 바꾼다. 파일에 없는 항목은 기본값이 된다.
    // 진행 중 정보(runs·tx)는 그대로 두고, 이전 버전 최고점은 큰 값을 남긴다.
    // v5 진행 칸(열린 문 · 도색 · 승진 · 꾸미기 · 월드 스킬 · 셈 · 예비)도 파일 값으로 바꾼다. 경력 · 이정표는 mergeMemory가 맡는다
    restore(p, { profile }) {
      if (!profile || typeof profile !== 'object') return fail('invalid');
      const src = migrate({ ...profile, schemaVersion: SCHEMA });
      for (const k of ['gold', 'blue', 'superCoins', 'incomeTier', 'ownedAuto']) p[k] = src[k];
      p.unlockedModes = src.unlockedModes;
      p.perma = { ...src.perma };
      p.cats = { ...src.cats };
      p.companion = src.companion;
      p.hidden = src.hidden;
      p.ownedAutoGold = src.ownedAutoGold;
      p.legacyBest = Math.max(p.legacyBest, src.legacyBest);
      p.scHold = null;
      for (const k of V5_FIELDS) if (k !== 'career' && k !== 'mile') p[k] = src[k];
      // 동반 정리(R-237)는 가져오기 때 바로 저장(옛 백업의 여러 동반이 남지 않게)
      writeParty(p, partyOf(p));
      rules.openDoors(p);
      return { ok: true };
    },
  };

  // 플레이 로그 한 줄(R-039): 판 · 초기화 · 되돌리기 · 가져오기. 초기화해도 남고 최근 HISTORY_KEEP줄만 둔다.
  // meta = { version, balance, at }. 판 줄의 wallet은 판 보상이 끝난 뒤 잔액
  const wallet3 = p => ({ gold: count(p?.gold), blue: count(p?.blue), sc: count(p?.superCoins) });
  // 출격 종류: 'normal' · 'super'(솔로) · 그 밖의 id 꼴 종류(예: 'world')는 그대로 — 초기화 줄의 순위 1위는 솔로만
  const launchOf = r => {
    const t = r?.launch?.type;
    return t === 'super' ? 'super' : isId(t) ? t : 'normal';
  };
  const history = {
    run(r, p, extra = {}) {
      return {
        at: Number(r.date) || Date.now(),
        kind: 'run',
        version: String(r.version || ''),
        balance: String(r.balance || ''),
        mode: modeId(r.difficultyId),
        craft: String(r.craft || ''),
        launch: launchOf(r),
        reason: String(r.reason || ''),
        time: Math.round((Number(r.time) || 0) * 10) / 10,
        level: count(r.level),
        stage: count(r.stage),
        score: count(r.score),
        kills: count(r.kills),
        bosses: count(r.bossKills),
        auto: r.autoUsed === true,
        earned: { gold: count(r.earned?.gold), blue: count(r.earned?.blue), sc: count(r.earned?.super) },
        wallet: wallet3(p),
        unlocked: Array.isArray(extra.unlocked) ? extra.unlocked.map(modeId) : [],
        hidden: extra.hidden === true,
        // 출격 버프(R-062): 낸 버프 · 1회 부활을 썼는지
        buffs: buffList(r.buffs),
        revived: r.revived === true,
      };
    },
    // 초기화 직전 상태 요약: 잔액 · 상점 · 해금 · 영구 스택 합 · 고양이 · 기록 수 · 순위 1위 Point
    reset(raw, records, meta = {}) {
      const p = migrate(raw),
        list = Array.isArray(records) ? records : [],
        best = kind => list.reduce((m, r) => (launchOf(r) === kind ? Math.max(m, count(r.score)) : m), 0);
      return {
        ...history.mark('reset', meta),
        wallet: wallet3(p),
        incomeTier: p.incomeTier,
        ownedAuto: p.ownedAuto,
        ownedAutoGold: p.ownedAutoGold,
        unlocked: [...p.unlockedModes],
        perma: Object.values(p.perma).reduce((a, n) => a + count(n), 0),
        cats: { ...p.cats },
        hidden: p.hidden,
        runs: list.length,
        best: { normal: best('normal'), super: best('super') },
      };
    },
    mark(kind, meta = {}, extra = {}) {
      return {
        at: Number(meta.at) || Date.now(),
        kind,
        version: String(meta.version || ''),
        balance: String(meta.balance || B.name),
        ...extra,
      };
    },
    // 문서에 한 줄 더하기(오래된 줄부터 버린다)
    add(doc, entry) {
      const old = Array.isArray(doc?.entries) ? doc.entries : [];
      return { id: HISTORY_ID, entries: [...old, entry].slice(-HISTORY_KEEP) };
    },
  };

  class ProfileStore {
    constructor(runStore, clock = () => Date.now()) {
      this.store = runStore;
      this.now = clock;
      this.profile = blank();
      this.storageLimited = false;
      this.storageReason = '';
      // 열 때 MAX를 넘던 영구 스택을 줄이고 돌려준 내역(R-042, permaExcess 형식). 없으면 null
      this.capped = null;
      // 부팅 정리에서 빠진 동반 고양이 id(R-237, cleanup partyCut). 화면이 첫 홈 안내 한 번에 쓴다. 없으면 null

          records: os => os.records.getAll(),
          h: os => os.profiles.get(HISTORY_ID),

        let next = null,
          saved = null,
          out = null;
        const profiles = tx.objectStore('profiles'),
          pr = profiles.get(PROFILE_ID);

          recordReady = !recordId,
          record = null;

    mutate(change, recordId) {
      change = rules.withMile(change, this.now());
      return this.serial(async () => {
        if (this.store.db) return this.transaction(change, recordId);
        if (recordId)
          return this.result(false, {
            reason: 'storage_unavailable',
            message: T().msg.storage.needDB,
          });
        const perform = () => {
          try {
            const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
            if (saved && saved.schemaVersion !== SCHEMA) {
              this.limit();
              return this.result(false, { reason: 'migrate' });
            }
            const p = migrate(saved || this.profile),
              out = change(p, null);
            if (out.ok && !out.duplicate) localStorage.setItem(KEY, JSON.stringify(p));
            this.profile = p;
            return this.result(out.ok, out);
          } catch {
            return this.result(false, { reason: 'storage' });

    // 실패 · 중단이면 null(아무것도 바뀌지 않음)
    tx(stores, reads, write) {
      return new Promise(resolve => {
        let t;
        try {
          t = this.store.db.transaction(stores, 'readwrite');
        } catch {
          return resolve(null);
        }
        const os = Object.fromEntries(stores.map(n => [n, t.objectStore(n)])),
          got = {},
          keys = Object.keys(reads);
        let left = keys.length,
          out = null;
        const go = () => {
          try {
            out = write(got, os);
          } catch {
            out = null;
            t.abort();
          }
        };
        for (const k of keys) {
          const req = reads[k](os);
          req.onsuccess = () => {
            got[k] = req.result;
            if (!--left) go();

        if (!keys.length) go();
        t.oncomplete = () => resolve(out);
        t.onerror = t.onabort = () => resolve(null);
      });

          { snap: os => os.profiles.get(RESET_ID), h: os => os.profiles.get(HISTORY_ID) },

        }

        return this.result(true, { records: out.records });

    const launch = r.launch === 'super' ? 'super' : 'normal',
      startLevel = launch === 'super' ? balance.superLaunch.level : 1,
      blueLevel =
        Math.max(0, Math.floor(num(r.level) / E.blueEvery) - Math.floor(startLevel / E.blueEvery)) * M.blue,
      blueCoins = realBlue ? r.blueCoins : (manualCoins + capped + chance) * share,
      blueCoin = blueCoins * num(E.coinChoiceBlue),
      // 보스 B(보스마다) · 포인트 B · 필드 B 코인: 실제 기록(r.actual)이면 실제 B에서 알려진 몫을 뺀 나머지,
      // 시뮬레이션 행이면 매분 모드 확률 × 값(필드에 쌓이므로 전부 줍는다고 본 상한 — 줍는 노력에 달림)
      blueBoss = num(r.bosses) * bc.boss,
      bluePoint = point.blue,
      // 승진 보급관 B · S(실제 기록이면 필드 B에서 빠지도록 알려진 몫에 넣는다)
      cat = promoSupply(balance, mode, r.supplyRank, w),
      blueCat = cat.blue,
      blueKnown = blueLevel + blueCoin + blueBoss + bluePoint + blueCat,
      blueField = isObj(r.actual)
        ? Math.max(0, num(r.actual.blue) - blueKnown)
        : w * num(M.blueCoin) * bc.value,
      blue = blueKnown + blueField,
      // S 코인은 줍는다고 가정한다(실제 개수가 있으면 그것). 포인트 S를 더한다
      sc =
        typeof r.superCoins === 'number' && Number.isFinite(r.superCoins)
          ? r.superCoins
          : mode === balance.superCoin.mode
            ? Math.max(0, Math.floor((minutes * 60) / balance.superCoin.every))
            : 0,
      superCat = cat.super,
      superAll = sc + point.super + superCat,
      per = v => (minutes > 0 ? v / minutes : 0);
    return {
      minutes,
      wholeMinutes: w,
      gold,
      blueLevel,
      blueCoin,
      blueBoss,
      blueField,
      bluePoint,
      blueCat,
      blue,
      superCat,
      super: superAll,
      superCost: launch === 'super' ? 1 : 0,
      perMinute: { gold: per(gold.total), blue: per(blue), super: per(superAll) },
    };
  }

  // 저장된 기록(NeonData.normalizeRecord 결과)을 economy 입력으로. 10초 미만 판은 뺀다.
  // 이 balance 규칙대로 만든 기록이면 economy(balance, recordRow(r)).gold.total ≈ earned.gold.
  function recordRow(record, balance) {
    if (!record || typeof record !== 'object') return null;
    const time = num(record.time);
    if (time < 10) return null;
    const E = balance.economy,
      mode = modeOf(balance, record.difficultyId),
      M = balance.modes[mode],
      earned = record.earned || {},
      minutes = time / 60,
      w = Math.floor(minutes),
      autoPicks = num(record.autoChoices),
      manualCoins = num(record.coinChoices),
      blueCoins = num(E.coinChoiceBlue) > 0 ? num(earned.blueCoin) / E.coinChoiceBlue : 0,
      n = E.coinChoice > 0 ? num(earned.autoGold) / E.coinChoice : 0;
    const capShare =
      autoPicks > 0 && n > 0 && E.autoGoldCapped > E.autoGoldChance
        ? clamp((n / autoPicks - E.autoGoldChance) / (E.autoGoldCapped - E.autoGoldChance), 0, 1)
        : 0;
    // 포인트 G(earned.point, R-079)는 분 보상이 아니라서 뺀다. 옛 기록은 0
    const minuteGold =
      num(earned.gold) -
      num(earned.boss) -
      num(earned.cat) -
      num(earned.autoGold) -
      num(earned.point) -
      manualCoins * E.coinChoice;
    const tier = w >= 1 ? clamp(Math.round(minuteGold / w - E.goldBase - M.goldBonus), 0, E.incomeMax) : 0;
    return {
      mode,
      launch: record.launch?.type === 'super' ? 'super' : 'normal',
      minutes,
      level: num(record.level),
      bosses: num(record.bossKills),
      manualCoins,
      blueCoins,
      autoPicks,
      capShare,
      autoGold: n > 0,
      tier,
      supplyLv: record.cats?.supply || 0,
      // 승진(R-113): 그 판 보급관 단계(1~9 정수만, 없으면 0)
      supplyRank:
        Number.isInteger(record.ranks?.supply) && record.ranks.supply >= 1 && record.ranks.supply <= 9
          ? record.ranks.supply
          : 0,
      actual: { gold: num(earned.gold), blue: num(earned.blue), super: num(earned.super) },
      record: { id: record.id, date: record.date, craft: record.craft },
      score: num(record.score),
      // 포인트 보상은 실제로 받은 판(earned.point가 있는 판)만 점수로 계산한다. 옛 기록은 0
      pointScore: num(earned.point) > 0 ? num(record.score) : 0,
      balance: typeof record.balance === 'string' ? record.balance : '',
    };
  }

  // ── 자동 판 판 줄 → 경제 입력(lab.html simAggregate와 같은 변환) ──
  function runRow(balance, run, settings, tier) {
    if (!isObj(run) || !own(balance.modes, run.mode)) return null;
    return {
      mode: run.mode,
      launch: run.launch,
      minutes: num(run.time) / 60,
      level: run.level,
      bosses: run.bosses,
      manualCoins: run.manualCoins,
      autoPicks: run.autoPicks,
      autoGold: !!(settings && settings.autoGold) && !!balance.modes[run.mode].auto,
      autoGoldCoins: run.autoGoldCoins,
      blueCoins: run.blueCoins,
      tier,
      supplyLv: 0,
      superCoins: run.sSpawned,
      score: run.score,
    };
  }
  // 판 하나 + 끝까지 살았는지 · 분당 Point · G · B
  function runRates(balance, run, settings, tier) {
    const row = runRow(balance, run, settings, tier);
    if (!row) return null;
    const e = economy(balance, row),
      min = num(run.time) / 60,
      per = v => (min > 0 ? v / min : 0);
    return {
      ...run,
      full: run.reason === 'time',
      ppm: per(num(run.score)),
      gpm: per(e.gold.total),
      bpm: per(e.blue),
    };
  }
  // 한 모드 · 한 묶음(지금/실험)의 판들 → 평균 · 분당(합 ÷ 합 분). 모르는 모드 판은 건너뛴다.
  function modeMetrics(balance, runs, settings, tier) {
    let n = 0,
      t = 0,
      lv = 0,
      full = 0,
      score = 0,
      gold = 0,
      blue = 0,
      sc = 0,
      st = 0,
      boss = 0;
    for (const r of Array.isArray(runs) ? runs : []) {
      const row = runRow(balance, r, settings, tier);
      if (!row) continue;
      const e = economy(balance, row);
      n++;
      t += num(r.time);
      lv += num(r.level);
      st += num(r.stage);
      boss += num(r.bosses);
      score += r.score || 0;
      gold += e.gold.total;
      blue += e.blue;
      sc += e.super;
      if (r.reason === 'time') full++;
    }
    if (!n) return null;
    const min = t / 60,
      per = v => (min > 0 ? v / min : 0);
    return {
      n,
      time: t / n,
      full: full / n,
      allFull: full === n,
      level: lv / n,
      stage: st / n,
      bosses: boss / n,
      score: score / n,
      ppm: per(score),
      gpm: per(gold),
      bpm: per(blue),
      spm: per(sc),
    };
  }

  // ── 흔들림 판정: 같은 기체 · 시드끼리 짝지은 차이(실험 − 지금)의 평균이 표준오차 2배를 넘어야 '변화' ──
  // value(run) → 숫자. 짝이 3개 미만이면 판정하지 않는다(sure = false).
  function paired(nowRuns, expRuns, value) {
    const key = r => r.craft + '|' + r.seed,
      map = new Map((nowRuns || []).map(r => [key(r), r])),
      d = [];
    for (const r of expRuns || []) if (map.has(key(r))) d.push(value(r) - value(map.get(key(r))));
    const n = d.length;
    if (!n) return { n: 0, mean: 0, se: 0, same: true, sure: false };
    const mean = d.reduce((s, x) => s + x, 0) / n,
      sd = n > 1 ? Math.sqrt(d.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1)) : 0,
      se = sd / Math.sqrt(n),
      same = d.every(x => Math.abs(x) < 1e-9);
    return { n, mean, se, same, sure: !same && n >= 3 && Math.abs(mean) > 2 * se };
  }

  // ── 노이즈(대조군): 사실상 같은 값(대조군)과 지금 값의 짝 차이 흔들림. 짝 = 같은 기체 · 판 번호.
  // value(run) → 숫자. 반환 { n, sd, minDetect }: sd = 짝 차이 표준편차, minDetect = 이 짝 수에서 잡히는 최소 차이(2표준오차).
  // 짝이 2개 미만이면 sd · minDetect는 NaN.
  function noiseFloor(nowRuns, ctlRuns, value) {
    const key = r => r.craft + '|' + r.seed,
      map = new Map((nowRuns || []).map(r => [key(r), r])),
      d = [];
    for (const r of ctlRuns || []) if (map.has(key(r))) d.push(value(r) - value(map.get(key(r))));
    const n = d.length;
    if (n < 2) return { n, sd: NaN, minDetect: NaN };
    const mean = d.reduce((s, x) => s + x, 0) / n,
      sd = Math.sqrt(d.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1));
    return { n, sd, minDetect: (2 * sd) / Math.sqrt(n) };
  }

  // ── 길이 분포(목표 구간): 판이 끝난 시각별 비율. 탈락 = 쓰러진 판, 끝까지 = 길이 끝까지 버틴 판.
  // cuts = [a, b](분): 탈락 시각이 a분 전 · a~b분 · b분 뒤로 나눈다. 반환 값은 판 수 대비 비율(0~1).
  function lengthBands(runs, cuts) {
    const [a, b] = cuts,
      list = runs || [],
      n = list.length;
    if (!n) return { n: 0, before: NaN, between: NaN, after: NaN, alive: NaN };
    const died = list.filter(r => r.reason !== 'time'),
      at = r => Number(r.time) / 60,
      share = k => list.filter(k).length / n;
    return {
      n,
      before: share(r => r.reason !== 'time' && at(r) < a),
      between: share(r => r.reason !== 'time' && at(r) >= a && at(r) < b),
      after: share(r => r.reason !== 'time' && at(r) >= b),
      alive: share(r => r.reason === 'time'),
      died: died.length,
    };
  }
  // ── 단계 순서 검사: 단계가 높은 모드가 낮은 모드보다 더 오래 버티면(끝까지 비율이 높으면) 뒤집힌 것.
  // rows = [{ mode, tier, value, margin }]. margin = 각 모드 값의 흔들림(최소 차이). 흔들림 안의 차이는 뒤집힘으로 보지 않는다.
  // 반환: [{ low, high, gap }] (low = 단계가 낮은 모드, high = 단계가 높은 모드, gap = 뒤집힌 크기)
  function tierOrder(rows) {
    const out = [],
      list = (rows || []).filter(r => Number.isFinite(r.tier) && Number.isFinite(r.value));
    for (const lo of list)
      for (const hi of list) {
        if (!(lo.tier < hi.tier)) continue;
        const slack = (Number(lo.margin) || 0) + (Number(hi.margin) || 0),
          gap = hi.value - lo.value;
        if (gap > slack) out.push({ low: lo.mode, high: hi.mode, gap });
      }
    return out;
  }

  // ── 한 묶음의 흔들림: 같은 설정 판들의 표준편차(sd)와, 판 수 n인 두 묶음을 비교할 때 잡히는 최소 차이(2표준오차, 독립 가정) ──
  // 짝 비교는 판이 작은 변화에도 갈라져서(대조군 참고) 짝을 쓰지 않는다. 최소 차이 = 2 × √2 × sd ÷ √n.
  function spreadOf(list, value) {
    const xs = (list || []).map(value).filter(Number.isFinite),
      n = xs.length;
    if (n < 2) return { n, sd: NaN, minDetect: NaN };
    const mean = xs.reduce((s, x) => s + x, 0) / n,
      sd = Math.sqrt(xs.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1));
    return { n, sd, minDetect: (2 * Math.SQRT2 * sd) / Math.sqrt(n) };
  }

  // ── 생존 곡선: t분(0..minutes)에 살아 있는 비율. 항목 { time, full } ──
  function survival(list, minutes) {
    const out = [];
    for (let t = 0; t <= minutes; t++)
      out.push(list.length ? list.filter(x => x.full || x.time >= t * 60 - 1e-6).length / list.length : NaN);
    return out;
  }

  // ── 해금: 판 끝 값이 그 해금 조건을 모두 채우면 도달(조건이 모두 커지기만 하므로 끝 값으로 충분) ──
  function unlockReach(balance, id, run) {
    if (!own(balance.unlock, id) || !isObj(run)) return false;
    const u = balance.unlock[id];
    return num(run.time) >= num(u.time) && num(run.score) >= num(u.score) && num(run.level) >= num(u.level);
  }

  // 모드 · 출격 종류로 묶기. 모드 키 순서, 같은 모드는 일반 다음 S 출격.
  function groupRows(rows, balance) {
    const groups = new Map();
    for (const id of Object.keys(balance.modes))
      for (const launch of ['normal', 'super']) groups.set(id + '|' + launch, { mode: id, launch, rows: [] });
    for (const row of rows || []) {
      if (!row) continue;
      const launch = row.launch === 'super' ? 'super' : 'normal',
        key = row.mode + '|' + launch;
      if (!groups.has(key)) groups.set(key, { mode: row.mode, launch, rows: [] });
      groups.get(key).rows.push(row);
    }
    return [...groups].filter(([, g]) => g.rows.length).map(([key, g]) => ({ key, ...g }));
  }

  const GOLD_KEYS = [
    'minute',
    'cat',
    'boss',
    'coin',
    'autoGoldCapped',
    'autoGoldChance',
    'autoGold',
    'point',
    'total',
  ];
  function summarize(balance, rows) {
    const list = (rows || []).filter(Boolean),
      n = list.length,
      sum = { gold: Object.fromEntries(GOLD_KEYS.map(k => [k, 0])) },
      extra = [
        'blue',
        'blueLevel',
        'blueCoin',
        'blueBoss',
        'blueField',
        'bluePoint',
        'blueCat',
        'super',
        'superCat',
        'superCost',
        'minutes',
        'level',
        'bosses',
      ];
    for (const k of extra) sum[k] = 0;
    for (const row of list) {
      const e = economy(balance, row);
      for (const k of GOLD_KEYS) sum.gold[k] += e.gold[k];
      sum.blue += e.blue;
      sum.blueLevel += e.blueLevel;
      sum.blueCoin += e.blueCoin;
      sum.blueBoss += e.blueBoss;
      sum.blueField += e.blueField;
      sum.bluePoint += e.bluePoint;
      sum.blueCat += e.blueCat;
      sum.super += e.super;
      sum.superCat += e.superCat;
      sum.superCost += e.superCost;
      sum.minutes += e.minutes;
      sum.level += num(row.level);
      sum.bosses += num(row.bosses);
    }
    const avg = v => (n > 0 ? v / n : 0),
      perMin = v => (sum.minutes > 0 ? v / sum.minutes : 0);
    const perRun = { gold: Object.fromEntries(GOLD_KEYS.map(k => [k, avg(sum.gold[k])])) };
    for (const k of extra) perRun[k] = avg(sum[k]);
    // 실제 수입: 모든 판에 실제 값이 있을 때만(판이 없으면 null)
    const actual =
      n > 0 && list.every(r => isObj(r.actual))
        ? {
            gold: avg(list.reduce((s, r) => s + num(r.actual.gold), 0)),
            blue: avg(list.reduce((s, r) => s + num(r.actual.blue), 0)),
            super: avg(list.reduce((s, r) => s + num(r.actual.super), 0)),
          }
        : null;
    return {
      n,
      minutes: sum.minutes,
      perRun,
      perMinute: { gold: perMin(sum.gold.total), blue: perMin(sum.blue), super: perMin(sum.super) },
      actual,
    };
  }

  // 기록이 없을 때 쓰는 예시 판 유형(이름은 화면이 붙인다)
