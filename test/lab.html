              changes: state.changes,
              rows: state.rows,
              sim: state.sim,
              results: { sim: state.simResults },
            },
            base,
            { now: Date.now(), version: VERSION },
          );
        }
        let draftTimer = 0;
        function saveDraft() {
          clearTimeout(draftTimer);
          draftTimer = setTimeout(() => {
            store.draft = {
              scenario: Lab.toJSON(scenarioNow(state.name)),
              ui: {
                tab: state.tab,
                stage: state.stage,
                source: state.source,
                name: state.name,
                sumOpen: state.sumOpen,
                simOpen: state.simOpen,
                axis: state.axis,
                shown: state.shown,
                craft: state.craft,
                chips: [...state.chips],
              },
            };
            writeStore();
          }, 300);
        }
        function applyScenario(sc) {
          state.changes = { ...sc.changes };
          state.rows = cleanRows(sc.rows);
          state.sim = cleanSim(sc.sim);
          const r = sc.results && sc.results.sim;
          state.simResults = validResults(r) ? r : null;
        }
        (function restore() {
          const d = store.draft;
          if (d && typeof d.scenario === 'string') {
            const r = Lab.parseScenario(d.scenario, base);
            if (r.ok) applyScenario(r.scenario);
          }
          const ui = (d && d.ui) || {};
          if (TABS.includes(ui.tab)) state.tab = ui.tab;
          if (Number.isFinite(ui.stage) && ui.stage >= 1) state.stage = Math.floor(ui.stage);
          if (['preset', 'test', 'real'].includes(ui.source)) state.source = ui.source;
          if (typeof ui.name === 'string') state.name = ui.name.slice(0, 60);
          if (typeof ui.sumOpen === 'boolean') state.sumOpen = ui.sumOpen;
          // 조건 칸: 결과가 있으면 접힌 채 시작
          state.simOpen = typeof ui.simOpen === 'boolean' ? ui.simOpen : !state.simResults;
          if (ui.axis === 'mode') state.axis = 'mode';
          if (Array.isArray(ui.shown)) {
            const shown = MODES.filter(m => ui.shown.includes(m));
            if (shown.length) state.shown = shown;
          }
          if (CRAFTS.includes(ui.craft)) state.craft = ui.craft;
          if (Array.isArray(ui.chips))
            for (const t of ui.chips) if (Lab.IMPACTS.includes(t)) state.chips.add(t);
        })();

        // ── 공통 조각 ──
        let toastTimer = 0;
        function toast(msg) {
          const el = $('toast');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }
        const segBtn = (v, label, on, extra = '') =>
          '<button type="button" data-v="' +
          esc(v) +
          '" aria-pressed="' +
          (on ? 'true' : 'false') +
          '"' +
          extra +
          '>' +
          esc(label) +
          '</button>';
        const legend = () =>
          '<div class="legend"><span><i></i>' +
          esc(L.now) +
          '</span><span><i class="exp"></i>' +
          esc(L.exp) +
          '</span></div>';
        const method = (title, list) =>
          '<details class="method"><summary>' +
          esc(title) +
          '</summary><ul>' +
          list.map(x => '<li>' + esc(x) + '</li>').join('') +
          '</ul></details>';
        function niceMax(v) {
          if (!(v > 0)) return 1;
          const p = Math.pow(10, Math.floor(Math.log10(v)));
          for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (v <= m * p + 1e-12) return m * p;
          return 10 * p;
        }
        // 꺾은선 그래프: x = 이름(모드), series[0] = 지금(실선), series[1] = 실험(점선)
        function lineChart(labels, series) {
          const W = 340,
            H = 136,
            l = 36,
            r = 10,
            t = 10,
            b = 20,
            n = labels.length,
            vals = series.flat().filter(Number.isFinite),
            top = niceMax(Math.max(0, ...vals)),
            X = i => l + (n > 1 ? (i * (W - l - r)) / (n - 1) : (W - l - r) / 2),
            Y = v => t + (1 - (Number.isFinite(v) ? v : 0) / top) * (H - t - b);
          let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
          for (const f of [0, 0.5, 1]) {
            const y = Y(top * f).toFixed(1);
            s +=
              '<line class="grid" x1="' +
              l +
              '" x2="' +
              (W - r) +
              '" y1="' +
              y +
              '" y2="' +
              y +
              '" />' +
              '<text x="' +
              (l - 5) +
              '" y="' +
              (Number(y) + 3) +
              '" text-anchor="end">' +
              esc(fmt(top * f)) +
              '</text>';
          }
          labels.forEach((lb, i) => {
            s +=
              '<text x="' +
              X(i).toFixed(1) +
              '" y="' +
              (H - 5) +
              '" text-anchor="middle">' +
              esc(lb) +
              '</text>';
          });
          series.forEach((vs, si) => {
            const cls = si ? 'exp' : 'now';
            s +=
              '<path class="' +
              cls +
              '" d="' +
              vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') +
              '" />';
            vs.forEach((v, i) => {
              s +=
                '<circle class="' +
                cls +
                '" cx="' +
                X(i).toFixed(1) +
                '" cy="' +
                Y(v).toFixed(1) +
                '" r="3" />';
            });
          });
          return s + '</svg>';
        }
        function numsTable(labels, a, b) {
          let h =
            '<table class="nums"><thead><tr><th></th>' +
            labels.map(x => '<th>' + esc(x) + '</th>').join('') +
            '</tr></thead><tbody><tr><th>' +
            esc(L.now) +
            '</th>' +
            a.map(v => '<td>' + esc(fmt(v)) + '</td>').join('') +
            '</tr>';
          if (b)
            h +=
              '<tr class="exp-row"><th>' +
              esc(L.exp) +
              '</th>' +
              b
                .map((v, i) => '<td' + (same(v, a[i]) ? ' class="same"' : '') + '>' + esc(fmt(v)) + '</td>')
                .join('') +
              '</tr>';
          return h + '</tbody></table>';
        }

        // ── 판단용 공통(R-068): 변화 글자 · 자동 판 보기 · 경고 · 요약 칸 ──
        const modeColor = m => 'var(--mode-' + m + ')';
        const pctText = (d, pp) => (d > 0 ? '+' : '−') + Math.abs(Math.round(d)) + (pp ? '%p' : '%');
        // 변화: 상대 %(pp면 %p). 흔들림 밖(sure)일 때만 초록 유리 · 빨강 불리, 3% 미만 · 흔들림 안은 회색, 같으면 '·'
        function change(a, b, { pp = false, sure = true, same: none = false } = {}) {
          if (!Number.isFinite(a) || !Number.isFinite(b)) return { text: '—', cls: 'flat', wobble: false };
          const d = pp ? (b - a) * 100 : a ? ((b - a) / Math.abs(a)) * 100 : b ? 100 : 0;
          if (none || Math.abs(d) < 0.5) return { text: '·', cls: 'flat', wobble: false };
          return {
            text: pctText(d, pp),
            cls: !sure || Math.abs(d) < FLAT_PCT ? 'flat' : d > 0 ? 'good' : 'bad',
            wobble: !sure,
          };
        }
        const ppk = (B, m) => Lab.pointPerKill(B, m, REF_STAGE);
        const DASH = { text: '—', cls: 'flat' };

        // 자동 판 결과 보기(메모): 결과 · 바꾼 값 · 조건이 바뀔 때만 다시 계산한다
        const SIG_KEYS = ['time', 'level', 'full', 'ppm', 'gpm', 'bpm'];
        let simMemo = { key: '', view: null };
        function simView() {
          const r = state.simResults;
          if (!validResults(r) || !r.runs.length) return null;
          const key = keyOf([r.at, r.runs.length, r.errors.length, state.changes, state.sim, !!running]);
          if (simMemo.key === key) return simMemo.view;
          const s = r.settings,
            tier = state.sim.tier,
            two = r.sets.includes('exp'),
            ranB = two ? Lab.apply(base, r.changes || {}).balance : base,
            balOf = set => (set === 'exp' ? ranB : base),
            rated = r.runs.map(run => Lab.runRates(balOf(run.set), run, s, tier)).filter(Boolean),
            pick = (list, set, m) => list.filter(x => x.set === set && x.mode === m),
            status = Lab.simStatus(r, { base, changes: state.changes, settings: state.sim }),
            table = s.modes.map(m => {
              const now = Lab.modeMetrics(base, pick(r.runs, 'now', m), s, tier),
                exp = two ? Lab.modeMetrics(ranB, pick(r.runs, 'exp', m), s, tier) : null,
                sig = {};
              for (const k of SIG_KEYS)
                sig[k] = Lab.paired(pick(rated, 'now', m), pick(rated, 'exp', m), x => +x[k]);
              return {
                mode: m,
                now,
                exp,
                sig,
                same: !!exp && SIG_KEYS.every(k => sig[k].n > 0 && sig[k].same),
              };
            });
          simMemo = {
            key,
            view: { r, s, two, ranB, status, table, running: !!running, fresh: !running && status.fresh },
          };
          return simMemo.view;
        }
        // 맞는 자동 판(실험 묶음이 있고 지금 값 · 조건과 같음)의 그 모드 줄
        const freshRow = (v, m) => (v && v.fresh && v.two ? v.table.find(x => x.mode === m && x.exp) : null);
        const condText = s =>
          L.sim.condLine(
            s.modes.length === MODES.length
              ? L.sim.allModes(MODES.length)
              : s.modes.map(m => T.modeName(m)).join(' · '),
            s.crafts.length,
            L.sim.launches[s.launch],
            s.minutes,
            L.sim.stageText(s.stage, s.rushTo ?? Sim.RUSH.to, s.perMin ?? 1),
            s.seeds,
          );
        // 옛 결과 차이 줄: 지문(balance.js 지금 값) → 바꾼 값 → 조건
        const SET_NAMES = {
          modes: L.sim.modes,
          crafts: L.sim.crafts,
          launch: L.sim.launch,
          minutes: L.sim.minutes,
          stage: L.sim.stagePlan,
          rushTo: L.sim.rushTo,
          perMin: L.sim.perMin,
          seeds: L.sim.seeds,
          autoGold: L.sim.autoGold,
        };
        function setValue(k, v) {
          if (k === 'modes') return (v || []).map(m => T.modeName(m)).join('·');
          if (k === 'crafts') return (v || []).map(c => T.craftName(c)).join('·');
          if (k === 'launch') return L.sim.launches[v] || String(v);
          if (k === 'minutes') return L.sim.minute(v);
          if (k === 'stage') return L.sim.stages[v] || String(v);
          if (k === 'seeds') return L.sim.seedsOf(v);
          return raw(v);
        }
        function staleLines(st, ran, now) {
          const out = [];
          if (st.base === 'unknown') out.push(L.sim.staleUnknown);
          else if (st.base === 'changed') out.push(L.sim.staleBase(st.names.ran, st.names.now));
          for (const c of st.changes) out.push(L.sim.staleValue(L.label(c.path), raw(c.ran), raw(c.now)));
          for (const k of st.settings)
            out.push(L.sim.staleSetting(SET_NAMES[k] || k, setValue(k, ran[k]), setValue(k, now[k])));
          return out;
        }
        function staleCard(lines, extra) {
          return (
            '<div class="stale" role="alert"><strong>' +
            esc(L.sim.staleTitle) +
            '</strong><ul>' +
            lines
              .slice(0, STALE_LINES)
              .map(x => '<li>' + esc(x) + '</li>')
              .join('') +
            (lines.length > STALE_LINES
              ? '<li>' + esc(L.sim.staleMore(lines.length - STALE_LINES)) + '</li>'
              : '') +
            '</ul>' +
            extra +
            '</div>'
          );
        }
        // 이 기기 기록(경제 탭에서 고른 출처, 예시면 시험 경로): 모드 · 출격 종류의 줄
        function recordRuns(mode, launch) {
          const rec = state.records[recSrc()];
          return rec && rec.status === 'ok'
            ? rec.rows.filter(r => r.mode === mode && r.launch === launch)
            : [];
        }
        // 생존 곡선의 기록 점선: 지금 값(balance 이름이 같음) 기록이 REAL_MIN판 이상이면 그것만, 아니면 전부
        function realRuns(mode, launch) {
          const all = recordRuns(mode, launch),
            cur = all.filter(r => r.balance === base.name);
          return cur.length >= REAL_MIN
            ? { list: cur, old: false }
            : { list: all, old: all.length > cur.length };
        }
        // 판 길이(분): 지금 = 기록 평균(없으면 예시 분), 실험 = 지금 × 자동 판 생존 변화(흔들림 밖일 때만)
        function runLength(mode, launch, fallback) {
          const list = recordRuns(mode, launch),
            now = list.length ? list.reduce((s, r) => s + r.minutes, 0) / list.length : fallback,
            v = simView(),
            row = v && v.s.launch === launch ? freshRow(v, mode) : null,
            k = row && row.now && row.now.time > 0 && row.sig.time.sure ? row.exp.time / row.now.time : 1;
          return {
            now,
            exp: now * k,
            k,
            src: list.length ? L.economy.lenSrc.records(list.length) : L.economy.lenSrc.preset,
          };
        }
        // 요약 G/분 · B/분: 경제 탭 줄 출처(예시 = 그 모드 일반 출격 예시 줄, 기록 = 그 모드 · 일반 묶음)의 분당 식
        function econDelta(m) {
          let rows = [];
          if (state.source === 'preset') {
            const r = state.rows.find(x => x.mode === m && x.launch === 'normal');
            if (r) rows = [r];
          } else {
            const rec = state.records[state.source];
            if (rec && rec.status === 'ok')
              rows = rec.rows.filter(x => x.mode === m && x.launch === 'normal');
          }
          if (!rows.length) return null;
          return { now: Lab.summarize(base, rows).perMinute, exp: Lab.summarize(exp(), rows).perMinute };
        }

        // 경고: 옛 결과 → 해금 → 순위 → 힌트. 식이 먼저, 맞는 자동 판이 있으면 근거를 덧붙인다
        function warnings() {
          const v = simView(),
            E = exp(),
            list = changeList(),
            S = L.summary,
            out = [];
          if (v && !v.running && !v.fresh)
            out.push({
              kind: 'danger',
              go: 'sim',
              head: S.heads.stale,
              text: S.stale(staleLines(v.status, v.s, state.sim).length),
            });
          if (!list.length) return out;
          for (const id of Object.keys(base.unlock)) {
            const u = base.unlock[id],
              ue = E.unlock[id] || u,
              from = u.from;
            if (!base.modes[from]) continue;
            const bits = [],
              ca = S.unlockParts(u).join(' · '),
              cb = S.unlockParts(ue).join(' · ');
            let vote = 0;
            if (ca !== cb) {
              bits.push(S.condBit(ca, cb));
              for (const k of ['time', 'score', 'level']) vote += Math.sign((ue[k] || 0) - (u[k] || 0));
            }
            if (u.score || ue.score) {
              const k = ppk(E, from) / ppk(base, from);
              if (Math.abs(k - 1) > WARN_RATIO) {
                bits.push(S.pointBit(pctText((k - 1) * 100)));
                vote += k < 1 ? 1 : -1;
              }
            }
            if (v && v.fresh && v.two && v.s.modes.includes(from)) {
              const n = v.r.runs.filter(r => r.set === 'now' && r.mode === from),
                e = v.r.runs.filter(r => r.set === 'exp' && r.mode === from),
                a = n.filter(r => Lab.unlockReach(base, id, r)).length,
                b = e.filter(r => Lab.unlockReach(v.ranB, id, r)).length;
              if (
                n.length &&
                e.length &&
                Math.abs(a - b) >= REACH_MIN &&
                Math.abs(a / n.length - b / e.length) >= REACH_PP
              ) {
                bits.push(S.reachBit(a, n.length, b, e.length));
                vote += b / e.length < a / n.length ? 1 : -1;
              }
            }
            if (bits.length)
              out.push({
                go: 'sim',
                head: S.unlockHead(id),
                text: S.unlock(
                  S.unlockCond(from, S.unlockParts(u)),
                  bits,
                  S.dirs[vote > 0 ? 'harder' : vote < 0 ? 'easier' : 'changed'],
                ),
              });
          }
          // 순위: 기록 출처의 일반 · S 출격 TOP3가 있는 모드 중 같은 플레이 Point(식)가 크게 바뀐 모드
          const rec = state.records[recSrc()],
            hits = [];
          for (const t of (rec && rec.top) || []) {
            if (!base.modes[t.mode] || hits.some(h => h.mode === t.mode)) continue;
            const k = ppk(E, t.mode) / ppk(base, t.mode);
            if (Math.abs(k - 1) > WARN_RATIO) hits.push({ mode: t.mode, k });
          }
          if (hits.length)
            out.push({
              go: 'economy',
              head: S.heads.rank,
              text: S.rank(
                hits.map(h => T.modeName(h.mode) + ' ' + pctText((h.k - 1) * 100)).join(' · '),
                S.rankDirs[
                  hits.every(h => h.k < 1) ? 'harder' : hits.every(h => h.k > 1) ? 'easier' : 'mixed'
                ],
              ),
            });
          if (!v && list.some(a => Lab.impacts(a.path).includes('difficulty')))
            out.push({ kind: 'hint', go: 'sim', head: S.heads.hint, text: S.hint });
          return out;
        }

        // 요약 칸 영향 표: 4줄 × 모드. 생존 · Point = 맞는 자동 판, 없으면 Point만 식(≈). G · B = 경제 줄 식
        function impactCells(m) {
          const v = simView(),
            E = exp(),
            row = freshRow(v, m),
            sim = k =>
              row ? change(row.now[k], row.exp[k], { sure: row.sig[k].sure, same: row.sig[k].same }) : null,
            e = econDelta(m);
          return {
            time: sim('time') || DASH,
            point: sim('ppm') || { ...change(ppk(base, m), ppk(E, m)), est: true },
            gold: e ? change(e.now.gold, e.exp.gold) : DASH,
            blue: e ? change(e.now.blue, e.exp.blue) : DASH,
          };
        }
        function renderSummary() {
          const list = changeList(),
            counts = {},
            warns = warnings(),
            nw = warns.filter(w => w.kind !== 'hint').length,
            open = state.sumOpen;
          for (const a of list) for (const t of Lab.impacts(a.path)) counts[t] = (counts[t] || 0) + 1;
          let h =
            '<button type="button" class="sum-head" data-act="sum" aria-expanded="' +
            open +
            '"><span class="t">' +
            esc(L.summary.title) +
            '</span><span class="tg">' +
            Lab.IMPACTS.filter(t => counts[t])
              .map(
                t => '<span class="tag t-' + t + '">' + esc(L.values.tags[t]) + ' ' + counts[t] + '</span>',
              )
              .join('') +
            '</span>' +
            (nw ? '<span class="w">⚠ ' + nw + '</span>' : '') +
            '<span class="caret" aria-hidden="true">' +
            (open ? '▴' : '▾') +
            '</span></button>';
          if (open) h += '<div class="sum-body">' + summaryBody(list, warns) + '</div>';
          $('summary').innerHTML = h;
        }
        function summaryBody(list, warns) {
          let h = warns.length
            ? '<ul class="warns">' +
              warns
                .map(
                  w =>
                    '<li class="' +
                    (w.kind || '') +
                    '" data-go="' +
                    w.go +
                    '" role="link" tabindex="0"><b>' +
                    esc(w.head) +
                    '</b><span>' +
                    esc(w.text) +
                    '</span></li>',
                )
                .join('') +
              '</ul>'
            : '';
          if (!list.length) return h + '<p class="note">' + esc(L.summary.empty) + '</p>';
          const cells = MODES.map(m => impactCells(m));
          h +=
            '<table class="imp"><colgroup><col class="k" />' +
            MODES.map(() => '<col />').join('') +
            '</colgroup><thead><tr><th></th>' +
            MODES.map(m => '<th style="color:' + modeColor(m) + '">' + esc(T.modeName(m)) + '</th>').join(
              '',
            ) +
            '</tr></thead><tbody>';
          for (const k of ['time', 'point', 'gold', 'blue'])
            h +=
              '<tr><th>' +
              esc(L.summary.rows[k]) +
              '</th>' +
              cells
                .map(
                  c =>
                    '<td class="' +
                    c[k].cls +
                    (c[k].est ? ' est' : '') +
                    '">' +
                    (c[k].est && c[k].text !== '·' ? '≈' : '') +
                    esc(c[k].text) +
                    '</td>',
                )
                .join('') +
              '</tr>';
          const v = simView(),
            s = v && v.s;
          h +=
            '</tbody></table><p class="src">' +
            (running
              ? '<span id="sum-run">' +
                esc(L.summary.srcRunning(running.finished(), running.total)) +
                '</span>'
              : '') +
            esc(
              (v && v.fresh && v.two
                ? L.summary.srcSim(L.summary.simDesc(s.minutes, s.crafts.length, s.seeds))
                : L.summary.srcNoSim) +
                L.summary.srcEcon(L.economy.sources[state.source]) +
                L.summary.srcColors,
            ) +
            '</p>';
          return h;
        }
        $('summary').addEventListener('click', e => {
          if (e.target.closest('[data-act="sum"]')) {
            state.sumOpen = !state.sumOpen;
            renderSummary();
            return saveDraft();
          }
          const li = e.target.closest('li[data-go]');
          if (li) setTab(li.dataset.go);
        });
        $('summary').addEventListener('keydown', e => {
          const li = e.target.closest('li[data-go]');
          if (li && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault();
            setTab(li.dataset.go);
          }
        });

        // ── 머리 · 탭 ──
        function syncChip() {
          const n = changeList().length,
            c = $('changed');
          c.textContent = L.changed(n);
          c.classList.toggle('on', n > 0);
        }
        function renderActive() {
          const t = state.tab;
          if (t === 'values') {
            if (!valuesBuilt) buildValues();
            else syncValues();
            return;
          }
          if (!dirty.has(t)) return;
          dirty.delete(t);
          ({ difficulty: renderDifficulty, economy: renderEconomy, sim: renderSim, save: renderSave })[t]();
        }
        function setTab(t) {
          state.tab = t;
          for (const b of document.querySelectorAll('.tab'))
            b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false');
          for (const id of TABS) $('tab-' + id).hidden = id !== t;
          dirty.add(t);
          renderActive();
          window.scrollTo(0, 0);
          saveDraft();
        }
        // 바꾼 값이 달라졌을 때: 머리 · 값 탭을 맞추고 다른 탭은 열 때 다시 그린다
        function changed() {
          syncChip();
          for (const t of TABS) if (t !== 'values') dirty.add(t);
          if (valuesBuilt) syncValues();
          renderSummary();
          renderActive();
          saveDraft();
        }
        // 기록 · 결과처럼 여러 탭이 함께 쓰는 것이 바뀌었을 때: 요약과 열린 탭을 다시 그린다
        function refreshAll() {
          for (const t of TABS) if (t !== 'values') dirty.add(t);
          renderSummary();
          renderActive();
        }

        // ── 값 탭 ──
        // 영향 태그 4가지(R-068): 규칙은 lab-core IMPACTS(요약 · 글 복사와 같은 함수)
        const tags = path =>
          Lab.impacts(path)
            .map(t => '<span class="tag t-' + t + '">' + esc(L.values.tags[t]) + '</span>')
            .join('');
        // 찾기 글(R-069): 이름 + 키 + 뜻 + 태그 이름(소문자). 태그 이름과 같은 말(예 '난이도')은 그 칩과 같은 줄을 찾는다
        const searchText = (words, path) => {
          const d = L.describe(path);
          return [...words, d ? d.text : '', ...Lab.impacts(path).map(t => L.values.tags[t])]
            .join(' ')
            .toLowerCase();
        };
        // 이름(목록 .v-name · 표 줄 머리 th)을 누르면 뜻 줄을 펼침/접음. 여럿 펼칠 수 있고 초안에는 남기지 않는다
        const descAttrs = path =>
          ' data-desc="' + esc(path) + '" role="button" tabindex="0" aria-expanded="false"';
        function descHTML(path) {
          const d = L.describe(path);
          if (!d) return '';
          return (
            esc(d.text) +
            ' · ' +
            esc(L.values.unit(d.unit)) +
            (d.dir ? ' · <span class="dir ' + d.dir + '">' + esc(L.values.dirs[d.dir]) + '</span>' : '')
          );
        }
        function toggleDesc(el) {
          const open = el.getAttribute('aria-expanded') !== 'true';
          el.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (el.tagName === 'TH') {
            const tr = el.parentElement,
              next = tr.nextElementSibling;
            if (next && next.classList.contains('desc')) next.remove();
            if (open)
              tr.insertAdjacentHTML(
                'afterend',
                '<tr class="desc"><td colspan="' +
                  tr.children.length +
                  '"><div class="v-desc">' +
                  descHTML(el.dataset.desc) +
                  '</div></td></tr>',
              );
            return;
          }
          const row = el.closest('.v-row'),
            old = row.querySelector('.v-desc');
          if (old) old.remove();
          if (open)
            row.insertAdjacentHTML(
              'beforeend',
              '<div class="v-desc">' + descHTML(el.dataset.desc) + '</div>',
            );
        }
        // 찾는 말 하나 → 검사 함수. 별칭(L.aliases)이 맞아도 된다. 한 글자 영문 · 숫자(g · b · s)는 떨어진 글자로만 맞는다
        function wordTest(w) {
          const tests = [w, ...(has(L.aliases, w) ? L.aliases[w] : [])].map(c => {
            if (!/^[a-z0-9]$/.test(c)) return s => s.includes(c);
            const re = new RegExp('(^|[^a-z0-9])' + c + '([^a-z0-9]|$)');
            return s => re.test(s);
          });
          return s => tests.some(f => f(s));
        }
        // 찾기 칩: 영향 4개 + '바꾼 값만'
        const CHIPS = [...Lab.IMPACTS, 'only'];
        function renderChips() {
          $('v-chips').innerHTML = CHIPS.map(id => {
            const only = id === 'only';
            return (
              '<button type="button" class="chip ' +
              (only ? 'only' : 't-' + id) +
              '" data-chip="' +
              id +
              '" aria-pressed="' +
              (only ? state.onlyChanged : state.chips.has(id)) +
              '">' +
              esc(only ? L.values.onlyChanged : L.values.tags[id]) +
              '</button>'
            );
          }).join('');
        }
        function inputHTML(path, kind, aria) {
          if (kind === 'bool')
            return (
              '<button type="button" class="tog" data-path="' +
              esc(path) +
              '" aria-label="' +
              esc(aria) +
              '"></button>'
            );
          return (
            '<input class="num" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-path="' +
            esc(path) +
            '" aria-label="' +
            esc(aria) +
            '" />'
          );
        }
        const wasHTML = path => '<button type="button" class="was" data-reset="' + esc(path) + '"></button>';
        // 표 묶음: 열 = 모드 · 기체 · 적, 줄 = 키(기체 시작 스킬은 스킬 순서로 뒤에)
        function matrixLayout(g) {
          const cols = Object.keys(base[g]),
            keys = [];
          for (const c of cols) {
            const pre = g + '.' + c + '.';
            for (const e of ENTRIES)
              if (e.path.startsWith(pre)) {
                const k = e.path.slice(pre.length);
                if (!keys.includes(k)) keys.push(k);
              }
          }
          if (g !== 'crafts') return { cols, keys };
          const starts = Object.keys(base.skills)
            .map(s => 'start.' + s)
            .filter(k => keys.includes(k));
          return { cols, keys: [...keys.filter(k => !k.startsWith('start.')), ...starts] };
        }
        function matrixHTML(g) {
          const { cols, keys } = matrixLayout(g),
            names = cols.map(c => L.column(g, c));
          let h =
            '<div class="matrix-wrap"><table class="matrix"><colgroup><col style="width:64px" />' +
            cols.map(() => '<col />').join('') +
            '</colgroup><thead><tr><th></th>' +
            names.map(x => '<th>' + esc(x) + '</th>').join('') +
            '</tr></thead><tbody>';
          for (const k of keys) {
            const rowName = L.rowName(g, k),
              first = g + '.' + cols[0] + '.' + k,
              search = searchText(
                [rowName, g + '.' + k, ...names, ...cols.map(c => g + '.' + c + '.' + k)],
                first,
              );
            h +=
              '<tr data-search="' +
              esc(search) +
              '" data-tags="' +
              Lab.impacts(first).join(' ') +
              '"><th' +
              descAttrs(first) +
              '>' +
              esc(rowName) +
              '<br />' +
              tags(first) +
              '</th>';
            cols.forEach((c, i) => {
              const path = g + '.' + c + '.' + k,
                e = ENTRY.get(path);
              if (!e && !Lab.isStartPath(base, path)) {
                h += '<td class="none">—</td>';
                return;
              }
              h +=
                '<td data-cell="' +
                esc(path) +
                '">' +
                inputHTML(path, e ? e.kind : 'number', names[i] + ' · ' + rowName) +
                wasHTML(path) +
                '</td>';
            });
            h += '</tr>';
          }
          return h + '</tbody></table></div>';
        }
        function listHTML(g) {
          let h = '';
          for (const e of ENTRIES) {
            if (e.group !== g) continue;
            const label = L.label(e.path);
            h +=
              '<div class="v-row" data-cell="' +
              esc(e.path) +
              '" data-search="' +
              esc(searchText([label, e.path], e.path)) +
              '" data-tags="' +
              Lab.impacts(e.path).join(' ') +
              '"><div class="v-name"' +
              descAttrs(e.path) +
              '><b>' +
              esc(label) +
              tags(e.path) +
              '</b><small>' +
              esc(e.path) +
              '</small></div><div>' +
              inputHTML(e.path, e.kind, label) +
              wasHTML(e.path) +
              '</div></div>';
          }
          return h;
        }
        function buildValues() {
          $('v-groups').innerHTML =
            GROUPS.map(
              g =>
                '<details class="group" data-group="' +
                g +
                '"' +
                (FIRST.includes(g) ? ' open' : '') +
                '><summary><span>' +
                esc(L.groups[g] || g) +
                '</span><span class="g-count"></span></summary><div class="g-body">' +
                (MATRIX.includes(g) ? matrixHTML(g) : listHTML(g)) +
                '</div></details>',
            ).join('') +
            '<p class="note hide" id="v-empty">' +
            esc(L.values.empty) +
            '</p>';
          valuesBuilt = true;
          syncValues();
        }
        function syncValues() {
          const host = $('v-groups'),
            words = state.search.trim().toLowerCase().split(/\s+/).filter(Boolean).map(wordTest),
            filtering = words.length > 0 || state.onlyChanged || state.chips.size > 0,
            counts = {};
          for (const cell of host.querySelectorAll('[data-cell]')) {
            const path = cell.dataset.cell,
              on = isChanged(path),
              v = currentValue(path);
            cell.classList.toggle('changed', on);
            if (on) counts[path.split('.')[0]] = (counts[path.split('.')[0]] || 0) + 1;
            const input = cell.querySelector('input.num');
            if (input && document.activeElement !== input) {
              input.value = raw(v);
              input.classList.remove('bad');
            }
            const tog = cell.querySelector('.tog');
            if (tog) {
              tog.textContent = raw(!!v);
              tog.setAttribute('aria-pressed', v ? 'true' : 'false');
            }
            const was = cell.querySelector('.was');
            if (was) {
              const b = raw(baseValue(path));
              was.textContent = cell.tagName === 'TD' ? b : L.values.was(b);
              was.setAttribute('aria-label', L.values.reset);
            }
          }
          // 찾는 말은 모두 맞아야 하고(그리고), 영향 칩은 그중 하나라도, '바꾼 값만'은 그리고
          let shown = 0;
          for (const row of host.querySelectorAll('[data-search]')) {
            const cells = row.hasAttribute('data-cell') ? [row] : [...row.querySelectorAll('[data-cell]')],
              rowTags = (row.dataset.tags || '').split(' '),
              ok =
                words.every(t => t(row.dataset.search)) &&
                (!state.chips.size || rowTags.some(t => state.chips.has(t))) &&
                (!state.onlyChanged || cells.some(c => c.classList.contains('changed')));
            row.classList.toggle('hide', !ok);
            if (ok) shown++;
          }
          for (const d of host.querySelectorAll('tr.desc'))
            d.classList.toggle('hide', d.previousElementSibling.classList.contains('hide'));
          for (const det of host.querySelectorAll('details.group')) {
            const n = counts[det.dataset.group] || 0,
              any = !!det.querySelector('[data-search]:not(.hide)');
            det.querySelector('.g-count').textContent = n ? L.changed(n) : '';
            det.classList.toggle('hide', !any);
            if (filtering && any) det.open = true;
          }
          $('v-empty').classList.toggle('hide', shown > 0);
        }
        // 난이도 그래프의 값 칩(R-069): 값 탭으로 가서 찾기 칸에 그 키를 넣고 그 줄로 + 1초 보라 테두리
        function gotoValue(find) {
          state.search = find;
          $('v-search').value = find;
          state.chips.clear();
          state.onlyChanged = false;
          renderChips();
          setTab('values');
          const row = $('v-groups').querySelector('[data-search]:not(.hide)');
          if (!row) return;
          row.scrollIntoView({ block: 'center' });
          row.classList.add('flash');
          setTimeout(() => row.classList.remove('flash'), 1000);
        }
        function setChange(path, value) {
          if (value === null || Object.is(value, baseValue(path))) delete state.changes[path];
          else state.changes[path] = value;
          changed();
        }
        function onNumber(el) {
          const path = el.dataset.path,
            text = el.value.trim().replace(/,/g, '');
          if (text === '') {
            el.classList.remove('bad');
            setChange(path, null);
            return;
          }
          const v = /^(∞|inf|infinity)$/i.test(text) ? Infinity : Number(text);
          if (!Lab.check(base, path, v).ok) {
            el.classList.add('bad');
            return;
          }
          el.classList.remove('bad');
          setChange(path, v);
        }
        $('v-groups').addEventListener('input', e => {
          if (e.target.matches('input.num')) onNumber(e.target);
        });
        $('v-groups').addEventListener('focusout', e => {
          const el = e.target;
          if (!el.matches('input.num')) return;
          el.classList.remove('bad');
          el.value = raw(currentValue(el.dataset.path));
        });
        $('v-groups').addEventListener('click', e => {
          const tog = e.target.closest('.tog');
          if (tog) return setChange(tog.dataset.path, !currentValue(tog.dataset.path));
          const was = e.target.closest('.was');
          if (was) return setChange(was.dataset.reset, null);
          const name = e.target.closest('[data-desc]');
          if (name) toggleDesc(name);
        });
        $('v-groups').addEventListener('keydown', e => {
          const name = e.target.closest('[data-desc]');
          if (!name || (e.key !== 'Enter' && e.key !== ' ')) return;
          e.preventDefault();
          toggleDesc(name);
        });
        $('v-search').addEventListener('input', e => {
          state.search = e.target.value;
          syncValues();
        });
        $('v-chips').addEventListener('click', e => {
          const b = e.target.closest('[data-chip]');
          if (!b) return;
          const id = b.dataset.chip;
          if (id === 'only') state.onlyChanged = !state.onlyChanged;
          else if (state.chips.has(id)) state.chips.delete(id);
          else state.chips.add(id);
          renderChips();
          syncValues();
          saveDraft();
        });
        $('v-reset').addEventListener('click', () => {
          const n = changeList().length;
          if (!n || !confirm(L.values.resetConfirm(n))) return;
          state.changes = {};
          changed();
        });

        // ── 난이도 탭(R-069): 가로축 STAGE(모드 색 선, 기본) · 가로축 모드(고른 Stage) ──
        // 그래프마다 식 한 줄 + 들어간 값 칩(누르면 값 탭 그 줄로). 처치 시간 · 초당 위험은 고른 기체의 기준 빌드
        const D_STAGES = Array.from({ length: 60 }, (x, i) => i + 1), // 임시값: STAGE 1~60
          D_TICKS = [1, 10, 20, 30, 40, 50, 60],
          STAGE_METRICS = ['killTime', 'threat', 'pointKill', 'hp', 'damage', 'spawnPerSec'],
          MODE_METRICS = [
            'hp',
            'damage',
            'spawnPerSec',
            'shotsPerSec',
            'bulletSpeed',
            'xp',
            'point',
            'killTime',
            'threat',
            'pointKill',
          ],
          // 화면 지표 → lab-core stageSeries 지표
          SERIES_OF = {
            killTime: 'killTime',
            threat: 'threat',
            pointKill: 'point',
            hp: 'hp',
            damage: 'damage',
            spawnPerSec: 'spawn',
          };
        // 한 모드 · 한 Stage의 지표(가로축 모드)
        function dValue(B, m, st, k) {
          if (k === 'killTime') return Lab.killTime(B, m, state.craft, st);
          if (k === 'threat') return Lab.threat(B, m, state.craft, st);
          if (k === 'pointKill') return Lab.pointPerKill(B, m, st);
          return Lab.difficulty(B, m, st)[k];
        }
        const secText = v => (v >= 1 ? fmt(v, v >= 10 ? 0 : 1) : String(+v.toPrecision(1))) + 's';
        // 가로축 STAGE 그래프(340×150): 모드 색 선, 지금 실선 · 실험 점선(다를 때만). log면 로그 눈금
        function stageChart(series, log, fmtY) {
          const W = 340,
            H = 150,
            l = 40,
            r = 10,
            t = 10,
            b = 20,
            vals = series.flatMap(s => [...s.now, ...(s.exp || [])]).filter(v => Number.isFinite(v) && v > 0);
          if (!vals.length) return '';
          const lo = log ? Math.pow(10, Math.floor(Math.log10(Math.min(...vals)))) : 0;
          let hi = log ? Math.pow(10, Math.ceil(Math.log10(Math.max(...vals)))) : niceMax(Math.max(...vals));
          if (log && hi <= lo) hi = lo * 10;
          const f = v =>
              log ? (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) : v / hi,
            X = i => l + (i / (D_STAGES.length - 1)) * (W - l - r),
            Y = v => t + (1 - f(Number.isFinite(v) ? Math.max(v, log ? lo : 0) : log ? lo : 0)) * (H - t - b),
            ticks = log
              ? Array.from({ length: Math.round(Math.log10(hi / lo)) + 1 }, (x, i) => lo * Math.pow(10, i))
              : [0, hi / 2, hi];
          let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
          for (const v of ticks) {
            const y = Y(v).toFixed(1);
            s +=
              '<line class="grid" x1="' +
              l +
              '" x2="' +
              (W - r) +
              '" y1="' +
              y +
              '" y2="' +
              y +
              '" /><text x="' +
              (l - 5) +
              '" y="' +
              (Number(y) + 3) +
              '" text-anchor="end">' +
              esc(fmtY(v)) +
              '</text>';
          }
          for (const st of D_TICKS) {
            const i = D_STAGES.indexOf(st);
            if (i >= 0)
              s +=
                '<text x="' +
                X(i).toFixed(1) +
                '" y="' +
                (H - 5) +
                '" text-anchor="middle">' +
                st +
                '</text>';
          }
          const line = (vs, m, dash) =>
            '<path class="mline' +
            (dash ? ' dash' : '') +
            '" style="stroke:' +
            modeColor(m) +
            '" d="' +
            vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') +
            '" />';
          for (const sr of series)
            s += line(sr.now, sr.mode, false) + (sr.exp ? line(sr.exp, sr.mode, true) : '');
          return s + '</svg>';
        }
        // 그래프 카드: 제목 · 식 한 줄 · 들어간 값 칩 · 본문
        const dCard = (k, title, body) =>
          '<article class="card"><h3>' +
          esc(title) +
          '</h3><p class="formula">' +
          esc(L.difficulty.formula[k]) +
          '</p><div class="vchips">' +
          L.difficulty.inputs[k]
            .map(c => '<button type="button" data-find="' + esc(c.find) + '">' + esc(c.label) + '</button>')
            .join('') +
          '</div>' +
          body +
          '</article>';
        function renderDifficulty() {
          const E = exp(),
            two = changeList().length > 0,
            D = L.difficulty;
          let h =
            '<p class="note">' +
            esc(D.note) +
            '</p><div class="dtools"><div class="seg" data-act="axis">' +
            segBtn('stage', D.axis.stage, state.axis === 'stage') +
            segBtn('mode', D.axis.mode, state.axis === 'mode') +
            '</div><label class="craftsel">' +
            esc(D.craft) +
            ' <select id="d-craft">' +
            CRAFTS.map(
              c =>
                '<option value="' +
                c +
                '"' +
                (c === state.craft ? ' selected' : '') +
                '>' +
                esc(T.craftName(c)) +
                '</option>',
            ).join('') +
            '</select></label></div>';
          if (state.axis === 'stage') {
            h +=
              '<div class="mdots" data-act="shown">' +
              MODES.map(
                m =>
                  '<button type="button" data-v="' +
                  m +
                  '" aria-pressed="' +
                  state.shown.includes(m) +
                  '" style="color:' +
                  modeColor(m) +
                  '">' +
                  esc(T.modeName(m)) +
                  '</button>',
              ).join('') +
              '</div><p class="src">' +
              esc(D.modesNote) +
              '</p>';
            const modes = MODES.filter(m => state.shown.includes(m));
            for (const k of STAGE_METRICS) {
              const series = modes.map(m => {
                const now = Lab.stageSeries(base, m, SERIES_OF[k], D_STAGES, state.craft),
                  ex = two ? Lab.stageSeries(E, m, SERIES_OF[k], D_STAGES, state.craft) : null;
                return { mode: m, now, exp: ex && ex.some((v, i) => !same(v, now[i])) ? ex : null };
              });
              h += dCard(
                k,
                D.metrics[k],
                stageChart(series, k === 'killTime', k === 'killTime' ? secText : v => fmt(v)),
              );
            }
          } else {
            const st = state.stage,
              names = MODES.map(m => T.modeName(m));
            h +=
              '<div><span class="field-label">' +
              esc(D.stage) +
              '</span><div class="seg" data-act="stage">' +
              [1, 10, 30, 60].map(s => segBtn(s, s, st === s)).join('') +
              '<input class="num" id="d-stage" type="text" inputmode="numeric" style="width:76px" value="' +
              st +
              '" aria-label="' +
              esc(D.stage) +
              '" /></div></div>' +
              legend() +
              '<p class="src">' +
              esc(D.modeNote) +
              '</p>';

        // ── 경제 탭 ──
        function openDB(name) {
          return new Promise(resolve => {
            let req;
            try {
              req = indexedDB.open(name);
            } catch {
              resolve(null);
              return;
            }
            // 없는 저장소는 만들지 않는다: 새로 만들 때만 생기는 업그레이드를 취소한다
            req.onupgradeneeded = () => {
              try {
                req.transaction.abort();
              } catch {
                /* 이미 끝남 */
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onblocked = () => resolve(null);
          });
        }
        // 같은 주소의 게임 기록을 읽기만 한다(시험 경로 · 실제 주소). 읽은 뒤 바로 닫는다.
        async function readRecords(which) {
          if (typeof indexedDB === 'undefined') return { status: 'unsupported', rows: [], n: 0, skipped: 0 };
          const db = await openDB(Data.DB_BASE + (which === 'test' ? '-test' : ''));
          if (!db) return { status: 'none', rows: [], n: 0, skipped: 0 };
          // 게임이 저장소를 새 버전으로 열려 하면 바로 비켜 준다
          db.onversionchange = () => db.close();
          let list = [];
          try {
            if (db.objectStoreNames.contains('records'))
              list = await new Promise(resolve => {
                const req = db.transaction('records', 'readonly').objectStore('records').getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
              });
          } catch {
            list = [];
          } finally {
            db.close();
          }
          const records = list.map(r => Data.normalizeRecord(r)).filter(Boolean),
            rows = records.map(r => Lab.recordRow(r, base)).filter(Boolean),
            // 순위 TOP3(일반 · S 출격 각 3): 순위 경고가 쓴다

              Data.ranking(records, kind)
                .slice(0, 3)

            );

        // ── 자동 판 탭 ──
        let running = null,

        const jobCount = () =>
          state.sim.modes.length * state.sim.crafts.length * state.sim.seeds * (changeList().length ? 2 : 1);
        // 작업자(Web Worker) 안에서 도는 코드: lab-sim 원문 뒤에 붙는다(바깥 변수를 쓰지 않는다)
        function workerMain() {
          var boxes = {},
            initError = null;
          self.onmessage = function (e) {
            var m = e.data;
            if (m.type === 'init') {
              boxes = {};
              initError = null;
              try {
                for (var k in m.balances) boxes[k] = self.NeonLabSim.load(LAB_SRC, m.balances[k]);
              } catch (err) {
                initError = String((err && err.message) || err);
              }
              return;
            }
            if (m.type !== 'job') return;
            try {
              if (initError) throw new Error(initError);
              var r = self.NeonLabSim.start(boxes[m.set], m.opts),
                last = 0;
              while (!r.advance(900)) {
                var now = Date.now();
                if (now - last > 250) {
                  last = now;
                  self.postMessage({ type: 'progress', id: m.id, p: r.progress });
                }
              }
              self.postMessage({ type: 'done', id: m.id, result: r.result() });
            } catch (err) {
              self.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });
            }
          };
        }
        function workerSource() {
          return (
            SOURCES.sim +
            '\n;var LAB_SRC = ' +
            JSON.stringify({ siege: SOURCES.siege, engine: SOURCES.engine }) +
            ';\n(' +
            workerMain.toString() +
            ')();\n'
          );
        }
        // 작업자 여러 개(최대 4)에 판을 나눠 준다. 20초 동안 소식이 없는 판은 끊고 다음 판으로.
        function startPool(jobs, balances, cb) {
          if (typeof Worker === 'undefined' || !SOURCES) return null;
          if (!workerURL)
            try {
              workerURL = URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' }));
            } catch {
              return null;
            }
          const size = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1, jobs.length)),
            slots = [],
            partial = new Map();
          let next = 0,
            finished = 0,
            stopped = false;
          const spawn = slot => {
            try {
              const w = new Worker(workerURL);
              w.onmessage = e => onMessage(slot, e.data);
              w.onerror = ev => {
                ev.preventDefault();
                fail(slot, ev.message || 'error');
              };
              w.postMessage({ type: 'init', balances });
              slot.w = w;
              return true;
            } catch {
              return false;
            }
          };
          const assign = slot => {
            if (stopped) return;
            if (next >= jobs.length) {
              slot.job = null;
              if (slots.every(s => !s.job)) end();
              return;
            }
            slot.job = jobs[next++];
            slot.last = Date.now();
            slot.w.postMessage({ type: 'job', id: slot.job.id, set: slot.job.set, opts: slot.job.opts });
          };
          const onMessage = (slot, m) => {
            if (stopped || !slot.job || m.id !== slot.job.id) return;
            slot.last = Date.now();
            if (m.type === 'progress') {
              partial.set(m.id, m.p);
              return cb.progress();
            }
            partial.delete(m.id);
            finished++;
            if (m.type === 'done') cb.done(slot.job, m.result);
            else cb.error(slot.job, m.message);
            assign(slot);
          };
          const fail = (slot, msg) => {
            if (stopped) return;
            const job = slot.job;
            try {
              slot.w.terminate();
            } catch {
              /* 이미 끝남 */
            }
            slot.job = null;
            if (job) {
              partial.delete(job.id);
              finished++;
              cb.error(job, msg);
            }
            if (spawn(slot)) assign(slot);
            else if (slots.every(s => !s.job)) end();
          };
          const watch = setInterval(() => {
            for (const s of slots) if (s.job && Date.now() - s.last > 20000) fail(s, L.sim.timeout);
          }, 2000);
          function end() {
            if (stopped) return;
            stopped = true;
            clearInterval(watch);
            for (const s of slots)
              try {
                s.w.terminate();
              } catch {
                /* 이미 끝남 */
              }
            cb.end();
          }
          for (let i = 0; i < size; i++) {
            const s = { w: null, job: null, last: 0 };
            if (!spawn(s)) break;
            slots.push(s);
          }
          if (!slots.length) {
            clearInterval(watch);
            return null;
          }
          slots.forEach(assign);
          return {
            total: jobs.length,
            finished: () => finished,
            progress: () => (finished + [...partial.values()].reduce((x, y) => x + y, 0)) / jobs.length,
            stop: end,
          };
        }
        // 작업자를 못 쓰는 브라우저: 화면에서 조금씩 끊어 돌린다
        function startLocal(jobs, balances, cb) {
          const boxes = {};
          let i = 0,
            cur = null,
            finished = 0,
            stopped = false,
            loadError = null;
          try {
            for (const k of Object.keys(balances)) boxes[k] = Sim.load(SOURCES, balances[k]);
          } catch (err) {
            loadError = String((err && err.message) || err);
          }
          const end = () => {
            if (stopped) return;
            stopped = true;
            cb.end();
          };
          const tick = () => {
            if (stopped) return;
            const t0 = performance.now();
            while (performance.now() - t0 < 12) {
              if (!cur) {
                if (i >= jobs.length) return end();

          return store.saved
            .map((json, i) => {
              const r = parsedSaved(json);
              if (!r.ok) return '';
              const sc = r.scenario,
                res = sc.results && sc.results.sim,
                n = validResults(res) ? res.runs.length : 0,
                // 그 시나리오의 바꾼 값 · 조건 · 지금 지문과 비교(R-068)
                old =
                  n > 0 &&
                  !Lab.simStatus(res, { base, changes: sc.changes, settings: cleanSim(sc.sim) }).fresh;
              return (
                '<div class="saved-item"><div><b>' +
                esc(sc.name) +
                '</b><small>' +
                esc(
                  (sc.savedAt ? dateText(sc.savedAt) + ' · ' : '') +
                    L.changed(Object.keys(sc.changes).length) +
                    (n ? ' · ' + L.save.simRuns(n) : ''),
                ) +
                (old ? '<span class="chip-old">' + esc(L.save.staleChip) + '</span>' : '') +
                '</small></div><div class="btns"><button type="button" class="btn small" data-act="open" data-i="' +
                i +
                '">' +
                esc(L.save.open) +
                '</button><button type="button" class="btn small" data-act="file" data-i="' +
                i +
                '">' +
                esc(L.save.file) +
                '</button><button type="button" class="btn small" data-act="remove" data-i="' +
                i +
                '">' +
                esc(L.save.remove) +
                '</button></div></div>'
              );
            })
            .join('');
        }
        function renderSave() {
          let h = Lab.BUILTIN.length ? '<h2>' + esc(L.save.builtin) + '</h2>' : '';
          for (const b of Lab.BUILTIN) {
            const t = L.save.builtins[b.id] || { name: b.id, desc: '' };
            h +=
              '<article class="card"><h3>' +
              esc(t.name) +
              '</h3><p class="note">' +
              esc(t.desc) +
              '</p><div class="btns"><button type="button" class="btn primary" data-act="builtin" data-id="' +
              esc(b.id) +
              '">' +
              esc(L.save.load) +
              '</button></div></article>';
          }
          for (const n of state.notices) h += '<p class="warn">' + esc(n) + '</p>';
          const v = simView();
          h +=
            '<h2>' +
            esc(L.save.current) +
            '</h2>' +
            (v && !v.running && !v.fresh
              ? staleCard(
                  staleLines(v.status, v.s, state.sim),
                  '<p class="note">' + esc(L.save.staleNote) + '</p>',
                )
              : '') +
            '<div class="card"><label><span class="field-label">' +
            esc(L.save.name) +
            '</span><input class="text" id="s-name" maxlength="60" autocomplete="off" value="' +
            esc(state.name) +
            '" /></label><div class="btns"><button type="button" class="btn primary" data-act="store">' +
            esc(L.save.store) +
            '</button><button type="button" class="btn" data-act="export">' +
            esc(L.save.exportFile) +
            '</button><label class="btn">' +
            esc(L.save.importFile) +
            '<input type="file" id="s-file" accept=".json,application/json" hidden /></label></div><p class="note">' +
            esc(storeOK ? L.save.storage : L.save.storageFail) +
            '</p><details class="method"><summary>' +
            esc(L.save.paste) +
            '</summary><textarea class="out" id="s-paste" placeholder="' +
            esc(L.save.pasteHint) +
            '"></textarea><div class="btns"><button type="button" class="btn" data-act="paste">' +
            esc(L.save.pasteOpen) +
            '</button></div></details></div><h2>' +
            esc(L.save.list) +
            '</h2><div class="card">' +
            savedList() +
            '</div><h2>' +
            esc(L.save.copy) +
            '</h2><div class="card"><div class="btns"><button type="button" class="btn primary" data-act="copy">' +
            esc(L.save.copy) +
            '</button></div><textarea class="out" id="s-text" readonly></textarea></div>';
          $('tab-save').innerHTML = h;
          $('s-text').value = exportText();
        }
        // 지금 바꾼 값이 저장한 시나리오 어디에도 없으면 버리기 전에 묻는다
        function confirmReplace() {
          const n = changeList().length;
          if (!n) return true;
          const k = keyOf(Lab.makeScenario({ changes: state.changes }, base, {}).changes);
          if (store.saved.some(j => parsedSaved(j).ok && keyOf(parsedSaved(j).scenario.changes) === k))
            return true;
          return confirm(L.save.replaceConfirm(n));
        }
        function openParsed(r) {
          applyScenario(r.scenario);
          state.name = r.scenario.name;
          const list = a => a.map(p => L.label(p) + ' (' + p + ')').join(', ');
          state.notices = [];
          if (r.drift.length)
            state.notices.push(
              L.save.drift(
                r.drift.map(d => L.label(d.path) + ' ' + raw(d.saved) + ' → ' + raw(d.now)).join(', '),
              ),
            );
          if (r.missing.length) state.notices.push(L.save.missing(list(r.missing)));
          if (r.rejected.length) state.notices.push(L.save.rejected(list(r.rejected.map(x => x.path))));
          changed();
          toast(L.save.opened(r.scenario.name));
        }
        function fileName(name) {
          const d = new Date(),
            p = n => String(n).padStart(2, '0'),
            safe = String(name || 'lab')
              .replace(/[\\/:*?"<>|\s]+/g, '-')
              .slice(0, 40);
          return (
            'neon-lab-' +
            safe +
            '-' +
            d.getFullYear() +
            p(d.getMonth() + 1) +
            p(d.getDate()) +
            '-' +
            p(d.getHours()) +
            p(d.getMinutes()) +
            '.json'
          );
        }
        function download(name, text) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        }
        $('tab-save').addEventListener('click', e => {
          const b = e.target.closest('[data-act]');
          if (!b) return;
          const act = b.dataset.act,
            i = Number(b.dataset.i);
          if (act === 'builtin') {
            const bi = Lab.BUILTIN.find(x => x.id === b.dataset.id);
            if (!bi || !confirmReplace()) return;
            state.changes = { ...bi.changes };
            state.sim = cleanSim(bi.sim);
            state.simResults = null;
            state.name = (L.save.builtins[bi.id] || {}).name || bi.id;
            state.notices = [];
            changed();
            toast(L.save.opened(state.name) + ' · ' + L.changed(changeList().length));
          } else if (act === 'store') {
            state.name = ($('s-name').value || '').trim().slice(0, 60);
            const json = Lab.toJSON(scenarioNow(state.name));
            store.saved.unshift(json);
            store.saved = store.saved.slice(0, 50);
            writeStore();
            toast(storeOK ? L.save.saved(parsedSaved(json).scenario.name) : L.save.storageFail);
            renderSave();
          } else if (act === 'export') {
            state.name = ($('s-name').value || '').trim().slice(0, 60);
            download(fileName(state.name), Lab.toJSON(scenarioNow(state.name)));
          } else if (act === 'open') {
            const r = parsedSaved(store.saved[i] || '');
            if (!r.ok) return toast(L.save.badFile);
            if (confirmReplace()) openParsed(r);
          } else if (act === 'file') {
            const r = parsedSaved(store.saved[i] || '');
            if (r.ok) download(fileName(r.scenario.name), store.saved[i]);
          } else if (act === 'remove') {
            const r = parsedSaved(store.saved[i] || '');
            if (!confirm(L.save.removeConfirm(r.ok ? r.scenario.name : '?'))) return;
            store.saved.splice(i, 1);
            writeStore();
            renderSave();
          } else if (act === 'paste') {
            // 에이전트가 대화로 준 시나리오 글(JSON)을 붙여 넣어 연다
            const r = Lab.parseScenario($('s-paste').value || '', base);
            if (!r.ok) return toast(L.save.badFile);
            if (!confirmReplace()) return;
            store.saved.unshift(Lab.toJSON(r.scenario));
            store.saved = store.saved.slice(0, 50);
            writeStore();
            openParsed(r);
          } else if (act === 'copy') copyText();
        });
        $('tab-save').addEventListener('change', e => {
          if (e.target.id === 's-name') {
            state.name = e.target.value.trim().slice(0, 60);
            $('s-text').value = exportText();
            return saveDraft();
          }
          if (e.target.id !== 's-file') return;
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          file.text().then(
            text => {
              const r = Lab.parseScenario(text, base);
              if (!r.ok) return toast(L.save.badFile);
              if (!confirmReplace()) return;
              store.saved.unshift(Lab.toJSON(r.scenario));
              store.saved = store.saved.slice(0, 50);
              writeStore();
              openParsed(r);
            },
            () => toast(L.save.badFile),
          );
        });
        async function copyText() {
          const text = exportText(),
            area = $('s-text');
          area.value = text;
          try {
            await navigator.clipboard.writeText(text);
            return toast(L.save.copied);
          } catch {
            /* 아래 방법으로 */
          }
          area.focus();
          area.select();
          let ok = false;
          try {
            ok = document.execCommand('copy');
          } catch {
            ok = false;
          }
          toast(ok ? L.save.copied : L.save.copyFail);
        }

        // ── 글 복사: 에이전트가 읽는 순서(머리 → 옛 결과 → 바꾼 값 → 경고 → 경제 분당 → 자동 판) ──
        // 변화 글자: '+6%', 흔들림 안이면 '+3%, 흔들림'
        const changeNote = c =>
          c.text === '·' || c.text === '—' ? '' : c.text + (c.wobble ? ', ' + L.text.wobble : '');
        function exportText() {
          const list = changeList(),
            v = simView(),
            stale = v && !v.running && !v.fresh ? staleLines(v.status, v.s, state.sim) : null,
            out = [L.text.head(state.name || Lab.makeScenario({}, base, {}).name)];
          if (stale) out.push(L.text.stale(stale[0], stale.length - 1));
          out.push(
            L.text.meta(VERSION, base.name, dateText(Date.now())),
            list.length ? L.text.changes(list.length) : L.text.none,
          );
          for (const a of list) {
            const t = Lab.impacts(a.path).map(x => L.values.tags[x]);
            out.push(
              '- ' +
                a.path +
                ' (' +
                L.label(a.path) +
                '): ' +
                raw(a.from) +
                ' → ' +
                raw(a.to) +
                (t.length ? ' [' + t.join(' · ') + ']' : ''),
            );
          }
          const warns = warnings();
          if (warns.length) {
            out.push('', L.text.warnings);
            for (const w of warns) out.push('- ' + w.head + ': ' + w.text);
          }
          const E = exp(),
            lines = econLines();
          if (list.length && lines.length) {
            out.push('', L.text.economy(L.economy.sources[state.source]));
            for (const raw0 of lines) {
              const l = econLine(raw0, E),
                pm = (k, d) => pairText(l.pm.now[k], l.pm.exp[k], d);
              out.push(
                '- ' +
                  l.title +
                  ' (' +
                  l.sub +
                  '): ' +
                  [
                    L.economy.pm.gold + ' ' + pm('gold', 1),
                    L.economy.pm.blue + ' ' + pm('blue', 2),
                    L.economy.pm.super + ' ' + pm('super', 2),
                    L.text.perRun(
                      pairText(l.perRunGold.now, l.perRunGold.exp, 0),
                      time(l.len.now * 60) + (l.len.k !== 1 ? ' → ' + time(l.len.exp * 60) : ''),
                      l.len.src +
                        (l.len.k !== 1 ? ' · ' + L.economy.lenSrc.sim(change(1, l.len.k).text) : ''),
                    ),
                  ].join(' · '),
              );
            }
          }
          if (v) {
            const s = v.s,
              cells = simAggregate(v.r);
            out.push('', L.text.sim(condText(s)) + (stale ? L.text.simStale : ''));
            for (const row of v.table) {
              const a = row.now,
                b = row.exp;
              if (!a) continue;
              const parts = SIG_KEYS.map(k => {
                const x = CMP_SHOW[k](a[k], a);
                if (!b || row.same) return L.sim.cmp[k] + ' ' + x;
                const c = change(a[k], b[k], {
                    pp: k === 'full',
                    sure: row.sig[k].sure,
                    same: row.sig[k].same,
                  }),
                  note = changeNote(c),
                  y = CMP_SHOW[k](b[k], b);
                return L.sim.cmp[k] + ' ' + (x === y ? x : x + ' → ' + y) + (note ? '(' + note + ')' : '');
              });
              out.push('- ' + L.text.average(row.mode) + ': ' + parts.join(' · '));
              // 생존 곡선: 5분마다(길이 안만)
              const surv = set =>
                  Lab.survival(
                    v.r.runs
                      .filter(r => r.set === set && r.mode === row.mode)
                      .map(r => ({ time: r.time, full: r.reason === 'time' })),
                    s.minutes,
                  ),
                sn = surv('now'),
                se = v.two ? surv('exp') : null,
                pct = x => (Number.isFinite(x) ? Math.round(x * 100) + '%' : '—'),
                marks = [5, 10, 15, 20].filter(m => m <= s.minutes);
              // 길이가 5의 배수가 아니면 끝 분도(3분 판이면 3분)
              if (s.minutes % 5 && s.minutes < 20) marks.push(s.minutes);
              if (marks.length)
                out.push(
                  '  ' +
                    L.text.survival(
                      marks
                        .map(m =>
                          L.text.survAt(m, pct(sn[m]), se && pct(se[m]) !== pct(sn[m]) ? pct(se[m]) : null),
                        )
                        .join(' · '),
                    ),
                );
              for (const c of s.crafts) {
                const cell = cells[row.mode] && cells[row.mode][c];
                if (!cell) continue;
                out.push(
                  '  · ' +
                    T.craftName(c) +
                    ': ' +
                    simFields
                      .map(([k, d]) => {
                        const x = simValue(cell.now, k, d),
                          y = v.two ? simValue(cell.exp, k, d) : x;
                        return L.sim.cols[k] + ' ' + (x === y ? x : x + ' → ' + y);
                      })
                      .join(' · '),
                );
              }
            }
          }
          return out.join('\n');
        }
        // ── 시작 ──
        $('sub').textContent = L.sub(VERSION, base.name);
        document.querySelector('.tabs').addEventListener('click', e => {
          const b = e.target.closest('.tab');
          if (b) setTab(b.dataset.tab);
        });
        $('changed').addEventListener('click', () => {
          state.onlyChanged = true;
          renderChips();
          setTab('values');
        });
        renderChips();
        syncChip();
        renderSummary();
        setTab(state.tab);
        // 기록 출처를 처음부터 읽는다(요약 순위 경고 · 생존 곡선 기록 점선 · 판 길이)
        loadRecords(recSrc());
      })();
    </script>
  </body>
</html>
